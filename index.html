<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – Intro</title>

    <link rel="stylesheet" href="resources/css/ccg-master.css">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body.intro-body {
            background: black;
            color: #5fffff;
            font-family: monospace;
            overflow: hidden;
            position: relative;
        }

        /* ======================
           POWER-ON SCREEN
        ======================= */
        #powerOverlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #04121c 0%, #000 100%);
        }

        .intro-logo {
            width: 280px;
            max-width: 80vw;
            margin-bottom: 32px;
            filter:
                drop-shadow(0 0 25px rgba(0, 255, 255, 0.75))
                drop-shadow(0 0 55px rgba(0, 180, 255, 0.75));
        }

        #powerText {
            font-size: 32px;
            letter-spacing: 0.18em;
            text-shadow: 0 0 8px rgba(95,255,255,1);
            animation: pulse 1.3s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse {
            0%   { opacity: 0.45; transform: scale(1); }
            50%  { opacity: 1;    transform: scale(1.08); }
            100% { opacity: 0.45; transform: scale(1); }
        }

        .hidden { display: none !important; }

        /* ======================
           SKIP INTRO BUTTON
        ======================= */
        #skipIntroBtn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 200;
            background: #b0002a;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 14px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #skipIntroBtn:hover {
            box-shadow: 0 0 12px rgba(255,140,140,0.9);
        }

        /* ======================
           C64 SCREEN
        ======================= */
        #c64Wrapper {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        .c64-border {
            background: #000e78;
            padding: 22px;
        }

        .c64-inner {
            background: #3c31ff;
            padding: 32px 40px;
            width: 900px;
            max-width: 90vw;
            height: 520px;
            max-height: 70vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        #c64Text {
            white-space: pre;
            color: #5fffff;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 0.05em;
        }

        /* ======================
           BLACKOUT + RASTER BARS
        ======================= */
        #rasterOverlay {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 5000;
            display: none;

            /* High-definition raster bars */
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,   0,   0, 0.85) 0px, rgba(255,   0,   0, 0.85) 10px,
                    rgba(255, 120,   0, 0.85) 10px,rgba(255, 120,   0, 0.85) 20px,
                    rgba(255, 255,   0, 0.85) 20px,rgba(255, 255,   0, 0.85) 30px,
                    rgba(  0, 255,   0, 0.85) 30px,rgba(  0, 255,   0, 0.85) 40px,
                    rgba(  0, 255, 255, 0.85) 40px,rgba(  0, 255, 255, 0.85) 50px,
                    rgba(  0, 128, 255, 0.85) 50px,rgba(  0, 128, 255, 0.85) 60px,
                    rgba(128,   0, 255, 0.85) 60px,rgba(128,   0, 255, 0.85) 70px
                );

            filter: blur(3px);

            animation:
                rasterScroll 2.8s linear infinite,
                rasterPulse 0.22s infinite,
                rasterJitter 0.15s infinite,
                rasterHueShift 3.5s infinite alternate;
        }

        @keyframes rasterScroll {
            0%   { background-position-y: 0; }
            100% { background-position-y: 70px; }
        }

        @keyframes rasterPulse {
            0%   { opacity: 0.78; }
            100% { opacity: 1.0; }
        }

        @keyframes rasterJitter {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-1.5px); }
            100% { transform: translateY(0px); }
        }

        @keyframes rasterHueShift {
            0%   { filter: hue-rotate(0deg) blur(3px); }
            100% { filter: hue-rotate(30deg) blur(3px); }
        }

        /* ======================
           SID SYNC TEXT (UPGRADED)
        ======================= */
        #sidText {
            position: fixed;
            top: 40%;
            width: 100%;
            text-align: center;
            font-family: "Press Start 2P", monospace;
            font-size: 44px;
            letter-spacing: 0.14em;
            opacity: 0;
            color: #00eaff;
            text-shadow:
                0 0 8px #00eaff,
                0 0 16px #00bbff,
                0 0 24px #0088ff,
                0 0 48px #0055ff,
                0 0 96px #0022ff;
            z-index: 6000;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .sidTextVisible {
            opacity: 1 !important;
            transform: scale(1.12);
        }

    </style>
</head>

<body class="intro-body">

<button id="skipIntroBtn">[ ESC ] SKIP INTRO</button>

<div id="powerOverlay">
    <img src="resources/C64 NEON.png" class="intro-logo">
    <p id="powerText">CLICK TO POWER ON</p>
</div>

<div id="c64Wrapper" class="hidden">
    <div class="c64-border">
        <div class="c64-inner">
            <pre id="c64Text"></pre>
        </div>
    </div>
</div>

<div id="rasterOverlay"></div>

<div id="sidText"></div>

<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script>
(function () {

    const powerOverlay = document.getElementById("powerOverlay");
    const c64Wrapper   = document.getElementById("c64Wrapper");
    const c64Text      = document.getElementById("c64Text");
    const raster       = document.getElementById("rasterOverlay");
    const sidAudio     = document.getElementById("sidAudio");
    const sidText      = document.getElementById("sidText");
    const skipBtn      = document.getElementById("skipIntroBtn");

    const timers = [];

    function schedule(fn, ms) {
        let id = setTimeout(fn, ms);
        timers.push(id);
    }

    function clearTimers() {
        timers.forEach(id => clearTimeout(id));
        timers.length = 0;
    }

    const basicText =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.

`;

    function showBasic() {
        c64Text.textContent = basicText;
    }

    function appendLine(txt) {
        c64Text.textContent += txt + "\n";
    }

    /* SID TEXT (IMPROVED) */
    function flashSID(msg, delay) {
        schedule(() => {
            sidText.textContent = msg;
            sidText.classList.add("sidTextVisible");
        }, delay);

        schedule(() => {
            sidText.classList.remove("sidTextVisible");
        }, delay + 1600);
    }

    /* LOAD SEQUENCE */
    function startLoadSequence() {

        schedule(() => {
            appendLine(`LOAD ""`);

            schedule(() => {
                appendLine(`PRESS PLAY ON TAPE`);

                schedule(() => {
                    appendLine(`FOUND "CHEEKY COMMODORE GAMER"`);
                    appendLine(`LOADING`);

                    schedule(startRasterAudio, 800);

                }, 900);

            }, 900);

        }, 500);
    }

    /* RASTER + SID START */
    function startRasterAudio() {

        /* Remove everything behind raster */
        c64Wrapper.style.display = "none";

        raster.style.display = "block";

        flashSID("ANOTHER VISITOR...", 200);
        flashSID("...STAY A WHILE...", 1600);
        flashSID("STAY FOREVER!", 3000);

        try {
            sidAudio.currentTime = 0;
            sidAudio.play().catch(()=>{});
        } catch(e){}

        sidAudio.onended = () => window.location.href = "home.html";
    }

    function beginIntro() {
        powerOverlay.classList.add("hidden");
        c64Wrapper.classList.remove("hidden");
        showBasic();
        startLoadSequence();
    }

    function skipIntro() {
        clearTimers();
        try {
            sidAudio.pause(); sidAudio.currentTime=0;
        }catch(e){}
        window.location.href = "home.html";
    }

    document.addEventListener("click", e => {
        if (powerOverlay && !powerOverlay.classList.contains("hidden")) beginIntro();
    });

    skipBtn.addEventListener("click", skipIntro);

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") skipIntro();
        if (e.key === "Enter" && !powerOverlay.classList.contains("hidden")) beginIntro();
    });

})();
</script>

</body>
</html>
