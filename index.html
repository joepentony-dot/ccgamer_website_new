<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCG C64 Intro</title>

    <!-- Minimal functionality-only CSS -->
    <style>
        body {
            margin: 0;
            background: black;
            color: #00ffff;
            font-family: monospace;
            font-size: 22px;
            overflow: hidden;
        }

        #screen {
            white-space: pre;
            padding: 20px;
        }

        /* Raster bars overlay */
        #raster {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                    0deg,
                    red 0px,
                    purple 4px,
                    blue 8px
            );
            display: none;
            z-index: 2000; /* IN FRONT of everything */
            opacity: 0.75;
            animation: scrollbars 0.25s linear infinite;
        }

        @keyframes scrollbars {
            0% { background-position-y: 0; }
            100% { background-position-y: 30px; }
        }

        /* Skip Intro button */
        #skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: red;
            color: white;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            z-index: 3000;
            display: block;
        }
    </style>
</head>

<body>

<div id="skip-btn">SKIP INTRO</div>

<div id="screen"></div>
<div id="raster"></div>

<audio id="sid" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script>
/* ============================================
   FUNCTIONALITY SEQUENCE ONLY
   ============================================ */

const screen = document.getElementById("screen");
const raster = document.getElementById("raster");
const sid = document.getElementById("sid");
const skipBtn = document.getElementById("skip-btn");

/* ==== 1. Perfect power-on phase (unchanged from your working version) ==== */
/* For now, placeholder text — you will replace this with your perfect version */
const powerOnText =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.
`;

let phase = 0;

/* TYPEWRITER PRINTER FUNCTION */
function printLine(text, delay, next) {
    setTimeout(() => {
        screen.textContent += text + "\n";
        if (next) next();
    }, delay);
}

/* ==== MAIN SEQUENCE ==== */

function startSequence() {
    // Phase 1 — Power on (perfect version will be inserted later)
    screen.textContent = powerOnText;

    // start LOAD "" after 1.2 seconds
    setTimeout(loadCommand, 1200);
}

function loadCommand() {
    printLine('LOAD ""', 500, pressPlay);
}

function pressPlay() {
    printLine('PRESS PLAY ON TAPE', 800, foundFile);
}

function foundFile() {
    printLine("FOUND 'CHEEKY COMMODORE GAMER'", 1000, startAudioAndRaster);
}

function startAudioAndRaster() {

    // SHOW RASTER BARS IN FRONT
    raster.style.display = "block";

    // PLAY AUDIO
    sid.play().catch(() => {
        console.log("Autoplay blocked");
    });

    // WHEN AUDIO FINISHES → REDIRECT
    sid.onended = () => {
        window.location.href = "home.html";
    };
}

/* ==== SKIP INTRO ==== */
function skipIntro() {
    sid.pause();
    sid.currentTime = 0;
    window.location.href = "home.html";
}

skipBtn.addEventListener("click", skipIntro);

// ESC key
document.addEventListener("keydown", e => {
    if (e.key === "Escape") skipIntro();
});

/* START */
startSequence();
</script>

</body>
</html>
