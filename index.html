<!-- ========================================================= -->
<!--   C64 INTRO ENGINE — FUNCTIONALITY ONLY (NO STYLE)        -->
<!--   (The CLICK TO POWER ON screen remains exactly as-is)    -->
<!-- ========================================================= -->

<!-- BASIC + TAPE LOAD STATES (hidden initially until power on) -->
<div id="c64-basic-screen" style="display:none;">
<pre id="basic-text">
**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM 38911 BASIC BYTES FREE

READY.
</pre>
</div>

<!-- Raster + Large Loading Bars (FRONT LAYER) -->
<div id="raster-stage" style="display:none;">
    <div id="big-loading-bars"></div>
</div>

<!-- Skip button stays visible at all times -->
<button id="skip-intro" style="
    position:fixed; top:10px; right:10px; z-index:9999;">
    [ ESC ] SKIP INTRO
</button>

<!-- SID AUDIO -->
<audio id="sidSpeech" preload="auto">
    <source src="resources/audio/c64_speech_stayawhile.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------------------------------------------------------
    ELEMENTS
--------------------------------------------------------- */
const basicScreen = document.getElementById("c64-basic-screen");
const basicText   = document.getElementById("basic-text");
const rasterStage = document.getElementById("raster-stage");
const loadingBars = document.getElementById("big-loading-bars");
const skipButton  = document.getElementById("skip-intro");
const sidAudio    = document.getElementById("sidSpeech");

const REDIRECT_URL = "home.html";

let redirectTimeout = null;

/* ---------------------------------------------------------
    EXTERNAL TRIGGER — CALL THIS WHEN “CLICK TO POWER ON”
    FINISHES.  (This should already exist in your code.)
--------------------------------------------------------- */
function startC64IntroSequence() {
    // Show BASIC screen immediately
    basicScreen.style.display = "block";
    showLoadCommand();
}

/* ---------------------------------------------------------
    Step 1 — Print LOAD""
--------------------------------------------------------- */
function showLoadCommand() {
    basicText.innerHTML =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM 38911 BASIC BYTES FREE

READY.
LOAD""`;

    setTimeout(showPressPlay, 800);
}

/* ---------------------------------------------------------
    Step 2 — PRESS PLAY ON TAPE
--------------------------------------------------------- */
function showPressPlay() {
    basicText.innerHTML =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM 38911 BASIC BYTES FREE

READY.
LOAD""
PRESS PLAY ON TAPE`;

    setTimeout(showFoundMessage, 1000);
}

/* ---------------------------------------------------------
    Step 3 — FOUND "CHEEKY COMMODORE GAMER"
--------------------------------------------------------- */
function showFoundMessage() {
    basicText.innerHTML =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM 38911 BASIC BYTES FREE

READY.
LOAD""
PRESS PLAY ON TAPE
FOUND "CHEEKY COMMODORE GAMER"`;

    setTimeout(startRasterAndSID, 500);
}

/* ---------------------------------------------------------
    Step 4 — RASTER BARS (FRONT) + AUDIO + LOADING BARS
--------------------------------------------------------- */
function startRasterAndSID() {

    // Hide BASIC screen completely
    basicScreen.style.display = "none";

    // Show raster + loading bars (front layer)
    rasterStage.style.display = "block";

    startSIDAudio();
    startBigLoadingBars();
}

/* ---------------------------------------------------------
    Audio Engine
--------------------------------------------------------- */
function startSIDAudio() {

    // Try autoplay
    const attempt = sidAudio.play();

    if (attempt !== undefined) {
        attempt.catch(() => {
            // Autoplay blocked — user click will start audio
            document.body.addEventListener("click", playSIDOnce, { once: true });
        });
    }

    sidAudio.onended = () => finishIntro();
}

function playSIDOnce() {
    sidAudio.play();
}

/* ---------------------------------------------------------
    fallback redirect timer (in case audio fails)
--------------------------------------------------------- */
redirectTimeout = setTimeout(() => {
    finishIntro();
}, 10000);

/* ---------------------------------------------------------
    Step 4 — Large Loading Bars Animation (logic only)
--------------------------------------------------------- */
function startBigLoadingBars() {
    let width = 0;

    const interval = setInterval(() => {
        width += 5;
        loadingBars.style.width = width + "%";

        if (width >= 100) {
            clearInterval(interval);
        }
    }, 80);
}

/* ---------------------------------------------------------
    Step 5 — Redirect to home.html
--------------------------------------------------------- */
function finishIntro() {
    sidAudio.pause();
    sidAudio.currentTime = 0;

    if (redirectTimeout) clearTimeout(redirectTimeout);

    window.location.href = REDIRECT_URL;
}

/* ---------------------------------------------------------
    Skip Intro (button + ESC)
--------------------------------------------------------- */
skipButton.addEventListener("click", finishIntro);

document.addEventListener("keydown", e => {
    if (e.key === "Escape") finishIntro();
});
</script>
