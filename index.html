<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCG C64 Intro</title>

    <style>
        :root {
            --c64-border: #00105a;
            --c64-background: #1f23b0; /* inner screen */
            --c64-cyan: #5fffff;       /* text colour */
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: var(--c64-border);
            color: var(--c64-cyan);
            font-family: monospace;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* C64 inner screen */
        #screen {
            white-space: pre;
            padding: 40px 48px;
            background: var(--c64-background);
            box-sizing: border-box;
            width: 90vw;
            max-width: 960px;
            height: 70vh;
            max-height: 540px;
            overflow: hidden;
        }

        /* CRT scanline overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.35) 0px,
                    rgba(0, 0, 0, 0.35) 2px,
                    transparent 2px,
                    transparent 4px
                );
            mix-blend-mode: multiply;
            opacity: 0.9;
            z-index: 1000;
            animation: crt-flicker 0.18s infinite alternate;
        }

        @keyframes crt-flicker {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        /* Raster bars overlay (IN FRONT of everything) */
        #raster {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                    0deg,
                    red 0px,
                    red 4px,
                    orange 4px,
                    orange 8px,
                    yellow 8px,
                    yellow 12px,
                    green 12px,
                    green 16px,
                    cyan 16px,
                    cyan 20px,
                    blue 20px,
                    blue 24px,
                    magenta 24px,
                    magenta 28px
            );
            display: none;
            z-index: 2000;
            opacity: 0.8;
            animation: scrollbars 0.22s linear infinite;
        }

        @keyframes scrollbars {
            0% { background-position-y: 0; }
            100% { background-position-y: 40px; }
        }

        /* Skip Intro button */
        #skip-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #b00000;
            color: #ffffff;
            padding: 10px 18px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            z-index: 3000;
            border: 2px solid #ffffff;
            text-shadow: 0 0 4px rgba(0,0,0,0.9);
        }

        #skip-btn:hover {
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.8);
        }
    </style>
</head>

<body>

<div id="skip-btn">SKIP INTRO</div>

<div id="screen"></div>
<div id="raster"></div>

<audio id="sid" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script>
const screen = document.getElementById("screen");
const raster = document.getElementById("raster");
const sid = document.getElementById("sid");
const skipBtn = document.getElementById("skip-btn");

/* =====================================================
   PERFECT, AUTHENTIC C64 POWER-ON SEQUENCE (TEXT ONLY)
   ===================================================== */
const powerOnText =
` **** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.
`;

function startSequence() {
    // Perfect power-on screen
    screen.textContent = powerOnText;

    // After a short delay, go into the LOAD phase
    setTimeout(loadCommand, 1100);
}

function printLine(text, delay, next) {
    setTimeout(() => {
        screen.textContent += text + "\\n";
        if (next) next();
    }, delay);
}

function loadCommand() {
    printLine('LOAD ""', 500, pressPlay);
}

function pressPlay() {
    printLine('PRESS PLAY ON TAPE', 800, foundFile);
}

function foundFile() {
    printLine("FOUND 'CHEEKY COMMODORE GAMER'", 1000, startAudioAndRaster);
}

function startAudioAndRaster() {
    // FULL-SCREEN RASTER BARS IN FRONT OF EVERYTHING
    raster.style.display = "block";

    // Play audio
    sid.play().catch(() => {
        console.warn("Autoplay blocked; user interaction may be required.");
    });

    // When audio finishes → redirect
    sid.onended = () => {
        window.location.href = "home.html";
    };
}

function skipIntro() {
    sid.pause();
    sid.currentTime = 0;
    window.location.href = "home.html";
}

skipBtn.addEventListener("click", skipIntro);

document.addEventListener("keydown", e => {
    if (e.key === "Escape") skipIntro();
});

// Start the sequence immediately
startSequence();
</script>

</body>
</html>
