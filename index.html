<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – Intro</title>

    <!-- Main CRT + Neon Styles -->
    <link rel="stylesheet" href="/ccgamer_website_new/resources/css/ccg-master.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body.intro-body {
            background: radial-gradient(circle at top, #050915 0, #060320 40%, #000000 100%);
            color: #5fffff;
            font-family: monospace;
            overflow: hidden;
            position: relative;
        }

        /* POWER-ON SCREEN */
        #powerOverlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .intro-logo {
            width: 280px;
            max-width: 80vw;
            margin-bottom: 32px;
            filter:
                drop-shadow(0 0 25px rgba(0, 255, 255, 0.7))
                drop-shadow(0 0 45px rgba(0, 100, 255, 0.7));
        }

        #powerText {
            font-size: 32px;
            letter-spacing: 0.18em;
            text-shadow: 0 0 8px rgba(95,255,255,0.9);
            animation: pulse 1.3s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse {
            0%   { opacity: 0.45; transform: scale(1); }
            50%  { opacity: 1;    transform: scale(1.06); }
            100% { opacity: 0.45; transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        /* SKIP INTRO BUTTON */
        #skipIntroBtn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 40;
            background: #b0002a;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #skipIntroBtn:hover {
            box-shadow: 0 0 12px rgba(255,140,140,0.9);
        }

        /* C64 SCREEN */
        #c64Wrapper {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c64-border {
            background: #000f5a;
            padding: 26px;
        }

        .c64-inner {
            background: #1f23b0;
            padding: 32px 40px;
            width: 900px;
            max-width: 90vw;
            height: 520px;
            max-height: 70vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        #c64Text {
            white-space: pre;
            color: #5fffff;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 0.05em;
        }

        /* FULL-SCREEN RASTER (softened, slowed, authentic) */
        #rasterOverlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            opacity: 0.95;

            /* blackout background */
            background-color: black;

            /* thick, blurred, colourful bars */
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 0, 0.9) 0px,   rgba(255, 0, 0, 0.9) 16px,
                    rgba(255,165,0,0.9) 16px,  rgba(255,165,0,0.9) 32px,
                    rgba(255,255,0,0.9) 32px,  rgba(255,255,0,0.9) 48px,
                    rgba(0,255,0,0.9) 48px,    rgba(0,255,0,0.9) 64px,
                    rgba(0,255,255,0.9) 64px,  rgba(0,255,255,0.9) 80px,
                    rgba(0,128,255,0.9) 80px,  rgba(0,128,255,0.9) 96px,
                    rgba(128,0,255,0.9) 96px,  rgba(128,0,255,0.9) 112px
                );

            filter: blur(4px);
            animation: rasterScroll 0.45s linear infinite;
            transform: scaleY(1.1);
        }

        @keyframes rasterScroll {
            0%   { background-position-y: 0; }
            100% { background-position-y: 64px; }
        }

        /* CRT scanlines */
        body.intro-body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.45) 0px,
                    rgba(0, 0, 0, 0.45) 2px,
                    transparent 2px,
                    transparent 4px
                );
            mix-blend-mode: multiply;
            opacity: 0.95;
            z-index: 2;
            animation: crtFlicker 0.18s infinite alternate;
        }

        @keyframes crtFlicker {
            0%   { opacity: 0.88; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body class="crt intro-body c64-mode">

<!-- SKIP INTRO -->
<button id="skipIntroBtn">[ ESC ] SKIP INTRO</button>

<!-- POWER ON -->
<div id="powerOverlay">
    <img src="resources/C64 NEON.png" class="intro-logo" alt="CCG Neon Logo">
    <p id="powerText">CLICK TO POWER ON</p>
</div>

<!-- C64 SCREEN -->
<div id="c64Wrapper" class="hidden">
    <div class="c64-border">
        <div class="c64-inner">
            <pre id="c64Text"></pre>
        </div>
    </div>
</div>

<!-- RASTER -->
<div id="rasterOverlay"></div>

<!-- AUDIO -->
<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script>
(function () {
    const powerOverlay = document.getElementById("powerOverlay");
    const powerText    = document.getElementById("powerText");
    const c64Wrapper   = document.getElementById("c64Wrapper");
    const c64Text      = document.getElementById("c64Text");
    const raster       = document.getElementById("rasterOverlay");
    const sidAudio     = document.getElementById("sidAudio");
    const skipBtn      = document.getElementById("skipIntroBtn");

    const timers = [];

    function schedule(fn, ms) {
        let id = setTimeout(fn, ms);
        timers.push(id);
    }

    function clearTimers() {
        timers.forEach(id => clearTimeout(id));
        timers.length = 0;
    }

    const basicText =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.

`;

    function showBasic() {
        c64Text.textContent = basicText;
    }

    function appendLine(line) {
        c64Text.textContent += line + "\n";
    }

    function startLoadSequence() {

        schedule(() => {
            appendLine(`LOAD ""`);

            schedule(() => {
                appendLine(`PRESS PLAY ON TAPE`);

                schedule(() => {
                    appendLine(`FOUND "CHEEKY COMMODORE GAMER"`);
                    appendLine(`LOADING`);

                    // 1 second delay BEFORE raster/audio
                    schedule(() => {
                        startRasterAudio();
                    }, 1000);

                }, 900);

            }, 900);

        }, 800);
    }

    function startRasterAudio() {
        raster.style.display = "block";

        try {
            sidAudio.currentTime = 0;
            sidAudio.play().catch(()=>{});
        } catch(e){}

        sidAudio.onended = () => window.location.href = "home.html";
    }

    function beginIntro() {
        if (powerOverlay.classList.contains("hidden")) return;

        powerOverlay.classList.add("hidden");
        c64Wrapper.classList.remove("hidden");

        showBasic();
        startLoadSequence();
    }

    function skip() {
        clearTimers();
        try {
            sidAudio.pause();
            sidAudio.currentTime = 0;
        } catch(e){}
        window.location.href = "home.html";
    }

    // CLICK ANYWHERE TO POWER ON (except Skip)
    document.addEventListener("click", e => {
        if (e.target === skipBtn || e.target.closest("#skipIntroBtn")) return;
        if (!powerOverlay.classList.contains("hidden")) beginIntro();
    });

    // TEXT CLICK
    powerText.addEventListener("click", e => {
        e.stopPropagation();
        beginIntro();
    });

    // SKIP INTRO
    skipBtn.addEventListener("click", e => {
        e.stopPropagation();
        skip();
    });

    // KEYS
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") skip();
        if ((e.key === "Enter" || e.key === " ") && !powerOverlay.classList.contains("hidden")) {
            beginIntro();
        }
    });
})();
</script>

</body>
</html>
