<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCG | C64 INTRO</title>

<!-- C64 FONT -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #00002b;
        color: #ffffff;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
        text-shadow: 0 0 6px #0011ff;
    }

    /* TITLE */
    #intro-title {
        position: absolute;
        top: 30%;
        width: 100%;
        text-align: center;
        font-size: 26px;
        letter-spacing: 8px;
        opacity: 0;
        animation: fadeIn 1.5s forwards 0.7s;
    }

    /* RASTER BARS */
    .bars {
        position: absolute;
        width: 100%;
        top: 55%;
        height: 150px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        opacity: 0;
        animation: fadeIn 1.5s forwards 2s;
    }
    .bar {
        height: 10px;
        animation: move 0.2s infinite;
    }
    @keyframes move { 
        0%   { transform: translateX(-10px); }
        50%  { transform: translateX(10px); }
        100% { transform: translateX(-10px); }
    }

    /* Skip Button */
    #skip-intro {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 18px;
        font-size: 14px;
        background: white;
        color: black;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        z-index: 99;
    }

    @keyframes fadeIn { 
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Click-to-start overlay (hidden by default!) */
    #audioUnlock {
        display: none;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.8);
        color: white;
        font-family: 'Press Start 2P';
        text-align: center;
        padding-top: 40vh;
    }
    #audioUnlock button {
        margin-top: 20px;
        padding: 10px 20px;
        background: white;
        color: black;
        border: none;
        cursor: pointer;
        font-family: inherit;
    }
</style>
</head>

<body>

<button id="skip-intro">SKIP INTRO</button>

<div id="intro-title">CHEEKY COMMODORE GAMER</div>

<!-- Raster bars -->
<div class="bars">
    <div class="bar" style="background:#ff0000;"></div>
    <div class="bar" style="background:#ffaa00;"></div>
    <div class="bar" style="background:#ffff00;"></div>
    <div class="bar" style="background:#00ff00;"></div>
    <div class="bar" style="background:#00aaff;"></div>
    <div class="bar" style="background:#0000ff;"></div>
    <div class="bar" style="background:#aa00ff;"></div>
</div>

<!-- Shown ONLY if autoplay blocked -->
<div id="audioUnlock">
    TAP TO ENABLE SOUND<br>
    <button id="audio-btn">BEGIN</button>
</div>

<script src="js/index-intro.js"></script>

</body>
</html>
