<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-blue:   #352879;
            --c64-light:  #6c5eb5;
            --c64-text:   #b8c76f;

            --c64-black:  #000000;
            --c64-white:  #ffffff;
            --c64-purple: #cc44cc;
            --c64-yellow: #feff6c;
            --c64-brown:  #664400;
            --c64-green:  #55cc55;
            --c64-blue2:  #5c6cff;
            --c64-cyan:   #00ffff;
            --c64-pink:   #ff66ff;
            --c64-red:    #ff3333;
            --c64-grey:   #aaaaaa;
            --c64-teal:   #00ccaa;
            --c64-orange: #ff9900;
            --c64-lime:   #88ff44;
        }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow: hidden;
            background: var(--c64-blue);
        }

        /* -----------------------
           POWER-ON SCREEN
           ----------------------- */
        #power-screen {
            position: fixed;
            inset: 0;
            background: var(--c64-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            color: var(--c64-light);
        }

        #power-logo {
            width: 160px;
            margin-bottom: 25px;
            image-rendering: pixelated;
        }

        #power-text {
            font-size: 34px;
            letter-spacing: 2px;
            animation: blink 1.1s steps(1,end) infinite;
        }

        @keyframes blink {
            0%,49% { opacity:1; }
            50%,100% { opacity:0; }
        }

        /* Scanlines for power screen */
        #power-crt {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9100;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.22) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.05), rgba(0,255,0,0.02), rgba(0,0,255,0.05));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.5;
        }

        /* -------------------------
           SKIP INTRO BUTTON
           ------------------------- */
        #skip-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 999999;
            background: #880000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 22px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            pointer-events: auto !important;
        }

        #skip-btn:hover {
            background: #fff;
            color:#880000;
        }

        /* -------------------------
           C64 LOADING SCREEN
           ------------------------- */
        #loader-screen {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--c64-blue);
            z-index: 9200;
        }

        .c64-screen {
            padding: 16px 28px;
            width: min(1200px, 96vw);
            height: min(820px, 92vh);
            box-sizing: border-box;
            background: var(--c64-blue);
            color: var(--c64-light);
        }

        .c64-line {
            font-size: 28px;
        }

        #loader-output {
            margin-top: 32px;
            font-size: 28px;
            line-height: 1.3;
            white-space: pre-wrap;
        }

        #loader-cursor {
            display: inline-block;
            width: 16px;
            height: 1.4em;
            background: var(--c64-light);
            animation: blink 0.8s steps(1,end) infinite;
            margin-left: 5px;
        }

        /* Scanlines for loader */
        #loader-crt {
            position: fixed;
            inset: 0;
            pointer-events:none;
            z-index: 9300;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.17) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.02), rgba(0,0,255,0.04));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.45;
            transition: opacity .2s;
        }

        /* -------------------------
           FULLSCREEN RASTER BARS
           ------------------------- */
        #rasterBars {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 9400;
            image-rendering: pixelated;
            background:
                repeating-linear-gradient(
                    to bottom,
                    var(--c64-blue)   0px,   var(--c64-blue)    8px,
                    var(--c64-white)  8px,   var(--c64-white)   16px,
                    var(--c64-purple)16px,   var(--c64-purple)  24px,
                    var(--c64-yellow)24px,   var(--c64-yellow)  32px,
                    var(--c64-brown) 32px,   var(--c64-brown)   40px,
                    var(--c64-green) 40px,   var(--c64-green)   48px,
                    var(--c64-blue2) 48px,   var(--c64-blue2)   56px,
                    var(--c64-cyan)  56px,   var(--c64-cyan)    64px,
                    var(--c64-pink)  64px,   var(--c64-pink)    72px,
                    var(--c64-red)   72px,   var(--c64-red)     80px,
                    var(--c64-grey)  80px,   var(--c64-grey)    88px,
                    var(--c64-teal)  88px,   var(--c64-teal)    96px,
                    var(--c64-orange)96px,   var(--c64-orange) 104px,
                    var(--c64-lime) 104px,   var(--c64-lime)   112px
                );
        }

        #rasterBars.active {
            opacity: 0.97;
            animation: barscroll 0.8s linear infinite, barjitter 0.06s infinite;
        }

        @keyframes barscroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 320px; }
        }

        @keyframes barjitter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-1px); }
            100%{ transform: translateY(0px); }
        }
    </style>
</head>

<body>

<button id="skip-btn">SKIP INTRO</button>

<!-- POWER SCREEN -->
<div id="power-screen">
    <img id="power-logo" src="resources/CCGAMER LOGO.png">
    <div id="power-text">CLICK TO POWER ON</div>
</div>
<div id="power-crt"></div>

<!-- LOADER SCREEN -->
<div id="loader-screen">
    <div class="c64-screen">
        <div class="c64-line">**** COMMODORE 64 BASIC V2 ****</div>
        <div class="c64-line">64K RAM SYSTEM 38911 BASIC BYTES FREE</div>
        <div class="c64-line">&nbsp;</div>

        <div id="loader-output"></div>
        <span id="loader-cursor"></span>
    </div>
</div>
<div id="loader-crt"></div>

<!-- RASTER BARS -->
<div id="rasterBars"></div>

<audio id="introAudio" preload="auto">
    <source src="resources/audio/c64_speech_stayawhile.mp3" type="audio/mpeg">
</audio>

<script>
(function(){

    const power   = document.getElementById('power-screen');
    const loader  = document.getElementById('loader-screen');
    const skipBtn = document.getElementById('skip-btn');

    const output  = document.getElementById('loader-output');
    const cursor  = document.getElementById('loader-cursor');

    const audio   = document.getElementById('introAudio');
    const bars    = document.getElementById('rasterBars');

    const loaderCRT = document.getElementById('loader-crt');
    const powerCRT  = document.getElementById('power-crt');

    let finished = false;

    /* -------------------------
       POWER ON → START LOADER
       ------------------------- */
    power.addEventListener('click', () => {
        power.style.display = 'none';
        powerCRT.style.display = 'none';

        loader.style.display = 'flex';
        runSequence();
    });

    /* -------------------------
       SKIP INTRO
       ------------------------- */
    skipBtn.addEventListener('click', goToHub);

    function goToHub() {
        if (finished) return;
        finished = true;

        try { audio.pause(); } catch(e){}
        try { audio.currentTime = 0; } catch(e){}

        // Redirect to actual hub
        window.location.href = "complete-index.html";
    }

    /* -------------------------
       LOADER STEPS
       ------------------------- */
    const steps = [
        { text:'LOAD ""', wait:600, audio:true },
        { text:'PRESS PLAY ON TAPE', wait:600 },
        { text:'OK', wait:500 },
        { text:'SEARCHING', wait:600 },
        { text:'FOUND CHEEKY COMMODORE GAMER', wait:600 },
        { text:'LOADING', wait:400, bars:true },
        { text:'ANOTHER VISITOR...', wait:400 },
        { text:'STAY A WHILE...', wait:400 },
        { text:'STAY FOREVER!', wait:400 }
    ];

    function typeLine(text, triggerAudio=false) {
        return new Promise(resolve => {

            let i = 0;
            const interval = setInterval(() => {
                output.textContent += text.charAt(i);
                i++;

                /* Start sound EXACTLY when LOAD "" finishes typing */
                if (i === text.length && triggerAudio) {
                    startAudio();
                }

                if (i >= text.length) {
                    clearInterval(interval);
                    output.textContent += '\n';
                    resolve();
                }
            }, 45);
        });
    }

    function startAudio() {
        audio.currentTime = 0;
        audio.muted = true;

        audio.play().then(() => {
            setTimeout(() => { audio.muted = false; }, 100);
        }).catch(() => {
            const unlock = () => {
                audio.muted = false;
                audio.currentTime = 0;
                audio.play().catch(()=>{});
                window.removeEventListener('click', unlock);
            };
            window.addEventListener('click', unlock, { once:true });
        });
    }

    function startBars() {
        bars.classList.add('active');
        loaderCRT.style.opacity = 0;

        // After raster bars + speech → go to hub
        setTimeout(() => {
            if (!finished) goToHub();
        }, 5500);
    }

    /* -------------------------
       RUN FULL LOADING SEQUENCE
       ------------------------- */
    async function runSequence() {
        output.textContent = "";

        for (const step of steps) {
            await typeLine(step.text, step.audio);

            if (step.bars) startBars();

            await new Promise(r => setTimeout(r, step.wait));
        }
    }

})();
</script>

</body>
</html>
