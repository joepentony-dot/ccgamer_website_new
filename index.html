<!DOCTYPE html>
<html lang="en" data-ccg-page="intro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | Booting System...</title>

    <meta name="description"
          content="Cinematic Commodore 64 style boot sequence for Cheeky Commodore Gamer. Another visitor... Stay a while, stay forever.">

    <link rel="icon" href="favicon.ico">

    <!-- GLOBAL (LIGHT) -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">
    <link rel="stylesheet" href="resources/css/ccg-mode.css">
    <link rel="stylesheet" href="resources/css/ccg-effects.css">

    <!-- INTRO SPECIFIC -->
    <link rel="stylesheet" href="resources/css/intro.css">
</head>

<body class="intro-body" data-ccg-mode="c64">

    <div class="intro-root">

        <!-- BACKGROUND VIDEO -->
        <video id="loaderVideo"
               class="intro-video"
               autoplay
               muted
               loop
               playsinline>
            <source src="resources/videos/c64_loader.mp4" type="video/mp4">
        </video>

        <!-- OVERLAY LAYERS -->
        <div id="introOverlay" class="intro-overlay intro-click-area">

            <!-- SKIP INTRO -->
            <button id="skipIntro" class="intro-skip" type="button">
                SKIP INTRO
            </button>

            <!-- FADE LAYER -->
            <div id="introFade" class="intro-fade"></div>

            <!-- IDLE POWER ON PROMPT -->
            <div id="introIdle" class="intro-idle">
                <div class="intro-idle-title">CLICK TO POWER ON</div>
                <div class="intro-idle-sub">Press fire to boot the system...</div>
            </div>

            <!-- C64 READY / LOAD TEXT -->
            <div id="introC64" class="intro-c64-screen" aria-hidden="true">
                <div class="intro-c64-line intro-c64-line--header">
                    **** COMMODORE 64 BASIC V2 ****
                </div>
                <div class="intro-c64-line intro-c64-line--header">
                    64K RAM SYSTEM  38911 BASIC BYTES FREE
                </div>
                <div class="intro-c64-line intro-c64-line--header">
                    READY.
                </div>

                <!-- Typed lines appear here -->
                <div id="typedLines"></div>
            </div>

            <!-- BIG NEON SPEECH TEXT -->
            <div id="speechText" class="intro-speech-text" aria-hidden="true">
                <!-- JS injects:
                     ANOTHER VISITOR
                     STAY A WHILE
                     STAY FOREVER... -->
            </div>
        </div>

    </div>

    <!-- JS -->
    <script src="js/index-intro.js" defer></script>
</body>
</html>
