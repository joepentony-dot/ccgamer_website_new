<!DOCTYPE html>
<html lang="en" data-ccg-page="intro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheeky Commodore Gamer | Booting System...</title>

    <meta name="description"
          content="Cinematic Commodore 64-style boot sequence for the Cheeky Commodore Gamer website. Another visitor... stay awhile, stay forever." />

    <link rel="icon" href="favicon.ico" />

    <!-- GLOBAL SITE STYLES (unchanged) -->
    <link rel="stylesheet" href="resources/css/ccg-master.css" />

    <!-- C64 BLOCKY FONT -->
    <link rel="stylesheet" href="https://rawcdn.githack.com/dirkwhoff/Grafix/c64-fonts/c64-font.css" />

    <!-- INTRO STYLES -->
    <link rel="stylesheet" href="resources/css/intro.css?v=2" />
</head>

<body class="intro-body">

<div class="intro-root">

    <!-- RASTER VIDEO BACKGROUND -->
    <video id="loaderVideo" class="intro-video" autoplay muted loop playsinline>
        <source src="resources/videos/c64_loader.mp4" type="video/mp4" />
    </video>

    <!-- EVERYTHING LIVES INSIDE THIS OVERLAY -->
    <div id="introOverlay" class="intro-overlay">

        <!-- TOP LEFT LOGO -->
        <div class="intro-logo">
            <img src="resources/images/ccgamer-logo.png" alt="Cheeky Commodore Gamer" />
        </div>

        <!-- TOP RIGHT SKIP BUTTON -->
        <button id="skipIntro" class="intro-skip" type="button">SKIP INTRO</button>

        <!-- FADE LAYER -->
        <div id="introFade"></div>

        <!-- IDLE STATE (WAITING FOR USER CLICK) -->
        <div id="introIdle" class="intro-idle">
            <div class="intro-idle-title">CLICK TO POWER ON</div>
        </div>

        <!-- C64 BASIC PANEL -->
        <div id="introC64" class="intro-c64-screen">

            <div class="intro-c64-line intro-c64-line--header">
                **** COMMODORE 64 BASIC V2 ****
            </div>

            <div class="intro-c64-line intro-c64-line--header">
                64K RAM SYSTEM  38911 BASIC BYTES FREE
            </div>

            <div class="intro-c64-line intro-c64-line--ready">
                READY.
            </div>

            <!-- TYPED COMMAND LINES -->
            <div id="typedLines"></div>
        </div>

        <!-- HUGE NEON SPEECH TEXT APPEARS HERE -->
        <div id="speechText" class="intro-speech-text"></div>

    </div><!-- /introOverlay -->
</div><!-- /intro-root -->

<!-- INTRO SCRIPT -->
<script src="js/index-intro.js?v=2" defer></script>

</body>
</html>
