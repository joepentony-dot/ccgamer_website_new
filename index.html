<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-blue:   #352879;
            --c64-light:  #6c5eb5;
            --c64-text:   #b8c76f;

            --border-blue: #201856;
        }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow: hidden;
            background: var(--c64-blue);
        }

        /* C64 BORDER FRAME */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            border: 28px solid var(--border-blue);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 99999;
        }

        /* CRT CURVE */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center,
                    rgba(255,255,255,0.03) 0%,
                    rgba(0,0,0,0.5) 100%);
            mix-blend-mode: soft-light;
            pointer-events: none;
            z-index: 99990;
        }

        /* -----------------------
           POWER-ON SCREEN
           ----------------------- */
        #power-screen {
            position: fixed;
            inset: 0;
            background: var(--c64-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            color: var(--c64-light);
            cursor: pointer;
        }

        #power-logo {
            width: 160px;
            margin-bottom: 26px;
            image-rendering: pixelated;
        }

        #power-text {
            font-size: 36px;
            letter-spacing: 2px;
            animation: blink 1.1s steps(1,end) infinite;
        }

        @keyframes blink {
            0%,49% { opacity:1; }
            50%,100% { opacity:0; }
        }

        #power-crt {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9100;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.22) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.03), rgba(0,0,255,0.06));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.55;
        }

        /* -------------------------
           SKIP INTRO BUTTON
           ------------------------- */
        #skip-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 999999;
            background: #880000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }

        #skip-btn:hover {
            background: #fff;
            color:#880000;
        }

        /* -------------------------
           LOADER SCREEN
           ------------------------- */
        #loader-screen {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--c64-blue);
            z-index: 9200;
        }

        .c64-screen {
            padding: 16px 28px;
            width: min(1200px, 90vw);
            height: min(820px, 90vh);
            background: var(--c64-blue);
            color: var(--c64-light);
        }

        .c64-line {
            font-size: 28px;
        }

        #loader-output {
            margin-top: 32px;
            font-size: 28px;
            white-space: pre-wrap;
            line-height: 1.2;
        }

        #loader-cursor {
            display: inline-block;
            width: 18px;
            height: 1.4em;
            background: var(--c64-light);
            animation: blink 0.8s steps(1,end) infinite;
            margin-left: 6px;
        }

        #loader-crt {
            position: fixed;
            inset: 0;
            pointer-events:none;
            z-index: 9300;
            background:
                linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.17) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.04), rgba(0,255,0,0.02), rgba(0,0,255,0.04));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.45;
            transition: opacity .2s;
        }

        /* -------------------------
           RASTER BARS (SOFTENED)
           ------------------------- */
        #rasterBars {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 9400;
            filter: blur(1.6px);
            image-rendering: pixelated;
            background:
                repeating-linear-gradient(
                    to bottom,
                    #352879 0px,   #352879 10px,
                    #ffffff 10px,  #ffffff 20px,
                    #cc44cc 20px,  #cc44cc 30px,
                    #feff6c 30px,  #feff6c 40px,
                    #664400 40px,  #664400 50px,
                    #55cc55 50px,  #55cc55 60px,
                    #5c6cff 60px,  #5c6cff 70px,
                    #00ffff 70px,  #00ffff 80px,
                    #ff66ff 80px,  #ff66ff 90px,
                    #ff3333 90px,  #ff3333 100px,
                    #aaaaaa 100px, #aaaaaa 110px,
                    #00ccaa 110px, #00ccaa 120px,
                    #ff9900 120px, #ff9900 130px,
                    #88ff44 130px, #88ff44 140px
                );
        }

        #rasterBars.active {
            opacity: 0.92;
            animation: barscroll 1.1s linear infinite, barjitter 0.08s infinite;
        }

        @keyframes barscroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 340px; }
        }

        @keyframes barjitter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-1px); }
            100%{ transform: translateY(0px); }
        }

    </style>
</head>

<body>

<button id="skip-btn">SKIP INTRO</button>

<!-- POWER SCREEN -->
<div id="power-screen">
    <img id="power-logo" src="resources/CCGAMER LOGO.png">
    <div id="power-text">CLICK TO POWER ON</div>
</div>
<div id="power-crt"></div>

<!-- LOADER SCREEN -->
<div id="loader-screen">
    <div class="c64-screen">
        <div class="c64-line">**** COMMODORE 64 BASIC V2 ****</div>
        <div class="c64-line">64K RAM SYSTEM 38911 BASIC BYTES FREE</div>
        <div class="c64-line">&nbsp;</div>

        <div id="loader-output"></div>
        <span id="loader-cursor"></span>
    </div>
</div>
<div id="loader-crt"></div>

<!-- RASTER -->
<div id="rasterBars"></div>

<!-- AUDIO -->
<audio id="introAudio" preload="auto">
    <source src="resources/audio/c64_speech_stayawhile.mp3" type="audio/mpeg">
</audio>

<script>
(function(){

    const power    = document.getElementById('power-screen');
    const loader   = document.getElementById('loader-screen');
    const skipBtn  = document.getElementById('skip-btn');
    const output   = document.getElementById('loader-output');
    const cursor   = document.getElementById('loader-cursor');
    const audio    = document.getElementById('introAudio');
    const bars     = document.getElementById('rasterBars');
    const loaderCRT = document.getElementById('loader-crt');
    const powerCRT  = document.getElementById('power-crt');

    /* -------------------------
       SKIP INTRO ALWAYS WORKS
       ------------------------- */
    function goToHub() {
        try { audio.pause(); } catch(e){}
        try { audio.currentTime = 0; } catch(e){}
        window.location.href = "home.html";
    }

    skipBtn.addEventListener('click', goToHub);

    /* -------------------------
       POWER ON
       ------------------------- */
    power.addEventListener('click', () => {
        power.style.display = 'none';
        powerCRT.style.display = 'none';
        loader.style.display = 'flex';
        runSequence();
    });

    /* LOADER TEXT STEPS */
    const steps = [
        { text:'LOAD ""', wait:700, audio:true },
        { text:'PRESS PLAY ON TAPE', wait:700 },
        { text:'OK', wait:500 },
        { text:'SEARCHING', wait:600 },
        { text:'FOUND CHEEKY COMMODORE GAMER', wait:700 },
        { text:'LOADING', wait:500, bars:true },
        { text:'ANOTHER VISITOR...', wait:400 },
        { text:'STAY A WHILE...', wait:400 },
        { text:'STAY FOREVER!', wait:400 }
    ];

    /* TYPEWRITER EFFECT */
    function typeLine(text, triggerAudio=false) {
        return new Promise(resolve => {

            let i = 0;
            const interval = setInterval(() => {
                output.textContent += text.charAt(i);
                i++;

                if (i === text.length && triggerAudio) {
                    startAudio();
                }

                if (i >= text.length) {
                    clearInterval(interval);
                    output.textContent += '\n';
                    resolve();
                }
            }, 45);
        });
    }

    /* START AUDIO */
    function startAudio() {
        audio.currentTime = 0;
        audio.muted = true;

        audio.play().then(() => {
            setTimeout(() => { audio.muted = false; }, 120);
        }).catch(() => {
            const unlock = () => {
                audio.muted = false;
                audio.currentTime = 0;
                audio.play().catch(()=>{});
                window.removeEventListener('click', unlock);
            };
            window.addEventListener('click', unlock, { once:true });
        });
    }

    /* START RASTER + AUTO REDIRECT */
    function startBars() {
        bars.classList.add('active');
        loaderCRT.style.opacity = 0;

        setTimeout(goToHub, 5500);
    }

    /* RUN FULL LOAD SEQUENCE */
    async function runSequence() {
        output.textContent = "";

        for (const step of steps) {
            await typeLine(step.text, step.audio);

            if (step.bars) startBars();

            await new Promise(r => setTimeout(r, step.wait));
        }
    }

})();
</script>

</body>
</html>
