<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – C64 Intro</title>

    <!-- Core global styles -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">
    <!-- Intro-only styles -->
    <link rel="stylesheet" href="resources/css/intro.css">

    <!-- SID text font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body class="intro-body">

<button id="skipIntroBtn">[ ESC ] SKIP INTRO</button>

<!-- POWER-ON OVERLAY -->
<div id="powerOverlay">
    <img src="resources/c64_neon.png" class="intro-logo" alt="Cheeky Commodore Gamer C64 Neon Logo">
    <p id="powerText">CLICK TO POWER ON</p>
</div>

<!-- C64 BLUE SCREEN -->
<div id="c64Wrapper" class="hidden">
    <div class="c64-border">
        <div class="c64-inner">
            <pre id="c64Text"></pre>
        </div>
    </div>
</div>

<!-- MICRO FLASH BETWEEN C64 SCREEN AND RASTER -->
<div id="flashOverlay"></div>

<!-- FULL-SCREEN RASTER BARS -->
<div id="rasterOverlay"></div>

<!-- BIG SID QUOTE TEXT -->
<div id="sidText"></div>

<!-- ONLY AUDIO: STAY A WHILE, STAY FOREVER -->
<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script src="js/index-intro.js" defer></script>

</body>
</html>
