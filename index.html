<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>

    <!-- C64 Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-blue: #352879;
            --c64-light-blue: #6c5eb5;
            --c64-text: #b8c76f;
            --c64-black: #000000;
            --c64-white: #ffffff;
            --c64-purple: #cc44cc;
            --c64-yellow: #feff6c;
            --c64-brown: #664400;
            --c64-green: #55cc55;
            --c64-blue2: #6c5eb5;
            --c64-cyan: #00ffff;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--c64-blue);
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* FULLSCREEN INTRO WRAPPER */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--c64-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9000;
        }

        /* C64 SCREEN (no border around entire screen) */
        .c64-screen {
            position: relative;
            background: var(--c64-blue);
            padding: 14px 24px;
            width: min(1200px, 94vw);
            height: min(820px, 90vh);
            overflow: hidden;
            box-sizing: border-box;
        }

        .c64-line {
            color: var(--c64-light-blue);
            font-size: 28px;
            letter-spacing: 1px;
        }

        .c64-loader-output {
            margin-top: 20px;
            font-size: 28px;
            color: var(--c64-light-blue);
            white-space: pre-wrap;
            line-height: 1.3;
        }

        .c64-cursor {
            display: inline-block;
            width: 16px;
            height: 1.35em;
            background: var(--c64-light-blue);
            animation: blink-cursor 0.8s steps(1,end) infinite;
            margin-left: 6px;
        }

        @keyframes blink-cursor {
            0%,49% { opacity:1; }
            50%,100% { opacity:0; }
        }

        /* SKIP BUTTON */
        #skip-intro-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10001;
            background: #880000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
        }

        #skip-intro-btn:hover {
            background:#fff;
            color:#880000;
        }

        /* CRT scanlines (less prominent per your request) */
        .crt-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9500;
            background:
                linear-gradient(
                    rgba(0,0,0,0) 50%,
                    rgba(0,0,0,0.15) 50%
                ),
                linear-gradient(
                    90deg,
                    rgba(255,0,0,0.04),
                    rgba(0,255,0,0.02),
                    rgba(0,0,255,0.04)
                );
            background-size: 100% 2px, 3px 100%;
            opacity: 0.5;
        }

        /* AUTHENTIC RASTER BARS — STRICT “A” ORDER FROM YOUR IMAGE */
        .raster-bars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            image-rendering: pixelated;
            background: repeating-linear-gradient(
                to bottom,
                var(--c64-black) 0px,   var(--c64-black) 6px,
                var(--c64-white) 6px,   var(--c64-white) 12px,
                var(--c64-purple) 12px, var(--c64-purple) 18px,
                var(--c64-yellow) 18px, var(--c64-yellow) 24px,
                var(--c64-brown) 24px,  var(--c64-brown) 30px,
                var(--c64-green) 30px,  var(--c64-green) 36px,
                var(--c64-blue2) 36px,  var(--c64-blue2) 42px,
                var(--c64-cyan) 42px,   var(--c64-cyan) 48px
            );
        }

        .raster-bars.active {
            opacity:0.92;
            animation: barscroll 0.9s linear infinite, barjitter 0.07s infinite;
        }

        @keyframes barscroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 300px; }
        }

        @keyframes barjitter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-1px); }
            100% { transform: translateY(0px); }
        }

        /* MAIN SITE PLACEHOLDER */
        #main-site {
            display: none;
            height: 100vh;
            background: var(--c64-blue);
            color: var(--c64-text);
            padding: 40px;
        }
    </style>
</head>

<body>

<div class="crt-overlay"></div>

<!-- INTRO -->
<div id="intro-screen">
    <div class="c64-screen">
        <div class="c64-line">**** COMMODORE 64 BASIC V2 ****</div>
        <div class="c64-line">64K RAM SYSTEM 38911 BASIC BYTES FREE</div>
        <div class="c64-line">&nbsp;</div>

        <div id="c64-loader-output" class="c64-loader-output"></div>
        <span id="c64-cursor" class="c64-cursor"></span>

        <div id="rasterBars" class="raster-bars"></div>
    </div>
</div>

<button id="skip-intro-btn">[ ESC ] SKIP INTRO</button>

<audio id="intro-audio" preload="auto">
    <source src="resources/audio/c64_speech_stayawhile.mp3" type="audio/mpeg">
</audio>

<!-- MAIN SITE PLACEHOLDER -->
<div id="main-site">
    <h1>MAIN SITE PLACEHOLDER</h1>
</div>

<script>
(function(){
    const output = document.getElementById('c64-loader-output');
    const cursor = document.getElementById('c64-cursor');
    const audio  = document.getElementById('intro-audio');
    const bars   = document.getElementById('rasterBars');
    const intro  = document.getElementById('intro-screen');
    const main   = document.getElementById('main-site');
    const skip   = document.getElementById('skip-intro-btn');

    let finished = false;

    const lines = [
        { txt:'LOAD ""', wait:600 },
        { txt:'PRESS PLAY ON TAPE', wait:1200, audio:true },
        { txt:'OK', wait:700 },
        { txt:'SEARCHING', wait:900 },
        { txt:'FOUND CHEEKY COMMODORE GAMER', wait:1100 },
        { txt:'LOADING', wait:800, bars:true },
        { txt:'', wait:300 },
        { txt:'ANOTHER VISITOR...', wait:1200 },
        { txt:'STAY A WHILE...', wait:1200 },
        { txt:'STAY FOREVER!', wait:2000 }
    ];

    function typeLine(text){
        return new Promise(res=>{
            if(text===''){ output.textContent += '\n'; return res(); }
            let i=0;
            const int=setInterval(()=>{
                output.textContent+=text.charAt(i);
                i++;
                if(i>=text.length){
                    clearInterval(int);
                    output.textContent+='\n';
                    res();
                }
            },45);
        });
    }

    function playAudio(){
        audio.currentTime = 0;
        audio.muted = true;

        audio.play().then(()=>{
            setTimeout(()=>audio.muted=false,100);
        }).catch(()=>{
            window.addEventListener('click', ()=>{
                audio.muted=false;
                audio.play().catch(()=>{});
            }, {once:true});
        });
    }

    function showMain(){
        if(finished) return;
        finished=true;
        audio.pause();
        intro.style.display='none';
        main.style.display='block';
        document.body.style.overflow='auto';
    }

    skip.addEventListener('click', showMain);

    async function run(){
        for(const step of lines){
            await typeLine(step.txt);

            if(step.audio) playAudio();
            if(step.bars)  bars.classList.add('active');

            await new Promise(r=>setTimeout(r, step.wait));
        }

        // GUARANTEED continuation
        setTimeout(showMain, 500);
    }

    window.addEventListener('load', run);
})();
</script>

</body>
</html>
