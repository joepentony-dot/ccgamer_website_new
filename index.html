<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Intro</title>

    <!-- Global CCG styling (CRT, colours, etc.) -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">

    <!-- C64-ish font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-blue: #352879;
            --c64-screen-blue: #1b1696;
            --c64-border: #6c6cff;
            --c64-text: #f2f2ff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--c64-blue);
            color: var(--c64-text);
            font-family: "Press Start 2P", monospace;
        }

        /* Common full-screen wrapper */
        #introRoot {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* POWER SCREEN (logo + click to power on) */
        #powerScreen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #000000 0%, #05002a 60%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #powerScreen img {
            max-width: 420px;
            width: 60%;
            height: auto;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 10px #000);
        }

        #powerPrompt {
            margin-top: 32px;
            font-size: 14px;
            letter-spacing: 3px;
            animation: flash 1s steps(2, start) infinite;
        }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* C64 BOOT SCREEN */
        #bootScreen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
            background-color: var(--c64-blue);
        }

        #bootScreen.active {
            opacity: 1;
            visibility: visible;
        }

        #c64Box {
            width: 90vw;
            max-width: 960px;
            height: 70vh;
            max-height: 540px;
            box-sizing: border-box;
            padding: 24px;
            border: 8px solid var(--c64-border);
            background-color: var(--c64-screen-blue);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #c64Text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: var(--c64-text);
        }

        /* Raster bars */
        #rasterBars {
            margin-top: 16px;
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .raster-row {
            height: 8px;
            width: 100%;
            background: red;
            animation: rasterMove 0.22s linear infinite;
        }

        .raster-row:nth-child(1) { background:#ff0040; animation-delay:0s; }
        .raster-row:nth-child(2) { background:#ff8000; animation-delay:0.03s; }
        .raster-row:nth-child(3) { background:#ffff00; animation-delay:0.06s; }
        .raster-row:nth-child(4) { background:#40ff00; animation-delay:0.09s; }
        .raster-row:nth-child(5) { background:#00a0ff; animation-delay:0.12s; }
        .raster-row:nth-child(6) { background:#0000ff; animation-delay:0.15s; }
        .raster-row:nth-child(7) { background:#a000ff; animation-delay:0.18s; }

        @keyframes rasterMove {
            0%   { transform: translateX(-6px); }
            50%  { transform: translateX(6px); }
            100% { transform: translateX(-6px); }
        }

        /* SKIP BUTTON */
        #skipIntro {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 999;
            padding: 8px 14px;
            font-size: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(0,0,0,0.7);
        }

        #skipIntro:hover {
            background:#f2e5ff;
        }

        @media (max-width: 700px) {
            #c64Box {
                font-size: 11px;
                padding: 16px;
            }
            #c64Text {
                font-size: 11px;
            }
        }
    </style>
</head>

<body class="crt c64-mode">

<div id="introRoot">
    <!-- POWER-ON SCREEN -->
    <div id="powerScreen">
        <img src="resources/CCGAMER LOGO.png" alt="Cheeky Commodore Gamer logo">
        <div id="powerPrompt">CLICK TO POWER ON</div>
    </div>

    <!-- C64 BOOT / LOADER SCREEN -->
    <div id="bootScreen">
        <div id="c64Box">
            <pre id="c64Text"></pre>

            <!-- Raster bars under the text -->
            <div id="rasterBars">
                <div class="raster-row"></div>
                <div class="raster-row"></div>
                <div class="raster-row"></div>
                <div class="raster-row"></div>
                <div class="raster-row"></div>
                <div class="raster-row"></div>
                <div class="raster-row"></div>
            </div>
        </div>
    </div>
</div>

<!-- Skip Intro -->
<button id="skipIntro">SKIP INTRO</button>

<!-- SID speech -->
<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<!-- Intro controller -->
<script src="js/index-intro.js"></script>

</body>
</html>
