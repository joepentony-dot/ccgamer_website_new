<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cheeky Commodore Gamer — Loading…</title>
    <meta name="description" content="Power-on intro for Cheeky Commodore Gamer.">

    <!-- INTRO-ONLY CSS -->
    <link rel="stylesheet" href="resources/css/intro.css" />

    <!-- GLOBAL (needed for fonts + base resets) -->
    <link rel="stylesheet" href="resources/css/ccg-master.css" />
    <link rel="stylesheet" href="resources/css/ccg-effects.css" />
</head>

<body class="ccg-intro-body">

    <!-- POWER FLASH -->
    <div id="flashOverlay"></div>

    <!-- CLICK-TO-START COVER -->
    <div id="powerOverlay">
        <div class="power-text">CLICK TO START</div>
        <div class="power-sub">Press fire to boot the system…</div>
    </div>

    <!-- MAIN C64 INTRO WRAPPER -->
    <div id="c64Wrapper">

        <!-- CRT SCREEN BORDER -->
        <div id="crtBorder"></div>

        <!-- TYPEWRITER OUTPUT -->
        <div id="c64Screen">
            <div id="typedText"></div>
            <div id="cursor">█</div>
        </div>

        <!-- RASTER BARS OVERLAY -->
        <canvas id="rasterOverlay"></canvas>

        <!-- SID SPEECH SUBTITLE -->
        <div id="sidText"></div>

        <!-- SKIP INTRO BUTTON -->
        <button id="skipIntroBtn" class="skip-btn">Skip Intro</button>

        <!-- SID AUDIO -->
        <audio id="sidAudio"
               src="resources/css/audio/c64_speech_stayawhile.mp3"
               preload="auto"></audio>
    </div>

    <!-- INTRO SCRIPT -->
    <script src="js/index-intro.js" defer></script>

</body>
</html>
