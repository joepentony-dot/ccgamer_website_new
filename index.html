<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>
    <meta name="description" content="Cheeky Commodore Gamer - C64 style intro loader with raster bars and SID speech.">

    <!-- C64 Font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-blue: #352879;
            --c64-light-blue: #6c5eb5;
            --c64-text: #b8c76f;
            --c64-red: #880000;
            --c64-green: #55cc55;
            --c64-cyan: #00ffff;
            --c64-yellow: #feff6c;
            --c64-purple: #cc44cc;
            --c64-white: #ffffff;
            --c64-black: #000000;
            --c64-orange: #d55e00;
            --c64-brown: #664400;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--c64-black);
            color: var(--c64-light-blue);
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* ==============================
           INTRO SCREEN WRAPPER
        =============================== */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: var(--c64-black);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .c64-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        /* Thin C64-style border */
        .c64-border {
            padding: 18px; /* thin-ish */
            background: var(--c64-light-blue);
        }

        .c64-screen {
            position: relative;
            background: var(--c64-blue);
            padding: 16px 24px;
            width: min(800px, 90vw);
            height: min(600px, 80vh);
            overflow: hidden;
            box-sizing: border-box;
        }

        .c64-header-lines {
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .c64-line {
            color: var(--c64-light-blue);
            font-size: 22px;
            letter-spacing: 1px;
        }

        .c64-loader-output {
            margin-top: 8px;
            font-size: 22px;
            color: var(--c64-light-blue);
            white-space: pre-wrap;
        }

        .c64-cursor {
            display: inline-block;
            width: 12px;
            height: 1.2em;
            margin-left: 4px;
            background: var(--c64-light-blue);
            animation: blink-cursor 0.8s steps(1, end) infinite;
            vertical-align: bottom;
        }

        @keyframes blink-cursor {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* SKIP BUTTON */
        #skip-intro-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 10000;
            background: var(--c64-red);
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-family: 'VT323', monospace;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 #000;
        }

        #skip-intro-btn:hover {
            background: #fff;
            color: var(--c64-red);
        }

        /* RASTER BARS */
        .raster-bars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            background: linear-gradient(to bottom,
                var(--c64-black) 0%,    var(--c64-black) 7%,
                var(--c64-white) 7%,    var(--c64-white) 14%,
                var(--c64-red) 14%,     var(--c64-red) 21%,
                var(--c64-cyan) 21%,    var(--c64-cyan) 28%,
                var(--c64-purple) 28%,  var(--c64-purple) 35%,
                var(--c64-green) 35%,   var(--c64-green) 42%,
                var(--c64-blue) 42%,    var(--c64-blue) 49%,
                var(--c64-yellow) 49%,  var(--c64-yellow) 56%,
                var(--c64-orange) 56%,  var(--c64-orange) 63%,
                var(--c64-brown) 63%,   var(--c64-brown) 70%,
                var(--c64-black) 70%,   var(--c64-black) 100%
            );
            background-size: 100% 320px;
            filter: blur(3px);
        }

        .raster-bars.active {
            opacity: 0.9;
            animation: rasterScroll 2.2s linear infinite, rasterJitter 0.1s infinite;
        }

        @keyframes rasterScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 320px; }
        }

        @keyframes rasterJitter {
            0%   { transform: translateY(0px); }
            25%  { transform: translateY(-1px); }
            50%  { transform: translateY(1px); }
            75%  { transform: translateY(-1px); }
            100% { transform: translateY(0px); }
        }

        /* Placeholder main site layout (for now) */
        #main-site {
            display: none;
            min-height: 100vh;
            background: radial-gradient(circle at top, #18254b 0, #050814 70%);
            color: var(--c64-text);
            padding: 20px;
        }

        .main-inner {
            max-width: 960px;
            margin: 0 auto;
            border: 4px solid var(--c64-light-blue);
            background: rgba(5, 8, 20, 0.9);
            padding: 20px;
        }

        .main-inner h1 {
            text-align: center;
            color: var(--c64-cyan);
            font-weight: normal;
            margin-top: 0;
        }

        .main-inner p {
            text-align: center;
            font-size: 20px;
        }

        @media (max-width: 600px) {
            .c64-border {
                padding: 10px;
            }
            .c64-screen {
                padding: 10px 12px;
            }
            .c64-line,
            .c64-loader-output {
                font-size: 18px;
            }
            #skip-intro-btn {
                font-size: 16px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ==============================
         C64 INTRO SCREEN
    =============================== -->
    <div id="intro-screen">
        <div class="c64-wrapper">
            <div class="c64-border">
                <div class="c64-screen">
                    <div class="c64-header-lines">
                        <div class="c64-line">**** COMMODORE 64 BASIC V2 ****</div>
                        <div class="c64-line">64K RAM SYSTEM 38911 BASIC BYTES FREE</div>
                        <div class="c64-line">&nbsp;</div>
                    </div>

                    <div id="c64-loader-output" class="c64-loader-output"></div>
                    <span id="c64-cursor" class="c64-cursor">&#9608;</span>

                    <!-- RASTER BARS OVERLAY -->
                    <div id="rasterBars" class="raster-bars"></div>
                </div>
            </div>
        </div>

        <!-- SKIP BUTTON -->
        <button id="skip-intro-btn" type="button">[ ESC ] SKIP INTRO</button>
    </div>

    <!-- HIDDEN AUDIO -->
    <audio id="intro-audio" preload="auto">
        <source src="resources/audio/c64_speech_stayawhile.mp3" type="audio/mpeg">
    </audio>

    <!-- ==============================
         MAIN SITE PLACEHOLDER
         (will replace with full homepage later)
    =============================== -->
    <div id="main-site">
        <div class="main-inner">
            <h1>CHEEKY COMMODORE GAMER</h1>
            <p>MAIN SITE PLACEHOLDER.<br>
               ONCE THE INTRO IS PERFECT, WE'LL DROP THE FULL EPIC HOMEPAGE HERE.</p>
        </div>
    </div>

    <!-- ==============================
         C64 INTRO SCRIPT
    =============================== -->
    <script>
        (function () {
            const loaderEl    = document.getElementById('c64-loader-output');
            const cursorEl    = document.getElementById('c64-cursor');
            const rasterBars  = document.getElementById('rasterBars');
            const introAudio  = document.getElementById('intro-audio');
            const introScreen = document.getElementById('intro-screen');
            const mainSite    = document.getElementById('main-site');
            const skipBtn     = document.getElementById('skip-intro-btn');

            let introFinished = false;

            // The sequence of lines to display
            const scriptLines = [
                { text: 'LOAD ""', delayAfter: 600 },
                { text: 'PRESS PLAY ON TAPE', delayAfter: 1200, startAudioHere: true },
                { text: 'OK', delayAfter: 700 },
                { text: 'SEARCHING', delayAfter: 900 },
                { text: 'FOUND CHEEKY COMMODORE GAMER', delayAfter: 1100 },
                { text: 'LOADING', delayAfter: 800, enableRaster: true }
            ];

            function typeLine(line, speed) {
                return new Promise(resolve => {
                    let i = 0;
                    const text = line;
                    const interval = setInterval(() => {
                        loaderEl.textContent += text.charAt(i);
                        i++;
                        if (i >= text.length) {
                            clearInterval(interval);
                            loaderEl.textContent += '\\n';
                            resolve();
                        }
                    }, speed);
                });
            }

            function startAudioSafely() {
                if (!introAudio) return;
                try {
                    introAudio.currentTime = 0;
                    introAudio.play().catch(() => {
                        // If autoplay is blocked, we just don't show a warning.
                    });
                } catch (e) {
                    // ignore
                }
            }

            function stopAudio() {
                if (!introAudio) return;
                try {
                    introAudio.pause();
                    introAudio.currentTime = 0;
                } catch (e) {
                    // ignore
                }
            }

            function showRasterBars() {
                rasterBars.classList.add('active');
            }

            function hideRasterBars() {
                rasterBars.classList.remove('active');
            }

            function finishIntro() {
                if (introFinished) return;
                introFinished = true;

                stopAudio();
                hideRasterBars();

                if (introScreen) introScreen.style.display = 'none';
                if (mainSite) mainSite.style.display = 'block';

                // Allow scrolling on main site if it grows
                document.body.style.overflow = 'auto';
            }

            async function runIntro() {
                if (!introScreen || !mainSite || !loaderEl) {
                    if (mainSite) mainSite.style.display = 'block';
                    return;
                }

                // Step through script lines
                for (let i = 0; i < scriptLines.length; i++) {
                    const step = scriptLines[i];
                    await typeLine(step.text, 55);

                    if (step.startAudioHere) {
                        startAudioSafely();
                    }

                    if (step.enableRaster) {
                        showRasterBars();
                    }

                    if (introFinished) return;
                    await new Promise(res => setTimeout(res, step.delayAfter));
                }

                // After lines complete, wait for audio end or timeout
                const audioTimeout = 9000;
                let resolved = false;

                function endHandler() {
                    if (resolved) return;
                    resolved = true;
                    introAudio && introAudio.removeEventListener('ended', endHandler);
                    finishIntro();
                }

                if (introAudio) {
                    introAudio.addEventListener('ended', endHandler);
                    setTimeout(endHandler, audioTimeout);
                } else {
                    setTimeout(finishIntro, audioTimeout);
                }
            }

            skipBtn.addEventListener('click', function () {
                finishIntro();
            });

            // Start intro once page is loaded
            window.addEventListener('load', runIntro);
        })();
    </script>
</body>
</html>
