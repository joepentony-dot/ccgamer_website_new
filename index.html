<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>

    <!-- Your global site CSS (CRT etc.) -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">

    <!-- C64-style font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --c64-border: #7c6cff;
            --c64-blue: #3b2aa5;
            --c64-screen: #221ba8;
            --c64-text: #d0d0ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #020012 0%, #010008 30%, #000 100%);
            color: var(--c64-text);
            font-family: "VT323", monospace;
        }

        /* CRT scanlines + subtle flicker */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.35) 0px,
                    rgba(0, 0, 0, 0.35) 1px,
                    transparent 1px,
                    transparent 3px
                );
            mix-blend-mode: multiply;
            opacity: 0.6;
            animation: crt-flicker 0.18s infinite alternate;
        }

        @keyframes crt-flicker {
            from { opacity: 0.55; }
            to   { opacity: 0.75; }
        }

        #intro-root {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* POWER-ON SCREEN */
        #power-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: radial-gradient(circle at center, #050020 0%, #020014 55%, #000 100%);
        }

        #power-logo {
            max-width: 520px;
            width: 55vw;
            height: auto;
            image-rendering: pixelated;
            filter:
                drop-shadow(0 0 14px #000)
                drop-shadow(0 0 22px #000);
        }

        #power-text {
            margin-top: 32px;
            font-size: 30px;
            letter-spacing: 4px;
            color: #f7f0ff;
            text-shadow:
                0 0 6px #ffffff,
                0 0 14px #7cf9ff,
                0 0 24px #7cf9ff;
            animation: power-flash 0.9s steps(2, start) infinite;
        }

        @keyframes power-flash {
            0%   { opacity: 1;   }
            50%  { opacity: 0.25;}
            100% { opacity: 1;   }
        }

        /* C64 SCREEN WRAPPER */
        #c64-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out;
            background: var(--c64-blue);
        }

        #c64-wrapper.active {
            opacity: 1;
            visibility: visible;
        }

        /* The actual C64 screen box */
        #c64-frame {
            width: 92vw;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background: var(--c64-blue);
            border: 22px solid var(--c64-border);
            box-shadow:
                0 0 22px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(0, 0, 60, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 26px;
        }

        #c64-inner {
            width: 100%;
            height: 100%;
            background: var(--c64-screen);
            padding: 32px 40px;
            color: var(--c64-text);
            font-size: 22px;       /* VT323 size – nice and chunky */
            line-height: 1.45;
            display: flex;
            flex-direction: column;
        }

        #c64-text {
            white-space: pre-wrap;
        }

        /* Raster overlay – full screen, blurred, multicolour */
        #raster-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            mix-blend-mode: screen;
            background-image:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 0, 64, 0.7) 0px,
                    rgba(255, 0, 64, 0.7) 4px,
                    rgba(255, 128, 0, 0.7) 4px,
                    rgba(255, 128, 0, 0.7) 8px,
                    rgba(255, 255, 0, 0.7) 8px,
                    rgba(255, 255, 0, 0.7) 12px,
                    rgba(64, 255, 0, 0.7) 12px,
                    rgba(64, 255, 0, 0.7) 16px,
                    rgba(0, 160, 255, 0.7) 16px,
                    rgba(0, 160, 255, 0.7) 20px,
                    rgba(0, 0, 255, 0.7) 20px,
                    rgba(0, 0, 255, 0.7) 24px,
                    rgba(160, 0, 255, 0.7) 24px,
                    rgba(160, 0, 255, 0.7) 28px,
                    rgba(0, 0, 0, 1) 28px,
                    rgba(0, 0, 0, 1) 32px
                );
            filter: blur(1.4px);
            animation: raster-flicker 0.11s linear infinite;
        }

        #raster-overlay.active {
            opacity: 0.75;
        }

        @keyframes raster-flicker {
            0%   { transform: translateX(-2px); }
            50%  { transform: translateX(2px); }
            100% { transform: translateX(-2px); }
        }

        /* BIG RED SKIP BUTTON */
        #skipIntro {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 9999;
            padding: 10px 22px;
            font-size: 16px;
            font-family: "VT323", monospace;
            border: none;
            border-radius: 4px;
            background: #ff0033;
            color: #ffffff;
            cursor: pointer;
            box-shadow:
                0 0 6px rgba(0,0,0,0.8),
                0 0 12px rgba(255,0,60,0.9);
            text-shadow: 0 0 4px #000;
        }

        #skipIntro:hover {
            background: #ff3359;
        }

        @media (max-width: 720px) {
            #power-text {
                font-size: 22px;
            }
            #c64-inner {
                font-size: 18px;
                padding: 22px 24px;
            }
        }
    </style>
</head>

<body>

<div id="intro-root">
    <!-- POWER ON SCREEN -->
    <div id="power-screen">
        <img id="power-logo" src="resources/CCGAMER LOGO.png" alt="Cheeky Commodore Gamer">
        <div id="power-text">CLICK TO POWER ON</div>
    </div>

    <!-- C64 LOADER SCREEN -->
    <div id="c64-wrapper">
        <div id="c64-frame">
            <div id="c64-inner">
                <pre id="c64-text"></pre>
            </div>
        </div>
    </div>
</div>

<!-- Full-screen raster overlay -->
<div id="raster-overlay"></div>

<!-- BIG RED SKIP BUTTON -->
<button id="skipIntro">SKIP INTRO</button>

<!-- SID Speech -->
<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<!-- Intro controller -->
<script src="js/index-intro.js"></script>

</body>
</html>
