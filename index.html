<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – Intro</title>

    <link rel="stylesheet" href="resources/css/ccg-master.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body.intro-body {
            background: radial-gradient(circle at top, #050915 0, #060320 40%, #000000 100%);
            color: #5fffff;
            font-family: monospace;
            overflow: hidden;
            position: relative;
        }

        /* POWER-ON SCREEN */
        #powerOverlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .intro-logo {
            width: 280px;
            max-width: 80vw;
            margin-bottom: 32px;
            filter:
                drop-shadow(0 0 25px rgba(0, 255, 255, 0.7))
                drop-shadow(0 0 45px rgba(0, 100, 255, 0.7));
        }

        #powerText {
            font-size: 32px;
            letter-spacing: 0.18em;
            text-shadow: 0 0 8px rgba(95,255,255,0.9);
            animation: pulse 1.3s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse {
            0%   { opacity: 0.45; transform: scale(1); }
            50%  { opacity: 1;    transform: scale(1.06); }
            100% { opacity: 0.45; transform: scale(1); }
        }

        .hidden { display: none !important; }

        /* SKIP INTRO */
        #skipIntroBtn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 200;
            background: #b0002a;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #skipIntroBtn:hover {
            box-shadow: 0 0 12px rgba(255,140,140,0.9);
        }

        /* C64 SCREEN */
        #c64Wrapper {
            position: relative;
            z-index: 5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c64-border {
            background: #000e78;
            padding: 22px;
        }

        .c64-inner {
            background: #3c31ff;
            padding: 32px 40px;
            width: 900px;
            max-width: 90vw;
            height: 520px;
            max-height: 70vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        #c64Text {
            white-space: pre;
            color: #5fffff;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 0.05em;
        }

        /* PERFECTED AUTHENTIC RASTER BARS */
        #rasterOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            opacity: 1;

            /* FULL BLACKOUT of everything behind */
            background-color: black !important;

            /* C64 rainbow */
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 0, 0.55)   0px,  rgba(255, 0, 0, 0.55)   8px,
                    rgba(255,165,0,0.55)   8px,  rgba(255,165,0,0.55)  16px,
                    rgba(255,255,0,0.55)  16px,  rgba(255,255,0,0.55)  24px,
                    rgba(0,255,0,0.55)    24px,  rgba(0,255,0,0.55)    32px,
                    rgba(0,255,255,0.55)  32px,  rgba(0,255,255,0.55)  40px,
                    rgba(0,128,255,0.55)  40px,  rgba(0,128,255,0.55)  48px,
                    rgba(128,0,255,0.55)  48px,  rgba(128,0,255,0.55)  56px
                );

            filter: blur(5px);

            animation:
                rasterScrollSmooth 3.5s linear infinite,
                rasterFlicker 0.12s infinite,
                rasterJitter 0.28s infinite;
        }

        @keyframes rasterScrollSmooth {
            0%   { background-position-y: 0; }
            100% { background-position-y: 56px; }
        }

        @keyframes rasterFlicker {
            0%   { opacity: 0.88; }
            100% { opacity: 1; }
        }

        @keyframes rasterJitter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
            100% { transform: translateY(0px); }
        }

        /* EPIC NEON TEXT DURING SID */
        #sidText {
            position: fixed;
            top: 40%;
            width: 100%;
            text-align: center;
            font-family: "Press Start 2P", monospace;
            font-size: 32px;
            letter-spacing: 0.12em;
            color: #00eaff;
            text-shadow: 0 0 18px #00eaff, 0 0 35px #00c8ff;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }
    </style>
</head>

<body class="crt intro-body c64-mode">

<button id="skipIntroBtn">[ ESC ] SKIP INTRO</button>

<!-- POWER ON -->
<div id="powerOverlay">
    <img src="resources/C64 NEON.png" class="intro-logo">
    <p id="powerText">CLICK TO POWER ON</p>
</div>

<!-- C64 SCREEN -->
<div id="c64Wrapper" class="hidden">
    <div class="c64-border">
        <div class="c64-inner">
            <pre id="c64Text"></pre>
        </div>
    </div>
</div>

<!-- RASTER -->
<div id="rasterOverlay"></div>

<!-- SID TEXT -->
<div id="sidText"></div>

<!-- AUDIO -->
<audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

<script>
(function () {

    const powerOverlay = document.getElementById("powerOverlay");
    const powerText    = document.getElementById("powerText");
    const c64Wrapper   = document.getElementById("c64Wrapper");
    const c64Text      = document.getElementById("c64Text");
    const raster       = document.getElementById("rasterOverlay");
    const sidAudio     = document.getElementById("sidAudio");
    const skipBtn      = document.getElementById("skipIntroBtn");
    const sidText      = document.getElementById("sidText");

    const timers = [];

    function schedule(fn, ms) {
        let id = setTimeout(fn, ms);
        timers.push(id);
    }

    function clearTimers() {
        timers.forEach(id => clearTimeout(id));
        timers.length = 0;
    }

    const basicText =
`**** COMMODORE 64 BASIC V2 ****
 64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.

`;

    function showBasic() {
        c64Text.textContent = basicText;
    }

    function appendLine(line) {
        c64Text.textContent += line + "\n";
    }

    /* SID TEXT EFFECT */
    function showSIDText(msg, delay) {
        schedule(() => {
            sidText.style.opacity = 1;
            sidText.innerText = msg;
        }, delay);

        schedule(() => {
            sidText.style.opacity = 0;
        }, delay + 1800);
    }

    function startLoadSequence() {

        schedule(() => {
            appendLine(`LOAD ""`);

            schedule(() => {
                appendLine(`PRESS PLAY ON TAPE`);

                schedule(() => {
                    appendLine(`FOUND "CHEEKY COMMODORE GAMER"`);
                    appendLine(`LOADING`);

                    schedule(() => { startRasterAudio(); }, 1000);

                }, 900);

            }, 900);

        }, 800);
    }

    function startRasterAudio() {

        raster.style.display = "block";

        showSIDText("ANOTHER VISITOR...", 200);
        showSIDText("...STAY A WHILE...", 1600);
        showSIDText("STAY FOREVER!", 3000);

        try {
            sidAudio.currentTime = 0;
            sidAudio.play().catch(()=>{});
        } catch(e){}

        sidAudio.onended = () => window.location.href = "home.html";
    }

    function beginIntro() {
        if (powerOverlay.classList.contains("hidden")) return;

        powerOverlay.classList.add("hidden");
        c64Wrapper.classList.remove("hidden");

        showBasic();
        startLoadSequence();
    }

    function skip() {
        clearTimers();
        try {
            sidAudio.pause();
            sidAudio.currentTime = 0;
        } catch(e){}
        window.location.href = "home.html";
    }

    document.addEventListener("click", e => {
        if (e.target === skipBtn) return;
        if (!powerOverlay.classList.contains("hidden")) beginIntro();
    });

    powerText.addEventListener("click", e => {
        e.stopPropagation();
        beginIntro();
    });

    skipBtn.addEventListener("click", skip);

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") skip();
        if ((e.key === "Enter" || e.key === " ") && !powerOverlay.classList.contains("hidden")) {
            beginIntro();
        }
    });

})();
</script>

</body>
</html>
