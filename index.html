<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – C64 Intro</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">
    <link rel="stylesheet" href="resources/css/ccg-mode.css">
    <link rel="stylesheet" href="resources/css/ccg-effects.css">
    <link rel="stylesheet" href="resources/css/ccg-anim.css">
    <link rel="stylesheet" href="resources/css/ccg-zx.css">

    <!-- JS -->
    <script src="js/site-mode.js" defer></script>
    <script src="js/index-intro.js" defer></script>
</head>

<body class="crt c64-intro">

    <!-- CLICK-TO-START OVERLAY (shown ONLY if autoplay is blocked) -->
    <div id="intro-tap-overlay" class="intro-overlay">
        <div class="intro-overlay-inner">
            <p>Click to start intro with sound</p>
            <button id="intro-overlay-btn">Begin</button>
        </div>
    </div>

    <!-- SKIP BUTTON (TOP-RIGHT) -->
    <button id="skip-intro" class="skip-button">Skip Intro</button>

    <!-- MAIN C64 INTRO SHELL -->
    <div class="intro-shell">
        <div class="intro-border">
            <div class="intro-screen">

                <!-- TITLE TEXT AREA -->
                <div class="intro-title-wrapper">
                    <div class="intro-title-line">
                        <span id="intro-title-text" class="intro-title-text"></span>
                        <span class="intro-cursor">█</span>
                    </div>
                </div>

                <!-- LOADING BARS AREA -->
                <div class="loader-bars">
                    <div class="loader-bar bar1"></div>
                    <div class="loader-bar bar2"></div>
                    <div class="loader-bar bar3"></div>
                    <div class="loader-bar bar4"></div>
                    <div class="loader-bar bar5"></div>
                    <div class="loader-bar bar6"></div>
                    <div class="loader-bar bar7"></div>
                    <div class="loader-bar bar8"></div>
                    <div class="loader-bar bar9"></div>
                    <div class="loader-bar bar10"></div>
                    <div class="loader-bar bar11"></div>
                    <div class="loader-bar bar12"></div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
