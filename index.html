<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer | C64 Loader Intro</title>
    <meta name="description" content="Epic Commodore 64 style intro for the Cheeky Commodore Gamer retro gaming hub.">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --c64-border-blue: #1d16b6;
            --c64-screen-blue: #3b31ef;
            --c64-text-main: #f7f7a0;   /* softer yellow like screenshot */
            --c64-text-alt: #9ae29b;
            --c64-light-blue: #6c5eb5;
            --c64-red: #ff3355;
            --c64-black: #000000;
            --c64-white: #ffffff;
            --c64-cyan: #00ffff;
            --c64-purple: #cc44cc;
            --c64-green: #55cc55;
            --c64-yellow: #feff6c;
            --c64-orange: #d55e00;
            --c64-brown: #664400;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #120f2b;
            color: var(--c64-text-main);
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            overflow: hidden;
            position: relative;
        }

        /* --- STARFIELD --- */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: -2;
            opacity: 0.25;
        }

        /* --- CRT OVERLAY --- */
        .crt-overlay {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.25) 50%
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 0, 0, 0.06),
                    rgba(0, 255, 0, 0.02),
                    rgba(0, 0, 255, 0.06)
                );
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* Subtle screen vignette / curve */
        .screen-vignette::before {
            content: "";
            position: fixed;
            inset: 3vh 4vw;
            border-radius: 20px;
            box-shadow:
                0 0 80px rgba(0,0,0,0.9) inset,
                0 0 40px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
        }

        /* =========================================
           POWER ON SCREEN
           ========================================= */
        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 7vh;
            background: radial-gradient(circle at center, #121638 0%, #02010a 70%);
            cursor: pointer;
            z-index: 6000;
        }

        #start-screen .logo-wrap {
            text-align: center;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.7));
        }

        #start-screen img {
            max-width: min(260px, 35vw);
            image-rendering: pixelated;
        }

        .power-text {
            color: var(--c64-text-main);
            font-size: min(3.2rem, 5vw);
            text-align: center;
            letter-spacing: 0.1em;
            text-shadow:
                0 0 8px rgba(0,255,255,0.9),
                0 0 14px rgba(0,0,128,0.9);
            animation: powerBlink 1.1s infinite;
        }

        @keyframes powerBlink {
            0%, 100% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.35; transform: translateY(1px); }
        }

        /* =========================================
           LOADING SCREEN
           ========================================= */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: var(--c64-screen-blue);
            cursor: default; /* keep mouse visible */
            z-index: 5000;
        }

        /* FULL-SCREEN RASTER BARS */
        .raster-bars {
            position: fixed;
            inset: -20%;
            z-index: -1;
            background: linear-gradient(
                to bottom,
                var(--c64-black) 0%,   var(--c64-black) 8%,
                var(--c64-white) 8%,   var(--c64-white) 16%,
                var(--c64-cyan) 16%,   var(--c64-cyan) 24%,
                var(--c64-purple) 24%, var(--c64-purple) 32%,
                var(--c64-blue) 32%,   var(--c64-blue) 40%,
                var(--c64-green) 40%,  var(--c64-green) 48%,
                var(--c64-yellow) 48%, var(--c64-yellow) 56%,
                var(--c64-red) 56%,    var(--c64-red) 64%,
                var(--c64-orange) 64%, var(--c64-orange) 72%,
                var(--c64-brown) 72%,  var(--c64-brown) 80%,
                var(--c64-blue) 80%,   var(--c64-blue) 100%
            );
            background-size: 100% 360px;
            filter: blur(4px);
            opacity: 0.9;
            mix-blend-mode: screen;
            animation: rasterScroll 2.3s linear infinite;
            display: none;
        }

        @keyframes rasterScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(360px); }
        }

        /* C64 text “frame” – fills most of the screen */
        .c64-frame {
            width: 88vw;
            max-width: 1200px;
            height: 80vh;
            border: min(16px, 2.2vw) solid var(--c64-border-blue);
            background-color: var(--c64-screen-blue);
            padding: min(24px, 2.5vw);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .c64-inner-text {
            color: var(--c64-text-main);
            font-size: min(1.8rem, 2.7vw);
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .c64-header-line {
            display: block;
            color: var(--c64-text-alt);
        }

        .loading-text-wrapper {
            margin-top: 1.6rem;
        }

        .cursor {
            display: inline-block;
            width: 14px;
            height: 1.2em;
            background-color: var(--c64-light-blue);
            vertical-align: bottom;
            margin-left: 3px;
            animation: blink 0.9s infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* SKIP BUTTON */
        #skip-btn {
            position: fixed;
            top: 12px;
            right: 14px;
            z-index: 6002;
            background: var(--c64-red);
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 22px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            pointer-events: auto;
            letter-spacing: 0.08em;
            animation: skipPulse 2.4s infinite;
        }

        @keyframes skipPulse {
            0%   { transform: translateY(0); box-shadow: 4px 4px 0px #000; }
            50%  { transform: translateY(-1px); box-shadow: 0 0 16px rgba(255,255,255,0.9); }
            100% { transform: translateY(0); box-shadow: 4px 4px 0px #000; }
        }

        #skip-btn:hover {
            background: #fff;
            color: var(--c64-red);
        }

        @media (max-width: 700px) {
            .c64-frame {
                width: 94vw;
                height: 78vh;
                padding: 16px;
            }
            .c64-inner-text {
                font-size: 1.25rem;
            }
            #skip-btn {
                font-size: 1.2rem;
                padding: 7px 14px;
            }
            #start-screen img {
                max-width: 190px;
            }
        }
    </style>
</head>
<body class="screen-vignette">

    <canvas id="starfield"></canvas>
    <div class="crt-overlay"></div>

    <!-- POWER ON SCREEN -->
    <div id="start-screen" onclick="startSystem()">
        <div class="logo-wrap">
            <img src="resources/CCGAMER LOGO.png"
                 alt="Cheeky Commodore Gamer Logo">
        </div>
        <div class="power-text">CLICK TO POWER ON</div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="raster-bars" id="rasterBars"></div>

        <button id="skip-btn" onclick="skipIntro()">[ ESC ] SKIP INTRO</button>

        <div class="c64-frame">
            <div class="c64-inner-text">
                <span class="c64-header-line">**** COMMODORE 64 BASIC V2 ****</span>
                <span class="c64-header-line">64K RAM SYSTEM  38911 BASIC BYTES FREE</span>

                <div class="loading-text-wrapper">
                    <span id="loading-terminal"></span><span class="cursor" id="loading-cursor"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/index-intro.js"></script>
</body>
</html>
