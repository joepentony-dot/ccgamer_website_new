<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – Intro</title>

    <!-- Master Stylesheet -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">
</head>

<body class="crt intro-body">

    <!-- Autoplay Overlay -->
    <div id="audioUnlock" class="intro-overlay">
        <p>CLICK TO START INTRO WITH SOUND</p>
        <button id="introBegin">Begin</button>
        <button id="skipIntroTop" class="skip-top">Skip Intro</button>
    </div>

    <div id="introContainer" class="intro-container hidden">

        <!-- Skip Button -->
        <button id="skipIntro" class="skip-top">Skip Intro</button>

        <!-- C64 Border + Screen -->
        <div class="c64-border">
            <div class="c64-screen">
                <div id="loadingBars" class="loading-bars"></div>
                <div id="introText" class="intro-text"></div>
            </div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

    <!-- JS -->
    <script src="js/index-intro.js"></script>

</body>
</html>
