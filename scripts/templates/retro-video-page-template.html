    <style>
      .retro-video-page { max-width: 960px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      .retro-video-page h1 { margin-bottom: 1rem; }
      .retro-video-page__summary { font-size: 1.05rem; margin: 0 0 1rem; }

      .retro-video-page__video { position: relative; padding-top: 56.25%; margin-bottom: 1.5rem; }
      .retro-video-page__video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .retro-video-page__related h2 { margin-bottom: .75rem; }
      .retro-video-page__related ul { margin: 0; padding-left: 1.2rem; }
      .retro-video-page__related li { margin-bottom: .45rem; }

<body class="ccg-body">

    <div class="retro-video-page__video">
        <iframe
          src="https://www.youtube.com/embed/__YOUTUBE_ID__"
          title="__VIDEO_TITLE__"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
