    <rect x="28" y="174" width="88" height="78" rx="13" fill="#0b3348" stroke="#26e8ff" stroke-width="5"/>
    <rect x="59" y="195" width="28" height="28" fill="none" stroke="#d8fbff" stroke-width="6"/>
    <path d="M0 177l-92 62M122 178l116 50" fill="none" stroke="#26e8ff" stroke-width="22" stroke-linecap="round"/>
    <g transform="translate(230 214) rotate(12)"><path d="M0 0q32-42 69-5-24 20-5 42-45 22-64-37z" fill="#ffe769" stroke="#6e3d1c" stroke-width="5"/><circle cx="62" cy="-4" r="5" fill="#111"/><path d="M66 8l38 16-42 6z" fill="#ff9a26"/></g>
  </g>

  <g transform="translate(1120 420)">
    <ellipse cx="55" cy="290" rx="180" ry="50" fill="#020105" opacity=".7"/>
    <path d="M-35 258Q-5 120 70 104q78 18 106 154l-42 45H2z" fill="#7c174f" stroke="#ff3ca6" stroke-width="8"/>
    <path d="M2 128Q12 15 72 0q63 17 73 128l-28 38H31z" fill="#25101d" stroke="#ff3ca6" stroke-width="8"/>
    <path d="M32 99q40-34 82 0l-8 47H40z" fill="#0b0308"/>
    <rect x="48" y="112" width="20" height="8" fill="#ffe2f3" filter="url(#smallGlow)"/><rect x="82" y="112" width="20" height="8" fill="#ffe2f3" filter="url(#smallGlow)"/>
    <rect x="28" y="174" width="88" height="78" rx="13" fill="#4d1235" stroke="#ff3ca6" stroke-width="5"/>
    <path d="M73 194l19 36H54z" fill="none" stroke="#ffe2f3" stroke-width="6"/>
    <path d="M0 177l-110 49M122 178l94 65" fill="none" stroke="#ff3ca6" stroke-width="22" stroke-linecap="round"/>
    <g transform="translate(-142 205) rotate(-15)"><rect x="0" y="0" width="72" height="47" rx="7" fill="#d8cbd3" stroke="#50142f" stroke-width="5"/><rect x="10" y="9" width="52" height="18" fill="#7d3254"/><path d="M22 47q15 45 45 70M36 47q5 45 36 75M50 47q-2 45 24 73" fill="none" stroke="#e7e0e6" stroke-width="6"/></g>
  </g>

  <g transform="translate(676 512)" filter="url(#glow)">
