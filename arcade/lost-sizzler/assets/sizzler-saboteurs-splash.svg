<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sizzler Saboteurs</title>
  <desc id="desc">Original retro splash screen showing cyan and magenta dungeon agents fighting over the glowing Sizzler Case.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080311"/><stop offset="0.58" stop-color="#160b25"/><stop offset="1" stop-color="#050208"/></linearGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#d8fbff" stop-opacity=".95"/><stop offset=".34" stop-color="#26e8ff" stop-opacity=".56"/><stop offset="1" stop-color="#26e8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pinkGlow"><stop stop-color="#ffe2f3" stop-opacity=".95"/><stop offset=".34" stop-color="#ff3ca6" stop-opacity=".58"/><stop offset="1" stop-color="#ff3ca6" stop-opacity="0"/></radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4aa"/><stop offset=".35" stop-color="#ffcc42"/><stop offset="1" stop-color="#8f430e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="smallGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="bricks" width="120" height="64" patternUnits="userSpaceOnUse"><path d="M0 1h120M0 63h120M1 0v64M60 0v32M119 0v64M30 32v32M90 32v32" fill="none" stroke="#6e467e" stroke-opacity=".16" stroke-width="3"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="35" y="35" width="1530" height="830" rx="24" fill="url(#bricks)" stroke="#f9c84f" stroke-width="5"/>
  <rect x="52" y="52" width="1496" height="796" rx="18" fill="none" stroke="#562d6b" stroke-width="3"/>

  <g opacity=".7">
    <path d="M78 690h300V425h230v265h384V425h230v265h300" fill="none" stroke="#59316c" stroke-width="18"/>
    <path d="M100 690h250V455h230v235M1020 690V455h230v235h250" fill="none" stroke="#0c0713" stroke-width="7"/>
    <g fill="#261330" stroke="#704783" stroke-width="5">
      <rect x="115" y="520" width="120" height="170"/><rect x="365" y="485" width="135" height="205"/><rect x="1110" y="485" width="135" height="205"/><rect x="1370" y="520" width="115" height="170"/>
    </g>
  </g>

  <ellipse cx="500" cy="528" rx="390" ry="390" fill="url(#cyanGlow)" opacity=".54"/>
  <ellipse cx="1100" cy="528" rx="390" ry="390" fill="url(#pinkGlow)" opacity=".54"/>

  <g font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" text-anchor="middle">
    <text x="800" y="178" font-size="58" letter-spacing="16" fill="#f2d575">CHEEKY COMMODORE QUEST</text>
    <text x="800" y="338" font-size="132" letter-spacing="4" fill="#08030d" stroke="#f7d361" stroke-width="18">SIZZLER</text>
    <text x="800" y="338" font-size="132" letter-spacing="4" fill="#fff2ad" stroke="#6c271d" stroke-width="6" filter="url(#smallGlow)">SIZZLER</text>
    <text x="800" y="432" font-size="100" letter-spacing="9" fill="#08030d" stroke="#26e8ff" stroke-width="15">SABOTEURS</text>
    <text x="800" y="432" font-size="100" letter-spacing="9" fill="#f7ecff" stroke="#ff3ca6" stroke-width="5">SABOTEURS</text>
  </g>

