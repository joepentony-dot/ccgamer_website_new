    <path d="M78 46V18q0-24 24-24h44q24 0 24 24v28" fill="none" stroke="#e9a935" stroke-width="16"/>
    <rect x="111" y="104" width="30" height="42" rx="5" fill="#4b210b"/>
    <path d="M126 109v31" stroke="#ffd85a" stroke-width="5"/>
    <text x="124" y="91" font-family="Impact, sans-serif" font-size="28" text-anchor="middle" fill="#4b210b">SIZZLER CASE</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="800" y="770" font-size="34" font-weight="700" letter-spacing="8" fill="#fff2ad">TRAPS • TREACHERY • TERRIBLE WEAPONS</text>
    <rect x="575" y="795" width="450" height="50" rx="10" fill="#09040f" stroke="#26e8ff" stroke-width="3"/>
    <text x="800" y="830" font-size="25" font-weight="700" letter-spacing="5" fill="#ff70bc">PRESS FIRE TO SABOTAGE</text>
