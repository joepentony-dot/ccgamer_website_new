<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#080914"/>
  <style>.h{font:700 34px Consolas,monospace;fill:#72eaff}.t{font:700 18px Consolas,monospace;fill:#fff}.s{font:600 14px Consolas,monospace;fill:#c7cbdb}.f{fill:#121626;stroke:#4d5872;stroke-width:2}.a{fill:#172c35;stroke:#72eaff;stroke-width:3}</style>
  <text x="55" y="60" class="h">CHEEKY SPRITE-SHEET TEMPLATE</text>
  <text x="55" y="92" class="s">Example 5 columns × 4 rows. Every frame must be the same size. Transparent PNG/WebP recommended.</text>

  <g transform="translate(55 135)">
    <!-- 5 x 4 grid, 250 x 160 per frame -->
    <g class="f">
      <rect x="0" y="0" width="250" height="160"/><rect x="250" y="0" width="250" height="160"/><rect x="500" y="0" width="250" height="160"/><rect x="750" y="0" width="250" height="160"/><rect x="1000" y="0" width="250" height="160"/>
      <rect x="0" y="160" width="250" height="160"/><rect x="250" y="160" width="250" height="160"/><rect x="500" y="160" width="250" height="160"/><rect x="750" y="160" width="250" height="160"/><rect x="1000" y="160" width="250" height="160"/>
      <rect x="0" y="320" width="250" height="160"/><rect x="250" y="320" width="250" height="160"/><rect x="500" y="320" width="250" height="160"/><rect x="750" y="320" width="250" height="160"/><rect x="1000" y="320" width="250" height="160"/>
      <rect x="0" y="480" width="250" height="160"/><rect x="250" y="480" width="250" height="160"/><rect x="500" y="480" width="250" height="160"/><rect x="750" y="480" width="250" height="160"/><rect x="1000" y="480" width="250" height="160"/>
    </g>

    <!-- frame labels -->
    <g class="s">
      <text x="12" y="24">0 IDLE 1</text><text x="262" y="24">1 IDLE 2</text><text x="512" y="24">2 RUN 1</text><text x="762" y="24">3 RUN 2</text><text x="1012" y="24">4 RUN 3</text>
      <text x="12" y="184">5 RUN 4</text><text x="262" y="184">6 RUN 5</text><text x="512" y="184">7 RUN 6</text><text x="762" y="184">8 JUMP</text><text x="1012" y="184">9 FALL</text>
      <text x="12" y="344">10 DUCK</text><text x="262" y="344">11 DUCK FIRE</text><text x="512" y="344">12 FIRE</text><text x="762" y="344">13 PUNCH 1</text><text x="1012" y="344">14 PUNCH 2</text>
      <text x="12" y="504">15 PUNCH 3</text><text x="262" y="504">16 KICK 1</text><text x="512" y="504">17 KICK 2</text><text x="762" y="504">18 KICK 3</text><text x="1012" y="504">19 HIT</text>
    </g>

    <!-- simplified head/body alignment markers -->
    <g opacity=".75">
      <circle cx="125" cy="64" r="31" fill="none" stroke="#ffe56e" stroke-width="3" stroke-dasharray="6 5"/>
      <rect x="75" y="94" width="100" height="56" rx="20" class="a"/>
      <circle cx="375" cy="64" r="31" fill="none" stroke="#ffe56e" stroke-width="3" stroke-dasharray="6 5"/>
      <rect x="325" y="94" width="100" height="56" rx="20" class="a"/>
      <circle cx="625" cy="64" r="31" fill="none" stroke="#ffe56e" stroke-width="3" stroke-dasharray="6 5"/>
      <rect x="575" y="94" width="100" height="56" rx="20" class="a"/>
    </g>
  </g>

  <g transform="translate(1335 150)">
    <text x="0" y="0" class="t">ADMIN EXAMPLE</text>
    <text x="0" y="34" class="s">Frame width:</text><text x="170" y="34" class="t">250</text>
    <text x="0" y="64" class="s">Frame height:</text><text x="170" y="64" class="t">160</text>
    <text x="0" y="94" class="s">Columns:</text><text x="170" y="94" class="t">5</text>
    <text x="0" y="124" class="s">FPS:</text><text x="170" y="124" class="t">8</text>
    <text x="0" y="172" class="t">Animation map</text>
    <text x="0" y="204" class="s">idle: [0,1]</text>
    <text x="0" y="228" class="s">run: [2,3,4,5,6,7]</text>
    <text x="0" y="252" class="s">jump: [8]</text>
    <text x="0" y="276" class="s">fall: [9]</text>
    <text x="0" y="300" class="s">duck: [10]</text>
    <text x="0" y="324" class="s">duckFire: [11]</text>
    <text x="0" y="348" class="s">fire: [12]</text>
    <text x="0" y="372" class="s">punch: [13,14,15]</text>
    <text x="0" y="396" class="s">kick: [16,17,18]</text>
    <text x="0" y="420" class="s">hit: [19]</text>
  </g>

  <text x="55" y="820" class="t">IMPORTANT FOR MEMBER AVATARS</text>
  <text x="55" y="850" class="s">Keep Cheeky's head position consistent between frames. The game can overlay the signed-in member avatar over the animated body.</text>
  <text x="55" y="875" class="s">The template numbers above demonstrate the grid concept only; your final Cheeky sheet can use different frame dimensions and column count.</text>
</svg>
