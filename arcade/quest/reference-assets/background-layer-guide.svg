<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0a0c16"/>
  <style>.h{font:700 36px Consolas,monospace;fill:#72eaff}.t{font:700 21px Consolas,monospace;fill:#fff}.s{font:600 16px Consolas,monospace;fill:#c9cde0}.n{font:700 18px Consolas,monospace;fill:#ffe56e}</style>
  <text x="55" y="62" class="h">BACKGROUND / LAYER COMPOSITION GUIDE — 1600 × 900</text>
  <text x="55" y="96" class="s">Create every background and optional layer on the full 1600 × 900 canvas so alignment is automatic.</text>

  <g transform="translate(80 145)">
    <rect x="0" y="0" width="1060" height="596" rx="16" fill="#171b2c" stroke="#59647c" stroke-width="3"/>
    <rect x="22" y="22" width="1016" height="552" fill="#1f2440"/>
    <circle cx="900" cy="120" r="62" fill="#2b3759"/>
    <rect x="0" y="470" width="1060" height="126" fill="#111526"/>
    <rect x="185" y="325" width="330" height="145" rx="10" fill="#293049"/>
    <rect x="245" y="255" width="155" height="85" rx="8" fill="#080b13" stroke="#72eaff" stroke-width="3"/>
    <rect x="267" y="280" width="111" height="38" fill="#273c58"/>
    <text x="322" y="305" text-anchor="middle" class="s">CRT</text>
    <rect x="680" y="280" width="220" height="190" rx="8" fill="#252840"/>
    <rect x="730" y="185" width="120" height="85" fill="#462c56"/>
    <text x="790" y="230" text-anchor="middle" class="s">POSTER</text>
    <ellipse cx="520" cy="508" rx="65" ry="20" fill="#000" opacity=".35"/>
    <circle cx="520" cy="370" r="40" fill="#efb58e"/>
    <rect x="475" y="408" width="90" height="88" rx="20" fill="#194b67"/>
    <text x="520" y="461" text-anchor="middle" class="s">PLAYER</text>
    <path d="M0 520 C240 485 370 560 550 520 C750 478 930 548 1060 510 L1060 596 L0 596 Z" fill="#41264f" opacity=".65"/>
    <text x="18" y="40" class="n">VISIBLE COMPOSITE</text>
  </g>

  <g transform="translate(1180 150)">
    <text x="0" y="0" class="t">DRAW ORDER</text>
    <g transform="translate(0 38)">
      <rect width="330" height="94" rx="12" fill="#44254f" stroke="#ff8fc9" stroke-width="3"/>
      <text x="18" y="34" class="n">4. FRONT LAYER</text><text x="18" y="65" class="s">Transparent foreground</text><text x="18" y="84" class="s">can pass in front of Cheeky.</text>
    </g>
    <g transform="translate(0 152)">
      <rect width="330" height="94" rx="12" fill="#183b45" stroke="#72eaff" stroke-width="3"/>
      <text x="18" y="34" class="n">3. PLAYER / GAMEPLAY</text><text x="18" y="65" class="s">Cheeky, enemies, hazards,</text><text x="18" y="84" class="s">bosses and effects.</text>
    </g>
    <g transform="translate(0 266)">
      <rect width="330" height="94" rx="12" fill="#26354c" stroke="#7df0a5" stroke-width="3"/>
      <text x="18" y="34" class="n">2. MID LAYER</text><text x="18" y="65" class="s">Desk, furniture, scenery</text><text x="18" y="84" class="s">behind the player.</text>
    </g>
    <g transform="translate(0 380)">
      <rect width="330" height="94" rx="12" fill="#25233e" stroke="#a98cff" stroke-width="3"/>
      <text x="18" y="34" class="n">1. BACK LAYER</text><text x="18" y="65" class="s">Distant decorations, lights,</text><text x="18" y="84" class="s">windows or animated detail.</text>
    </g>
    <g transform="translate(0 494)">
      <rect width="330" height="94" rx="12" fill="#131522" stroke="#59647c" stroke-width="3"/>
      <text x="18" y="34" class="n">0. MAIN BACKGROUND</text><text x="18" y="65" class="s">Full 1600 × 900 scene.</text><text x="18" y="84" class="s">Always safe as fallback.</text>
    </g>
  </g>

  <text x="80" y="792" class="t">SAFE ARTWORK RULE:</text>
  <text x="80" y="824" class="s">Do not bake HUD text, enemies, hazards, bosses, pickups or collision-critical objects into the background artwork.</text>
  <text x="80" y="855" class="s">Transparent Back/Mid/Front layers should remain exactly 1600 × 900 even when only a small part contains artwork.</text>
</svg>
