<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05040b">
  <meta name="robots" content="noindex,nofollow">
  <title>Cheeky's Commodore Quest — GitHub Engine Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Cheeky's Commodore Quest">
    <canvas id="game" width="1600" height="900" tabindex="0" aria-label="Cheeky's Commodore Quest game canvas"></canvas>
    <div id="loading" class="loading">LOADING COMMODORE QUEST…</div>
    <div class="rotate-prompt" role="status" aria-live="polite">
      <div class="rotate-prompt__card">
        <div class="rotate-prompt__phone" aria-hidden="true">▯ ↻</div>
        <strong>ROTATE YOUR PHONE</strong>
        <span>Cheeky’s Commodore Quest is designed for landscape play.</span>
        <small>Turn your phone sideways for the largest playing area and touch controls.</small>
      </div>
    </div>
    <div class="corner-controls" aria-label="Game controls">
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-level" type="button">Level Select</button>
      <button id="btn-quit" class="danger" type="button">Quit Game</button>
      <button id="btn-fullscreen" type="button">Fullscreen</button>
    </div>
    <div id="touch" class="touch" aria-hidden="true">
      <div><button data-touch="left">◀</button><button data-touch="right">▶</button></div>
      <div><button data-touch="jump">JUMP</button><button data-touch="duck">DUCK</button><button data-touch="fire">FIRE / PUNCH</button><button data-touch="kick">KICK</button></div>
    </div>
  </main>
  <script defer src="game/core.js"></script>
  <script defer src="game/balance.js"></script>
  <script defer src="game/assets-config.js"></script>
  <script defer src="game/remote-assets.js"></script>
  <script defer src="game/sprite-runtime.js"></script>
  <script defer src="game/stages.js"></script>
  <script defer src="game/audio.js"></script>
  <script defer src="game/achievements.js"></script>
  <script defer src="game/main-v2.js"></script>
</body>
</html>
