<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ccg-context" content="admin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCG Admin Reset Password</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../favicon.ico" />
  <link href="../resources/css/ccg-master.css?v=20260207-01" rel="stylesheet" />
  <link href="../resources/css/ccg-mode.css?v=20260207-01" rel="stylesheet" />
  <link href="../resources/css/ccg-effects.css?v=20260207-01" rel="stylesheet" />
  <link href="./css/admin-auth.css?v=20260207-01" rel="stylesheet" />
  <link href="../resources/css/ccg-admin.css?v=20260207-01" rel="stylesheet" />
</head>
<body class="ccg-body" data-ccg-mode="c64" data-mode="c64" data-recovery-page="reset">
  <div aria-hidden="true" class="ccg-bg"><div aria-hidden="true" class="ccg-bg-starfield"></div><div aria-hidden="true" class="ccg-bg-grid"></div><div aria-hidden="true" class="ccg-bg-crt-overlay"></div></div>
  <main class="admin-auth-wrap ccg-page--admin omega-admin-shell" data-admin-shell>
    <section class="admin-auth-panel" aria-labelledby="admin-reset-title">
      <p class="admin-auth-kicker">CCG Admin Security Layer</p>
      <h1 id="admin-reset-title">Set new admin password</h1>
      <p class="admin-auth-help">Use this page only from a CCG Admin password recovery email.</p>
      <form data-reset-form novalidate>
        <label for="admin-password">New password</label>
        <input id="admin-password" data-password-input type="password" autocomplete="new-password" minlength="8" required />
        <button class="ccg-auth-peek" data-toggle-password type="button">Show password</button>
        <label for="admin-password-confirm">Confirm new password</label>
        <input id="admin-password-confirm" data-confirm-password-input type="password" autocomplete="new-password" minlength="8" required />
        <button class="ccg-auth-peek" data-toggle-confirm-password type="button">Show password</button>
        <button class="ccg-btn ccg-btn--primary" data-submit-button type="submit">Save new password</button>
      </form>
      <p class="admin-auth-message" data-message data-state="info">Checking recovery link…</p>
      <p data-complete hidden><a class="ccg-btn ccg-btn--primary admin-auth-link" href="/admin/login.html">Return to admin login</a></p>
      <p><a class="ccg-btn ccg-btn--ghost admin-auth-link" href="/admin/login.html">Back to admin login</a></p>
    </section>
  </main>
  <script src="/js/ccg-supabase-config.js?v=20260207-01"></script>
  <script src="/js/ccg-supabase-client.js?v=20260207-01"></script>
  <script type="module" src="/admin/js/password-recovery.js?v=20260207-01"></script>
</body>
</html>
