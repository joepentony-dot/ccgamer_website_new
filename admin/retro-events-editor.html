<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="ccg-context" content="admin" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Retro Video Collections Builder</title>
  <link rel="icon" href="../favicon.ico" />
  <link href="../resources/css/ccg-master.css?v=retro-events-editor-6" rel="stylesheet" />
  <link href="../resources/css/ccg-admin.css?v=retro-events-editor-6" rel="stylesheet" />

  <style>
    .retro-editor { max-width: 1120px; margin: 1.5rem auto; padding: 1rem; }
    .retro-card { background: rgba(10, 20, 45, 0.92); border: 1px solid #3ba3ff; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .retro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .retro-grid .full { grid-column: 1 / -1; }
    label { display: flex; flex-direction: column; gap: .3rem; font-weight: 600; }
    input[type="text"], input[type="number"], input[type="date"], textarea, select { width: 100%; padding: .55rem; border-radius: 6px; border: 1px solid #6baeff; background: #07182f; color: #fff; }
    textarea { min-height: 84px; resize: vertical; }
    .toggle-wrap { display: inline-flex; align-items: center; gap: .5rem; font-weight: 700; }
    .toggle-wrap input { accent-color: #ff2a6d; }
    .retro-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
    .retro-status { margin-top: .75rem; font-weight: 700; min-height: 1.2em; }
    .retro-status.error { color: #fda4af; }
    .retro-status.ok { color: #86efac; }
    .retro-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
    .retro-item { display: grid; grid-template-columns: 1fr auto; gap: .75rem; align-items: center; border: 1px solid rgba(107, 174, 255, .5); border-radius: 10px; background: rgba(6, 18, 38, .95); padding: .65rem .75rem; }
    .retro-item-title { font-weight: 700; }
    .retro-item-sub { font-size: .85rem; color: #9bc6f1; }
    .retro-pill.members { display: inline-flex; align-items: center; font-size: .72rem; border: 1px solid rgba(255, 128, 170, .9); padding: .1rem .45rem; border-radius: 999px; background: rgba(255, 42, 109, 0.2); margin-left: .45rem; }
    .retro-item-buttons { display: flex; gap: .45rem; flex-wrap: wrap; }
    .retro-help { color: #9bc6f1; font-size: .9rem; }
    .content-switcher { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-bottom: .8rem; }
    .content-switcher label { font-weight: 700; min-width: 140px; }
    .mode-pill { display: inline-flex; align-items: center; border: 1px solid rgba(125, 211, 252, .8); border-radius: 999px; padding: .2rem .6rem; font-size: .78rem; color: #7dd3fc; }
    .retro-preview { display: grid; gap: .75rem; }
    .retro-preview-card { border: 1px solid rgba(107, 174, 255, .5); border-radius: 10px; background: rgba(6, 18, 38, .95); overflow: hidden; max-width: 430px; }
    .retro-preview-card img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
    .retro-preview-body { padding: .75rem; display: grid; gap: .45rem; }
    .retro-preview-title { font-weight: 700; line-height: 1.25; }
    .seo-hint { font-size: .82rem; color: #9bc6f1; margin: 0; }

    @media (max-width: 840px) {
      .retro-grid { grid-template-columns: 1fr; }
      .retro-item { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="ccg-body ccg-admin" data-ccg-mode="c64" data-mode="c64">
  <main class="retro-editor">

    <section class="retro-card">
      <div class="content-switcher">
        <label>Builder Selector</label>
        <div class="retro-actions">
          <button type="button" class="ccg-btn ccg-btn--ghost" data-builder-select="game">Games</button>
          <button type="button" class="ccg-btn ccg-btn--primary" data-builder-select="retro">Amiga Demo Music / Events / Specials</button>
        </div>
        <span class="mode-pill">Current mode: Non-Game Video Builder</span>
      </div>

      <h1>Non-Game Video Builder</h1>

      <p>This editor manages:
        <code>/data/retro-events.json</code>,
        <code>/data/retro-specials.json</code>,
        <code>/data/amiga-demo-music.json</code>
      </p>

      <p class="retro-help">
        Now using GitHub direct commit mode — no local server required.
      </p>

      <p class="retro-status" data-status></p>
    </section>

    <section class="retro-card">
      <h2 data-form-heading>Add Retro Event</h2>

      <form data-form>
        <div class="retro-grid">

          <label>Section *
            <select data-field="type" required>
              <option value="retro_event">Retro Events</option>
              <option value="retro_special">Retro Specials</option>
              <option value="demo_music">Amiga Demo Music</option>
            </select>
          </label>

          <label>Title *
            <input type="text" data-field="title" required />
          </label>

          <label>Slug
            <input type="text" data-field="slug" />
          </label>

          <label>YouTube URL *
            <input type="text" data-field="youtubeUrl" required />
          </label>

          <label>YouTube ID *
            <input type="text" data-field="youtubeId" required />
          </label>

        </div>

        <div class="retro-actions">
          <button type="submit" class="ccg-btn ccg-btn--primary">Add</button>
        </div>

      </form>
    </section>

    <section class="retro-card">
      <h2>Entries</h2>

      <ul class="retro-list" data-event-list></ul>

      <div class="retro-actions">
        <button class="ccg-btn ccg-btn--primary" data-action="save-retro-json">Save Events</button>
        <button class="ccg-btn ccg-btn--secondary" data-action="save-specials-json">Save Specials</button>
        <button class="ccg-btn ccg-btn--secondary" data-action="save-demo-json">Save Demo Music</button>
      </div>

    </section>

  </main>

  <!-- 🔥 CACHE BUSTING FIX -->
  <script type="module" src="/admin/js/retro-events-editor.js?v=retro-events-editor-6"></script>

</body>
</html>
