<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ccg-context" content="admin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CCG Admin</title>
  <link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/admin/dashboard.html" />
</head>
<body>
  <p>Checking admin access…</p>

  <script src="/js/ccg-supabase-config.js" defer></script>
  <script src="/js/ccg-supabase-client.js" defer></script>
  <script src="/js/ccg-auth-ui.js" defer></script>
  <script type="module">
    import { ensureRole } from '/admin/js/guard.js';

    const access = await ensureRole(['admin', 'superadmin']);
    if (access) {
      const target = '/admin/dashboard.html' + window.location.search + window.location.hash;
      window.location.replace(target);
    }
  </script>
</body>
</html>
