<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ccg-context" content="admin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCG Admin | Members</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="../resources/css/ccg-master.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="../resources/css/ccg-mode.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="./css/admin-auth.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="./css/members.css?v=admin-stable-20260225" rel="stylesheet" />
</head>
<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">
  <main class="omega-admin-shell" data-admin-shell>
    <header class="members-header">
      <h1>Members &amp; Moderation</h1>
      <p>Admin-only members list, communication controls, and moderation timeline.</p>
      <p class="admin-status" data-member-status>Checking admin session…</p>
    </header>

    <section class="members-controls" aria-label="Members filtering">
      <label>
        Search
        <input type="search" id="membersSearch" placeholder="email or username" />
      </label>
      <label>
        Role
        <select id="membersRoleFilter">
          <option value="">All roles</option>
          <option value="user">user</option>
          <option value="editor">editor</option>
          <option value="mod">mod</option>
          <option value="admin">admin</option>
          <option value="superadmin">superadmin</option>
        </select>
      </label>
      <label>
        Ban state
        <select id="membersBannedFilter">
          <option value="">All</option>
          <option value="false">Active only</option>
          <option value="true">Banned only</option>
        </select>
      </label>
      <button type="button" id="membersRefresh">Refresh</button>
    </section>

    <section class="members-table-wrap" aria-label="Current members list">
      <table class="members-table" id="membersTable">
        <thead>
          <tr>
            <th>Email</th>
            <th>Username</th>
            <th>Role</th>
            <th>Joined</th>
            <th>Last sign in</th>
            <th>Preferences</th>
            <th>Ban</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="membersTableBody"></tbody>
      </table>
    </section>

    <section class="members-comms" aria-label="Admin communication tool">
      <h2>Send Admin Message</h2>
      <form id="messageForm">
        <label>
          Message type
          <select id="messageType" required>
            <option value="game_notification">Game notification</option>
            <option value="newsletter">Newsletter</option>
            <option value="admin_contact">Admin contact</option>
          </select>
        </label>
        <label>
          Subject
          <input type="text" id="messageSubject" required maxlength="140" />
        </label>
        <label>
          Body
          <textarea id="messageBody" rows="5" required></textarea>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="messageOptInOnly" checked />
          Respect opt-in preferences
        </label>
        <button type="submit">Send</button>
      </form>
      <p id="messageResult" class="admin-inline-status"></p>
    </section>

    <section class="members-timeline" aria-label="Admin activity timeline">
      <h2>Activity timeline</h2>
      <button type="button" id="timelineRefresh">Refresh timeline</button>
      <ul id="timelineList"></ul>
    </section>
  </main>

  <script type="module" src="/admin/js/members.js?v=admin-stable-20260225"></script>
  <script src="/admin/js/input-fix.js?v=admin-stable-20260207"></script>
</body>
</html>
