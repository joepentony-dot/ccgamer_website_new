<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="ccg-context" content="admin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCG Admin | Members</title>
  <meta name="robots" content="noindex,nofollow" />

  <link href="../resources/css/ccg-master.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="../resources/css/ccg-mode.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="./css/admin-auth.css?v=admin-stable-20260207" rel="stylesheet" />
  <link href="./css/members.css?v=admin-stable-20260227" rel="stylesheet" />
</head>

<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">
  <main class="omega-admin-shell ccg-admin-panel" data-admin-shell>
    <nav class="ccg-admin-nav" aria-label="Admin navigation">
      <a href="/admin/dashboard.html" data-nav="dashboard">Dashboard</a>
      <a href="/admin/announce.html" data-nav="announce">Announcements</a>
      <a href="/admin/members.html" data-nav="members">Members</a>
      <button type="button" data-admin-logout>Logout</button>
    </nav>

    <header class="members-header">
      <h1>Members Directory</h1>
      <p>Phase 3: role controls, Moderator badge wiring, and moderation safety rails.</p>
      <p class="admin-status" data-member-status>Checking admin session…</p>
      <p class="admin-status" id="membersInlineStatus" data-state="info"></p>
    </header>

    <section class="members-controls">
      <label>
        Search
        <input type="search" id="membersSearch" placeholder="email or username" />
      </label>

      <label>
        Role
        <select id="membersRoleFilter">
          <option value="">All roles</option>
          <option value="user">user</option>
          <option value="editor">Moderator</option>
          <option value="admin">admin</option>
          <option value="superadmin">superadmin</option>
        </select>
      </label>

      <label>
        Ban state
        <select id="membersBannedFilter">
          <option value="">All</option>
          <option value="false">Active</option>
          <option value="true">Banned</option>
        </select>
      </label>

      <button id="membersRefresh">Refresh</button>
    </section>

    <section class="members-table-wrap">
      <table class="members-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Username</th>
            <th>Signup date</th>
            <th>Last sign in</th>
            <th>Role</th>
            <th>Badges</th>
            <th>Role controls</th>
            <th>Soft ban controls</th>
          </tr>
        </thead>
        <tbody id="membersTableBody"></tbody>
      </table>
    </section>

  </main>

  <script src="/js/ccg-supabase-config.js?v=admin-stable-20260207" defer></script>
  <script src="/js/ccg-supabase-client.js?v=admin-stable-20260207" defer></script>
  <script src="/js/ccg-auth-ui.js?v=admin-stable-20260207" defer></script>
  <script type="module" src="/admin/js/admin-nav.js?v=admin-stable-20260207"></script>
  <script type="module" src="/admin/js/admin-members.js?v=admin-stable-20260301"></script>
  <script src="/admin/js/input-fix.js?v=admin-stable-20260207"></script>
</body>
</html>
