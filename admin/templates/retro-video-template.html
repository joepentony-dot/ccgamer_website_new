<!DOCTYPE html>
<html lang="en" data-ccg-page="retro-video">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{SEO_TITLE}}</title>
    <meta name="description" content="{{SEO_DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:type" content="video.other" />
    <meta property="og:site_name" content="Cheeky Commodore Gamer" />
    <meta property="og:title" content="{{SEO_TITLE}}" />
    <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:image" content="{{THUMBNAIL_URL}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SEO_TITLE}}" />
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{THUMBNAIL_URL}}" />
    <meta name="twitter:url" content="{{CANONICAL_URL}}" />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/ccg-master.css" />
    <link rel="stylesheet" href="/resources/css/ccg-mode.css" />
    <link rel="stylesheet" href="/resources/css/ccg-effects.css" />
    <link rel="stylesheet" href="/resources/css/ccg-anim.css" />
    <link rel="stylesheet" href="/resources/css/ccg-overlays.css" />
    <link rel="stylesheet" href="/resources/css/ccg-cards.css" />
    <link rel="stylesheet" href="/resources/css/games.css" />
    <link rel="stylesheet" href="/resources/css/ccg-footer.css" />
    <link rel="stylesheet" href="/resources/css/ccg-mobile-lite.css" />
    <link rel="stylesheet" href="/resources/css/retro-video-pages.css" />
</head>
<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">
<div class="ccg-bg" aria-hidden="true">
  <div class="ccg-bg-starfield" aria-hidden="true"></div>
  <div class="ccg-bg-grid" aria-hidden="true"></div>
  <div class="ccg-bg-crt-overlay" aria-hidden="true"></div>
</div>

<div class="ccg-page">
<main class="ccg-main">
<section class="retro-video-page game-shell game-shell--detail">
  <header class="retro-video-page__hero game-hero">
    <p class="retro-video-page__eyebrow">{{COLLECTION_LABEL}} Feature</p>
    <h1 class="game-hero__title retro-video-page__title">{{TITLE}}</h1>
    <p class="retro-video-page__summary">{{SUMMARY}}</p>

    <div class="retro-video-page__actions" aria-label="Page actions">
      <a class="ccg-btn ccg-btn--secondary" href="{{COLLECTION_URL}}">← Back to {{COLLECTION_LABEL}}</a>
      <a class="ccg-btn ccg-btn--primary" href="https://www.youtube.com/watch?v={{YOUTUBE_ID}}" rel="noopener" target="_blank">Watch on YouTube ↗</a>
    </div>
    {{MEMBERS_BADGE}}
  </header>

  <div class="retro-video-page__video-shell">
    <div class="retro-video-page__video">
      <iframe src="https://www.youtube.com/embed/{{YOUTUBE_ID}}"
        title="{{TITLE}}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
    </div>
  </div>

  <section class="retro-video-page__description-block">
    <h2 class="game-subtitle">About this video</h2>
    <p class="retro-video-page__description">{{DESCRIPTION}}</p>
  </section>

  {{RELATED_ITEMS}}
</section>
</main>

<footer class="ccg-footer">
  <p class="ccg-footer__text">
    © <span data-ccg-year></span> Cheeky Commodore Gamer.
    Not affiliated with Commodore, Amiga or publishers.
  </p>
</footer>
</div>

<script src="/js/analytics.js" defer></script>
<script src="/js/ccg-base.js" defer></script>
<script src="/js/ccg-mobile-lite.js" defer></script>
<script src="/resources/js/ccg-share.js" defer></script>
</body>
</html>
