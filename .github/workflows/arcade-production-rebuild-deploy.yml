name: Arcade Production Rebuild Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.ccg-tmp/arcade-production-rebuild.trigger'
      - '.github/workflows/arcade-production-rebuild-deploy.yml'
      - 'scripts/arcade-rebuild-assets.py'
      - 'scripts/arcade-rebuild-main.py'
      - 'scripts/arcade-rebuild-admin-mobile.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/arcade-production-rebuild-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: codex/arcade-production-rebuild-20260821
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair and compile-check temporary artwork generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/arcade-rebuild-assets.py')
          source = path.read_text(encoding='utf-8')
          bad = "        ellipse(d,(34,18,126,82),c,width=6); for x in (48,80,112): d.line((x,72,x-10,94),fill=c,width=9)"
          good = "        ellipse(d,(34,18,126,82),c,width=6)\n        for x in (48,80,112):\n            d.line((x,72,x-10,94),fill=c,width=9)"
          if bad not in source:
              raise SystemExit('Expected temporary generator line was not found.')
          path.write_text(source.replace(bad, good), encoding='utf-8')
          PY
          python -m py_compile scripts/arcade-rebuild-assets.py scripts/arcade-rebuild-main.py scripts/arcade-rebuild-admin-mobile.py

      - name: Generate production artwork
        run: python scripts/arcade-rebuild-assets.py

      - name: Apply production runtime rebuild
        run: python scripts/arcade-rebuild-main.py

      - name: Apply Admin and mobile landscape rebuild
        run: python scripts/arcade-rebuild-admin-mobile.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check arcade/quest/game/main-v2.js
          node --check arcade/quest/game/assets-config.js
          node --check arcade/quest/game/remote-assets.js
          node --check admin/js/arcade-assets.js
          node --check scripts/validate-arcade-quest.js

      - name: Validate final balance rules
        shell: bash
        run: |
          set -euo pipefail
          grep -F "fireOnly" arcade/quest/game/balance.js
          grep -F "extraAt = [4, 9, 14]" arcade/quest/game/balance.js
          grep -F "mode === 'invaders'" arcade/quest/game/balance.js
          grep -F 'src="game/balance.js"' arcade/quest/index.html

      - name: Validate production rebuild
        run: node scripts/validate-arcade-quest.js

      - name: Remove one-time rebuild helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/arcade-rebuild-assets.py
          rm -f scripts/arcade-rebuild-main.py
          rm -f scripts/arcade-rebuild-admin-mobile.py
          rm -f .ccg-tmp/arcade-production-rebuild.trigger
          rm -f .github/workflows/arcade-production-rebuild-deploy.yml

      - name: Commit production rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No rebuild changes to commit.'
            exit 0
          fi
          git commit -m "Rebuild Commodore Quest production art and mobile play"
          git push origin HEAD:codex/arcade-production-rebuild-20260821
