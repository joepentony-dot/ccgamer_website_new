name: C64 Dungeon Carnage Mobile Trap Layout Contract

on:
  pull_request:
    paths:
      - "arcade/lost-sizzler/js/v10-42-bootstrap.js"
      - "arcade/lost-sizzler/js/v10-42-r19-mobile-trap-layout-stability.js"
      - "arcade/lost-sizzler/tests/browser/v10-42-mobile-trap-layout-live.mjs"
      - "arcade/lost-sizzler/tests/browser/v10-42-mobile-geometry-diagnostic.mjs"
      - "tests/v10-42-mobile-trap-layout-stability.mjs"
      - ".github/workflows/c64-dungeon-carnage-mobile-trap-layout-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-trap-layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify mobile trap and portrait layout contract
        run: node tests/v10-42-mobile-trap-layout-stability.mjs

  mobile-trap-layout-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          npx playwright install --with-deps chromium
      - name: Report live mobile geometry
        run: node arcade/lost-sizzler/tests/browser/v10-42-mobile-geometry-diagnostic.mjs
      - name: Verify live portrait geometry and trap damage
        run: node arcade/lost-sizzler/tests/browser/v10-42-mobile-trap-layout-live.mjs
