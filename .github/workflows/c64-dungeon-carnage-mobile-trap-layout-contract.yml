name: C64 Dungeon Carnage Mobile Trap Layout Contract

on:
  pull_request:
    paths:
      - "arcade/lost-sizzler/js/v10-42-bootstrap.js"
      - "arcade/lost-sizzler/js/v10-42-r19-mobile-trap-layout-stability.js"
      - "arcade/lost-sizzler/tests/browser/v10-42-mobile-trap-layout-live.mjs"
      - "tests/v10-42-mobile-trap-layout-stability.mjs"
      - ".github/workflows/c64-dungeon-carnage-mobile-trap-layout-contract.yml"
      - "scripts/install-dungeon-chromium.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-trap-layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify mobile trap and portrait layout contract
        run: node tests/v10-42-mobile-trap-layout-stability.mjs

  mobile-trap-layout-live:
    # Pinned Chromium 1.55 cannot install on ubuntu-latest 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test runtime
        shell: bash
        run: bash scripts/install-dungeon-chromium.sh
      - name: Verify live portrait geometry and trap damage
        run: node arcade/lost-sizzler/tests/browser/v10-42-mobile-trap-layout-live.mjs
