name: Phase 20C Email Branding Apply

on:
  push:
    branches:
      - codex/phase20c-branded-announcement-emails
    paths:
      - scripts/apply-phase20c-email-branding.py
      - .github/workflows/phase20c-email-branding-apply.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-phase20c-email-branding.py
      - .github/workflows/phase20c-email-branding-apply.yml

permissions:
  contents: write

concurrency:
  group: phase20c-email-branding-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase20c-branded-announcement-emails
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply branded email integration
        run: python scripts/apply-phase20c-email-branding.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit integrated function
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/send-new-game-notification/index.ts
          git commit -m "Phase 20C: connect branded email template"
          git push origin HEAD:codex/phase20c-branded-announcement-emails
