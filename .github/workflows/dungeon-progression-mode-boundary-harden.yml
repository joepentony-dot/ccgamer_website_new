name: Dungeon Progression Mode Boundary Harden

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - scripts/harden-dungeon-progression-mode-boundaries.mjs

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded mode-boundary patch
        run: node scripts/harden-dungeon-progression-mode-boundaries.mjs
      - name: Syntax and progression contract
        shell: bash
        run: |
          node --check arcade/lost-sizzler/js/dungeon-progression-foundation.js
          node arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          node arcade/lost-sizzler/tests/horde-survivor-contract.mjs
          node arcade/lost-sizzler/tests/sizzler-saboteurs-contract.mjs
      - name: Commit hardening and remove temporary patch machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler/js/dungeon-progression-foundation.js arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          git rm scripts/harden-dungeon-progression-mode-boundaries.mjs .github/workflows/dungeon-progression-mode-boundary-harden.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No hardening changes produced"; exit 1; }
          git commit -m "fix: isolate dungeon progression from special modes"
          git push origin HEAD:codex/dungeon-carnage-progression-foundation
