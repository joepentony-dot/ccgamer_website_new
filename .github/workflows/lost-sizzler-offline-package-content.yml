name: Lost Sizzler Offline Package Content

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/assets/audio/**'
      - 'arcade/lost-sizzler/js/audio-assets.js'
      - 'arcade/lost-sizzler/js/config.js'
      - 'arcade/lost-sizzler/js/online-services-gate.js'
      - 'arcade/lost-sizzler/js/v10-4-patch.js'
      - 'arcade/lost-sizzler/tests/desktop-catalogue-delivery-contract.mjs'
      - 'games/games.json'
      - 'scripts/build-lost-sizzler-package-manifest.mjs'
      - 'scripts/verify-lost-sizzler-offline-package-content.mjs'
      - 'scripts/verify-lost-sizzler-offline-catalogue.mjs'
      - '.github/workflows/lost-sizzler-offline-package-content.yml'
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/assets/audio/**'
      - 'arcade/lost-sizzler/js/audio-assets.js'
      - 'arcade/lost-sizzler/js/config.js'
      - 'arcade/lost-sizzler/js/online-services-gate.js'
      - 'arcade/lost-sizzler/js/v10-4-patch.js'
      - 'arcade/lost-sizzler/tests/desktop-catalogue-delivery-contract.mjs'
      - 'games/games.json'
      - 'scripts/build-lost-sizzler-package-manifest.mjs'
      - 'scripts/verify-lost-sizzler-offline-package-content.mjs'
      - 'scripts/verify-lost-sizzler-offline-catalogue.mjs'
      - '.github/workflows/lost-sizzler-offline-package-content.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate offline package content tooling syntax
        run: |
          node --check scripts/build-lost-sizzler-package-manifest.mjs
          node --check scripts/verify-lost-sizzler-offline-package-content.mjs
          node --check scripts/verify-lost-sizzler-offline-catalogue.mjs
          node --check arcade/lost-sizzler/tests/desktop-catalogue-delivery-contract.mjs

      - name: Run offline package content self-tests
        run: |
          node scripts/verify-lost-sizzler-offline-package-content.mjs --self-test
          node scripts/verify-lost-sizzler-offline-catalogue.mjs --self-test
          node arcade/lost-sizzler/tests/desktop-catalogue-delivery-contract.mjs

      - name: Build desktop package manifest
        run: node scripts/build-lost-sizzler-package-manifest.mjs --output lost-sizzler-package-manifest.json

      - name: Verify minimum offline package content
        run: node scripts/verify-lost-sizzler-offline-package-content.mjs --manifest lost-sizzler-package-manifest.json

      - name: Verify packaged C64 collectible catalogue
        run: node scripts/verify-lost-sizzler-offline-catalogue.mjs --manifest lost-sizzler-package-manifest.json
