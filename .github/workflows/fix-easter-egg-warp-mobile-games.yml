name: Easter Egg WARP and Mobile Games

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/ccg-global.js'
      - 'resources/css/ccg-overlays.css'
      - 'resources/css/pacman-touch.css'
      - 'resources/audio/easter-eggs/pacman.html'
      - 'scripts/apply-easter-egg-warp-mobile-games-fix.py'
      - 'scripts/test-easter-egg-warp-mobile-games.mjs'
      - '.github/workflows/fix-easter-egg-warp-mobile-games.yml'
      - '.github/workflows/fix-easter-egg-viewport.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-easter-egg-games:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Fetch main baseline
        run: git fetch origin main --depth=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            home.html \
            > "$RUNNER_TEMP/easter-games-protected-before.sha256"

      - name: Apply bounded Easter egg game repairs
        run: |
          python scripts/apply-easter-egg-warp-mobile-games-fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path('js/ccg-global.js')
          text = path.read_text(encoding='utf-8')
          auto_focus = "\n".join([
              '        frame.addEventListener("load", () => {',
              '            if (!usesMobileEasterEggControls()) {',
              '                frame.focus({ preventScroll: true });',
              '            }',
              '        }, { once: true });',
              '',
          ])
          count = text.count(auto_focus)
          if count == 1:
              path.write_text(text.replace(auto_focus, '', 1), encoding='utf-8')
              print('Removed PACMAN iframe auto-focus so the visible Exit control retains focus.')
          elif count == 0:
              print('PACMAN iframe auto-focus is already absent.')
          else:
              raise SystemExit(f'Expected at most one PACMAN auto-focus block, found {count}')
          PY
          python - <<'PY'
          import subprocess
          from pathlib import Path

          relative_path = 'resources/audio/easter-eggs/pacman.html'
          path = Path(relative_path)
          baseline = subprocess.check_output(['git', 'show', f'origin/main:{relative_path}'])
          current = path.read_bytes()
          normalized = current.replace(b'\r\n', b'\n')
          desired = normalized.replace(b'\n', b'\r\n') if b'\r\n' in baseline else normalized
          if current != desired:
              path.write_bytes(desired)
              print('Restored PACMAN source line-ending style from main.')
          else:
              print('PACMAN source line endings already match main.')
          PY

      - name: Validate JavaScript syntax
        run: node --check js/ccg-global.js

      - name: Confirm PACMAN touch assets
        run: |
          test -f resources/css/pacman-touch.css
          grep -q 'CCG PACMAN TOUCH CONTROLS' resources/audio/easter-eggs/pacman.html
          grep -q 'data-pacman-key-code="78"' resources/audio/easter-eggs/pacman.html

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          if len(games) != 651:
              raise SystemExit(f'Expected 651 games, found {len(games)}')
          if any(str(game.get('slug', '')).strip().lower() == 'powerdrome' for game in games):
              raise SystemExit('Powerdrome must remain absent')
          print('Catalogue integrity passed: 651 games; Powerdrome absent.')
          PY

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Start local website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/easter-games-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/easter-games-http.pid"
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/home.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/easter-games-http.log"
          exit 1

      - name: Test WARP, PACMAN and INVADERS
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: |
          mkdir -p docs/seo-baseline "$RUNNER_TEMP/easter-games-screenshots"
          node scripts/test-easter-egg-warp-mobile-games.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output docs/seo-baseline/easter-egg-warp-mobile-games-evidence.json \
            --report docs/seo-baseline/easter-egg-warp-mobile-games-validation.md \
            --screenshots "$RUNNER_TEMP/easter-games-screenshots"

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/easter-games-protected-before.sha256"

      - name: Remove temporary dependencies
        if: always()
        run: rm -rf node_modules

      - name: Confirm bounded fix scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/fix-easter-egg-viewport.yml',
              '.github/workflows/fix-easter-egg-warp-mobile-games.yml',
              'docs/seo-baseline/easter-egg-third-click-evidence.json',
              'docs/seo-baseline/easter-egg-viewport-evidence.json',
              'docs/seo-baseline/easter-egg-viewport-validation.md',
              'docs/seo-baseline/easter-egg-warp-mobile-games-evidence.json',
              'docs/seo-baseline/easter-egg-warp-mobile-games-validation.md',
              'js/ccg-global.js',
              'resources/audio/easter-eggs/pacman.html',
              'resources/css/ccg-overlays.css',
              'resources/css/pacman-touch.css',
              'scripts/apply-easter-egg-warp-mobile-games-fix.py',
              'scripts/test-easter-egg-warp-mobile-games.mjs',
          }
          tracked_output = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'],
              text=True,
          )
          untracked_output = subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'],
              text=True,
          )
          actual = {
              line.strip()
              for output in (tracked_output, untracked_output)
              for line in output.splitlines()
              if line.strip()
          }
          if actual != expected:
              print('Expected:', sorted(expected))
              print('Actual:', sorted(actual))
              raise SystemExit('Unexpected Easter egg game repair scope')
          print('Exact Easter egg game repair scope passed.')
          PY

      - name: Upload Easter egg game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easter-egg-warp-mobile-games
          path: |
            docs/seo-baseline/easter-egg-warp-mobile-games-evidence.json
            docs/seo-baseline/easter-egg-warp-mobile-games-validation.md
            ${{ runner.temp }}/easter-games-screenshots
          if-no-files-found: warn
          retention-days: 30

      - name: Commit repair and evidence to PR branch
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            js/ccg-global.js \
            resources/audio/easter-eggs/pacman.html \
            resources/css/ccg-overlays.css \
            resources/css/pacman-touch.css \
            docs/seo-baseline/easter-egg-warp-mobile-games-evidence.json \
            docs/seo-baseline/easter-egg-warp-mobile-games-validation.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Fix WARP and mobile Easter egg games'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Publish summary
        if: always()
        run: |
          if [ -f docs/seo-baseline/easter-egg-warp-mobile-games-validation.md ]; then
            cat docs/seo-baseline/easter-egg-warp-mobile-games-validation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Easter egg game report was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
