name: Easter Egg WARP and Mobile Games

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/ccg-global.js'
      - 'js/easter-eggs/easter-egg-registry.js'
      - 'resources/css/ccg-overlays.css'
      - 'resources/css/pacman-touch.css'
      - 'resources/audio/easter-eggs/pacman.html'
      - 'resources/audio/easter-eggs/invaders.html'
      - 'scripts/test-easter-egg-warp-mobile-games.mjs'
      - 'scripts/test-pacman-mobile-render.mjs'
      - 'scripts/test-easter-egg-e5-pacman.mjs'
      - '.github/workflows/fix-easter-egg-warp-mobile-games.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-easter-egg-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            home.html \
            > "$RUNNER_TEMP/easter-games-protected-before.sha256"

      - name: Validate current Easter egg game assets
        run: |
          node --check js/ccg-global.js
          node --check js/easter-eggs/easter-egg-registry.js
          node --check scripts/test-easter-egg-e5-pacman.mjs
          test -f resources/audio/easter-eggs/pacman.html
          test -f resources/css/pacman-touch.css
          test -f resources/audio/easter-eggs/invaders.html
          grep -q 'Pacman.Ghost = function' resources/audio/easter-eggs/pacman.html
          grep -q 'data-pacman-key-code="38"' resources/audio/easter-eggs/pacman.html
          grep -q 'START / NEW GAME' resources/audio/easter-eggs/pacman.html
          grep -q 'phase: "E5"' js/easter-eggs/easter-egg-registry.js
          grep -q 'phase: "E4"' js/easter-eggs/easter-egg-registry.js
          grep -q 'triggerWarp' js/ccg-global.js
          grep -q 'getEasterEggAsset("pacman.html")' js/ccg-global.js
          grep -q 'getEasterEggAsset("invaders.html")' js/ccg-global.js
          node scripts/test-easter-egg-e5-pacman.mjs

      - name: Confirm local runtimes contain no retired dependencies
        run: |
          if grep -q 'cdnjs.cloudflare.com\|raw.githubusercontent.com\|jquery.min.js\|modernizr.min.js' resources/audio/easter-eggs/pacman.html; then
            echo 'PACMAN contains a retired external runtime dependency.'
            exit 1
          fi
          ! grep -q 'dwmkerr.github.io/spaceinvaders' js/ccg-global.js

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          if len(games) != 651:
              raise SystemExit(f'Expected 651 games, found {len(games)}')
          if any(str(game.get('slug', '')).strip().lower() == 'powerdrome' for game in games):
              raise SystemExit('Powerdrome must remain absent')
          print('Catalogue integrity passed: 651 games; Powerdrome absent.')
          PY

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/easter-games-protected-before.sha256"

      - name: Publish summary
        if: always()
        run: |
          echo '## Easter Egg Game Compatibility' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Validated WARP integration plus E4 Invaders and the restored original E5 Pac-Man runtime.' >> "$GITHUB_STEP_SUMMARY"
