name: CCG Backend Contract

on:
  pull_request:
    paths:
      - 'services/ccg-backend/**'
      - '.github/workflows/ccg-backend-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccg_backend_contract
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ccg_contract_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ccg_backend_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ccg_contract_password@127.0.0.1:5432/ccg_backend_contract
      CCG_DB_SSL: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: services/ccg-backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check backend source and fail-closed configuration
        working-directory: services/ccg-backend
        run: npm run check

      - name: Validate sanitized source migration snapshot
        working-directory: services/ccg-backend
        run: npm run migration:snapshot:check

      - name: Prove sensitive migration import safety on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/migration-import-contract.mjs

      - name: Prove backend schema and cloud-save transactions on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/database-contract.mjs

      - name: Prove migrated login and CCG session lifecycle on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/local-auth-database-contract.mjs

      - name: Prove CCG password recovery and session revocation on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/password-recovery-database-contract.mjs

      - name: Prove checksum-locked migration execution on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/migration-runner-contract.mjs

      - name: Prove source-compatible online-service state on PostgreSQL
        working-directory: services/ccg-backend
        run: node tests/online-service-database-contract.mjs

      - name: Check migration policy markers
        shell: bash
        run: |
          set -euo pipefail
          migration='services/ccg-backend/migrations/001_initial.sql'
          account_migration='services/ccg-backend/migrations/002_account_profiles.sql'
          session_migration='services/ccg-backend/migrations/003_auth_sessions.sql'
          profile_state_migration='services/ccg-backend/migrations/004_profile_owned_state.sql'
          service_state_migration='services/ccg-backend/migrations/005_online_service_state.sql'
          snapshot='services/ccg-backend/migration/source-snapshot-2026-09-06.json'
          test -f "$migration"
          test -f "$account_migration"
          test -f "$session_migration"
          test -f "$profile_state_migration"
          test -f "$service_state_migration"
          test -f "$snapshot"
          test -f services/ccg-backend/src/auth-http.mjs
          test -f services/ccg-backend/src/password-recovery.mjs
          test -f services/ccg-backend/scripts/migrate.mjs
          test -f services/ccg-backend/scripts/verify-migration-snapshot.mjs
          test -f services/ccg-backend/scripts/import-migration-bundle.mjs
          test -f services/ccg-backend/scripts/export-supabase-migration-bundle.mjs
          test -f services/ccg-backend/client/ccg-auth-client.mjs
          test -f services/ccg-backend/client/ccg-online-client.mjs
          test -f services/ccg-backend/tests/auth-client-contract.mjs
          test -f services/ccg-backend/tests/online-client-contract.mjs
          test -f services/ccg-backend/tests/online-service-database-contract.mjs
          test -f services/ccg-backend/tests/password-recovery-database-contract.mjs
          test -f services/ccg-backend/tests/migration-runner-contract.mjs
          test -f services/ccg-backend/tests/migration-snapshot-contract.mjs
          test -f services/ccg-backend/tests/migration-import-contract.mjs
          test -f services/ccg-backend/tests/migration-export-contract.mjs
          grep -q 'offline game first' services/ccg-backend/README.md
          grep -q 'CCG_AUTH_MODE=local' services/ccg-backend/README.md
          grep -q 'migrate:apply' services/ccg-backend/package.json
          grep -q 'migration:verify' services/ccg-backend/package.json
          grep -q 'migration:import' services/ccg-backend/package.json
          grep -q 'migration:export' services/ccg-backend/package.json
          grep -q '"auth_accounts": 33' "$snapshot"
          grep -q '"profiles": 27' "$snapshot"
          grep -q '"contains_password_hashes": false' "$snapshot"
          grep -q '"contains_session_tokens": false' "$snapshot"
          grep -q '"contains_unsubscribe_tokens": false' "$snapshot"
          grep -q 'lost_sizzler_cloud_saves' "$migration"
          grep -q 'client_revision_ms' "$migration"
          grep -q 'deleted_at' "$migration"
          grep -q 'lost_sizzler_multiplayer_rooms' "$migration"
          grep -q 'ccg_auth_accounts' "$account_migration"
          grep -q 'ccg_auth_identities' "$account_migration"
          grep -q 'ccg_profiles' "$account_migration"
          grep -q 'password_hash' "$account_migration"
          grep -q 'ccg_auth_sessions' "$session_migration"
          grep -q 'refresh_token_sha256' "$session_migration"
          grep -q 'ccg_auth_recovery_tokens' "$session_migration"
          grep -q 'ccg_auth_login_buckets' "$session_migration"
          grep -q 'profile_favourites' "$profile_state_migration"
          grep -q 'profile_game_library' "$profile_state_migration"
          grep -q 'profile_top_picks' "$profile_state_migration"
          grep -q 'user_badges' "$profile_state_migration"
          grep -q 'user_roles' "$profile_state_migration"
          grep -q 'email_subscriptions' "$profile_state_migration"
          grep -q 'comments' "$profile_state_migration"
          grep -q 'ccq_weekly_attempts' "$profile_state_migration"
          grep -q 'ccq_weekly_leaderboard' "$service_state_migration"
          grep -q 'ccq_weekly_result_deliveries' "$service_state_migration"
          grep -q 'game_feedback' "$service_state_migration"
          grep -q 'game_feedback_replies' "$service_state_migration"
          grep -q 'game_play_events' "$service_state_migration"
          grep -q 'lost_sizzler_request_buckets' "$service_state_migration"
          grep -q 'Never expose `password_hash`' services/ccg-backend/AUTH-PROFILE-MIGRATION-PLAN.md
          if grep -Eiq '(SUPABASE_SERVICE_ROLE|service[_-]?role|-----BEGIN ([A-Z0-9 ]+)?PRIVATE KEY-----)' services/ccg-backend/src/*; then
            echo 'Backend source contains forbidden embedded privileged credential material.' >&2
            exit 1
          fi
