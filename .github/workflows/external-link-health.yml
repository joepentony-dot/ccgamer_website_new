name: External Link Health

on:
  pull_request:
    paths:
      - "scripts/audit-external-links.js"
      - "tests/external-link-health.test.mjs"
      - ".github/workflows/external-link-health.yml"
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: node --check scripts/audit-external-links.js
      - name: Safety regression tests
        run: node --test tests/external-link-health.test.mjs

  audit:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run read-only external-link audit
        run: |
          mkdir -p .health
          node scripts/audit-external-links.js \
            --json .health/external-link-health.json \
            --markdown .health/external-link-health.md \
            --concurrency 6
      - name: Verify both external-link reports
        # upload-artifact's if-no-files-found only fails when ZERO paths match.
        # Check each file independently to reject a partial/empty report bundle.
        run: |
          test -s .health/external-link-health.json
          test -s .health/external-link-health.md
          node -e 'JSON.parse(require("node:fs").readFileSync(".health/external-link-health.json", "utf8"))'
      - name: Upload detailed health artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-link-health
          # The report directory is dot-prefixed: v4 excludes it by default.
          # Explicit paths prevent unrelated hidden files entering the artifact.
          path: |
            .health/external-link-health.json
            .health/external-link-health.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Update confirmed-broken-link issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.health/external-link-health.json', 'utf8'));
            const markdown = fs.readFileSync('.health/external-link-health.md', 'utf8');
            const title = '[Automated] External link health';
            const broken = Number(report?.summary?.confirmedBroken || 0);
            const body = `${markdown}\n\n_Automatically generated by the External Link Health workflow. Full JSON is retained as a workflow artifact for 30 days._`.slice(0, 60000);

            // Issues may be disabled; preserve the report independently of that API.
            await core.summary.addRaw(markdown).write();
            try {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100,
              });
              const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

              if (broken > 0) {
                if (existing) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    title,
                    body,
                    state: 'open',
                  });
                } else {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title,
                    body,
                  });
                }
                core.warning(`${broken} confirmed broken external link(s) require review.`);
                return;
              }

              if (existing && existing.state === 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              core.notice('No confirmed broken external links were found.');
            } catch (error) {
              if (Number(error?.status) !== 410) throw error;
              core.warning('GitHub Issues is disabled (HTTP 410); the complete link report remains in the workflow artifact and job summary.');
              if (broken > 0) core.warning(`${broken} confirmed broken external link(s) require review.`);
            }
