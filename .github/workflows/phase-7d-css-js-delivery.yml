name: Phase 7D CSS and JavaScript Delivery

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase-7d-css-js-delivery.yml"
      - "scripts/apply-phase7d-delivery.py"
      - "scripts/phase7d_live_check.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-7d-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-js-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Phase 7D branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Fetch main baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/phase7d-protected.sha256"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            beautifulsoup4==4.13.4 \
            pillow==11.3.0
          npm install --no-save --package-lock=false --ignore-scripts \
            playwright-core@1.61.1 \
            axe-core@4.12.1
          google-chrome --version

      - name: Validate Phase 7D tooling
        run: |
          python -m py_compile scripts/apply-phase7d-delivery.py
          node --check scripts/phase7d_live_check.mjs
          node --check scripts/rebuild-games.js

      - name: Record before state
        run: |
          python scripts/apply-phase7d-delivery.py inspect \
            --output "$RUNNER_TEMP/phase-7d-before-delivery.json"
          python scripts/phase7a_static_performance_accessibility_audit.py scan \
            --output "$RUNNER_TEMP/phase-7d-before-static.json"

      - name: Apply bounded delivery corrections
        run: python scripts/apply-phase7d-delivery.py apply

      - name: Run authoritative game publishing command
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          python scripts/apply-phase7d-delivery.py apply

      - name: Verify deterministic repeat generation
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/phase7d-first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          python scripts/apply-phase7d-delivery.py apply
          git diff --binary > "$RUNNER_TEMP/phase7d-second.diff"
          if ! cmp -s "$RUNNER_TEMP/phase7d-first.diff" "$RUNNER_TEMP/phase7d-second.diff"; then
            echo "Phase 7D repeat-generation mismatch:"
            diff -u "$RUNNER_TEMP/phase7d-first.diff" "$RUNNER_TEMP/phase7d-second.diff" || true
            exit 1
          fi
          git diff --check

      - name: Record after state
        run: |
          python scripts/apply-phase7d-delivery.py inspect \
            --output "$RUNNER_TEMP/phase-7d-after-delivery.json"
          python scripts/phase7a_static_performance_accessibility_audit.py scan \
            --output "$RUNNER_TEMP/phase-7d-after-static.json"

      - name: Start local static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/phase7d-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/phase7d-server.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/about.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/phase7d-server.log"
          exit 1

      - name: Run browser delivery and accessibility checks
        run: |
          node scripts/phase7d_live_check.mjs \
            --base-url http://127.0.0.1:4173 \
            --output "$RUNNER_TEMP/phase-7d-live.json"

      - name: Validate corrections and compose report
        run: |
          python scripts/apply-phase7d-delivery.py validate \
            --before-static "$RUNNER_TEMP/phase-7d-before-static.json" \
            --after-static "$RUNNER_TEMP/phase-7d-after-static.json" \
            --before-delivery "$RUNNER_TEMP/phase-7d-before-delivery.json" \
            --after-delivery "$RUNNER_TEMP/phase-7d-after-delivery.json" \
            --live "$RUNNER_TEMP/phase-7d-live.json" \
            --report docs/seo-baseline/phase-7d-css-js-delivery.md \
            --evidence docs/seo-baseline/phase-7d-css-js-delivery-evidence.json
          sed -i 's/[[:space:]]\+$//' docs/seo-baseline/phase-7d-css-js-delivery.md
          git diff --check

      - name: Upload detailed Phase 7D evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-7d-css-js-delivery-evidence
          path: |
            ${{ runner.temp }}/phase-7d-before-static.json
            ${{ runner.temp }}/phase-7d-after-static.json
            ${{ runner.temp }}/phase-7d-before-delivery.json
            ${{ runner.temp }}/phase-7d-after-delivery.json
            ${{ runner.temp }}/phase-7d-live.json
            ${{ runner.temp }}/phase7d-server.log
            docs/seo-baseline/phase-7d-css-js-delivery.md
            docs/seo-baseline/phase-7d-css-js-delivery-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/phase7d-protected.sha256"

      - name: Remove temporary dependencies and caches
        run: |
          if test -f "$RUNNER_TEMP/phase7d-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/phase7d-server.pid")" 2>/dev/null || true
          fi
          rm -rf node_modules
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Confirm exact Phase 7D scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          protected = {
              "index.html",
              "home.html",
              "resources/css/intro.css",
              "js/index-intro.js",
              "games/games.json",
          }
          allowed_exact = {
              ".github/workflows/phase-7d-css-js-delivery.yml",
              "scripts/apply-phase7d-delivery.py",
              "scripts/phase7d_live_check.mjs",
              "docs/seo-baseline/phase-7d-css-js-delivery.md",
              "docs/seo-baseline/phase-7d-css-js-delivery-evidence.json",
          }

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted({*tracked, *untracked})

          unexpected = []
          for path in changed:
              if path in allowed_exact:
                  continue
              if path in protected:
                  unexpected.append(path)
                  continue
              if path.endswith(".html"):
                  if path.startswith("data/lemon-cache/") or path.startswith("admin/js/_backup_2026-02-working/"):
                      unexpected.append(path)
                  continue
              if path.startswith("scripts/") and path.endswith((".js", ".mjs")):
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit(f"Unexpected Phase 7D paths: {unexpected}")
          if any(path.endswith(".css") for path in changed):
              raise SystemExit("Phase 7D must not modify CSS source files.")
          if protected.intersection(changed):
              raise SystemExit("A protected file entered the Phase 7D diff.")

          print(f"Validated Phase 7D scope ({len(changed)} files).")
          PY
          git diff --check

      - name: Commit validated Phase 7D output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -u
          git add \
            docs/seo-baseline/phase-7d-css-js-delivery.md \
            docs/seo-baseline/phase-7d-css-js-delivery-evidence.json

          git reset -- \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json

          if git diff --cached --quiet; then
            echo "Phase 7D output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Phase 7D CSS and JavaScript delivery"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
