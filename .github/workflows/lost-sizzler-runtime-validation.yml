      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-12-dossier-direct-link.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-20-onboarding-safety.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-21-environmental-polish.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-22-version-cache.mjs'
