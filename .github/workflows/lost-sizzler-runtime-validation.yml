      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-24-mobile-ergonomics.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-25-melee-ammo.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-26-ammo-budget.mjs'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - '.github/workflows/lost-sizzler-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate runtime JavaScript syntax
        run: |
          node --check games/ccg-games/cheeky-commodore-quest/js/version-check.js
          node --check games/ccg-games/cheeky-commodore-quest/js/asset-overrides.js
          node --check games/ccg-games/cheeky-commodore-quest/js/game-main.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-dossier-polish.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-9-browser-stability.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-20-onboarding-safety.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-20-onboarding-hardening.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-23-tutorial-guidance.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-21-environmental-polish.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-24-mobile-ergonomics.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-25-melee-ammo-balance.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-26-ammo-budget.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-18-expansion-changelog.js
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-12-dossier-direct-link.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-20-onboarding-safety.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-21-environmental-polish.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-22-version-cache.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-24-mobile-ergonomics.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-25-melee-ammo.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-26-ammo-budget.mjs
          node --check js/ccg-home-community.js

      - name: Validate dossier discovery and cold direct-link boot
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-12-dossier-direct-link.mjs

      - name: Validate full tutorial progression, highlighted controls, automatic explanations, gentle opening and dossier identity isolation
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-20-onboarding-safety.mjs

      - name: Validate door geometry, rare vortex pits and environmental knockback
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-21-environmental-polish.mjs

      - name: Validate build refresh and home Lost Sizzler recognition
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-22-version-cache.mjs

      - name: Validate mobile readability, touch controls and inventory return
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-24-mobile-ergonomics.mjs

      - name: Validate sword-first combat, scarce ammo and rare melee equipment
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-25-melee-ammo.mjs

      - name: Validate enemy-budgeted ammo supply and 50 percent miss allowance
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-26-ammo-budget.mjs

      - name: Re-run browser stability regression checks
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-9-stability.mjs
