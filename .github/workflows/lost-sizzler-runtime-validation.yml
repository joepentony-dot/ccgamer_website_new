name: Lost Sizzler Runtime Validation

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - '.github/workflows/lost-sizzler-runtime-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - '.github/workflows/lost-sizzler-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical Lost Sizzler JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z)

      - name: Run canonical Lost Sizzler regression suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test; do
            echo "Running $test"
            node "$test"
          done < <(find arcade/lost-sizzler/tests -maxdepth 1 -type f -name '*.mjs' -print0 | sort -z)

      - name: Validate migration redirects and canonical structure
        shell: bash
        run: |
          set -euo pipefail
          test -f arcade/lost-sizzler/index.html
          test -f arcade/lost-sizzler/version.json
          grep -q '/arcade/lost-sizzler/' games/ccg-games/cheeky-commodore-quest/index.html
          grep -q '/arcade/lost-sizzler/' games/the-lost-sizzler/index.html
          grep -q 'isEditableKeyboardTarget' arcade/lost-sizzler/js/game-main.js
