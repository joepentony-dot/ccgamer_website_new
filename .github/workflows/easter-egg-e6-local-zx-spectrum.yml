name: Easter Egg E6 Local ZX Spectrum

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/ccg-global.js'
      - 'js/easter-eggs/easter-egg-registry.js'
      - 'js/easter-eggs/zx-spectrum.js'
      - 'resources/audio/easter-eggs/zx-spectrum.html'
      - 'resources/audio/easter-eggs/zx_1.gif'
      - 'resources/audio/easter-eggs/zx_2.gif'
      - 'resources/css/easter-eggs-zx-spectrum.css'
      - 'scripts/apply-easter-egg-e6-zx-spectrum.py'
      - '.github/workflows/easter-egg-e6-local-zx-spectrum.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-local-zx-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: sha256sum index.html resources/css/intro.css js/index-intro.js home.html games/games.json > "$RUNNER_TEMP/e6-protected.sha256"

      - name: Confirm bounded integration is already applied
        run: |
          python scripts/apply-easter-egg-e6-zx-spectrum.py
          git diff --exit-code -- js/ccg-global.js js/easter-eggs/easter-egg-registry.js

      - name: Validate local E6 assets and sequence
        run: |
          node --check js/ccg-global.js
          node --check js/easter-eggs/easter-egg-registry.js
          node --check js/easter-eggs/zx-spectrum.js
          test -f resources/audio/easter-eggs/zx-spectrum.html
          test -f resources/css/easter-eggs-zx-spectrum.css
          test -f resources/audio/easter-eggs/zx-clive.jpg
          test -f resources/audio/easter-eggs/no_i_dont_think_sp.mp3
          test -f resources/audio/easter-eggs/zx_1.gif
          test -f resources/audio/easter-eggs/zx_2.gif
          grep -q 'getEasterEggAsset("zx-spectrum.html")' js/ccg-global.js
          grep -q 'runtime: "local", phase: "E6"' js/easter-eggs/easter-egg-registry.js
          grep -q 'data-zx-spectrum' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-action="restart"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-action="sound"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-loader-one' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-loader-two' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-team' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'data-zx-reveal' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'src="zx_1.gif"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'src="zx_2.gif"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'zx-clive.jpg' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'no_i_dont_think_sp.mp3' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'href="../../css/easter-eggs-zx-spectrum.css"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q 'src="../../../js/easter-eggs/zx-spectrum.js"' resources/audio/easter-eggs/zx-spectrum.html
          grep -q "WE'RE TEAM COMMODORE HERE" resources/audio/easter-eggs/zx-spectrum.html
          grep -q '}, 5000);' js/easter-eggs/zx-spectrum.js
          grep -q '}, 10000);' js/easter-eggs/zx-spectrum.js
          grep -q 'later(showClive, 11600);' js/easter-eggs/zx-spectrum.js
          grep -q 'later(closeEasterEgg, 17800);' js/easter-eggs/zx-spectrum.js
          grep -q 'context.decodeAudioData' js/easter-eggs/zx-spectrum.js
          grep -q 'const playVoice = async' js/easter-eggs/zx-spectrum.js
          grep -q 'object-fit: contain' resources/css/easter-eggs-zx-spectrum.css
          ! grep -q 'jsspeccy.zxdemo.org' js/ccg-global.js
          ! grep -q 'https://' resources/audio/easter-eggs/zx-spectrum.html
          ! grep -q 'https://' js/easter-eggs/zx-spectrum.js

      - name: Confirm presentation and audio safeguards
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('resources/audio/easter-eggs/zx-spectrum.html').read_text(encoding='utf-8')
          script = Path('js/easter-eggs/zx-spectrum.js').read_text(encoding='utf-8')
          styles = Path('resources/css/easter-eggs-zx-spectrum.css').read_text(encoding='utf-8')
          compact_script = ''.join(script.split())

          assert 'href="../../css/easter-eggs-zx-spectrum.css"' in html
          assert 'src="../../../js/easter-eggs/zx-spectrum.js"' in html
          assert 'later(()=>{stopTapeSound();loaderOne.hidden=true;' in compact_script
          assert 'else if (!loaderOne.hidden || !loaderTwo.hidden)' not in script
          assert 'context.decodeAudioData' in script
          assert 'overflow: hidden;' in styles
          assert 'object-fit: contain;' in styles
          print('E6 presentation and audio safeguards passed.')
          PY

      - name: Confirm GIF signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('zx_1.gif', 'zx_2.gif'):
              path = Path('resources/audio/easter-eggs') / name
              signature = path.read_bytes()[:6]
              assert signature in (b'GIF87a', b'GIF89a'), (name, signature)
              print(f'{name}: valid GIF signature')
          PY

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          assert len(games) == 651, len(games)
          print('Catalogue integrity passed: 651 games.')
          PY

      - name: Confirm protected files unchanged
        run: sha256sum --check "$RUNNER_TEMP/e6-protected.sha256"
