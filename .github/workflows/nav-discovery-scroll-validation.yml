name: Navigation Discovery Scroll Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "_headers"
      - "service-worker.js"
      - "js/ccg-nav-core.js"
      - "js/ccg-nav.js"
      - "js/ccg-nav-fit.js"
      - "js/ccg-header-auth-loader.js"
      - "js/ccg-auth.js"
      - "js/ccg-music-navigation.js"
      - "js/ccg-pwa-visible-install.js"
      - "js/ccg-release-check.js"
      - "js/ccg-archive-shortcuts.js"
      - "games/discover/index.html"
      - "js/game-discovery.js"
      - "resources/css/game-discovery.css"
      - "resources/css/ccg-scroll-authority.css"
      - "resources/css/ccg-socials.css"
      - "scripts/audit-nav-more-browser.js"
      - "scripts/audit-global-shell-browser.js"
      - "scripts/normalize-public-header-shell.js"
      - "tests/nav-discovery-scroll.test.mjs"
      - "tests/global-shell-auth.test.mjs"
      - "tests/public-header-stage-normalizer.test.mjs"
      - ".github/workflows/nav-discovery-scroll-validation.yml"
      - ".github/workflows/deploy-github-pages-omega-stable.yml"
  push:
    branches: [main]
    paths:
      - "_headers"
      - "service-worker.js"
      - "js/ccg-nav-core.js"
      - "js/ccg-nav.js"
      - "js/ccg-nav-fit.js"
      - "js/ccg-header-auth-loader.js"
      - "js/ccg-auth.js"
      - "js/ccg-music-navigation.js"
      - "js/ccg-pwa-visible-install.js"
      - "js/ccg-release-check.js"
      - "js/ccg-archive-shortcuts.js"
      - "games/discover/index.html"
      - "js/game-discovery.js"
      - "resources/css/game-discovery.css"
      - "resources/css/ccg-scroll-authority.css"
      - "resources/css/ccg-socials.css"
      - "scripts/audit-nav-more-browser.js"
      - "scripts/audit-global-shell-browser.js"
      - "scripts/normalize-public-header-shell.js"
      - "tests/nav-discovery-scroll.test.mjs"
      - "tests/global-shell-auth.test.mjs"
      - "tests/public-header-stage-normalizer.test.mjs"
      - ".github/workflows/nav-discovery-scroll-validation.yml"
      - ".github/workflows/deploy-github-pages-omega-stable.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check js/ccg-nav-core.js
          node --check js/ccg-nav.js
          node --check js/ccg-nav-fit.js
          node --check js/ccg-header-auth-loader.js
          node --check js/ccg-auth.js
          node --check js/ccg-music-navigation.js
          node --check js/ccg-release-check.js
          node --check js/ccg-archive-shortcuts.js
          node --check js/game-discovery.js
          node --check scripts/audit-nav-more-browser.js
          node --check scripts/audit-global-shell-browser.js
          node --check scripts/normalize-public-header-shell.js

      - name: Confirm duplicate navigation authority is removed
        run: test ! -e js/ccg-nav-authority.js

      - name: Run navigation discovery and scroll regressions
        run: node --test tests/nav-discovery-scroll.test.mjs

      - name: Run global shell auth and parity regressions
        run: node --test tests/global-shell-auth.test.mjs

      - name: Run staged first-paint shell regressions
        run: node --test tests/public-header-stage-normalizer.test.mjs

      - name: Run desktop More browser interaction audit
        run: node scripts/audit-nav-more-browser.js

      - name: Run multi-page global shell browser audit
        run: node scripts/audit-global-shell-browser.js

      - name: Check whitespace
        run: git diff --check
