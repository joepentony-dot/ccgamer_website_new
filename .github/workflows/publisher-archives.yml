name: Refresh Publisher Archives

on:
  push:
    branches:
      - main
    paths:
      - "games/games.json"
      - "js/ccg-nav.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/publisher-utils.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/remove-invalid-publisher-labels.js"
      - "data/publisher-playlists.json"
      - "resources/css/publisher-logos.css"
      - "resources/images/publishers/**"
      - ".github/workflows/publisher-archives.yml"
  pull_request:
    branches:
      - main
    paths:
      - "games/games.json"
      - "js/ccg-nav.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/publisher-utils.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/remove-invalid-publisher-labels.js"
      - "data/publisher-playlists.json"
      - "resources/css/publisher-logos.css"
      - "resources/images/publishers/**"
      - ".github/workflows/publisher-archives.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher-archives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate publisher scripts
        run: |
          node --check js/ccg-nav.js
          node --check scripts/apply-publisher-logos.js

      - name: Remove known invalid publisher labels
        run: node scripts/remove-invalid-publisher-labels.js

      - name: Generate publisher archives
        run: node scripts/generate-publisher-pages.js

      - name: Apply featured publisher logos
        run: node scripts/apply-publisher-logos.js

      - name: Verify publisher logo output
        shell: bash
        run: |
          test -s games/publishers/index.html
          grep -q '/resources/css/publisher-logos.css' games/publishers/index.html

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const {
            FEATURED_PUBLISHERS,
            slugifyPublisher
          } = require("./scripts/publisher-utils");

          const html = fs.readFileSync("games/publishers/index.html", "utf8");
          const standardSlugs = FEATURED_PUBLISHERS.map(slugifyPublisher);
          const extraSlugs = ["microprose-software"];
          const expectedSlugs = Array.from(new Set([...standardSlugs, ...extraSlugs]))
            .filter((slug) => fs.existsSync(path.join("resources", "images", "publishers", `${slug}.png`)));

          if (!expectedSlugs.length) {
            throw new Error("No featured publisher logo files were found.");
          }

          expectedSlugs.forEach((slug) => {
            if (!html.includes(`data-publisher-logo="${slug}"`)) {
              throw new Error(`Missing generated logo wrapper for ${slug}.`);
            }
            if (!html.includes(`/resources/images/publishers/${slug}.png`)) {
              throw new Error(`Missing generated image reference for ${slug}.`);
            }
          });

          const markupCount = (html.match(/data-publisher-logo=/g) || []).length;
          if (markupCount !== expectedSlugs.length) {
            throw new Error(`Expected ${expectedSlugs.length} featured logo wrappers but found ${markupCount}.`);
          }

          console.log(`[publisher-logos] Verified ${expectedSlugs.length} featured publisher logos.`);
          NODE

      - name: Rebuild sitemaps
        run: node scripts/generate-sitemaps.js

      - name: Validate sitemaps
        run: node scripts/validate-sitemaps.js

      - name: Commit generated publisher and sitemap outputs
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git add games/games.json games/publishers resources/images/publishers tools/seo/static-pages.json sitemap.xml sitemap-pages.xml sitemap-games.xml

          if git diff --cached --quiet; then
            echo "Publisher archives are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated publisher archives"

          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
