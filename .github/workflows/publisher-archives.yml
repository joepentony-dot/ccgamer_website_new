name: Apply staged publisher corrections

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publisher-archives.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and retain the normal workflow
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Save normal publisher workflow
        shell: bash
        run: |
          git show HEAD^:.github/workflows/publisher-archives.yml > "$RUNNER_TEMP/publisher-archives.yml"

      - name: Check out staged correction branch
        shell: bash
        run: |
          git fetch origin fix/publisher-corrections-20260804
          git checkout -B fix/publisher-corrections-20260804 origin/fix/publisher-corrections-20260804

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record protected hashes
        run: |
          sha256sum index.html home.html resources/css/intro.css js/index-intro.js > "$RUNNER_TEMP/protected.sha256"

      - name: Install logos and correct game publishers
        shell: bash
        run: |
          set -euo pipefail

          cat .ccg-tmp/publisher-logo-mini.b64.part-* \
            | base64 --decode > "$RUNNER_TEMP/publisher-logos.zip"

          unzip -o "$RUNNER_TEMP/publisher-logos.zip" \
            -d resources/images/publishers/

          for slug in \
            timeworks tv-games tynesoft ubi-soft ultimate \
            vifi-international virgin-games virgin-mastertronic \
            windham-classics zeppelin-games atarisoft \
            hodder-and-stoughton hudson-soft satchel-software thalamus
          do
            rm -f \
              "resources/images/publishers/${slug}.png" \
              "resources/images/publishers/${slug}.svg" \
              "resources/images/publishers/${slug}.jpg" \
              "resources/images/publishers/${slug}.jpeg"
          done

          node <<'NODE'
          const fs = require("fs");
          const path = "games/games.json";
          const games = JSON.parse(fs.readFileSync(path, "utf8"));

          const retired = new Set([
            "Starcade",
            "System 4 Software",
            "UK Gold",
            "Zafiro Software Division"
          ]);

          function publishersFor(game) {
            game.credits ||= {};
            const value = game.credits.publisher;
            const names = Array.isArray(value) ? value : value ? [value] : [];
            game.credits.publisher = names
              .map((name) => String(name).trim())
              .filter((name) => name && !retired.has(name));
            return game.credits.publisher;
          }

          function getGame(slug) {
            const game = games.find((entry) => entry.slug === slug);
            if (!game) throw new Error(`Missing game: ${slug}`);
            publishersFor(game);
            return game;
          }

          function ensurePublisher(game, name) {
            if (!game.credits.publisher.includes(name)) {
              game.credits.publisher.push(name);
            }
          }

          for (const game of games) {
            if (game.credits) publishersFor(game);
          }

          const up = getGame("up-up-and-away");
          ensurePublisher(up, "Argus Press");
          if (typeof up.description === "string") {
            up.description = up.description.replace("from Starcade", "from Argus Press");
          }

          ensurePublisher(getGame("ninja-rabbits"), "MicroValue");
          ensurePublisher(getGame("dropzone"), "US Gold");
          ensurePublisher(getGame("nosferatu-the-vampyre"), "Piranha");
          ensurePublisher(getGame("airwolf"), "Elite");

          const expected = new Map([
            ["up-up-and-away", ["Argus Press"]],
            ["ninja-rabbits", ["MicroValue"]],
            ["dropzone", ["US Gold"]],
            ["nosferatu-the-vampyre", ["Piranha"]],
            ["airwolf", ["Elite"]]
          ]);

          for (const [slug, required] of expected) {
            const game = getGame(slug);
            for (const publisher of required) {
              if (!game.credits.publisher.includes(publisher)) {
                throw new Error(`${slug} is missing ${publisher}`);
              }
            }
          }

          const leftovers = [];
          for (const game of games) {
            for (const publisher of publishersFor(game)) {
              if (retired.has(publisher)) leftovers.push(`${game.slug}: ${publisher}`);
            }
          }
          if (leftovers.length) {
            throw new Error(`Retired publisher labels remain: ${leftovers.join(", ")}`);
          }

          fs.writeFileSync(path, `${JSON.stringify(games, null, 2)}\n`);
          NODE

          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          node scripts/validate-publisher-logo-output.js

      - name: Verify corrected output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e games/publishers/starcade
          test ! -e games/publishers/system-4-software
          test ! -e games/publishers/uk-gold
          test ! -e games/publishers/zafiro-software-division
          sha256sum --check "$RUNNER_TEMP/protected.sha256"
          git diff --check

      - name: Commit clean correction branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ccg-tmp
          rm -f .github/workflows/apply-publisher-corrections-20260804.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply publisher corrections and logo batch"
          git push origin HEAD:fix/publisher-corrections-20260804

      - name: Restore main after staging
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          cp "$RUNNER_TEMP/publisher-archives.yml" .github/workflows/publisher-archives.yml
          rm -rf .ccg-tmp
          rm -f .github/workflows/apply-publisher-corrections-20260804.yml
          git add -A
          git commit -m "Restore publisher archive workflow after staged correction"
          git push origin HEAD:main
