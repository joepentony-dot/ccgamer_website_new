name: Refresh Publisher Archives

on:
  push:
    branches:
      - main
    paths:
      - "games/games.json"
      - "scripts/generate-publisher-pages.js"
      - "scripts/enrich-publisher-pages.js"
      - "scripts/publisher-utils.js"
      - "data/publisher-playlists.json"
      - "data/publisher-profiles.json"
      - "resources/css/publisher-profiles.css"
      - ".github/workflows/publisher-archives.yml"
  pull_request:
    branches:
      - main
    paths:
      - "games/games.json"
      - "scripts/generate-publisher-pages.js"
      - "scripts/enrich-publisher-pages.js"
      - "scripts/publisher-utils.js"
      - "data/publisher-playlists.json"
      - "data/publisher-profiles.json"
      - "resources/css/publisher-profiles.css"
      - ".github/workflows/publisher-archives.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publisher-archives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate publisher archives
        run: node scripts/generate-publisher-pages.js

      - name: Add factual publisher SEO
        run: node scripts/enrich-publisher-pages.js

      - name: Rebuild sitemaps
        run: node scripts/generate-sitemaps.js

      - name: Validate sitemaps
        run: node scripts/validate-sitemaps.js

      - name: Commit generated publisher and sitemap outputs
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git add games/publishers tools/seo/static-pages.json sitemap.xml sitemap-pages.xml sitemap-games.xml

          if git diff --cached --quiet; then
            echo "Publisher archives are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated publisher archives"

          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
