name: Refresh Publisher Archives

on:
  push:
    branches:
      - main
    paths:
      - "js/ccg-nav.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/materialize-publisher-histories.js"
      - "scripts/audit-publisher-seo-evidence.js"
      - "scripts/apply-publisher-evidence-overrides.js"
      - "scripts/stabilize-publisher-static-pages.js"
      - "scripts/ensure-publisher-history-runtime.js"
      - "scripts/publisher-utils.js"
      - "scripts/fetch-publisher-logos.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/validate-publisher-logo-output.js"
      - "scripts/remove-invalid-publisher-labels.js"
      - "data/publisher-histories*.json"
      - "data/publisher-evidence-overrides.json"
      - "data/publisher-logo-sources.json"
      - "data/publisher-playlists.json"
      - "resources/css/publisher-history.css"
      - "resources/css/publisher-logos.css"
      - "resources/images/publishers/**"
      - ".github/workflows/publisher-archives.yml"
  pull_request:
    branches:
      - main
    paths:
      - "js/ccg-nav.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/materialize-publisher-histories.js"
      - "scripts/audit-publisher-seo-evidence.js"
      - "scripts/apply-publisher-evidence-overrides.js"
      - "scripts/stabilize-publisher-static-pages.js"
      - "scripts/ensure-publisher-history-runtime.js"
      - "scripts/publisher-utils.js"
      - "scripts/fetch-publisher-logos.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/validate-publisher-logo-output.js"
      - "scripts/remove-invalid-publisher-labels.js"
      - "data/publisher-histories*.json"
      - "data/publisher-evidence-overrides.json"
      - "data/publisher-logo-sources.json"
      - "data/publisher-playlists.json"
      - "resources/css/publisher-history.css"
      - "resources/css/publisher-logos.css"
      - "resources/images/publishers/**"
      - ".github/workflows/publisher-archives.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publisher-archives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate publisher scripts
        run: |
          node --check js/ccg-nav.js
          node --check scripts/generate-publisher-pages.js
          node --check scripts/materialize-publisher-histories.js
          node --check scripts/audit-publisher-seo-evidence.js
          node --check scripts/apply-publisher-evidence-overrides.js
          node --check scripts/stabilize-publisher-static-pages.js
          node --check scripts/ensure-publisher-history-runtime.js
          node --check scripts/fetch-publisher-logos.js
          node --check scripts/apply-publisher-logos.js
          node --check scripts/validate-publisher-logo-output.js

      - name: Fetch vetted publisher logos
        env:
          CCG_PUBLISHER_LOGOS_STRICT: "0"
        run: node scripts/fetch-publisher-logos.js

      - name: Remove known invalid publisher labels
        run: node scripts/remove-invalid-publisher-labels.js

      - name: Apply independent publisher evidence
        run: node scripts/apply-publisher-evidence-overrides.js

      - name: Generate publisher archives
        run: node scripts/generate-publisher-pages.js

      - name: Apply publisher logos
        run: node scripts/apply-publisher-logos.js

      - name: Verify publisher logo output
        run: node scripts/validate-publisher-logo-output.js

      - name: Embed publisher histories in initial HTML
        run: node scripts/materialize-publisher-histories.js

      - name: Restore publisher runtime parity
        run: node scripts/ensure-publisher-history-runtime.js

      - name: Stabilize publisher sitemap eligibility ordering
        run: node scripts/stabilize-publisher-static-pages.js

      - name: Validate publisher SEO and evidence output
        run: node scripts/audit-publisher-seo-evidence.js

      - name: Detect sitemap-impacting changes
        id: sitemap-impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="$PR_BASE_SHA"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(scripts/generate-publisher-pages\.js|scripts/materialize-publisher-histories\.js|scripts/apply-publisher-evidence-overrides\.js|scripts/stabilize-publisher-static-pages\.js|scripts/ensure-publisher-history-runtime\.js|scripts/publisher-utils\.js|scripts/remove-invalid-publisher-labels\.js|data/publisher-histories.*\.json|data/publisher-evidence-overrides\.json|data/publisher-playlists\.json)$'; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild sitemaps
        if: steps.sitemap-impact.outputs.refresh == 'true'
        run: node scripts/generate-sitemaps.js

      - name: Validate sitemaps
        run: node scripts/validate-sitemaps.js

      - name: Commit generated publisher and sitemap outputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add games/publishers resources/images/publishers tools/seo/static-pages.json sitemap.xml sitemap-pages.xml sitemap-games.xml

          if git diff --cached --quiet; then
            echo "Publisher archives are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated publisher archives"

          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git push origin "HEAD:${TARGET_BRANCH}"; then
            exit 0
          fi

          if [ "$TARGET_BRANCH" != "main" ]; then
            echo "Could not push generated output to ${TARGET_BRANCH}."
            exit 1
          fi

          GENERATED_BRANCH="automation/publisher-archives-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${GENERATED_BRANCH}"

          gh pr create \
            --base main \
            --head "${GENERATED_BRANCH}" \
            --title "Refresh generated publisher archives" \
            --body "Automatically generated publisher archive output after publisher logo assets were added directly to main."