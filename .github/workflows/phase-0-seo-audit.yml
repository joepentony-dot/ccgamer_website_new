name: Phase 0 SEO Baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/phase0_site_audit.py"
      - "scripts/phase0_public_site_audit.py"
      - ".github/workflows/phase-0-seo-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-0-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit scripts
        run: |
          python -m py_compile scripts/phase0_site_audit.py
          python -m py_compile scripts/phase0_public_site_audit.py

      - name: Generate public-site baseline
        run: python scripts/phase0_public_site_audit.py

      - name: Verify report outputs
        shell: bash
        run: |
          test -s docs/seo-baseline/phase-0-baseline.md
          test -s docs/seo-baseline/phase-0-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("docs/seo-baseline/phase-0-baseline.json").read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          required = {
              "html_pages",
              "indexable_pages",
              "duplicate_indexable_canonical_groups",
              "broken_internal_links",
              "missing_local_assets",
          }
          missing = sorted(required.difference(summary))
          if missing:
              raise SystemExit(f"Baseline summary is missing keys: {missing}")
          if summary["html_pages"] < 1:
              raise SystemExit("No HTML pages were audited")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload detailed audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-seo-baseline-json
          path: docs/seo-baseline/phase-0-baseline.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary audit files
        shell: bash
        run: |
          rm docs/seo-baseline/phase-0-baseline.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Confirm audit is non-destructive
        shell: bash
        run: |
          ALLOWED="docs/seo-baseline/phase-0-baseline.md"
          UNEXPECTED_TRACKED="$(git diff --name-only | grep -v -x "$ALLOWED" || true)"
          UNEXPECTED_UNTRACKED="$(git ls-files --others --exclude-standard | grep -v -x "$ALLOWED" || true)"

          if [ -n "$UNEXPECTED_TRACKED" ] || [ -n "$UNEXPECTED_UNTRACKED" ]; then
            echo "Unexpected tracked changes:"
            printf '%s\n' "$UNEXPECTED_TRACKED"
            echo "Unexpected untracked files:"
            printf '%s\n' "$UNEXPECTED_UNTRACKED"
            exit 1
          fi

      - name: Commit generated baseline summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git add docs/seo-baseline/phase-0-baseline.md

          if git diff --cached --quiet; then
            echo "Phase 0 summary is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Phase 0 SEO baseline"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
