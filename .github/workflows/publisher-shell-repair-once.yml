name: Temporary Public Shell Diagnostic

on:
  push:
    branches:
      - fix/pages-latest-deploy-wins-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-shell-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/pages-latest-deploy-wins-20260819
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: List every remaining noncanonical shared-header page
        shell: bash
        run: |
          node scripts/normalize-public-header-shell.js --root .
          echo '--- NONCANONICAL FILES ---'
          git diff --name-only -- '*.html'
          echo '--- GROUP COUNTS ---'
          git diff --name-only -- '*.html' | awk -F/ '{ if (NF >= 2) print $1 "/" $2; else print $1 }' | sort | uniq -c | sort -nr
          echo '--- TOTAL ---'
          git diff --name-only -- '*.html' | wc -l
