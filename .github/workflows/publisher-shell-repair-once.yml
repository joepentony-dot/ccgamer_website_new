name: One-time Publisher Shell Source Repair

on:
  push:
    branches:
      - fix/pages-latest-deploy-wins-20260819

permissions:
  contents: write

concurrency:
  group: publisher-shell-repair-once
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/pages-latest-deploy-wins-20260819
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Harden publisher generator and publisher CI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const generatorPath = 'scripts/generate-publisher-pages.js';
          let generator = fs.readFileSync(generatorPath, 'utf8');

          if (!generator.includes('require("./normalize-public-header-shell")')) {
            const importAnchor = '} = require("./publisher-utils");';
            if (!generator.includes(importAnchor)) throw new Error('Publisher utils import anchor not found.');
            generator = generator.replace(
              importAnchor,
              `${importAnchor}\nconst { normaliseHtml, STATIC_SHELL_VERSION } = require("./normalize-public-header-shell");`
            );
          }

          if (!generator.includes('function canonicalizePublisherHtml(')) {
            const helperAnchor = 'function htmlEscape(value) {';
            if (!generator.includes(helperAnchor)) throw new Error('Publisher helper anchor not found.');
            const helper = `function canonicalizePublisherHtml(html, label) {\n    const result = normaliseHtml(html);\n    if (!result.applicable || result.malformed) {\n        fail(\`${'${label}'} is missing the replaceable shared-header contract.\`);\n    }\n\n    const output = result.html;\n    const required = [\n        \`data-ccg-static-shell=\\\"${'${STATIC_SHELL_VERSION}'}\\\"\`,\n        'class=\\\"ccg-auth-slot\\\" data-ccg-auth-pending=\\\"true\\\"',\n        'data-ccg-auth-snapshot-bootstrap=\\\"true\\\"',\n        'ccg-socials__icon--yt',\n        'ccg-socials__icon--patreon',\n        'ccg-socials__icon--paypal',\n        'ccg-socials__icon--x',\n        'ccg-socials__icon--fb',\n        'ccg-socials__icon--discord',\n        'src=\\\"/js/ccg-header-auth-loader.js\\\"'\n    ];\n    const missing = required.filter((snippet) => !output.includes(snippet));\n    if (missing.length) {\n        fail(\`${'${label}'} is missing canonical shell requirements: ${'${missing.join(", ")}'}\`);\n    }\n\n    return output;\n}\n\n`;
            generator = generator.replace(helperAnchor, `${helper}${helperAnchor}`);
          }

          const indexOld = 'const indexHtml = renderPublisherIndex(groups);';
          const indexNew = 'const indexHtml = canonicalizePublisherHtml(renderPublisherIndex(groups), "publisher index");';
          if (generator.includes(indexOld)) generator = generator.replace(indexOld, indexNew);
          else if (!generator.includes(indexNew)) throw new Error('Publisher index render anchor not found.');

          const pageOld = 'const html = renderPublisherPage(group, playlists);';
          const pageNew = 'const html = canonicalizePublisherHtml(renderPublisherPage(group, playlists), `publisher ${group.slug}`);';
          if (generator.includes(pageOld)) generator = generator.replace(pageOld, pageNew);
          else if (!generator.includes(pageNew)) throw new Error('Publisher detail render anchor not found.');

          fs.writeFileSync(generatorPath, generator, 'utf8');

          const workflowPath = '.github/workflows/publisher-archives.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const triggerLine = '      - "scripts/generate-publisher-pages.js"';
          if (!workflow.includes('      - "scripts/normalize-public-header-shell.js"')) {
            workflow = workflow.replaceAll(
              triggerLine,
              `${triggerLine}\n      - "scripts/normalize-public-header-shell.js"`
            );
          }

          if (!workflow.includes('Require canonical publisher shell after all materialization')) {
            const stepAnchor = `      - name: Stabilize publisher sitemap eligibility ordering\n        run: node scripts/stabilize-publisher-static-pages.js\n\n`;
            if (!workflow.includes(stepAnchor)) throw new Error('Publisher workflow insertion anchor not found.');
            workflow = workflow.replace(
              stepAnchor,
              `${stepAnchor}      - name: Require canonical publisher shell after all materialization\n        run: node scripts/normalize-public-header-shell.js --root games/publishers --check\n\n`
            );
          }
          fs.writeFileSync(workflowPath, workflow, 'utf8');
          NODE

      - name: Canonicalize all committed publisher pages
        run: |
          node scripts/normalize-public-header-shell.js --root games/publishers
          node scripts/normalize-public-header-shell.js --root games/publishers --check

      - name: Validate repaired source
        run: |
          node --check scripts/generate-publisher-pages.js
          node scripts/normalize-public-header-shell.js --root games/publishers --check
          git diff --check

      - name: Remove temporary repair workflow and commit
        shell: bash
        run: |
          rm .github/workflows/publisher-shell-repair-once.yml
          git add scripts/generate-publisher-pages.js .github/workflows/publisher-archives.yml games/publishers .github/workflows/publisher-shell-repair-once.yml

          if git diff --cached --quiet; then
            echo "No publisher repair changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalize publisher archive shell at source"
          git push origin HEAD:fix/pages-latest-deploy-wins-20260819
