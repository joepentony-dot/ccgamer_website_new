name: "One-time Olli and Lissa thumbnail WebP conversion"

on:
  push:
    branches:
      - ccg/olli-and-lissa-1987-staging
    paths:
      - ".github/workflows/olli-lissa-thumbnail-webp-once.yml"

permissions:
  contents: write

jobs:
  convert-user-supplied-thumbnail:
    if: github.ref == 'refs/heads/ccg/olli-and-lissa-1987-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Convert only the Olli and Lissa thumbnail and update its record
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="resources/images/thumbnails/all/olli-and-lissa.jpg"
          TARGET="resources/images/thumbnails/all/olli-and-lissa.webp"
          test -s "$SOURCE"
          test ! -e "$TARGET"
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          convert "$SOURCE" -quality 80 "$TARGET"
          test -s "$TARGET"
          if command -v identify >/dev/null 2>&1; then
            identify "$TARGET" | grep -E 'WEBP 460x215 '
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = "games/games.json";
          const before = fs.readFileSync(path, "utf8");
          const games = JSON.parse(before);
          const matched = games.filter(g => g.slug === "olli-and-lissa");
          if (games.length !== 666 || matched.length !== 1) {
            throw new Error("Unexpected catalogue state; no changes will be committed.");
          }
          const game = matched[0];
          if (game.thumbnail !== "resources/images/thumbnails/all/olli-and-lissa.jpg" ||
              game.ccg_rating !== 5 ||
              game.videoid !== "iSBLT9C9xh4") {
            throw new Error("Unexpected game data; no changes will be committed.");
          }
          game.thumbnail = "resources/images/thumbnails/all/olli-and-lissa.webp";
          const next = JSON.stringify(games, null, 2) + "\n";
          fs.writeFileSync(path, next);
          NODE
          git add -- "$TARGET" games/games.json
          git diff --cached --check
          git config user.name "ccg-artwork-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimise Olli and Lissa new-game thumbnail as WebP"
          git push origin HEAD:ccg/olli-and-lissa-1987-staging
