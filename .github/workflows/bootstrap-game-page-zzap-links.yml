name: Bootstrap Game Page Zzap Links

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'codex/game-page-zzap-links'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: codex/game-page-zzap-links
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply game-page Zzap integration
        run: |
          node scripts/patch-game-page-zzap-links.js
          node scripts/patch-game-page-zzap-performance.js

      - name: Validate JavaScript syntax
        run: |
          node --check js/load-single-game.js
          node --check admin/js/content-publisher.js
          node --check js/ccg-zzap64-matcher.js

      - name: Run targeted regression tests
        run: |
          node --test tests/content-publisher.test.mjs
          node --test tests/game-zzap-links.test.mjs
          node scripts/audit-zzap64-awards.js
          git diff --check

      - name: Confirm protected files are untouched
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          for protected in index.html home.html resources/css/intro.css js/index-intro.js games/games.json; do
            if printf '%s\n' "$changed" | grep -Fxq "$protected"; then
              echo "Protected file changed: $protected"
              exit 1
            fi
          done

      - name: Commit permanent integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/load-single-game.js admin/content-publisher.html admin/js/content-publisher.js
          if git diff --cached --quiet; then
            echo "Game-page Zzap integration already current."
            exit 0
          fi
          git commit -m "Link verified Zzap reviews from game pages"
          git push origin HEAD:codex/game-page-zzap-links
