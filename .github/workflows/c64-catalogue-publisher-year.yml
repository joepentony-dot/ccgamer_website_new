name: C64 Publisher and Year Catalogue Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/games.json'
      - 'emulator/c64/catalogue-metadata.json'
      - 'emulator/c64/publisher-research-sources.json'
      - 'emulator/c64/index.html'
      - 'resources/css/ccg-c64-emulator.css'
      - 'js/ccg-c64/catalogue-browser.js'
      - 'js/ccg-c64/game-catalog.js'
      - 'js/ccg-c64/app.js'
      - 'js/ccg-c64/coi-bootstrap.js'
      - 'scripts/c64/rebuild-catalogue-metadata.mjs'
      - 'tests/c64-catalogue-publisher-year.mjs'
      - 'tests/c64-publisher-research-provenance.mjs'
      - 'tests/c64-visible-publisher-coverage.mjs'
      - 'docs/ccg-c64-publisher-mame-exact-20261016.json'
      - 'tests/c64-publisher-mame-snapshot.mjs'
      - 'docs/ccg-c64-publisher-visible-20261016.json'
      - 'emulator/c64/media/cartridge-replacements/active.json'
      - 'tests/c64-gamebase-publisher-candidates.test.py'
      - 'scripts/c64/gamebase64-publisher-candidates.py'
      - 'scripts/c64/mame-bulk-publisher-candidates.py'
      - 'tests/c64-mame-bulk-publisher-candidates.test.py'
      - '.github/workflows/c64-catalogue-publisher-year.yml'
  push:
    branches: [main]
    paths:
      - 'games/games.json'
      - 'emulator/c64/catalogue-metadata.json'
      - 'scripts/c64/rebuild-catalogue-metadata.mjs'
      - 'tests/c64-catalogue-publisher-year.mjs'
      - 'tests/c64-publisher-research-provenance.mjs'
      - 'tests/c64-visible-publisher-coverage.mjs'
      - 'docs/ccg-c64-publisher-visible-20261016.json'
      - 'emulator/c64/media/cartridge-replacements/active.json'
      - 'tests/c64-gamebase-publisher-candidates.test.py'
      - 'scripts/c64/gamebase64-publisher-candidates.py'
      - 'scripts/c64/mame-bulk-publisher-candidates.py'
      - 'tests/c64-mame-bulk-publisher-candidates.test.py'
      - '.github/workflows/c64-catalogue-publisher-year.yml'

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check C64 module syntax
        run: |
          node --check js/ccg-c64/catalogue-browser.js
          node --check js/ccg-c64/app.js
          node --check js/ccg-c64/coi-bootstrap.js
          node --check scripts/c64/rebuild-catalogue-metadata.mjs
          node --check tests/c64-visible-publisher-coverage.mjs
      - name: Run C64 catalogue metadata and filter regression tests
        run: |
          node tests/c64-catalogue-publisher-year.mjs
          node tests/c64-publisher-research-provenance.mjs
          node tests/c64-visible-publisher-coverage.mjs
          node tests/c64-publisher-mame-snapshot.mjs
          python3 tests/c64-gamebase-publisher-candidates.test.py
          python3 tests/c64-mame-bulk-publisher-candidates.test.py
