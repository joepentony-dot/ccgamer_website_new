name: "One-time full Olli and Lissa canonical page generation"
on:
  push:
    branches:
      - ccg/olli-and-lissa-1987-staging
    paths:
      - ".github/workflows/olli-lissa-canonical-page-once.yml"
permissions:
  contents: write
jobs:
  generate-scoped-canonical-html:
    if: github.ref == 'refs/heads/ccg/olli-and-lissa-1987-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run existing authoritative canonical page generator
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-seo-game-routes.js --output-root .
          node scripts/generate-sitemaps.js
          node scripts/validate-seo-game-routes.js --root .
          node <<'NODE'
          const fs = require('fs');
          const p = 'games/olli-and-lissa/index.html';
          const html = fs.readFileSync(p,'utf8');
          const expected = [
            'data-ccg-page="single-game"',
            'resources/css/game-pages.css',
            'https://www.cheekycommodoregamer.co.uk/games/olli-and-lissa/',
            'resources/images/thumbnails/all/olli-and-lissa.webp',
            'Olli &amp; Lissa'
          ];
          for(const marker of expected)if(!html.includes(marker))throw new Error('Missing canonical page marker: '+marker);
          if(html.length < 18000)throw new Error('Generated HTML is not the full established game-page shell');
          if(html.includes('http-equiv="refresh"'))throw new Error('Refusing legacy redirect shell');
          console.log('Olli and Lissa canonical full page verified at',html.length,'characters');
          NODE
          git add -- games/olli-and-lissa/index.html games/olli-and-lissa.html sitemap-games.xml
          git diff --cached --check
          git config user.name "ccg-game-page-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish full Olli and Lissa canonical page using shared SEO template"
          git push origin HEAD:ccg/olli-and-lissa-1987-staging
