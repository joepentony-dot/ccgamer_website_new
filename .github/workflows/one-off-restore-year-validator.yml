name: One-off restore year validator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'codex/seo/materialize-retro-video-outputs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore protected validator details
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-year-platform-discovery.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'problems.push(`Game route /games/${game.slug}/ is not its own canonical game route`);',
              'problems.push(`Game route /games/${game.slug}/ is not its own canonical route`);'
          )

          platform_guard = '    if (platforms.length !== 2) problems.push(`Expected two platform routes, found ${platforms.length}`);\n'
          game_guard = '    if (archiveData.games.length < 651) problems.push(`Game total fell below the protected Phase 6A baseline: ${archiveData.games.length}`);\n'
          if game_guard not in text:
              if platform_guard not in text:
                  raise SystemExit('Could not locate platform validation guard')
              text = text.replace(platform_guard, platform_guard + game_guard, 1)

          text = text.replace('        }, problems);\n\n        compareExactList(actualSlugs, expectedSlugs, `${pageLabel} game links`, problems);',
                              '        }, problems);\n        compareExactList(actualSlugs, expectedSlugs, `${pageLabel} game links`, problems);')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-year-platform-discovery.js
          git diff --cached --quiet || git commit -m "Restore Phase 4D validator safeguards"
          git push origin HEAD:${{ github.head_ref }}
