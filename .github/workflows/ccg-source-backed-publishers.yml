name: CCG Source-Backed Publishers

on:
  pull_request:
    paths:
      - "data/publisher-histories.json"
      - "js/ccg-publisher-history.js"
      - "resources/css/publisher-history.css"
      - "scripts/audit-source-backed-publishers.js"
      - "docs/phase-18-source-backed-publisher-histories.md"
      - ".github/workflows/ccg-source-backed-publishers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-backed-publishers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript and JSON syntax
        run: |
          node --check js/ccg-publisher-history.js
          node --check scripts/audit-source-backed-publishers.js
          node -e "JSON.parse(require('fs').readFileSync('data/publisher-histories.json', 'utf8'))"

      - name: Run publisher evidence audit
        run: node scripts/audit-source-backed-publishers.js

      - name: Confirm audit made no repository changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
