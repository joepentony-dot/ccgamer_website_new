name: Temporary Publisher Layout Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure first-frame layout contributors
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('scripts/audit-header-frame-local.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const CONTENT_TOP_TOLERANCE = 1;', 'const CONTENT_TOP_TOLERANCE = 1000;')
          text = text.replace('const PANEL_RANGE_TOLERANCE = 40;', 'const PANEL_RANGE_TOLERANCE = 1000;')
          old = '''      const contentRect = contentAnchor ? contentAnchor.getBoundingClientRect() : null;\n      window.__ccgHeaderFrames.push({'''
          new = '''      const contentRect = contentAnchor ? contentAnchor.getBoundingClientRect() : null;\n      const headerRect = document.querySelector('[data-ccg-header]')?.getBoundingClientRect() || null;\n      const modeRect = document.querySelector('.ccg-mode-identity')?.getBoundingClientRect() || null;\n      const commandRect = main?.querySelector(':scope > .ccg-home-search-command')?.getBoundingClientRect() || null;\n      const mainRect = main?.getBoundingClientRect() || null;\n      window.__ccgHeaderFrames.push({'''
          if old not in text:
              raise SystemExit('Sampler anchor missing')
          text = text.replace(old, new, 1)
          old = '''        searchCommandPresent: Boolean(main?.querySelector(':scope > .ccg-home-search-command'))\n      });'''
          new = '''        searchCommandPresent: Boolean(main?.querySelector(':scope > .ccg-home-search-command')),\n        headerHeight: headerRect ? Math.round(headerRect.height * 10) / 10 : 0,\n        modeHeight: modeRect ? Math.round(modeRect.height * 10) / 10 : 0,\n        commandHeight: commandRect ? Math.round(commandRect.height * 10) / 10 : 0,\n        mainTop: mainRect ? Math.round(mainRect.top * 10) / 10 : null\n      });'''
          if old not in text:
              raise SystemExit('Sample field anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('const pages = ["/home.html", "/games/publishers/", "/music/", "/about.html", "/contact.html", "/games/discover/", "/zzap64/", "/install-app.html"];', 'const pages = ["/games/publishers/", "/music/"];')
          p.write_text(text, encoding='utf-8')
          subprocess.run(['node','--check',str(p)], check=True)
          subprocess.run(['node',str(p)], check=True)
