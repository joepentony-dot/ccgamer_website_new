name: Phase 7E Affiliate Image Optimisation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase-7e-affiliate-image-optimisation.yml"
      - "scripts/apply-phase7e-affiliate-image-optimisation.py"
      - "resources/images/affiliate/a500-mini.png"
      - "resources/images/affiliate/c64-maxi.png"
      - "resources/images/affiliate/joystick-clear.png"
      - "resources/images/affiliate/gamepad-white.png"
      - "resources/images/affiliate/gamepad-black.png"
      - "docs/seo-baseline/phase-7e-affiliate-image-optimisation.md"
      - "docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json"

permissions:
  contents: write

concurrency:
  group: phase-7e-affiliate-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  optimise-affiliate-images:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 7E correction branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Fetch main baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate optimiser source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-phase7e-affiliate-image-optimisation.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Phase 7E affiliate image optimiser compiles.")
          PY

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            js/affiliate-products.js \
            resources/data/affiliate-products.json \
            resources/css/games.css \
            > "$RUNNER_TEMP/phase7e-affiliate-protected.sha256"

      - name: Record all non-target raster hashes
        env:
          MANIFEST_PATH: ${{ runner.temp }}/phase7e-affiliate-other-images-before.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          targets = {
              "resources/images/affiliate/a500-mini.png",
              "resources/images/affiliate/c64-maxi.png",
              "resources/images/affiliate/joystick-clear.png",
              "resources/images/affiliate/gamepad-white.png",
              "resources/images/affiliate/gamepad-black.png",
          }
          extensions = {".png", ".jpg", ".jpeg", ".webp"}
          manifest = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative in targets or relative.startswith(".git/"):
                  continue
              manifest[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path(os.environ["MANIFEST_PATH"]).write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Recorded {len(manifest)} non-target raster image hashes.")
          PY

      - name: Optimise five affiliate PNGs
        run: |
          python scripts/apply-phase7e-affiliate-image-optimisation.py apply \
            --report docs/seo-baseline/phase-7e-affiliate-image-optimisation.md \
            --evidence docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json \
            --artifact-dir "$RUNNER_TEMP/phase7e-affiliate-image-artifacts"

      - name: Validate corrected images and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          evidence = json.loads(
              Path("docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          if evidence.get("phase") != "7E" or evidence.get("correction") != "affiliate-image-optimisation":
              raise SystemExit("Invalid Phase 7E affiliate evidence identity")
          summary = evidence.get("summary", {})
          if int(summary.get("files", 0)) != 5:
              raise SystemExit("Phase 7E affiliate evidence does not contain five files")
          if float(summary.get("reduction_percent", 0)) < 45:
              raise SystemExit("Affiliate image reduction did not reach 45%")
          for item in evidence.get("images", []):
              before = item["before"]
              after = item["after"]
              if max(int(after["width"]), int(after["height"])) > 800:
                  raise SystemExit(f"Corrected image remains over 800px: {item['path']}")
              if int(after["bytes"]) >= int(before["bytes"]):
                  raise SystemExit(f"Corrected image did not reduce: {item['path']}")
              if before.get("has_transparency") and not after.get("has_transparency"):
                  raise SystemExit(f"Transparency was lost: {item['path']}")
              with Image.open(item["path"]) as image:
                  image.load()
                  if image.format != "PNG":
                      raise SystemExit(f"Image format changed: {item['path']}")
          print(json.dumps(summary, indent=2))
          PY
          git diff --check

      - name: Confirm all non-target raster images are unchanged
        env:
          BEFORE_MANIFEST: ${{ runner.temp }}/phase7e-affiliate-other-images-before.json
          AFTER_MANIFEST: ${{ runner.temp }}/phase7e-affiliate-other-images-after.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          targets = {
              "resources/images/affiliate/a500-mini.png",
              "resources/images/affiliate/c64-maxi.png",
              "resources/images/affiliate/joystick-clear.png",
              "resources/images/affiliate/gamepad-white.png",
              "resources/images/affiliate/gamepad-black.png",
          }
          extensions = {".png", ".jpg", ".jpeg", ".webp"}
          manifest = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              relative = path.relative_to(root).as_posix()
              if relative in targets or relative.startswith(".git/"):
                  continue
              manifest[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          after_path = Path(os.environ["AFTER_MANIFEST"])
          after_path.write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          before = Path(os.environ["BEFORE_MANIFEST"]).read_text(encoding="utf-8")
          after = after_path.read_text(encoding="utf-8")
          if before != after:
              raise SystemExit("A non-target raster image changed during Phase 7E affiliate correction")
          print(f"Validated {len(manifest)} unchanged non-target raster images.")
          PY

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/phase7e-affiliate-protected.sha256"

      - name: Confirm exact correction scope
        run: |
          python - <<'PY'
          import subprocess

          targets = {
              "resources/images/affiliate/a500-mini.png",
              "resources/images/affiliate/c64-maxi.png",
              "resources/images/affiliate/joystick-clear.png",
              "resources/images/affiliate/gamepad-white.png",
              "resources/images/affiliate/gamepad-black.png",
          }
          allowed = {
              ".github/workflows/phase-7e-affiliate-image-optimisation.yml",
              "scripts/apply-phase7e-affiliate-image-optimisation.py",
              "docs/seo-baseline/phase-7e-affiliate-image-optimisation.md",
              "docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json",
              *targets,
          }
          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted({*tracked, *untracked})
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit(f"Unexpected Phase 7E affiliate paths: {unexpected}")
          missing_targets = sorted(targets.difference(changed))
          if missing_targets:
              raise SystemExit(f"Affiliate targets were not changed: {missing_targets}")
          print(f"Validated exact Phase 7E affiliate scope ({len(changed)} files).")
          PY

      - name: Upload visual comparisons and evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-7e-affiliate-image-optimisation
          path: |
            ${{ runner.temp }}/phase7e-affiliate-image-artifacts/
            docs/seo-baseline/phase-7e-affiliate-image-optimisation.md
            docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit bounded correction to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            resources/images/affiliate/a500-mini.png \
            resources/images/affiliate/c64-maxi.png \
            resources/images/affiliate/joystick-clear.png \
            resources/images/affiliate/gamepad-white.png \
            resources/images/affiliate/gamepad-black.png \
            docs/seo-baseline/phase-7e-affiliate-image-optimisation.md \
            docs/seo-baseline/phase-7e-affiliate-image-optimisation-evidence.json
          if git diff --cached --quiet; then
            echo "No generated affiliate correction changes to commit."
            exit 0
          fi
          git commit -m "Optimise Phase 7E affiliate images [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Publish correction summary
        run: cat docs/seo-baseline/phase-7e-affiliate-image-optimisation.md >> "$GITHUB_STEP_SUMMARY"
