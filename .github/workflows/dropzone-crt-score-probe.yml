name: Dropzone CRT Score Forensics (Read-only)

on:
  pull_request:
    paths:
      - "scripts/high-score-arena/probe-dropzone-crt.mjs"
      - ".github/workflows/dropzone-crt-score-probe.yml"
      - "emulator/c64/media/cartridge-replacements/active.json"
      - "emulator/c64/media/cartridge-replacements/dropzone.crt"
      - "js/ccg-c64/core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-dropzone-crt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture real Dropzone cartridge HUD and RAM
        run: |
          set -euo pipefail
          node --check scripts/high-score-arena/probe-dropzone-crt.mjs
          node scripts/high-score-arena/probe-dropzone-crt.mjs --output-dir "$RUNNER_TEMP/dropzone-crt"
      - name: Retain real game memory and image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropzone-crt-forensic-frames
          path: ${{ runner.temp }}/dropzone-crt/
          if-no-files-found: warn
          retention-days: 7
