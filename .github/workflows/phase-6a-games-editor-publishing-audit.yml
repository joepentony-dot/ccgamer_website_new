name: Phase 6A Games Editor Publishing Audit

# Historical read-only audit retained for deliberate manual verification.
# Phase 6B is the current catalogue-growth and editor-publishing gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6a-games-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        shell: bash
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/phase6a-protected.sha256"

      - name: Validate audit tooling
        run: python -m py_compile scripts/phase6a_games_editor_publishing_audit.py

      - name: Run disposable synthetic-game audit
        run: |
          python scripts/phase6a_games_editor_publishing_audit.py \
            --json-output "$RUNNER_TEMP/phase-6a-games-editor-evidence.json" \
            --report-output "$RUNNER_TEMP/phase-6a-games-editor-report.md"

      - name: Verify audit evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          evidence = json.loads((temp / "phase-6a-games-editor-evidence.json").read_text())
          real_games = json.loads(Path("games/games.json").read_text())
          required = {
              "baseline_game_count",
              "source_inspection",
              "existing_package_test",
              "sandbox",
              "blockers",
              "verdict",
              "protected_hashes_unchanged",
          }
          missing = sorted(required.difference(evidence))
          if missing:
              raise SystemExit(f"Missing Phase 6A evidence keys: {missing}")
          if evidence["baseline_game_count"] != len(real_games):
              raise SystemExit("Phase 6A baseline count does not match the real games database.")
          if evidence["sandbox"]["synthetic_game_count"] != len(real_games) + 1:
              raise SystemExit("Disposable sandbox did not contain exactly one synthetic game.")
          if not evidence["protected_hashes_unchanged"]:
              raise SystemExit("Protected hashes were not preserved.")
          if evidence["verdict"] not in {"ready", "not ready"}:
              raise SystemExit("Unexpected Phase 6A verdict.")
          if "phase6a-synthetic-game" in Path("games/games.json").read_text():
              raise SystemExit("Synthetic game leaked into the real database.")
          print(json.dumps({
              "verdict": evidence["verdict"],
              "blockers": len(evidence["blockers"]),
              "output_checks": evidence["sandbox"]["output_validation"]["checks"],
          }, indent=2))
          PY

      - name: Upload detailed Phase 6A evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-6a-games-editor-publishing-evidence
          path: |
            ${{ runner.temp }}/phase-6a-games-editor-evidence.json
            ${{ runner.temp }}/phase-6a-games-editor-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Remove Python cache
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/phase6a-protected.sha256"

      - name: Confirm audit is read only
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
