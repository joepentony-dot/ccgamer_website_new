name: CCG Arena HelioHost transport contract

on:
  pull_request:
    paths:
      - "js/ccg-c64/arena/client/heliohost-attempt.mjs"
      - "js/ccg-c64/arena/client/heliohost-member-session.mjs"
      - "js/ccg-c64/arena/client/heliohost-board.mjs"
      - "js/ccg-c64/arena/client/auto-run-controller.mjs"
      - "js/ccg-c64/arena-preview.js"
      - "js/ccg-c64/arena/read-sierra-crossfire-screen-score.mjs"
      - "js/ccg-c64/arena/observe-sierra-crossfire-run.mjs"
      - "js/ccg-c64/arena/sierra-one-click-launch.mjs"
      - "tests/high-score-arena-sierra-one-click.test.mjs"
      - "tests/high-score-arena-sierra-local-run.test.mjs"
      - "tests/fixtures/sierra-crossfire-local-run-histories.json"
      - "js/ccg-c64/app.js"
      - "service-worker.js"
      - "tests/high-score-arena-heliohost-transport.test.mjs"
      - "tests/high-score-arena-heliohost-board.test.mjs"
      - "tests/high-score-arena-heliohost-member-session.test.mjs"
      - "tests/high-score-arena-auto-run-controller.test.mjs"
      - "tests/high-score-arena-board-model.test.mjs"
      - "tests/high-score-arena-preview-integration.test.mjs"
      - "tests/high-score-arena-auto-mount.test.mjs"
      - ".github/workflows/high-score-arena-heliohost-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-and-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify disabled-by-default PHP/MariaDB transport and existing neon board
        run: |
          node --check js/ccg-c64/arena/client/heliohost-attempt.mjs
          node --check js/ccg-c64/arena/client/heliohost-member-session.mjs
          node --check js/ccg-c64/arena/client/heliohost-board.mjs
          node --check js/ccg-c64/arena/client/auto-run-controller.mjs
          node --check js/ccg-c64/arena-preview.js
          node --check js/ccg-c64/arena/read-sierra-crossfire-screen-score.mjs
          node --check js/ccg-c64/arena/observe-sierra-crossfire-run.mjs
          node --check js/ccg-c64/arena/sierra-one-click-launch.mjs
          node --test tests/high-score-arena-sierra-local-run.test.mjs
          node --test tests/high-score-arena-sierra-one-click.test.mjs
          node --test tests/high-score-arena-heliohost-transport.test.mjs
          node --test tests/high-score-arena-heliohost-board.test.mjs
          node --test tests/high-score-arena-heliohost-member-session.test.mjs
          node --test tests/high-score-arena-auto-run-controller.test.mjs
          node --test tests/high-score-arena-board-model.test.mjs
          node --test tests/high-score-arena-preview-integration.test.mjs
          node tests/high-score-arena-auto-mount.test.mjs
      - name: Ensure no Supabase score route is reintroduced
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ei 'supabase|service_role|anon_key|auth.users' js/ccg-c64/arena/client/heliohost-attempt.mjs js/ccg-c64/arena/client/heliohost-board.mjs js/ccg-c64/arena/client/auto-run-controller.mjs js/ccg-c64/arena/client/heliohost-member-session.mjs; then
            echo "High Score Arena must use independent HelioHost PHP backend"; exit 1
          fi
