name: Consolidate Argus Press Software 2026-08-04

on:
  push:
    branches:
      - fix/consolidate-argus-press-software-20260804
    paths:
      - ".github/workflows/consolidate-argus-press-software-20260804.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/consolidate-argus-press-software-20260804
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record protected file hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum index.html home.html resources/css/intro.css js/index-intro.js > "$RUNNER_TEMP/protected.sha256"

      - name: Install verified PNG and consolidate publisher data
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode .ccg-tmp/argus-press-software.png.b64 \
            > resources/images/publishers/argus-press-software.png

          python <<'PY'
          from pathlib import Path
          import struct

          path = Path("resources/images/publishers/argus-press-software.png")
          data = path.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Argus Press Software asset is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (600, 240):
              raise SystemExit(f"Unexpected logo dimensions: {width}x{height}")
          print(f"Validated Argus Press Software PNG: {width}x{height}")
          PY

          rm -f \
            resources/images/publishers/argus-press.webp \
            resources/images/publishers/argus-press.png \
            resources/images/publishers/argus-press.svg \
            resources/images/publishers/argus-press.jpg \
            resources/images/publishers/argus-press.jpeg \
            resources/images/publishers/argus-press-software.webp \
            resources/images/publishers/argus-press-software.svg \
            resources/images/publishers/argus-press-software.jpg \
            resources/images/publishers/argus-press-software.jpeg

          node <<'NODE'
          const fs = require("fs");
          const path = "games/games.json";
          const games = JSON.parse(fs.readFileSync(path, "utf8"));

          const exactOldName = "Argus Press";
          const finalName = "Argus Press Software";

          function normalizePublishers(game) {
            game.credits ||= {};
            const value = game.credits.publisher;
            const names = Array.isArray(value) ? value : value ? [value] : [];
            const replaced = names
              .map((name) => String(name).trim())
              .filter(Boolean)
              .map((name) => name === exactOldName ? finalName : name);
            game.credits.publisher = [...new Set(replaced)];
          }

          for (const game of games) {
            if (game.credits) normalizePublishers(game);
          }

          const up = games.find((game) => game.slug === "up-up-and-away");
          if (!up) throw new Error("Missing game: up-up-and-away");
          normalizePublishers(up);
          up.credits.publisher = up.credits.publisher
            .filter((name) => name !== exactOldName);
          if (!up.credits.publisher.includes(finalName)) {
            up.credits.publisher.push(finalName);
          }

          if (typeof up.description === "string") {
            up.description = up.description.replace(
              /Argus Press(?! Software)/g,
              finalName
            );
          }

          const leftovers = [];
          for (const game of games) {
            const names = Array.isArray(game?.credits?.publisher)
              ? game.credits.publisher
              : game?.credits?.publisher
                ? [game.credits.publisher]
                : [];
            if (names.includes(exactOldName)) {
              leftovers.push(game.slug);
            }
          }
          if (leftovers.length) {
            throw new Error(`Argus Press publisher labels remain: ${leftovers.join(", ")}`);
          }

          if (!up.credits.publisher.includes(finalName)) {
            throw new Error("Up Up and Away is not assigned to Argus Press Software");
          }

          fs.writeFileSync(path, `${JSON.stringify(games, null, 2)}\n`);
          NODE

      - name: Rebuild affected website output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-games.js
          node scripts/generate-publisher-pages.js
          node scripts/apply-publisher-logos.js
          rm -rf games/publishers/argus-press
          node scripts/generate-sitemaps.js
          node scripts/validate-publisher-logo-output.js
          node scripts/validate-sitemaps.js
          rm -f seo-audit-report.md

      - name: Verify final consolidation
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/images/publishers/argus-press-software.png
          test ! -e resources/images/publishers/argus-press-software.webp
          test ! -e resources/images/publishers/argus-press.webp
          test ! -e resources/images/publishers/argus-press.png
          test ! -e games/publishers/argus-press

          grep -q '/resources/images/publishers/argus-press-software.png' games/publishers/index.html
          grep -q '/resources/images/publishers/argus-press-software.png' games/publishers/argus-press-software/index.html
          grep -q 'Argus Press Software' games/up-up-and-away/index.html

          if grep -q 'href="/games/publishers/argus-press/"' games/publishers/index.html; then
            echo "Obsolete Argus Press card remains"
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");
          const games = JSON.parse(fs.readFileSync("games/games.json", "utf8"));
          const up = games.find((game) => game.slug === "up-up-and-away");
          if (!up) throw new Error("Missing Up Up and Away");
          const publishers = Array.isArray(up?.credits?.publisher)
            ? up.credits.publisher
            : [up?.credits?.publisher].filter(Boolean);
          if (!publishers.includes("Argus Press Software")) {
            throw new Error("Up Up and Away publisher correction failed");
          }
          if (publishers.includes("Argus Press")) {
            throw new Error("Obsolete Argus Press label remains on Up Up and Away");
          }
          for (const game of games) {
            const names = Array.isArray(game?.credits?.publisher)
              ? game.credits.publisher
              : [game?.credits?.publisher].filter(Boolean);
            if (names.includes("Argus Press")) {
              throw new Error(`Obsolete Argus Press label remains on ${game.slug}`);
            }
          }
          NODE

          sha256sum --check "$RUNNER_TEMP/protected.sha256"
          git diff --check

      - name: Remove temporary correction files
        shell: bash
        run: |
          rm -rf .ccg-tmp
          rm -f .github/workflows/consolidate-argus-press-software-20260804.yml

      - name: Commit clean correction branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No correction changes were produced."
            exit 1
          fi
          git commit -m "Consolidate Argus Press under Argus Press Software"
          git push origin HEAD:fix/consolidate-argus-press-software-20260804
