name: CCG Cloudflare Audio Admin Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ccg-cloudflare-audio-migration.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ccg-cloudflare-audio-admin-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out required files
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /admin/archive-quality.html
            /admin/js/archive-quality.js
            /admin/content-publisher.html
            /admin/js/content-publisher.js
            /admin/games-editor.html
            /admin/js/games-editor.js
            /admin/GAMES_EDITOR.md
            /games/games.json
            /.github/workflows/games-publishing.yml
            /.github/workflows/ccg-cloudflare-audio-migration.yml
            /js/ccg-music-config.js
            /scripts/validate-games-source.js
            /tests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Remove obsolete local-audio assumptions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/migrate-cloudflare-audio.cjs" <<'NODE'
          const fs = require('fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content, 'utf8');
          }

          function replaceOnce(path, pattern, replacement, label) {
            const source = read(path);
            const matches = source.match(new RegExp(pattern.source, pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g')) || [];
            if (matches.length !== 1) {
              throw new Error(path + ': expected one ' + label + ' match, found ' + matches.length);
            }
            write(path, source.replace(pattern, replacement));
          }

          // Unified Content Publisher: game music is slug-derived from Cloudflare R2.
          replaceOnce(
            'admin/content-publisher.html',
            /\s*<label>Game music files\s*<textarea rows="3" data-game-field="music" placeholder="filename\.mp3, second-file\.mp3"><\/textarea>\s*<\/label>/,
            '',
            'obsolete Game music files field'
          );
          replaceOnce(
            'admin/content-publisher.html',
            /<script type="module" src="\/admin\/js\/content-publisher\.js"><\/script>/,
            '<script type="module" src="/admin/js/content-publisher.js?v=cloudflare-audio-20260812"></script>',
            'Content Publisher script tag'
          );
          replaceOnce(
            'admin/js/content-publisher.js',
            /\n\s*const music = parseCommaList\(gameValue\('music'\)\);\s*\n\s*if \(music\.length\) entry\.music = music;/,
            '',
            'Content Publisher legacy music writer'
          );

          // Legacy Game Builder: remove repository MP3 filename handling.
          replaceOnce(
            'admin/games-editor.html',
            /\s*<label class="full">Music Files \(optional\)<input data-field="music" placeholder="arkanoid-theme\.mp3, arkanoid-level\.mp3" \/><\/label>\s*<p class="hint full">Files must exist in: <code>resources\/audio\/games\/<\/code>\. Separate multiple files with commas\.<\/p>/,
            '',
            'legacy Game Builder music field'
          );
          replaceOnce(
            'admin/games-editor.html',
            /\s*<p class="hint" data-preview-music-status><\/p>/,
            '',
            'legacy music preview status'
          );
          replaceOnce('admin/js/games-editor.js', /\n\s*music: '',/, '', 'EMPTY_DRAFT music field');
          replaceOnce('admin/js/games-editor.js', /\n\s*musicCheck: 'idle',/, '', 'legacy music check state');
          replaceOnce(
            'admin/js/games-editor.js',
            /\n\s*previewMusicStatus: document\.querySelector\('\[data-preview-music-status\]'\),/,
            '',
            'legacy music preview element'
          );
          replaceOnce(
            'admin/js/games-editor.js',
            /\n\s*music: parseCommaList\(state\.draft\.music\),/,
            '',
            'legacy gameEntry music property'
          );
          replaceOnce(
            'admin/js/games-editor.js',
            /\n\s*if \(!Array\.isArray\(gameEntry\.music\) \|\| gameEntry\.music\.length === 0\) \{\s*delete gameEntry\.music;\s*\}\s*/,
            '\n',
            'legacy empty music cleanup block'
          );
          replaceOnce(
            'admin/js/games-editor.js',
            /return \[\.\.\.toList\(game\.composer\), \.\.\.toList\(game\?\.credits\?\.musician\), \.\.\.toList\(game\.music\)\]/,
            'return [...toList(game.composer), ...toList(game?.credits?.musician)]',
            'legacy composer music fallback'
          );
          replaceOnce(
            'admin/js/games-editor.js',
            /composer: normalizeComposerList\(game\),\s*music: Array\.isArray\(game\.music\) \? game\.music : \(game\.music \? \[game\.music\] : \[\]\)/,
            'composer: normalizeComposerList(game)',
            'legacy games-search music output'
          );
          replaceOnce(
            'admin/js/games-editor.js',
            /\n\s*if \(el\.previewMusicStatus\) \{\s*el\.previewMusicStatus\.textContent = slug \? `Auto-detect on page: \/resources\/audio\/games\/\$\{slug\}\.mp3` : 'Music auto-detection requires a slug\.';\s*\}/,
            '',
            'legacy local music preview message'
          );

          // Archive Quality: local resource checks must never reinterpret game music as repository files.
          replaceOnce(
            'admin/js/archive-quality.js',
            /const RESOURCE_CONCURRENCY = 8;/,
            "const RESOURCE_CONCURRENCY = 8;\nconst CLOUDFLARE_MUSIC_CONCURRENCY = 16;\nconst CLOUDFLARE_MUSIC_TIMEOUT_MS = 2200;\nconst CLOUDFLARE_MUSIC_BASE_URL = 'https://pub-2f6ac7261f6347f59524930d84e71a92.r2.dev/';",
            'archive resource constants'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /resourcesChecked: 0,\s*running: false,\s*lastCheckedAt: null/,
            "resourcesChecked: 0,\n  cloudflareMusicChecked: 0,\n  cloudflareMusicFound: 0,\n  cloudflareMusicRunning: false,\n  running: false,\n  lastCheckedAt: null",
            'archive state counters'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /function musicPath\(value\) \{[\s\S]*?\n\}\n\n(?=function buildResourceTasks)/,
            '',
            'obsolete musicPath helper'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /\n\s*asArray\(game\?\.music\)\.map\(musicPath\)\.filter\(Boolean\)\.forEach\(\(url\) => \{[\s\S]*?\n\s*\}\);\n/,
            '\n',
            'obsolete Local audio resource tasks'
          );

          const cloudflareFunctions = String.raw`
          function cloudflareMusicUrl(slug) {
            const normalized = text(slug).replace(/\.mp3$/i, '').replace(/^\/+|\/+$/g, '');
            if (!normalized) return '';
            return CLOUDFLARE_MUSIC_BASE_URL + encodeURIComponent(normalized).replace(/%2F/gi, '/') + '.mp3';
          }

          function probeCloudflareMusic(url) {
            return new Promise((resolve) => {
              const audio = new Audio();
              audio.preload = 'metadata';
              audio.src = url;

              let settled = false;
              let timeoutId = null;

              const cleanup = () => {
                audio.removeEventListener('loadedmetadata', onReady);
                audio.removeEventListener('error', onError);
                if (timeoutId) window.clearTimeout(timeoutId);
                audio.removeAttribute('src');
                try { audio.load(); } catch (_error) {}
              };

              const finish = (ok) => {
                if (settled) return;
                settled = true;
                cleanup();
                resolve(ok);
              };

              const onReady = () => finish(true);
              const onError = () => finish(false);

              audio.addEventListener('loadedmetadata', onReady, { once: true });
              audio.addEventListener('error', onError, { once: true });
              timeoutId = window.setTimeout(() => finish(false), CLOUDFLARE_MUSIC_TIMEOUT_MS);

              try { audio.load(); } catch (_error) { finish(false); }
            });
          }

          async function runCloudflareMusicAudit() {
            if (state.cloudflareMusicRunning) return;
            if (state.running) {
              setStatus('Finish the local archive audit before starting the Cloudflare music check.', 'info');
              return;
            }

            state.cloudflareMusicRunning = true;
            const button = document.getElementById('archiveQualityRunMusic');
            if (button) {
              button.disabled = true;
              button.textContent = 'Checking music…';
            }

            try {
              if (!state.games.length) await loadCatalogue();

              const tasks = state.games
                .map((game) => ({ game, slug: text(game?.slug) }))
                .filter((task) => task.slug);

              state.cloudflareMusicChecked = 0;
              state.cloudflareMusicFound = 0;
              renderSummary();
              setStatus('Checking Cloudflare-hosted game music by canonical slug…', 'info');
              setProgress(0, tasks.length, 'Checking Cloudflare music for ' + tasks.length + ' game slugs…');

              let cursor = 0;
              async function worker() {
                while (cursor < tasks.length) {
                  const taskIndex = cursor;
                  cursor += 1;
                  const task = tasks[taskIndex];
                  const url = cloudflareMusicUrl(task.slug);
                  const playable = url ? await probeCloudflareMusic(url) : false;
                  state.cloudflareMusicChecked += 1;
                  if (playable) state.cloudflareMusicFound += 1;

                  if (state.cloudflareMusicChecked === tasks.length || state.cloudflareMusicChecked % 10 === 0) {
                    renderSummary();
                    setProgress(
                      state.cloudflareMusicChecked,
                      tasks.length,
                      'Checked ' + state.cloudflareMusicChecked + ' of ' + tasks.length + ' Cloudflare music URLs · ' + state.cloudflareMusicFound + ' playable'
                    );
                  }
                }
              }

              await Promise.all(Array.from(
                { length: Math.min(CLOUDFLARE_MUSIC_CONCURRENCY, tasks.length || 1) },
                worker
              ));

              renderSummary();
              if (state.cloudflareMusicFound > 0) {
                setStatus(
                  'Cloudflare music check complete: ' + state.cloudflareMusicFound + ' playable tracks found across ' + state.cloudflareMusicChecked + ' game slugs. Missing tracks are not archive warnings.',
                  'success'
                );
              } else {
                setStatus(
                  'Cloudflare music check completed across ' + state.cloudflareMusicChecked + ' game slugs, but this browser could not confirm a playable track. No per-game warnings were created.',
                  'warning'
                );
              }
            } catch (error) {
              console.error('[archive-quality] Cloudflare music audit failed', error);
              setStatus(error?.message || 'The Cloudflare music check could not be completed.', 'error');
            } finally {
              state.cloudflareMusicRunning = false;
              hideProgress();
              if (button) {
                button.disabled = false;
                button.textContent = 'Check Cloudflare music';
              }
            }
          }
          `;

          replaceOnce(
            'admin/js/archive-quality.js',
            /(?=function formatBytes\(bytes\))/, 
            cloudflareFunctions + '\n',
            'Cloudflare audit insertion point'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /document\.getElementById\('archiveQualityResourceCount'\)\.textContent = String\(state\.resourcesChecked\);/,
            "document.getElementById('archiveQualityResourceCount').textContent = String(state.resourcesChecked);\n  const musicCount = document.getElementById('archiveQualityCloudflareMusicCount');\n  if (musicCount) musicCount.textContent = state.cloudflareMusicFound + '/' + state.cloudflareMusicChecked;",
            'archive summary counters'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /Quick audit complete: \$\{state\.games\.length\} games inspected\. Run the full audit to verify local files and canonical pages\./,
            'Quick audit complete: ${state.games.length} games inspected. Run the full audit to verify local resources and canonical pages.',
            'quick audit status copy'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /Checking live local files and canonical pages…/,
            'Checking live local resources and canonical pages…',
            'full audit status copy'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /Full audit complete: \$\{critical\} critical, \$\{warnings\} warning and \$\{state\.resourcesChecked\} local file checks\./,
            'Full audit complete: ${critical} critical, ${warnings} warning and ${state.resourcesChecked} local resource checks.',
            'full audit completion copy'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /local_resources_checked: state\.resourcesChecked,\s*filters_applied: true,/,
            "local_resources_checked: state.resourcesChecked,\n    cloudflare_music_checked: state.cloudflareMusicChecked,\n    cloudflare_music_found: state.cloudflareMusicFound,\n    filters_applied: true,",
            'archive JSON export counters'
          );
          replaceOnce(
            'admin/js/archive-quality.js',
            /document\.getElementById\('archiveQualityRun'\)\?\.addEventListener\('click', \(\) => \{ void runFullAudit\(\); \}\);/,
            "document.getElementById('archiveQualityRun')?.addEventListener('click', () => { void runFullAudit(); });\n  document.getElementById('archiveQualityRunMusic')?.addEventListener('click', () => { void runCloudflareMusicAudit(); });",
            'archive control binding'
          );

          // Archive Quality presentation.
          replaceOnce(
            'admin/archive-quality.html',
            /Examines the live game catalogue for missing required information, malformed values, duplicate records and absent or oversized local files\. It reports findings only and never edits the game database\./,
            'Examines the live game catalogue for missing required information, malformed values, duplicate records and absent or oversized local resources. Cloudflare-hosted game music can be checked separately by canonical slug. It reports findings only and never edits the game database.',
            'Archive Quality introduction'
          );
          replaceOnce(
            'admin/archive-quality.html',
            /<button class="ccg-btn ccg-btn--primary" type="button" id="archiveQualityRun">Run full audit<\/button>/,
            '<button class="ccg-btn ccg-btn--primary" type="button" id="archiveQualityRun">Run full audit</button>\n        <button class="ccg-btn ccg-btn--ghost" type="button" id="archiveQualityRunMusic">Check Cloudflare music</button>',
            'Archive Quality action button'
          );
          replaceOnce(
            'admin/archive-quality.html',
            /<strong id="archiveQualityResourceCount">0<\/strong>\s*<span>Local files checked<\/span>\s*<\/article>/,
            '<strong id="archiveQualityResourceCount">0</strong>\n        <span>Local resources checked</span>\n      </article>\n      <article class="archive-quality__summary-card">\n        <strong id="archiveQualityCloudflareMusicCount">0/0</strong>\n        <span>Cloudflare tracks found</span>\n      </article>',
            'Archive Quality summary card'
          );
          replaceOnce(
            'admin/archive-quality.html',
            /Preparing file checks…/,
            'Preparing resource checks…',
            'Archive Quality progress copy'
          );
          replaceOnce(
            'admin/archive-quality.html',
            /The full audit checks required catalogue fields, duplicate identifiers, local thumbnail, audio, optional 3D-box and canonical page files, plus local image file size\. External Google Drive, Lemon64 and YouTube availability cannot be proved reliably from a browser without a server-side service, so this report validates their format and supplies direct review links rather than labelling an unreachable third-party request as broken\./,
            'The full audit checks required catalogue fields, duplicate identifiers, local thumbnails, optional 3D-box images, local linked files and canonical pages, plus local image file size. Game music is hosted on Cloudflare R2 and is not treated as a local repository file. Use “Check Cloudflare music” to probe <code>&lt;slug&gt;.mp3</code> with browser audio metadata; missing tracks are counted as unavailable rather than raised as archive warnings because not every game must have a hosted track. External Google Drive, Lemon64 and YouTube availability cannot be proved reliably from a browser without a server-side service, so this report validates their format and supplies direct review links rather than labelling an unreachable third-party request as broken.',
            'Archive Quality audit boundaries'
          );
          replaceOnce(
            'admin/archive-quality.html',
            /<script type="module" src="\/admin\/js\/archive-quality\.js\?v=phase20-20260806"><\/script>/,
            '<script type="module" src="/admin/js/archive-quality.js?v=cloudflare-audio-20260812"></script>',
            'Archive Quality script version'
          );

          // Documentation and publishing triggers.
          replaceOnce(
            'admin/GAMES_EDITOR.md',
            /Optional information includes collections, manual URL, disk\/download links, music files, developer, programmer, graphics and musician credits\./,
            'Optional information includes collections, manual URL, disk/download links, developer, programmer, graphics and musician credits.',
            'Game Builder optional information copy'
          );
          replaceOnce(
            'admin/GAMES_EDITOR.md',
            /- Optional game audio: `resources\/audio\/games\/<slug>\.mp3` or the explicitly recorded filenames/,
            '- Game audio is hosted on Cloudflare R2 and resolved from the canonical slug as `<slug>.mp3`; do not add repository audio paths or a `music` filename field to `games.json`',
            'Game Builder audio documentation'
          );
          replaceOnce(
            '.github/workflows/games-publishing.yml',
            /\s*- "resources\/audio\/games\/\*\*"/,
            '',
            'local audio workflow trigger'
          );

          // Remove all stale music filename metadata from the authoritative source.
          const gamesPath = 'games/games.json';
          const games = JSON.parse(read(gamesPath));
          if (!Array.isArray(games)) throw new Error('games/games.json is not an array');
          let removedMusicFields = 0;
          for (const game of games) {
            if (game && Object.prototype.hasOwnProperty.call(game, 'music')) {
              delete game.music;
              removedMusicFields += 1;
            }
          }
          if (removedMusicFields < 1) throw new Error('Expected at least one obsolete games.json music field to remove');
          write(gamesPath, JSON.stringify(games, null, 2) + '\n');
          console.log('[cloudflare-audio-migration] Removed ' + removedMusicFields + ' obsolete games.json music field(s).');

          // Permanent regression coverage.
          write('tests/cloudflare-audio-admin.test.mjs', String.raw`import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const read = (path) => fs.readFileSync(new URL('../' + path, import.meta.url), 'utf8');

          test('admin publishers never write repository music filename metadata', () => {
            const publisherHtml = read('admin/content-publisher.html');
            const publisherJs = read('admin/js/content-publisher.js');
            const legacyHtml = read('admin/games-editor.html');
            const legacyJs = read('admin/js/games-editor.js');

            assert.doesNotMatch(publisherHtml, /data-game-field=["']music["']/);
            assert.doesNotMatch(publisherJs, /gameValue\(["']music["']\)/);
            assert.doesNotMatch(legacyHtml, /data-field=["']music["']/);
            assert.doesNotMatch(legacyHtml, /resources\/audio\/games/);
            assert.doesNotMatch(legacyJs, /state\.draft\.music/);
            assert.doesNotMatch(legacyJs, /resources\/audio\/games/);
          });

          test('game source no longer carries obsolete music filename properties', () => {
            const games = JSON.parse(read('games/games.json'));
            assert.ok(Array.isArray(games) && games.length > 0);
            assert.equal(games.filter((game) => Object.prototype.hasOwnProperty.call(game, 'music')).length, 0);
          });

          test('Archive Quality separates Cloudflare music from local resource findings', () => {
            const html = read('admin/archive-quality.html');
            const js = read('admin/js/archive-quality.js');
            const musicConfig = read('js/ccg-music-config.js');
            const publishing = read('.github/workflows/games-publishing.yml');

            assert.match(html, /id=["']archiveQualityRunMusic["']/);
            assert.match(html, /Cloudflare tracks found/);
            assert.match(js, /runCloudflareMusicAudit/);
            assert.match(js, /new Audio\(\)/);
            assert.doesNotMatch(js, /category:\s*["']Local audio["']/);
            assert.doesNotMatch(js, /resources\/audio\/games/);
            assert.doesNotMatch(publishing, /resources\/audio\/games/);

            const archiveBase = js.match(/CLOUDFLARE_MUSIC_BASE_URL = '([^']+)'/)?.[1];
            const runtimeBase = musicConfig.match(/DEFAULT_MUSIC_BASE_URL = "([^"]+)"/)?.[1];
            assert.equal(archiveBase, runtimeBase, 'Archive Quality and public music runtime must use the same Cloudflare base URL');
          });
          `);
          NODE

          node "$RUNNER_TEMP/migrate-cloudflare-audio.cjs"

      - name: Validate migration
        shell: bash
        run: |
          node --check admin/js/archive-quality.js
          node --check admin/js/content-publisher.js
          node --check admin/js/games-editor.js
          node --test tests/cloudflare-audio-admin.test.mjs
          node scripts/validate-games-source.js
          git diff --check

      - name: Create review branch and pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/ccg-cloudflare-audio-migration.yml

          BRANCH="codex/cloudflare-audio-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            admin/archive-quality.html \
            admin/js/archive-quality.js \
            admin/content-publisher.html \
            admin/js/content-publisher.js \
            admin/games-editor.html \
            admin/js/games-editor.js \
            admin/GAMES_EDITOR.md \
            games/games.json \
            .github/workflows/games-publishing.yml \
            tests/cloudflare-audio-admin.test.mjs \
            .github/workflows/ccg-cloudflare-audio-migration.yml
          git commit -m "Align game audio admin pipeline with Cloudflare R2"
          git push origin "HEAD:$BRANCH"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Align game audio admin pipeline with Cloudflare R2" \
            --body "Removes obsolete local MP3 filename handling from both game publishers and Archive Quality, strips stale games.json music fields, removes the old local-audio publishing trigger, adds an optional non-warning Cloudflare music availability probe by canonical slug, updates admin documentation, and adds regression coverage. The temporary migration workflow deletes itself in this PR.")
          echo "Created PR: $PR_URL"
