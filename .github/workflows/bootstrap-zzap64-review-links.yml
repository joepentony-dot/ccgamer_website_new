name: Bootstrap Zzap64 Review Links

on:
  push:
    branches:
      - codex/zzap64-original-review-links

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: codex/zzap64-original-review-links
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate original Zzap review links
        run: node scripts/generate-zzap64-review-links.js

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/generate-zzap64-review-links.js
          node --check js/zzap64-awards.js

      - name: Commit generated map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zzap64-review-links.json
          if git diff --cached --quiet; then
            echo "Review-link map already current."
            exit 0
          fi
          git commit -m "Generate Zzap64 original review links"
          git push origin HEAD:codex/zzap64-original-review-links
