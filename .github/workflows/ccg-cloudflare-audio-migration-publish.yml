name: Publish CCG Cloudflare Audio Admin Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ccg-cloudflare-audio-migration-publish.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out required files
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /admin/archive-quality.html
            /admin/js/archive-quality.js
            /admin/content-publisher.html
            /admin/js/content-publisher.js
            /admin/games-editor.html
            /admin/js/games-editor.js
            /admin/GAMES_EDITOR.md
            /games/games.json
            /.github/workflows/games-publishing.yml
            /.github/workflows/ccg-cloudflare-audio-migration.yml
            /.github/workflows/ccg-cloudflare-audio-migration-publish.yml
            /js/ccg-music-config.js
            /scripts/validate-games-source.js
            /tests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Apply the already validated migration
        shell: bash
        run: |
          awk '
            /^          const fs = require\('\''fs'\''\);$/ { capture=1 }
            /^          NODE$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/ccg-cloudflare-audio-migration.yml > "$RUNNER_TEMP/migrate-cloudflare-audio.cjs"

          test -s "$RUNNER_TEMP/migrate-cloudflare-audio.cjs"
          node "$RUNNER_TEMP/migrate-cloudflare-audio.cjs"

      - name: Keep workflow cleanup separate from the site PR
        shell: bash
        run: |
          git restore .github/workflows/games-publishing.yml
          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/cloudflare-audio-admin.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace("  const publishing = read('.github/workflows/games-publishing.yml');\n", '');
          source = source.replace("  assert.doesNotMatch(publishing, /resources\\/audio\\/games/);\n", '');
          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Revalidate final PR contents
        shell: bash
        run: |
          node --check admin/js/archive-quality.js
          node --check admin/js/content-publisher.js
          node --check admin/js/games-editor.js
          node --test tests/cloudflare-audio-admin.test.mjs
          node scripts/validate-games-source.js
          git diff --check
          test -z "$(git diff --name-only -- .github/workflows/games-publishing.yml)"

      - name: Create review branch and pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="codex/cloudflare-audio-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            admin/archive-quality.html \
            admin/js/archive-quality.js \
            admin/content-publisher.html \
            admin/js/content-publisher.js \
            admin/games-editor.html \
            admin/js/games-editor.js \
            admin/GAMES_EDITOR.md \
            games/games.json \
            tests/cloudflare-audio-admin.test.mjs
          git commit -m "Align game audio admin pipeline with Cloudflare R2"
          git push origin "HEAD:$BRANCH"

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Align game audio admin pipeline with Cloudflare R2" \
            --body "Removes obsolete local MP3 filename handling from the unified Content Publisher, legacy Game Builder and Archive Quality; strips stale games.json music filename properties; adds a separate non-warning Cloudflare R2 availability check by canonical slug; updates admin documentation; and adds regression coverage. Syntax checks, regression tests and source validation passed before this PR was created.")
          echo "Created PR: $PR_URL"
