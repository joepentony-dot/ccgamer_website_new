name: C64 Dungeon Carnage Solo Long Session Repeatability

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/tests/browser/v10-41-solo-long-session-soak.mjs'
      - '.github/workflows/c64-dungeon-carnage-solo-long-session-repeatability.yml'
      - 'arcade/lost-sizzler/js/v10-41-r30-global-movement-guard.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sustained-solo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          npx playwright install --with-deps chromium
      - name: Validate long-session contract syntax
        run: node --check arcade/lost-sizzler/tests/browser/v10-41-solo-long-session-soak.mjs
      - name: Run independent sustained Solo soak
        run: node arcade/lost-sizzler/tests/browser/v10-41-solo-long-session-soak.mjs
      - name: Preserve verification-only scope
        run: |
          set -o pipefail
          git diff --name-only HEAD^1 HEAD | tee /tmp/changed.txt
          if grep -Eq '^(index\.html|resources/css/intro\.css|js/index-intro\.js|games/games\.json)$' /tmp/changed.txt; then
            echo 'Protected file changed.' >&2
            exit 1
          fi
