name: CCG Content Publisher Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "admin/index.html"
      - "admin/content-publisher.html"
      - "admin/help.html"
      - "admin/js/content-publisher.js"
      - "resources/css/ccg-content-publisher.css"
      - "js/load-single-game.js"
      - "js/ccg-zzap64-matcher.js"
      - "data/zzap64-review-links.json"
      - "scripts/audit-admin-runtime-bootstrap.js"
      - "tests/content-publisher.test.mjs"
      - "tests/game-zzap-links.test.mjs"
      - ".github/workflows/content-publisher-validation.yml"
  push:
    branches:
      - main
    paths:
      - "admin/index.html"
      - "admin/content-publisher.html"
      - "admin/help.html"
      - "admin/js/content-publisher.js"
      - "resources/css/ccg-content-publisher.css"
      - "js/load-single-game.js"
      - "js/ccg-zzap64-matcher.js"
      - "data/zzap64-review-links.json"
      - "scripts/audit-admin-runtime-bootstrap.js"
      - "tests/content-publisher.test.mjs"
      - "tests/game-zzap-links.test.mjs"
      - ".github/workflows/content-publisher-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check admin/js/content-publisher.js
          node --check scripts/audit-admin-runtime-bootstrap.js
          node --check js/load-single-game.js
          node --check js/ccg-zzap64-matcher.js

      - name: Run publisher and Zzap game-link regression tests
        run: |
          node --test tests/content-publisher.test.mjs
          node --test tests/game-zzap-links.test.mjs

      - name: Run admin runtime bootstrap audit
        run: node scripts/audit-admin-runtime-bootstrap.js

      - name: Confirm protected files are outside publisher scope
        shell: bash
        run: |
          ! grep -F "resources/css/intro.css" admin/js/content-publisher.js
          ! grep -F "js/index-intro.js" admin/js/content-publisher.js
          ! grep -F "YOUTUBE_API_KEY" admin/js/content-publisher.js

      - name: Check whitespace
        run: git diff --check