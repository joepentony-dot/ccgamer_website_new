name: Lost Sizzler Final Test Autopatch

on:
  push:
    branches:
      - codex/lost-sizzler-consolidation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/lost-sizzler-consolidation
          fetch-depth: 0

      - name: Correct home CTA regression assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('arcade/lost-sizzler/tests/v10-6-regression.mjs')
          text = p.read_text(encoding='utf-8')
          old = 'assert.match(homeHtml,/href="\\/arcade\\/lost-sizzler\\/"/);assert.match(homeHtml,/BETA TEST MY NEW GAME/);'
          new = 'const homeCommunity=read("../../js/ccg-home-community.js");assert.match(homeCommunity,/lostSizzlerUrl = "\\/arcade\\/lost-sizzler\\/"/);assert.match(homeHtml,/BETA TEST MY NEW GAME/);'
          if old not in text:
              raise SystemExit('Expected stale CTA assertion not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/lost-sizzler-final-test-autopatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler/tests/v10-6-regression.mjs .github/workflows/lost-sizzler-final-test-autopatch.yml
          git commit -m "Validate canonical Lost Sizzler home CTA in runtime script"
          git push origin HEAD:codex/lost-sizzler-consolidation
