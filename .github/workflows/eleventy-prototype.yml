name: Eleventy Prototype Validation

on:
  push:
    branches:
      - codex/eleventy-ccg-prototype
    paths:
      - "prototype-eleventy/**"
      - ".github/workflows/eleventy-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-eleventy
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Eleventy prototype
        run: npm run build

      - name: Verify generated routes
        run: |
          test -f _site/index.html
          test -f _site/games/index.html
          test -f _site/games/20-tons/index.html
          test -f _site/games/720-degrees/index.html
          test -f _site/games/genres/index.html
          test -f _site/games/genres/arcade/index.html
          test -f _site/games/publishers/index.html
          test -f _site/games/collections/index.html
          test -f _site/games/collections/cartridge-games/index.html
          test -f _site/games/collections/licensed-games/index.html
          test -f _site/games/collections/bpjs-indexed-games/index.html
          test -f _site/games/collections/top-picks/index.html
          test -f _site/games/collections/amiga-demo-music/index.html
          test -f _site/games/collections/retro-events/index.html
          test -f _site/games/collections/retro-specials/index.html
          test -f _site/zzap64/index.html
          test -f _site/amiga-demo-music/index.html
          test -f _site/amiga-demo-music/9-fingers-spaceballs/index.html
          test -f _site/amiga-demo-music/jesus-on-es/index.html
          test -f _site/amiga-demo-music/state-of-the-art/index.html
          test -f _site/sitemap.xml
          test -f _site/_redirects

      - name: Verify responsive accessibility shell
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const representativePages = [
            "_site/index.html",
            "_site/games/index.html",
            "_site/games/20-tons/index.html",
            "_site/games/genres/index.html",
            "_site/games/genres/arcade/index.html",
            "_site/games/publishers/index.html",
            "_site/games/collections/index.html",
            "_site/zzap64/index.html",
            "_site/amiga-demo-music/index.html",
            "_site/amiga-demo-music/state-of-the-art/index.html"
          ];

          for (const path of representativePages) {
            const html = fs.readFileSync(path, "utf8");
            const required = [
              '<meta name="viewport" content="width=device-width, initial-scale=1">',
              '<a class="skip-link" href="#main-content">Skip to main content</a>',
              'aria-label="Primary navigation"',
              'id="main-content"'
            ];
            for (const marker of required) {
              if (!html.includes(marker)) {
                throw new Error(`Missing accessibility shell marker ${marker} in ${path}.`);
              }
            }
          }

          const currentPageExpectations = new Map([
            ["_site/index.html", 'href="/" aria-current="page"'],
            ["_site/games/index.html", 'href="/games/" aria-current="page"'],
            ["_site/games/genres/index.html", 'href="/games/genres/" aria-current="page"'],
            ["_site/games/publishers/index.html", 'href="/games/publishers/" aria-current="page"'],
            ["_site/games/collections/index.html", 'href="/games/collections/" aria-current="page"'],
            ["_site/zzap64/index.html", 'href="/zzap64/" aria-current="page"'],
            ["_site/amiga-demo-music/index.html", 'href="/amiga-demo-music/" aria-current="page"']
          ]);

          for (const [path, marker] of currentPageExpectations) {
            const html = fs.readFileSync(path, "utf8");
            if (!html.includes(marker)) {
              throw new Error(`Missing current-page navigation state ${marker} in ${path}.`);
            }
          }

          const css = fs.readFileSync("_site/assets/site.css", "utf8");
          for (const marker of [
            "min-height: 44px",
            'a[aria-current="page"]',
            "overflow-wrap: break-word",
            "@media (max-width: 720px)",
            "@media (prefers-reduced-motion: reduce)"
          ]) {
            if (!css.includes(marker)) {
              throw new Error(`Missing responsive/accessibility CSS invariant: ${marker}.`);
            }
          }
          NODE

      - name: Verify shared SEO metadata
        run: |
          grep -Fq '<link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/">' _site/index.html
          grep -Fq '<link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/games/20-tons/">' _site/games/20-tons/index.html
          grep -Fq '<link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/games/genres/arcade/">' _site/games/genres/arcade/index.html
          grep -Fq '<link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/games/collections/top-picks/">' _site/games/collections/top-picks/index.html
          grep -Fq '<meta property="og:site_name" content="Cheeky Commodore Gamer">' _site/games/20-tons/index.html
          grep -Fq '<meta name="twitter:site" content="@CheekyC64Gamer">' _site/games/20-tons/index.html

      - name: Verify game structured data
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const html = fs.readFileSync("_site/games/20-tons/index.html", "utf8");
          const match = html.match(
            /<script\b(?=[^>]*type="application\/ld\+json")(?=[^>]*data-ccg-schema="game-graph")[^>]*>([\s\S]*?)<\/script>/i
          );
          if (!match) throw new Error("Missing game-graph JSON-LD on representative game page.");

          const payload = JSON.parse(match[1]);
          if (payload["@context"] !== "https://schema.org" || !Array.isArray(payload["@graph"])) {
            throw new Error("Game schema must be a schema.org @graph.");
          }

          const videoGame = payload["@graph"].find((item) => item?.["@type"] === "VideoGame");
          const breadcrumb = payload["@graph"].find((item) => item?.["@type"] === "BreadcrumbList");

          if (!videoGame || !breadcrumb) {
            throw new Error("Representative game page must own VideoGame and BreadcrumbList schema.");
          }

          const canonical = "https://www.cheekycommodoregamer.co.uk/games/20-tons/";
          if (
            videoGame["@id"] !== `${canonical}#game` ||
            videoGame.name !== "20 Tons" ||
            videoGame.url !== canonical ||
            videoGame.gamePlatform !== "Commodore 64" ||
            videoGame.datePublished !== "1985" ||
            videoGame.publisher?.name !== "64 Tape Computing"
          ) {
            throw new Error(`Unexpected VideoGame schema: ${JSON.stringify(videoGame)}`);
          }

          const crumbs = breadcrumb.itemListElement || [];
          if (
            breadcrumb["@id"] !== `${canonical}#breadcrumb` ||
            crumbs.length !== 3 ||
            crumbs[0]?.item !== "https://www.cheekycommodoregamer.co.uk" ||
            crumbs[1]?.item !== "https://www.cheekycommodoregamer.co.uk/games/" ||
            crumbs[2]?.item !== canonical
          ) {
            throw new Error(`Unexpected BreadcrumbList schema: ${JSON.stringify(breadcrumb)}`);
          }
          NODE

      - name: Verify archive hub structured data
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const readSchema = (path, marker) => {
            const html = fs.readFileSync(path, "utf8");
            const match = html.match(
              new RegExp(`<script\\b(?=[^>]*type="application\\/ld\\+json")(?=[^>]*data-ccg-schema="${marker}")[^>]*>([\\s\\S]*?)<\\/script>`, "i")
            );
            if (!match) throw new Error(`Missing ${marker} JSON-LD in ${path}.`);
            return JSON.parse(match[1]);
          };

          const games = readSchema("_site/games/index.html", "hub-games");
          const gamesTypes = games["@graph"]?.map((item) => item?.["@type"]) || [];
          if (!gamesTypes.includes("CollectionPage") || !gamesTypes.includes("BreadcrumbList")) {
            throw new Error(`Games hub schema contract changed: ${JSON.stringify(games)}`);
          }

          const publishers = readSchema("_site/games/publishers/index.html", "hub-publishers");
          const publisherList = publishers["@graph"]?.find((item) => item?.["@type"] === "ItemList");
          if (
            !publisherList ||
            publisherList.numberOfItems !== publisherList.itemListElement?.length ||
            publisherList.numberOfItems < 100 ||
            publisherList.itemListElement?.[0]?.position !== 1
          ) {
            throw new Error(`Publisher hub ItemList is incomplete: ${JSON.stringify(publisherList)}`);
          }

          const collections = readSchema("_site/games/collections/index.html", "hub-collections");
          const collectionList = collections["@graph"]?.find((item) => item?.["@type"] === "ItemList");
          if (
            !collectionList ||
            collectionList.numberOfItems !== 7 ||
            collectionList.itemListElement?.length !== 7 ||
            collectionList.itemListElement.some((item) => !item.url?.endsWith("/"))
          ) {
            throw new Error(`Collections hub ItemList is unexpected: ${JSON.stringify(collectionList)}`);
          }

          const zzap = readSchema("_site/zzap64/index.html", "hub-zzap64");
          if (
            zzap["@type"] !== "CollectionPage" ||
            zzap.url !== "https://www.cheekycommodoregamer.co.uk/zzap64/"
          ) {
            throw new Error(`Zzap!64 hub schema contract changed: ${JSON.stringify(zzap)}`);
          }

          for (const schemaFreePath of ["_site/index.html", "_site/games/genres/index.html"]) {
            const html = fs.readFileSync(schemaFreePath, "utf8");
            if (/data-ccg-schema="hub-/.test(html)) {
              throw new Error(`Unexpected invented hub schema in ${schemaFreePath}.`);
            }
          }
          NODE

      - name: Verify XML sitemap
        run: |
          assert_contains() {
            needle="$1"
            if ! grep -Fq "$needle" _site/sitemap.xml; then
              echo "Missing sitemap entry: $needle"
              exit 1
            fi
          }
          assert_contains '<?xml version="1.0" encoding="UTF-8"?>'
          assert_contains '<loc>https://www.cheekycommodoregamer.co.uk/</loc>'
          assert_contains '<loc>https://www.cheekycommodoregamer.co.uk/games/20-tons/</loc>'
          assert_contains '<loc>https://www.cheekycommodoregamer.co.uk/games/genres/arcade/</loc>'
          assert_contains '<loc>https://www.cheekycommodoregamer.co.uk/games/collections/top-picks/</loc>'
          assert_contains '<loc>https://www.cheekycommodoregamer.co.uk/amiga-demo-music/state-of-the-art/</loc>'
          if grep -Fq '<loc>https://www.cheekycommodoregamer.co.uk/sitemap.xml</loc>' _site/sitemap.xml; then
            echo 'sitemap.xml must not list itself'
            exit 1
          fi

      - name: Verify proven legacy URL redirects
        run: |
          grep -Fxq '/games/collections/cartridge-games.html /games/collections/cartridge-games/ 301' _site/_redirects
          grep -Fxq '/games/collections/licensed-games.html /games/collections/licensed-games/ 301' _site/_redirects
          grep -Fxq '/games/collections/bpjs-indexed-games.html /games/collections/bpjs-indexed-games/ 301' _site/_redirects
          grep -Fxq '/games/collections/top-picks.html /games/collections/top-picks/ 301' _site/_redirects
          grep -Fxq '/games/collections/amiga-demo-music.html /games/collections/amiga-demo-music/ 301' _site/_redirects
          grep -Fxq '/games/collections/retro-events.html /games/collections/retro-events/ 301' _site/_redirects
          grep -Fxq '/games/collections/retro-specials.html /games/collections/retro-specials/ 301' _site/_redirects
