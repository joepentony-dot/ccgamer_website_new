name: Zzap64 Review Link Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/zzap64-awards/**"
      - "data/zzap64-review-links.json"
      - "scripts/generate-zzap64-review-links.js"
      - "scripts/zzap64-bible-client.js"
      - "js/zzap64-awards.js"
      - "zzap64/index.html"
      - "resources/css/zzap64-awards.css"
      - "tests/zzap64-review-links.test.mjs"
      - ".github/workflows/zzap64-review-links-validation.yml"
      - ".github/workflows/zzap64-review-links-refresh.yml"
  push:
    branches:
      - main
    paths:
      - "data/zzap64-awards/**"
      - "data/zzap64-review-links.json"
      - "scripts/generate-zzap64-review-links.js"
      - "scripts/zzap64-bible-client.js"
      - "js/zzap64-awards.js"
      - "zzap64/index.html"
      - "resources/css/zzap64-awards.css"
      - "tests/zzap64-review-links.test.mjs"
      - ".github/workflows/zzap64-review-links-validation.yml"
      - ".github/workflows/zzap64-review-links-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/generate-zzap64-review-links.js
          node --check scripts/zzap64-bible-client.js
          node --check js/zzap64-awards.js

      - name: Confirm generated review links are current
        run: node scripts/generate-zzap64-review-links.js --check

      - name: Test original magazine links
        run: node --test tests/zzap64-review-links.test.mjs

      - name: Run existing Zzap award audit
        run: node scripts/audit-zzap64-awards.js

      - name: Confirm protected files are untouched
        shell: bash
        run: |
          changed="$(git diff --name-only origin/main...HEAD 2>/dev/null || true)"
          for protected in index.html home.html resources/css/intro.css js/index-intro.js games/games.json; do
            if printf '%s\n' "$changed" | grep -Fxq "$protected"; then
              echo "Protected file changed: $protected"
              exit 1
            fi
          done

      - name: Check whitespace
        run: git diff --check
