name: Lost Sizzler Migration Finalizer

on:
  push:
    branches:
      - codex/lost-sizzler-consolidation
    paths:
      - '.github/workflows/lost-sizzler-migration-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/lost-sizzler-consolidation
          fetch-depth: 0

      - name: Canonicalize internal Lost Sizzler paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('arcade/lost-sizzler')
          old='/games/ccg-games/cheeky-commodore-quest/'
          new='/arcade/lost-sizzler/'
          suffixes={'.html','.js','.mjs','.json','.css','.txt','.md'}
          changed=[]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              text=path.read_text(encoding='utf-8')
              updated=text.replace(old,new)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))
          print('Canonicalized Lost Sizzler files:')
          for path in changed:
              print(f' - {path}')
          PY

      - name: Refuse stale canonical self-references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings '/games/ccg-games/cheeky-commodore-quest/' arcade/lost-sizzler --include='*.html' --include='*.js' --include='*.mjs' --include='*.json'; then
            echo 'Stale self-reference remains in canonical Lost Sizzler runtime.' >&2
            exit 1
          fi

      - name: Commit canonicalized runtime
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No canonical path changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/lost-sizzler
          git commit -m 'Finalize Lost Sizzler canonical arcade paths'
          git push origin HEAD:codex/lost-sizzler-consolidation
