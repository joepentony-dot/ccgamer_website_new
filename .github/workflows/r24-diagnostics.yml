name: R24 Diagnostics

on:
  push:
    branches:
      - fix/lost-sizzler-r24-live-regressions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture static regression output
        shell: bash
        run: |
          set +e
          : > r24-diagnostics.log
          echo '=== CANONICAL LOST SIZZLER STATIC SUITE ===' >> r24-diagnostics.log
          while IFS= read -r -d '' test; do
            echo "--- $test ---" >> r24-diagnostics.log
            node "$test" >> r24-diagnostics.log 2>&1
            echo "exit=$?" >> r24-diagnostics.log
          done < <(find arcade/lost-sizzler/tests -maxdepth 1 -type f -name '*.mjs' ! -name 'v10-6-browser.mjs' ! -name 'v10-28-browser-stability.mjs' -print0 | sort -z)
          echo '=== ADMIN TESTS ===' >> r24-diagnostics.log
          node --test tests/admin-navigation.test.mjs tests/analytics-growth.test.mjs >> r24-diagnostics.log 2>&1
          echo "exit=$?" >> r24-diagnostics.log
          echo '=== VOICE TEST ===' >> r24-diagnostics.log
          node games/ccg-games/cheeky-commodore-quest/tests/v10-19-voice-admin.mjs >> r24-diagnostics.log 2>&1
          echo "exit=$?" >> r24-diagnostics.log
          echo '=== ARCHIVE QUALITY ===' >> r24-diagnostics.log
          node --test tests/admin-archive-quality.test.mjs >> r24-diagnostics.log 2>&1
          echo "exit=$?" >> r24-diagnostics.log
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: r24-diagnostics
          path: r24-diagnostics.log
          if-no-files-found: error
          retention-days: 1
