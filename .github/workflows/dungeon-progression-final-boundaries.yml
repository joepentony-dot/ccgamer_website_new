name: Dungeon Progression Final Boundaries

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - scripts/harden-dungeon-progression-final-boundaries.mjs
      - .github/workflows/dungeon-progression-final-boundaries.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final guarded boundary patch
        run: node scripts/harden-dungeon-progression-final-boundaries.mjs
      - name: Validate foundation and special-mode isolation
        shell: bash
        run: |
          node --check arcade/lost-sizzler/js/dungeon-progression-foundation.js
          node arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          node arcade/lost-sizzler/tests/dungeon-progression-foundation-loader-contract.mjs
          node arcade/lost-sizzler/tests/horde-survivor-contract.mjs
          node arcade/lost-sizzler/tests/sizzler-saboteurs-contract.mjs
      - name: Commit final guards and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler/js/dungeon-progression-foundation.js arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          git rm scripts/harden-dungeon-progression-final-boundaries.mjs .github/workflows/dungeon-progression-final-boundaries.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No final boundary changes produced"; exit 1; }
          git commit -m "fix: finish special-mode progression isolation"
          git push origin HEAD:codex/dungeon-carnage-progression-foundation
