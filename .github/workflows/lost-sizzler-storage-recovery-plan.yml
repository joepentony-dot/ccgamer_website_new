name: Lost Sizzler Storage Recovery Plan

on:
  pull_request:
    paths:
      - 'scripts/recover-lost-sizzler-enabled-storage.mjs'
      - 'scripts/verify-lost-sizzler-storage-recovery.mjs'
      - 'arcade/lost-sizzler/SUPABASE-STORAGE-RECOVERY-MANIFEST.md'
      - '.github/workflows/lost-sizzler-storage-recovery-plan.yml'
      - '.github/workflows/lost-sizzler-storage-recovery-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Prove frozen enabled-only request plan without network
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen recovery plan
        run: |
          set -euo pipefail
          BASE='https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/'
          ONE="$RUNNER_TEMP/lost-sizzler-recovery-plan-one.txt"
          ALL="$RUNNER_TEMP/lost-sizzler-recovery-plan-all.txt"

          node --check scripts/recover-lost-sizzler-enabled-storage.mjs
          node --check scripts/verify-lost-sizzler-storage-recovery.mjs
          node scripts/recover-lost-sizzler-enabled-storage.mjs --self-test
          node scripts/verify-lost-sizzler-storage-recovery.mjs --manifest-check
          node scripts/verify-lost-sizzler-storage-recovery.mjs --self-test

          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const path = '.github/workflows/lost-sizzler-storage-recovery-manual.yml';
          const source = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n');
          const match = source.match(/^on:\n([\s\S]*?)\npermissions:/m);
          assert.ok(match, `${path} must contain an on: block followed by permissions:`);

          const events = match[1]
            .split('\n')
            .map((line) => line.match(/^  ([A-Za-z0-9_-]+):(?:\s.*)?$/))
            .filter(Boolean)
            .map((entry) => entry[1]);

          assert.deepEqual(
            events,
            ['workflow_dispatch'],
            `${path} must remain manual-only; top-level workflow events were: ${events.join(', ') || '(none)'}`
          );

          console.log('Lost Sizzler Storage recovery workflow is locked to workflow_dispatch only.');
          NODE

          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');

          const path = 'scripts/recover-lost-sizzler-enabled-storage.mjs';
          const source = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n');
          const downloadStart = source.indexOf('async function downloadTo(url, destination) {');
          const promotionFunction = source.indexOf('function promoteVerifiedDownload(partial, destination) {');
          const hashIndex = source.indexOf('const sha256 = sha256File(partial);');
          const sizeGuard = source.indexOf('if (!sizeMatches) fail(');
          const probeGuard = source.indexOf('if (args.probe && !probe?.ok) fail(');
          const promoteIndex = source.indexOf('promoteVerifiedDownload(partial, destination);');

          assert.ok(downloadStart >= 0 && promotionFunction > downloadStart, 'recovery downloader must retain a distinct download and promotion boundary');
          const downloadBody = source.slice(downloadStart, promotionFunction);
          assert.ok(downloadBody.includes("fs.writeFileSync(partial, Buffer.concat(chunks, bytes), { flag: 'wx' });"), 'download must land in an exclusive .partial file');
          assert.ok(!downloadBody.includes('fs.renameSync('), 'download phase must not promote bytes before verification');
          assert.ok(hashIndex > promotionFunction, 'SHA-256 must be calculated from the partial file after download');
          assert.ok(sizeGuard > hashIndex, 'byte-size verification must follow SHA-256 collection');
          assert.ok(probeGuard > sizeGuard, 'optional ffprobe verification must remain after byte-size verification');
          assert.ok(promoteIndex > probeGuard, 'final filename promotion must occur only after size and optional ffprobe guards');
          assert.ok(source.includes('if (fs.existsSync(destination)) fail(`Refusing to overwrite existing recovery file: ${destination}`);'), 'promotion must continue refusing an existing final recovery file');

          console.log('Lost Sizzler recovered objects are promoted only after verification.');
          NODE

          node scripts/recover-lost-sizzler-enabled-storage.mjs \
            --storage-base-url "$BASE" \
            --plan \
            --limit 1 > "$ONE"

          grep -Fqx 'Lost Sizzler enabled Storage recovery plan: 1/16 objects, 3360888 expected bytes.' "$ONE"
          grep -Fqx 'PLAN 01 | row 62 | lostSizzlerDanger/combat-01.mp3 | 3360888 | https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/music/lostSizzlerDanger/1787411621547-0-combat-01.mp3' "$ONE"
          grep -Fqx 'PLAN ONLY: zero network requests; zero files created; enabled generation only.' "$ONE"
          test "$(grep -Ec '^PLAN [0-9]{2} \|' "$ONE")" -eq 1

          node scripts/recover-lost-sizzler-enabled-storage.mjs \
            --storage-base-url "$BASE" \
            --plan \
            --limit 16 > "$ALL"

          grep -Fqx 'Lost Sizzler enabled Storage recovery plan: 16/16 objects, 72233137 expected bytes.' "$ALL"
          grep -Fqx 'PLAN 01 | row 62 | lostSizzlerDanger/combat-01.mp3 | 3360888 | https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/music/lostSizzlerDanger/1787411621547-0-combat-01.mp3' "$ALL"
          grep -Fqx 'PLAN 11 | row 77 | lostSizzlerNamed/named-03.mp3 | 5134967 | https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/music/lostSizzlerNamed/1787411637581-15-named-03.mp3' "$ALL"
          grep -Fqx 'PLAN 16 | row 66 | lostSizzlerStalker/count-loadula-03.mp3 | 3982975 | https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/music/lostSizzlerStalker/1787411625578-4-count-loadula-03.mp3' "$ALL"
          grep -Fqx 'PLAN ONLY: zero network requests; zero files created; enabled generation only.' "$ALL"
          test "$(grep -Ec '^PLAN [0-9]{2} \|' "$ALL")" -eq 16
          test "$(grep -Ec 'https://[^ ]+\.supabase\.co/storage/v1/object/public/ccg-arcade-assets/music/' "$ALL")" -eq 16

          if node scripts/recover-lost-sizzler-enabled-storage.mjs \
            --storage-base-url "$BASE" \
            --plan \
            --output "$RUNNER_TEMP/forbidden-plan-output" >/dev/null 2>&1; then
            echo '--plan unexpectedly accepted an output directory' >&2
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/forbidden-plan-output"

          echo 'Lost Sizzler enabled Storage recovery plan is frozen, enabled-only and no-network.'
