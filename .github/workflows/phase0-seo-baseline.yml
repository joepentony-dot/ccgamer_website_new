name: Phase 0 SEO Baseline

on:
  push:
    branches:
      - audit/phase-0-seo-baseline
    paths:
      - "scripts/phase0_seo_baseline.py"
      - ".github/workflows/phase0-seo-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase0-seo-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit script
        run: python -m py_compile scripts/phase0_seo_baseline.py

      - name: Generate read-only baseline reports
        run: python scripts/phase0_seo_baseline.py

      - name: Verify report output
        run: |
          test -s docs/phase0-seo-baseline.md
          test -s docs/phase0-seo-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("docs/phase0-seo-baseline.json").read_text(encoding="utf-8"))
          summary = report.get("summary", {})
          if not summary:
              raise SystemExit("Baseline JSON does not contain a summary.")
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit reports to audit branch
        shell: bash
        run: |
          git add docs/phase0-seo-baseline.md docs/phase0-seo-baseline.json

          if git diff --cached --quiet; then
            echo "Phase 0 reports are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Phase 0 SEO baseline reports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
