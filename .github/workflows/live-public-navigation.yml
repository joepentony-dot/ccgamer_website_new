name: Live Public Navigation Verification

# Diagnostic trigger only: verify merged public release v7 on the custom domain.
on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/audit-nav-more-browser.js"
      - ".github/workflows/live-public-navigation.yml"
  workflow_run:
    workflows:
      - "Deploy GitHub Pages (Omega Stable)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-public-navigation
  cancel-in-progress: true

jobs:
  verify-live-navigation:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.head_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate browser audit syntax
        run: node --check scripts/audit-nav-more-browser.js

      - name: Verify public custom-domain navigation release
        shell: bash
        env:
          CCG_NAV_AUDIT_BASE_URL: https://www.cheekycommodoregamer.co.uk
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node scripts/audit-nav-more-browser.js; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "The public custom domain did not pass the deployed navigation interaction audit." >&2
              exit 1
            fi
            echo "Public navigation release is not fully ready yet (attempt ${attempt}/12)."
            sleep 10
          done

      - name: Validate live first-frame audit syntax
        run: node --check scripts/audit-header-frame-live.js

      - name: Verify live v7 first-frame header stability
        env:
          CCG_HEADER_FRAME_BASE_URL: https://www.cheekycommodoregamer.co.uk
        run: node scripts/audit-header-frame-live.js
