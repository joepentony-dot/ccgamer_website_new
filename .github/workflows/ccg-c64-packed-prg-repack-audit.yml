name: CCG C64 packed PRG repack audit
on:
  push:
    branches:
      - codex/c64-prg-pack-repack-guarded-20261016
    paths:
      - scripts/ccg-repack-retired-c64-prgs.mjs
      - .github/workflows/ccg-c64-packed-prg-repack-audit.yml
  pull_request:
    paths:
      - scripts/ccg-repack-retired-c64-prgs.mjs
      - .github/workflows/ccg-c64-packed-prg-repack-audit.yml
permissions:
  contents: read
jobs:
  verify-original-packed-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate migration script syntax
        run: node --check scripts/ccg-repack-retired-c64-prgs.mjs
      - name: Audit BLAST survivor bytes and exact CRT matches without writing
        run: node scripts/ccg-repack-retired-c64-prgs.mjs --scope blast
      - name: Audit archive survivor bytes and exact CRT matches without writing
        run: node scripts/ccg-repack-retired-c64-prgs.mjs --scope prg-archive
      - name: Confirm read-only migration made no edits
        run: test -z "$(git status --porcelain)"
