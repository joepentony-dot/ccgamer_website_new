name: One-off fix video library validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-off-fix-video-library-validation-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.head_ref == 'codex/seo/materialize-video-library-output' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Apply reviewed Video Library validation additions
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validate-year-platform-discovery.js')
          text = validator.read_text(encoding='utf-8')

          old_registry = '''const REVIEWED_FOREIGN_REGISTRY_ADDITIONS = new Set([\n    "games/discover/index.html"\n]);'''
          new_registry = '''const REVIEWED_FOREIGN_REGISTRY_ADDITIONS = new Set([\n    "games/discover/index.html",\n    "videos/index.html"\n]);'''
          if old_registry in text:
              text = text.replace(old_registry, new_registry, 1)
          elif new_registry not in text:
              raise SystemExit('Could not update reviewed foreign registry additions')

          old_pages = '''    ["sitemap-pages.xml", new Set([\n        `${SITE_ORIGIN}/games/discover/`\n    ])]'''
          new_pages = '''    ["sitemap-pages.xml", new Set([\n        `${SITE_ORIGIN}/games/discover/`,\n        `${SITE_ORIGIN}/videos/`\n    ])]'''
          if old_pages in text:
              text = text.replace(old_pages, new_pages, 1)
          elif new_pages not in text:
              raise SystemExit('Could not update reviewed sitemap-pages additions')

          validator.write_text(text, encoding='utf-8')

          template = Path('admin/templates/video-library-template.html')
          html = template.read_text(encoding='utf-8')
          full_description = 'Browse Cheeky Commodore Gamer videos covering Commodore 64 and Amiga games, Zzap!64 awards, retro features, events and Amiga demo music.'
          html = html.replace(
              'Browse CCG videos covering C64 and Amiga games, Zzap!64 awards, retro features, events and demo music.',
              full_description
          )
          template.write_text(html, encoding='utf-8')
          PY

      - name: Generate current video outputs
        run: |
          node scripts/generate-retro-pages.js
          node scripts/generate-video-seo.js
          node scripts/generate-retro-video-seo.js
          node scripts/generate-video-library.js
          node scripts/generate-sitemaps.js

      - name: Validate generated output
        run: |
          node scripts/validate-sitemaps.js
          node scripts/validate-video-seo.js
          node scripts/validate-retro-video-seo.js
          node scripts/validate-video-library.js
          python scripts/validate_social_metadata.py --allow-deferred-homepage
          git diff --check
          sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Commit fixes and regenerated output
        run: |
          git add \
            admin/templates/video-library-template.html \
            scripts/validate-year-platform-discovery.js \
            retro-events \
            retro-specials \
            amiga-demo-music \
            videos \
            tools/seo/static-pages.json \
            sitemap.xml \
            sitemap-pages.xml \
            sitemap-games.xml \
            sitemap-videos.xml \
            sitemap-retro-videos.xml

          if git diff --cached --quiet; then
            echo "Video Library validation output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Video Library with archive and social validators"
          git push origin HEAD:${{ github.head_ref }}
