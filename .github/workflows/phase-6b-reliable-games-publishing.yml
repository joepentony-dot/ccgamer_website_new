name: Phase 6B Reliable Games Editor Publishing

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/phase6b_games_editor_transaction.py"
      - "scripts/validate-games-source.js"
      - "scripts/rebuild-games.js"
      - "scripts/build-games.js"
      - "scripts/audit-game-manuals.js"
      - "scripts/enforce-manual-only-game-pages.js"
      - "scripts/ensure-downloads-discovery-links.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/validate-downloads-page.js"
      - "scripts/build-magazine-review-chunks.js"
      - "scripts/audit-magazine-review-coverage.js"
      - "scripts/ensure-magazine-review-runtime.js"
      - "scripts/mark-rerelease-publishers.js"
      - "scripts/link-publisher-strength-genres.js"
      - "scripts/generate-composer-pages.js"
      - "scripts/generate-year-platform-pages.js"
      - "scripts/integrate-year-platform-discovery.js"
      - "scripts/validate-year-platform-discovery.js"
      - "admin/games-editor.html"
      - "admin/js/games-editor.js"
      - "admin/templates/game-landing-template.html"
      - "admin/GAMES_EDITOR.md"
      - ".github/workflows/games-publishing.yml"
      - ".github/workflows/phase-6b-reliable-games-publishing.yml"
      - ".github/workflows/publisher-archives.yml"
      - ".github/workflows/composer-archives.yml"
      - ".github/workflows/game-downloads.yml"
      - ".github/workflows/year-platform-archives.yml"
      - "games/index.html"
      - "games/genres/**"
      - "games/publishers/**"
      - "games/developers/**"
      - "games/downloads/**"
      - "games/platforms/**"
      - "games/years/**"
      - "games/games-index.json"
      - "games/games-search.json"
      - "tools/seo/static-pages.json"
      - "sitemap.xml"
      - "sitemap-pages.xml"
      - "sitemap-games.xml"
      - "docs/seo-baseline/phase-6b-reliable-games-publishing.md"
  workflow_dispatch:

# Validation only: test the production publishing chain exactly as committed.
permissions:
  contents: read

concurrency:
  group: phase-6b-reliable-games-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Validate current publishing syntax
        run: |
          python -m py_compile scripts/phase6b_games_editor_transaction.py
          node --check scripts/validate-games-source.js
          node --check scripts/rebuild-games.js
          node --check scripts/build-games.js
          node --check scripts/audit-game-manuals.js
          node --check scripts/enforce-manual-only-game-pages.js
          node --check scripts/ensure-downloads-discovery-links.js
          node --check scripts/generate-downloads-page.js
          node --check scripts/validate-downloads-page.js
          node --check scripts/build-magazine-review-chunks.js
          node --check scripts/audit-magazine-review-coverage.js
          node --check scripts/ensure-magazine-review-runtime.js
          node --check scripts/mark-rerelease-publishers.js
          node --check scripts/link-publisher-strength-genres.js
          node --check scripts/generate-composer-pages.js
          node --check scripts/generate-year-platform-pages.js
          node --check scripts/integrate-year-platform-discovery.js
          node --check scripts/validate-year-platform-discovery.js
          node --check admin/js/games-editor.js

      - name: Run editor package regression
        run: node --test tests/games-editor-package.test.mjs

      - name: Run current catalogue publishing chain unchanged
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Verify deterministic current-catalogue output
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          git diff --binary > "$RUNNER_TEMP/second.diff"
          if ! cmp -s "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"; then
            echo "Deterministic rebuild mismatch:"
            diff -u "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff" || true
            exit 1
          fi
          git diff --check

      - name: Run synthetic C64 and Amiga manuals-only transactions
        shell: bash
        run: |
          set +e
          python scripts/phase6b_games_editor_transaction.py \
            --json-output "$RUNNER_TEMP/phase-6b-evidence.json" \
            --report-output docs/seo-baseline/phase-6b-reliable-games-publishing.md
          status=$?
          echo "Phase 6B transaction evidence:"
          cat "$RUNNER_TEMP/phase-6b-evidence.json" || true
          exit "$status"

      - name: Upload Phase 6B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6b-reliable-games-publishing-evidence
          path: ${{ runner.temp }}/phase-6b-evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove Python cache
        if: always()
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Confirm protected files are unchanged
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Confirm no real synthetic record exists
        if: always()
        shell: bash
        run: |
          ! grep -R "phase6b-synthetic" games/games.json games/games-index.json games/games-search.json

      - name: Confirm workflow is validation-only
        shell: bash
        run: |
          ! grep -q "git"" push" .github/workflows/phase-6b-reliable-games-publishing.yml
          echo "Phase 6B validates production publishing without mutating or pushing the source branch."
