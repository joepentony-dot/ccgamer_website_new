name: Safely retire old fully merged branches

on:
  pull_request:
    paths:
      - .github/workflows/ccg-retire-merged-branches.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/ccg-retire-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ccg-retire-merged-branches
  cancel-in-progress: false

jobs:
  guarded-retirement:
    if: github.repository == 'joepentony-dot/ccgamer_website_new'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout commit history without unnecessary media files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Audit and retire only verified safe branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_DELETIONS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Retire next batch of old merged branches') }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "joepentony-dot/ccgamer_website_new" ]]; then
            echo "Wrong repository; refusing to run." >&2
            exit 1
          fi

          # Obtain all refs, but do not download website/game media.
          git fetch --no-tags --filter=blob:none origin \
            '+refs/heads/*:refs/remotes/origin/*'

          # Abort if the GitHub API cannot provide the open-PR protection list.
          open_heads="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[].head.ref')"
          declare -A blocked=()
          while IFS= read -r head; do
            [[ -n "$head" ]] && blocked["$head"]=1
          done <<< "$open_heads"

          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          cutoff="$(( $(date -u +%s) - 120 * 86400 ))"
          examined=0
          eligible=0
          deleted=0
          failed=0
          max_deletions=65
          mode="DRY RUN"
          [[ "$APPLY_DELETIONS" == 'true' ]] && mode="LIVE (up to 65)"
          echo "Mode: $mode"
          echo "Base: $main_sha"
          echo "Age threshold: 120 days; original tip must be an ancestor of main"

          # Only dispose of old, ordinary task branches, not long-lived,
          # automation, release, staging, verification, or unknown refs.
          while IFS=$'\t' read -r branch sha tip_date; do
            [[ -n "$branch" ]] || continue
            ((examined+=1))
            case "$branch" in
              codex/*|fix/*|feature/*|feat/*|agent/*|perf/*|audit/*|seo/*|chore/*|upgrade/*|add/*) ;;
              *) continue ;;
            esac
            [[ "$branch" =~ ^[a-zA-Z0-9._/-]+$ ]] || continue
            [[ -z "${blocked[$branch]+blocked}" ]] || continue
            [[ "$tip_date" =~ ^[0-9]+$ ]] || continue
            (( tip_date < cutoff )) || continue
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            # A true Git ancestor of current main has no unique commits.
            git merge-base --is-ancestor "$sha" "$main_sha" || continue
            ((eligible+=1))
            echo "Eligible: $branch ($sha)"

            if [[ "$APPLY_DELETIONS" != 'true' ]]; then
              continue
            fi
            (( deleted + failed < max_deletions )) || break
            # Recheck remote ref before deletion to avoid stale selection.
            current="$(git ls-remote --heads origin "refs/heads/$branch")"
            if [[ "$current" != "$sha"$'\t'"refs/heads/$branch" ]]; then
              echo "SKIP: remote branch changed: $branch"
              continue
            fi
            # --force-with-lease makes deletion conditional on the exact SHA.
            if git push --porcelain \
              --force-with-lease="refs/heads/$branch:$sha" \
              origin ":refs/heads/$branch"; then
              echo "DELETED: $branch"
              ((deleted+=1))
            else
              echo "FAILED (retained): $branch" >&2
              ((failed+=1))
            fi
          done < <(git for-each-ref --sort=committerdate \
            --format='%(refname:strip=3)%09%(objectname)%09%(committerdate:unix)' \
            refs/remotes/origin)

          {
            echo '### Conservative old branch retirement'
            echo
            echo "- Mode: $mode"
            echo "- Examined: $examined"
            echo "- Eligible old branches found: $eligible"
            echo "- Deleted: $deleted"
            echo "- Deletion failures (branches retained): $failed"
            echo '- Protected: open PR heads, main, automation, staging, releases, and all branches with commits not contained in main'
          } >> "$GITHUB_STEP_SUMMARY"
          (( failed == 0 )) || exit 1
