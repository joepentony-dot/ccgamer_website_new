name: Fix Mastertronic publisher logo 2026-08-04

on:
  push:
    branches:
      - fix/mastertronic-broken-image-20260804
    paths:
      - ".github/workflows/fix-mastertronic-logo-20260804.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/mastertronic-broken-image-20260804
          fetch-depth: 0

      - name: Record protected file hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum index.html home.html resources/css/intro.css js/index-intro.js > "$RUNNER_TEMP/protected.sha256"

      - name: Restore exact uploaded Mastertronic PNG
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bdf5492a28e557a3e1dfd2b0f6bd8418ef88fc82
          git show bdf5492a28e557a3e1dfd2b0f6bd8418ef88fc82:mastertronic.png \
            > resources/images/publishers/mastertronic.png

          python <<'PY'
          from pathlib import Path
          import struct

          path = Path("resources/images/publishers/mastertronic.png")
          data = path.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Recovered Mastertronic asset is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (600, 240):
              raise SystemExit(f"Unexpected Mastertronic dimensions: {width}x{height}")
          print(f"Validated Mastertronic PNG: {width}x{height}, {len(data)} bytes")
          PY

      - name: Replace failing SVG references
        shell: bash
        run: |
          set -euo pipefail
          rm -f resources/images/publishers/mastertronic.svg
          rm -f resources/images/publishers/mastertronic.webp

          mapfile -t files < <(git grep -l 'mastertronic\.svg' || true)
          for file in "${files[@]}"; do
            sed -i 's#mastertronic\.svg#mastertronic.png#g' "$file"
          done

          mapfile -t webp_files < <(git grep -l 'mastertronic\.webp' || true)
          for file in "${webp_files[@]}"; do
            sed -i 's#mastertronic\.webp#mastertronic.png#g' "$file"
          done

      - name: Validate publisher logo output
        shell: bash
        run: |
          set -euo pipefail
          test -s resources/images/publishers/mastertronic.png
          test ! -e resources/images/publishers/mastertronic.svg
          test ! -e resources/images/publishers/mastertronic.webp
          ! git grep -n 'mastertronic\.svg'
          ! git grep -n 'mastertronic\.webp'
          node scripts/validate-publisher-logo-output.js
          sha256sum --check "$RUNNER_TEMP/protected.sha256"
          git diff --check

      - name: Commit clean fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mastertronic-logo-20260804.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix broken Mastertronic publisher logo"
          git push origin HEAD:fix/mastertronic-broken-image-20260804
