name: Correct Cloudflare Audio Admin PR

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ccg-cloudflare-audio-pr-fix.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Cloudflare audio PR branch
        uses: actions/checkout@v5
        with:
          ref: codex/cloudflare-audio-admin-31623943841-1
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /admin/js/archive-quality.js
            /admin/archive-quality.html
            /admin/content-publisher.html
            /admin/js/content-publisher.js
            /admin/games-editor.html
            /admin/js/games-editor.js
            /games/games.json
            /js/ccg-music-config.js
            /scripts/validate-games-source.js
            /tests/cloudflare-audio-admin.test.mjs

      - name: Correct resource task scope
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'admin/js/archive-quality.js';
          let source = fs.readFileSync(path, 'utf8');
          const bad = "    }\n    });\n\n    [game?.pdf, game?.disk]";
          const good = "    }\n\n    [game?.pdf, game?.disk]";
          if (!source.includes(bad)) throw new Error('Expected stray closure was not found exactly once.');
          if (source.indexOf(bad) !== source.lastIndexOf(bad)) throw new Error('Stray closure pattern matched more than once.');
          source = source.replace(bad, good);
          fs.writeFileSync(path, source, 'utf8');

          const testPath = 'tests/cloudflare-audio-admin.test.mjs';
          let testSource = fs.readFileSync(testPath, 'utf8');
          const insertion = "\n  assert.doesNotMatch(js, /\\n\\s*\\}\\);\\n\\n\\s*\\[game\\?\\.pdf, game\\?\\.disk\\]/, 'Local linked-file checks must remain inside the per-game resource loop');";
          const anchor = "  assert.doesNotMatch(js, /resources\\/audio\\/games/);";
          if (!testSource.includes(anchor)) throw new Error('Regression-test insertion point missing.');
          testSource = testSource.replace(anchor, anchor + insertion);
          fs.writeFileSync(testPath, testSource, 'utf8');
          NODE

      - name: Validate corrected PR branch
        shell: bash
        run: |
          node --check admin/js/archive-quality.js
          node --check admin/js/content-publisher.js
          node --check admin/js/games-editor.js
          node --test tests/cloudflare-audio-admin.test.mjs
          node scripts/validate-games-source.js
          git diff --check

      - name: Push correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/js/archive-quality.js tests/cloudflare-audio-admin.test.mjs
          git commit -m "Keep archive resource checks inside the game loop"
          git push origin HEAD:codex/cloudflare-audio-admin-31623943841-1
