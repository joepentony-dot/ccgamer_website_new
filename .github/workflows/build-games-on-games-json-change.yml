name: Manual legacy game output validation

# Historical lightweight builder retained only as a manual diagnostic.
# Reliable Games Publishing (.github/workflows/games-publishing.yml) is the
# single authoritative writer for generated game pages, archives, search data
# and sitemaps after games/games.json changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-games-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate builder syntax
        run: node --check scripts/build-games.js

      - name: Build generated game assets in validation workspace
        run: node scripts/build-games.js
        env:
          CI: '1'
          CCG_BUILD_GAME_PAGES: '1'

      - name: Validate generated diff
        run: git diff --check

      - name: Explain publishing ownership
        run: |
          echo "This workflow is validation-only."
          echo "Run Reliable Games Publishing to publish generated game/archive/sitemap output."
