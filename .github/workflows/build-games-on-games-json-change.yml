name: Build games outputs

on:
  push:
    branches:
      - main
    paths:
      - 'games/games.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-generated-games-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build generated game assets
        run: node scripts/build-games.js
        env:
          CI: '1'
          CCG_BUILD_GAME_PAGES: '1'

      - name: Commit generated files
        run: |
          echo "[build-games] Checking for generated file changes..."
          if git diff --quiet; then
            echo "[build-games] No generated file changes."
            exit 0
          fi

          echo "[build-games] Changes detected. Preparing commit..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/games-index.json games/games-search.json sitemap-games.xml games
          git commit -m "chore(games): rebuild generated game assets"
          echo "[build-games] Pushing generated assets commit..."
          git push
