name: Manual game output recovery check

# Recovery/diagnostic workflow only.
# Automatic game publishing is owned by .github/workflows/games-publishing.yml,
# which runs the complete validated archive/SEO/sitemap publishing chain.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-generated-games-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate generator syntax
        run: |
          node --check scripts/build-games.js
          node --check scripts/rebuild-games.js
          node --check scripts/validate-sitemaps.js
          node --check scripts/audit-publishing-automation.js

      - name: Run authoritative publishing chain in recovery mode
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Run publishing and indexing guard
        run: node scripts/audit-publishing-automation.js

      - name: Verify generated diff
        run: git diff --check

      - name: Report recovery output without publishing
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated game/archive output is already current."
          else
            echo "Recovery check found generated differences."
            echo "Use Reliable Games Publishing to publish them; this recovery workflow never pushes to main."
            git status --short
          fi
