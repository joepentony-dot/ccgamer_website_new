name: Lost Sizzler Apply Tighten

on:
  pull_request:
    paths:
      - '.github/workflows/lost-sizzler-apply-tighten.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tightening branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-sizzler-browser-stability-gameplay
          fetch-depth: 0

      - name: Reuse validated tightening transform
        shell: bash
        run: |
          set -euo pipefail
          payload="$(sed -n "s/^          echo '\(.*\)' | base64 -d > \/tmp\/lost-sizzler-tighten.py$/\1/p" .github/workflows/lost-sizzler-final-tighten.yml)"
          test -n "$payload"
          printf '%s' "$payload" | base64 -d > /tmp/lost-sizzler-tighten.py
          python /tmp/lost-sizzler-tighten.py
          node --check arcade/lost-sizzler/js/v10-36-bootstrap.js
          node --check arcade/lost-sizzler/js/v10-12-developer-changelog.js
          node --check arcade/lost-sizzler/tests/v10-6-browser.mjs
          node --check arcade/lost-sizzler/tests/v10-28-browser-stability.mjs

      - name: Commit game and test tightening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/lost-sizzler
          git commit -m 'Tighten Lost Sizzler r21 release edges'
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
