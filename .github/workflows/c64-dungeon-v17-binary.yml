name: C64 Dungeon Carnage v1.7 Binary Validation

on:
  push:
    branches:
      - codex/c64-dungeon-v17-binary-build
    paths:
      - '.github/workflows/c64-dungeon-v17-binary.yml'
      - 'tools/c64-binary-build/v17/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install authentic C64 toolchain
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y cc65 vice xvfb xauth curl
          cl65 --version

      - name: Restore and verify exact v1.7 source payload
        run: |
          rm -rf /tmp/dungeon-v17 /tmp/dungeon-v17.tar.gz /tmp/dungeon-v17.tar.gz.b64
          mkdir -p /tmp/dungeon-v17
          cat tools/c64-binary-build/v17/chunks/payload.part-* > /tmp/dungeon-v17.tar.gz.b64
          test "$(wc -c < /tmp/dungeon-v17.tar.gz.b64)" = "23588"
          echo 'ce9693ab84999db05856b9289c9ad57abe3a0809f0b43d8194d967b288fe5f4a  /tmp/dungeon-v17.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/dungeon-v17.tar.gz.b64 > /tmp/dungeon-v17.tar.gz
          echo 'feb03f66af46b11620b9d02af5c83feb9b7439c468de20e18e9678fa8554844c  /tmp/dungeon-v17.tar.gz' | sha256sum -c -
          tar -xzf /tmp/dungeon-v17.tar.gz -C /tmp/dungeon-v17
          mkdir -p /tmp/dungeon-v17/tools /tmp/dungeon-v17/tests/stubs
          cp .c64-v17-support/validate_release.py /tmp/dungeon-v17/tools/validate_release.py
          cp .c64-v17-support/stubs/*.h /tmp/dungeon-v17/tests/stubs/
          python3 .c64-v17-support/apply_cc65_compat.py

      - name: Run v1.7 source regressions
        working-directory: /tmp/dungeon-v17
        run: python3 tests/test_v17.py

      - name: Compile real 6502 C64 PRG with cc65
        working-directory: /tmp/dungeon-v17
        run: |
          mkdir -p build
          cl65 -Oirs -t c64 -C c64-game.cfg \
            -m build/DUNGEON-CARNAGE-64.map \
            -Ln build/DUNGEON-CARNAGE-64.lbl \
            -o build/DUNGEON-CARNAGE-64.prg src/main.c
          test -s build/DUNGEON-CARNAGE-64.prg
          test "$(stat -c%s build/DUNGEON-CARNAGE-64.prg)" = "23578"
          echo '93f51958590964fccb27b0ab7c7c9da49ad6cb82e95a358193d580e602d9429a  build/DUNGEON-CARNAGE-64.prg' | sha256sum -c -

      - name: Build and verify D64 filesystem
        working-directory: /tmp/dungeon-v17
        run: |
          python3 tools/make_d64.py build/DUNGEON-CARNAGE-64.prg build/DUNGEON-CARNAGE-64-v1.7.d64
          test "$(stat -c%s build/DUNGEON-CARNAGE-64-v1.7.d64)" = "174848"
          echo '1c881d728a860c8fefc2d64ebfc02fb9eef36ca4d6c29bfe593f2e462fe8d75f  build/DUNGEON-CARNAGE-64-v1.7.d64' | sha256sum -c -
          c1541 build/DUNGEON-CARNAGE-64-v1.7.d64 -list | tee build/D64-DIRECTORY.txt
          grep -qi 'DUNGEON CARNAGE' build/D64-DIRECTORY.txt
          sha256sum build/DUNGEON-CARNAGE-64.prg build/DUNGEON-CARNAGE-64-v1.7.d64 > build/SHA256SUMS.txt

      - name: Supply ephemeral VICE ROM data for CI boot only
        run: |
          mkdir -p /tmp/vice-roms/C64 /tmp/vice-roms/DRIVES
          base='https://raw.githubusercontent.com/VICE-Team/svn-mirror/main/vice/data'
          curl -fL "$base/C64/basic-901226-01.bin" -o /tmp/vice-roms/C64/basic-901226-01.bin
          curl -fL "$base/C64/chargen-901225-01.bin" -o /tmp/vice-roms/C64/chargen-901225-01.bin
          curl -fL "$base/C64/kernal-901227-03.bin" -o /tmp/vice-roms/C64/kernal-901227-03.bin
          curl -fL "$base/DRIVES/dos1541-325302-01+901229-05.bin" -o '/tmp/vice-roms/DRIVES/dos1541-325302-01+901229-05.bin'
          curl -fL "$base/DRIVES/dos1541ii-251968-03.bin" -o /tmp/vice-roms/DRIVES/dos1541ii-251968-03.bin
          test "$(stat -c%s /tmp/vice-roms/C64/basic-901226-01.bin)" = '8192'
          test "$(stat -c%s /tmp/vice-roms/C64/chargen-901225-01.bin)" = '4096'
          test "$(stat -c%s /tmp/vice-roms/C64/kernal-901227-03.bin)" = '8192'
          test "$(stat -c%s '/tmp/vice-roms/DRIVES/dos1541-325302-01+901229-05.bin')" = '16384'
          for root in /usr/share/vice /usr/lib/vice; do
            sudo mkdir -p "$root/C64" "$root/DRIVES"
            sudo cp /tmp/vice-roms/C64/* "$root/C64/"
            sudo cp /tmp/vice-roms/DRIVES/* "$root/DRIVES/"
          done

      - name: VICE PAL boot smoke test
        working-directory: /tmp/dungeon-v17
        shell: bash
        run: |
          mkdir -p build/vice
          EMU="$(command -v x64sc || command -v x64 || true)"
          test -n "$EMU"
          echo "Using VICE: $EMU"
          set +e
          timeout 30s xvfb-run -a "$EMU" \
            -pal -silent -warp -sounddev dummy \
            -kernal /tmp/vice-roms/C64/kernal-901227-03.bin \
            -basic /tmp/vice-roms/C64/basic-901226-01.bin \
            -chargen /tmp/vice-roms/C64/chargen-901225-01.bin \
            -dos1541 '/tmp/vice-roms/DRIVES/dos1541-325302-01+901229-05.bin' \
            -autostart build/DUNGEON-CARNAGE-64-v1.7.d64 \
            -limitcycles 5000000 \
            -exitscreenshot build/vice/boot.png \
            > build/vice/vice.log 2>&1
          rc=$?
          set -e
          echo "VICE exit code: $rc"
          tail -200 build/vice/vice.log || true
          test "$rc" -eq 0
          test -s build/vice/boot.png
          if grep -Eqi 'panic|fatal error|segmentation fault' build/vice/vice.log; then exit 1; fi

      - name: Record validation summary
        if: always()
        working-directory: /tmp/dungeon-v17
        shell: bash
        run: |
          mkdir -p build
          {
            echo 'Cheeky Commodore Gamer: Dungeon Carnage 64 v1.7'
            echo 'Authentic cc65 + VICE binary-validation run'
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS $RUNNER_ARCH"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cl65 --version 2>&1 || true
            (x64sc --version || x64 --version) 2>&1 | head -20 || true
          } > build/BINARY-VALIDATION.txt

      - name: Upload compiled C64 release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-carnage-64-v1.7-binary
          if-no-files-found: error
          retention-days: 7
          path: |
            /tmp/dungeon-v17/build/DUNGEON-CARNAGE-64.prg
            /tmp/dungeon-v17/build/DUNGEON-CARNAGE-64-v1.7.d64
            /tmp/dungeon-v17/build/DUNGEON-CARNAGE-64.map
            /tmp/dungeon-v17/build/DUNGEON-CARNAGE-64.lbl
            /tmp/dungeon-v17/build/D64-DIRECTORY.txt
            /tmp/dungeon-v17/build/SHA256SUMS.txt
            /tmp/dungeon-v17/build/BINARY-VALIDATION.txt
            /tmp/dungeon-v17/build/vice/**
