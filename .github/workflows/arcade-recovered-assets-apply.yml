name: Arcade Recovered Assets Apply

on:
  push:
    branches:
      - codex/arcade-recovered-assets-fix
    paths:
      - 'scripts/arcade-recover-uploaded-assets.py'
      - '.github/workflows/arcade-recovered-assets-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/arcade-recovered-assets-fix
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover uploaded Arcade assets and apply runtime corrections
        run: python scripts/arcade-recover-uploaded-assets.py

      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          node --check arcade/quest/game/main-v2.js
          node --check arcade/quest/game/assets-config.js
          node --check arcade/quest/game/remote-assets.js
          node --check scripts/validate-arcade-quest.js
          node scripts/validate-arcade-quest.js
          git diff --check

      - name: Remove one-time recovery helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/arcade-recover-uploaded-assets.py
          rm -f .github/workflows/arcade-recovered-assets-apply.yml

      - name: Commit recovered artwork and corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/quest/assets/production
          git add arcade/quest/game/assets-config.js arcade/quest/game/main-v2.js
          git add scripts/validate-arcade-quest.js
          git add -u scripts/arcade-recover-uploaded-assets.py .github/workflows/arcade-recovered-assets-apply.yml
          if git diff --cached --quiet; then
            echo 'No correction changes to commit.'
            exit 0
          fi
          git commit -m "Recover Commodore Quest uploaded assets and ducking"
          git push origin HEAD:codex/arcade-recovered-assets-fix

# Trigger recovery after the workflow is present on the branch.
