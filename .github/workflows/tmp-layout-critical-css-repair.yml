name: Temporary CCG Layout Critical CSS Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote layout-critical CSS before paint and prove frame stability
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'scripts/normalize-public-header-shell.js',
              '  "/resources/css/ccg-global-search.css",\n  "/resources/css/ccg-socials.css",',
              '  "/resources/css/ccg-global-search.css",\n  "/resources/css/ccg-inner-page-density.css",\n  "/resources/css/ccg-scroll-authority.css",\n  "/resources/css/ccg-socials.css",'
          )

          replace(
              'service-worker.js',
              '  "/resources/css/ccg-global-search.css",\n  "/resources/css/zzap64-performance.css",',
              '  "/resources/css/ccg-global-search.css",\n  "/resources/css/ccg-inner-page-density.css",\n  "/resources/css/ccg-scroll-authority.css",\n  "/resources/css/zzap64-performance.css",'
          )

          replace(
              'js/ccg-release-check.js',
              '        "/resources/css/ccg-global-search.css",\n        "/resources/css/zzap64-performance.css",',
              '        "/resources/css/ccg-global-search.css",\n        "/resources/css/ccg-inner-page-density.css",\n        "/resources/css/ccg-scroll-authority.css",\n        "/resources/css/zzap64-performance.css",'
          )

          p = Path('tests/global-shell-auth.test.mjs')
          text = p.read_text(encoding='utf-8')
          anchor = "    '/resources/css/ccg-global-search.css',\n"
          if text.count(anchor) != 1:
              raise SystemExit('global shell test: global-search asset anchor missing')
          text = text.replace(anchor, anchor + "    '/resources/css/ccg-inner-page-density.css',\n    '/resources/css/ccg-scroll-authority.css',\n", 1)
          p.write_text(text, encoding='utf-8')

          for js in [
              'scripts/normalize-public-header-shell.js',
              'scripts/audit-header-frame-local.js',
              'scripts/audit-nav-more-browser.js',
              'js/ccg-release-check.js'
          ]:
              subprocess.run(['node','--check',js], check=True)

          subprocess.run(['node','scripts/normalize-public-header-shell.js','--root','.'], check=True)
          subprocess.run(['node','scripts/normalize-public-header-shell.js','--root','.','--check'], check=True)
          subprocess.run(['node','--test','tests/public-header-stage-normalizer.test.mjs','tests/global-shell-auth.test.mjs'], check=True)
          subprocess.run(['node','scripts/audit-header-frame-local.js'], check=True)
          subprocess.run(['node','scripts/audit-nav-more-browser.js'], check=True)

          protected = ['index.html','resources/css/intro.css','js/index-intro.js','games/games.json']
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          bad = [name for name in protected if name in changed]
          if bad:
              raise SystemExit('Protected files changed: ' + ', '.join(bad))
      - name: Commit proven first-paint CSS repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/normalize-public-header-shell.js service-worker.js js/ccg-release-check.js tests/global-shell-auth.test.mjs
          git add -- '*.html'
          git diff --cached --check
          git commit -m "Load layout-critical shared styles before first paint [repair-bot]"
          git push origin HEAD:${{ github.head_ref }}
