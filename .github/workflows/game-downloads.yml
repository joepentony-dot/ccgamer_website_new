name: Validate Game Downloads Archive

on:
  push:
    branches:
      - main
    paths:
      - "games/games.json"
      - "home.html"
      - "games/index.html"
      - "scripts/ensure-downloads-discovery-links.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/update-downloads-sitemap.js"
      - "scripts/update-downloads-static-pages.js"
      - "scripts/validate-downloads-page.js"
      - "scripts/publisher-utils.js"
      - "scripts/rebuild-games.js"
      - "resources/css/downloads.css"
      - "js/game-downloads.js"
      - "js/ccg-nav.js"
      - ".github/workflows/game-downloads.yml"
  pull_request:
    branches:
      - main
    paths:
      - "games/games.json"
      - "home.html"
      - "games/index.html"
      - "scripts/ensure-downloads-discovery-links.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/update-downloads-sitemap.js"
      - "scripts/update-downloads-static-pages.js"
      - "scripts/validate-downloads-page.js"
      - "scripts/publisher-utils.js"
      - "scripts/rebuild-games.js"
      - "resources/css/downloads.css"
      - "js/game-downloads.js"
      - "js/ccg-nav.js"
      - ".github/workflows/game-downloads.yml"
  workflow_dispatch:

# This workflow is deliberately validation-only. Reliable Games Publishing owns
# generated Game Downloads A-Z output and merges it through the protected-main
# publishing route. Keeping one writer prevents competing automation commits.
permissions:
  contents: read

concurrency:
  group: validate-game-downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate downloads source files
        run: |
          node --check scripts/ensure-downloads-discovery-links.js
          node --check scripts/generate-downloads-page.js
          node --check scripts/update-downloads-sitemap.js
          node --check scripts/update-downloads-static-pages.js
          node --check scripts/validate-downloads-page.js
          node --check js/game-downloads.js
          node --check js/ccg-nav.js

      - name: Build downloads output in validation workspace
        run: |
          node scripts/ensure-downloads-discovery-links.js
          node scripts/generate-downloads-page.js
          node scripts/update-downloads-static-pages.js
          node scripts/update-downloads-sitemap.js

      - name: Verify downloads discovery and accordion archive
        shell: bash
        run: |
          test -s games/downloads/index.html
          if grep -q 'home-explore-grid' home.html; then
            echo "Streamlined homepage detected; downloads discovery is intentionally routed through Browse Games."
          else
            grep -q 'data-home-downloads-card="true"' home.html
            grep -q 'href="/games/downloads/"' home.html
          fi
          grep -q 'data-games-downloads-shortcut="true"' games/index.html
          grep -q 'href="/games/downloads/"' games/index.html
          grep -q 'id="downloadSearchInput"' games/downloads/index.html
          grep -q '<details class="ccg-downloads-letter"' games/downloads/index.html
          grep -q 'data-src=' games/downloads/index.html
          grep -q 'data-direct-download' games/downloads/index.html
          grep -q '>Download Game<' games/downloads/index.html
          grep -q '>Game Page<' games/downloads/index.html
          ! grep -q 'View Game &amp; Download' games/downloads/index.html
          test "$(grep -c 'https://www.cheekycommodoregamer.co.uk/games/downloads/' sitemap-pages.xml)" -eq 1
          node -e 'const pages=require("./tools/seo/static-pages.json"); if (pages[0] !== "" || !pages.includes("games/downloads/index.html")) process.exit(1);'

      - name: Validate every downloadable game is in A-Z
        run: node scripts/validate-downloads-page.js

      - name: Verify shared archive registrations survive
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pages = JSON.parse(fs.readFileSync("tools/seo/static-pages.json", "utf8"));
          const sitemap = fs.readFileSync("sitemap-pages.xml", "utf8");
          const developerEntries = pages.filter((entry) => (
            typeof entry === "string" &&
            /^games\/developers\/(?:index\.html|[^/]+\/index\.html)$/.test(entry)
          ));

          for (const entry of developerEntries) {
            const url = `https://www.cheekycommodoregamer.co.uk/${entry.replace(/index\.html$/, "")}`;
            if (!sitemap.includes(`<loc>${url}</loc>`)) {
              throw new Error(`Shared developer sitemap entry was lost: ${url}`);
            }
          }

          console.log(`[downloads] Preserved ${developerEntries.length} developer sitemap registrations.`);
          NODE

      - name: Validate sitemaps
        run: node scripts/validate-sitemaps.js

      - name: Confirm bounded downloads scope
        run: |
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          )
          paths = []
          for line in output.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)

          allowed = {
              "home.html",
              "games/index.html",
              "games/downloads/index.html",
              "tools/seo/static-pages.json",
              "sitemap-pages.xml",
          }
          unexpected = sorted(path for path in paths if path not in allowed)
          if unexpected:
              raise SystemExit(f"Unexpected downloads workflow paths: {unexpected}")
          print(f"Validated {len(paths)} downloads workflow paths.")
          PY

      - name: Confirm workflow is validation-only
        run: |
          echo "Downloads output validated. No files are committed by this workflow."
          echo "Reliable Games Publishing remains the sole generated-output writer."
