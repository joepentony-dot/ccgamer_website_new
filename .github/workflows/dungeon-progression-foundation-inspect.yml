name: Dungeon Progression Foundation Inspect

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - .github/workflows/dungeon-progression-foundation-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact progression mutation sites
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='arcade/lost-sizzler/js/game-core.js';
          const s=fs.readFileSync(file,'utf8');
          const needles=[
            'score+=','score +=','score-=','score -=',
            '.weapon=','.weapon =','weaponLoot',
            'kind==="credits"','kind === "credits"','kind==="weapon"','kind === "weapon"',
            'hp<=0','hp <= 0','alive=false','alive = false',
            'treasure','escapeMs','KeyX','Digit1','BracketLeft','BracketRight',
            'function interact','function pickup','function updateEnemies','function updateEnemy',
            'function openChest','function sync','function updateHUD'
          ];
          console.log(`===== ${file} (${s.length} bytes, ${s.split('\n').length} lines) =====`);
          for(const needle of needles){
            let from=0,hit=0;
            while((from=s.indexOf(needle,from))!==-1 && hit<20){
              hit++;
              const a=Math.max(0,from-1100),b=Math.min(s.length,from+needle.length+2600);
              console.log(`\n--- ${needle} #${hit} @ ${from} ---\n${s.slice(a,b)}`);
              from+=needle.length;
            }
          }
          NODE
