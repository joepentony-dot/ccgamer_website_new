name: Dungeon Progression Foundation Inspect

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - .github/workflows/dungeon-progression-foundation-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinpoint progression mutation lines
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='arcade/lost-sizzler/js/game-core.js';
          const lines=fs.readFileSync(file,'utf8').split('\n');
          const needles=['.weapon=','.weapon =','weaponLoot','kind==="credits"','kind === "credits"','kind==="weapon"','kind === "weapon"','hp<=0','hp <= 0','alive=false','alive = false','treasure','escapeMs','KeyX','Digit1','BracketLeft','BracketRight','function interact','function pickup','function updateEnemies','function updateEnemy','function openChest'];
          for(const needle of needles){
            for(let i=0;i<lines.length;i++){
              let at=lines[i].indexOf(needle),hit=0;
              while(at!==-1&&hit<8){
                const a=Math.max(0,at-420),b=Math.min(lines[i].length,at+needle.length+900);
                console.log(`LINE ${i+1} :: ${needle} :: ${lines[i].slice(a,b)}`);
                hit++;at=lines[i].indexOf(needle,at+needle.length);
              }
            }
          }
          NODE
