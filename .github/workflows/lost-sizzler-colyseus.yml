name: Lost Sizzler Colyseus Validation

on:
  pull_request:
    paths:
      - "multiplayer-server/**"
      - "arcade/lost-sizzler/js/horde-survivor.js"
      - "arcade/lost-sizzler/js/v10-41-r38-colyseus-horde.js"
      - "arcade/lost-sizzler/js/v10-41-r40-colyseus-dungeon.js"
      - "render.yaml"
      - ".github/workflows/lost-sizzler-colyseus.yml"
  push:
    branches:
      - main
    paths:
      - "multiplayer-server/**"
      - "arcade/lost-sizzler/js/horde-survivor.js"
      - "arcade/lost-sizzler/js/v10-41-r38-colyseus-horde.js"
      - "arcade/lost-sizzler/js/v10-41-r40-colyseus-dungeon.js"
      - "render.yaml"
      - ".github/workflows/lost-sizzler-colyseus.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplayer-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiplayer-server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Typecheck Colyseus server
        run: npm run typecheck
      - name: Build Colyseus server
        run: npm run build
      - name: Boot server and exercise real Horde and Dungeon rooms
        shell: bash
        run: |
          set -euo pipefail
          PORT=10000 npm start > /tmp/lost-sizzler-colyseus.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if node -e 'fetch("http://127.0.0.1:10000/healthz").then(async r=>{const body=await r.json();if(!r.ok||body.ok!==true||body.hordeAuthority!=="server"||body.dungeonTransport!=="colyseus")process.exit(1)}).catch(()=>process.exit(1))'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lost-sizzler-colyseus.log
            exit 1
          fi
          node -e 'fetch("http://127.0.0.1:10000/").then(async r=>{const body=await r.json();if(!r.ok||body.transport!=="colyseus"||body.hordeAuthority!=="server"||body.dungeonTransport!=="colyseus"||!body.rooms?.includes("dungeon_v1"))process.exit(1)}).catch(()=>process.exit(1))'
          npm run smoke:local || {
            cat /tmp/lost-sizzler-colyseus.log
            exit 1
          }
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
