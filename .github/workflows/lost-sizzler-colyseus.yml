name: Lost Sizzler Colyseus Validation

on:
  pull_request:
    paths:
      - "multiplayer-server/**"
      - "render.yaml"
      - ".github/workflows/lost-sizzler-colyseus.yml"
  push:
    branches:
      - main
    paths:
      - "multiplayer-server/**"
      - "render.yaml"
      - ".github/workflows/lost-sizzler-colyseus.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplayer-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiplayer-server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Typecheck Colyseus server
        run: npm run typecheck
      - name: Build Colyseus server
        run: npm run build
