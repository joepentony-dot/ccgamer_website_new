name: "One-time Olli and Lissa VP8X metadata compatibility"
on:
  push:
    branches:
      - ccg/olli-and-lissa-1987-staging
    paths:
      - ".github/workflows/olli-lissa-vp8x-once.yml"
permissions:
  contents: write
jobs:
  preserve-thumbnail-pixels-and-repair-header:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/ccg/olli-and-lissa-1987-staging'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add VP8X container canvas without re-encoding artwork
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "resources/images/thumbnails/all/olli-and-lissa.webp";
          const file = fs.readFileSync(path);
          if (file.toString("ascii",0,4) !== "RIFF" ||
              file.toString("ascii",8,12) !== "WEBP" ||
              file.toString("ascii",12,16) !== "VP8 ") {
            throw new Error("Unexpected source WebP format, refusing mutation");
          }
          if (file.readUInt32LE(4) !== file.length-8) {
            throw new Error("Invalid WebP RIFF length");
          }
          const vp8x = Buffer.alloc(18);
          vp8x.write("VP8X",0,"ascii");
          vp8x.writeUInt32LE(10,4);
          vp8x.writeUIntLE(459,12,3);
          vp8x.writeUIntLE(214,15,3);
          const fixed = Buffer.concat([file.subarray(0,12), vp8x, file.subarray(12)]);
          fixed.writeUInt32LE(fixed.length-8,4);
          fs.writeFileSync(path,fixed);
          const verify=fs.readFileSync(path);
          if(verify.toString("ascii",12,16)!=="VP8X"||
              verify.readUIntLE(24,3)+1!==460||
              verify.readUIntLE(27,3)+1!==215) {
            throw new Error("Thumbnail VP8X dimensions verification failed");
          }
          console.log("Preserved original VP8 image bitstream; VP8X canvas is 460x215.");
          NODE
          git add -- resources/images/thumbnails/all/olli-and-lissa.webp
          git diff --cached --check
          git config user.name "ccg-artwork-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Olli and Lissa WebP dimensions compatible with existing generator"
          git push origin HEAD:ccg/olli-and-lissa-1987-staging
