name: Phase 7E Asset Optimisation Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase-7e-asset-optimisation-audit.yml"
      - "scripts/phase7e_asset_optimisation_audit.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-7e-asset-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-optimisation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Phase 7E branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Fetch main baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate Phase 7E tooling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/phase7e_asset_optimisation_audit.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Phase 7E audit script compiles.")
          PY

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/phase7e-protected.sha256"

      - name: Record image manifest before audit
        run: |
          python scripts/phase7e_asset_optimisation_audit.py fingerprint \
            --output "$RUNNER_TEMP/phase-7e-images-before.json"

      - name: Run read-only asset audit
        run: |
          python scripts/phase7e_asset_optimisation_audit.py audit \
            --report docs/seo-baseline/phase-7e-asset-optimisation-audit.md \
            --evidence docs/seo-baseline/phase-7e-asset-optimisation-evidence.json
          test -s docs/seo-baseline/phase-7e-asset-optimisation-audit.md
          test -s docs/seo-baseline/phase-7e-asset-optimisation-evidence.json

      - name: Confirm image assets are byte-identical
        run: |
          python scripts/phase7e_asset_optimisation_audit.py fingerprint \
            --output "$RUNNER_TEMP/phase-7e-images-after.json"
          cmp "$RUNNER_TEMP/phase-7e-images-before.json" "$RUNNER_TEMP/phase-7e-images-after.json"

      - name: Validate audit evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("docs/seo-baseline/phase-7e-asset-optimisation-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          if evidence.get("phase") != "7E" or evidence.get("mode") != "read-only":
              raise SystemExit("Phase 7E evidence identity is invalid.")
          summary = evidence.get("summary", {})
          if int(summary.get("image_files", 0)) < 1:
              raise SystemExit("Phase 7E found no raster image assets.")
          if int(summary.get("total_bytes", 0)) < 1:
              raise SystemExit("Phase 7E total image size is invalid.")
          print(json.dumps(summary, indent=2))
          PY
          git diff --check

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/phase7e-protected.sha256"

      - name: Confirm exact read-only scope
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              ".github/workflows/phase-7e-asset-optimisation-audit.yml",
              "scripts/phase7e_asset_optimisation_audit.py",
              "docs/seo-baseline/phase-7e-asset-optimisation-audit.md",
              "docs/seo-baseline/phase-7e-asset-optimisation-evidence.json",
          }
          image_extensions = {".png", ".jpg", ".jpeg", ".webp"}
          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted({*tracked, *untracked})
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit(f"Unexpected Phase 7E paths: {unexpected}")
          changed_images = [
              path for path in changed if Path(path).suffix.lower() in image_extensions
          ]
          if changed_images:
              raise SystemExit(f"Phase 7E modified image assets: {changed_images}")
          print(f"Validated read-only Phase 7E scope ({len(changed)} files).")
          PY

      - name: Upload Phase 7E evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-7e-asset-optimisation-audit
          path: |
            ${{ runner.temp }}/phase-7e-images-before.json
            ${{ runner.temp }}/phase-7e-images-after.json
            docs/seo-baseline/phase-7e-asset-optimisation-audit.md
            docs/seo-baseline/phase-7e-asset-optimisation-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish audit summary
        run: cat docs/seo-baseline/phase-7e-asset-optimisation-audit.md >> "$GITHUB_STEP_SUMMARY"
