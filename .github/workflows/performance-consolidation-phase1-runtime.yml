name: Performance consolidation phase 1 runtime

on:
  push:
    branches:
      - codex/performance-consolidation-phase-1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            home.html
            resources/css/home.css
            resources/css/home-debug.css
            service-worker.js
            js/ccg-mobile-lite.js
            tests/performance-consolidation-phase1.mjs
            tests/ccg-mobile-lite-startup.mjs

      - name: Restore guarded files and optimise startup scan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- home.html resources/css/home.css resources/css/home-debug.css service-worker.js
          rm -f tests/performance-consolidation-phase1.mjs

          python - <<'PY'
          from pathlib import Path

          path = Path('js/ccg-mobile-lite.js')
          text = path.read_text(encoding='utf-8')

          old_fn = '''    const retireLegacyRetailerCommissionUi = () => {\n        document.querySelectorAll("#affiliate-products-section").forEach((section) => {'''
          new_fn = '''    let legacyRetailerCommissionUiInitialPassDone = false;\n\n    const retireLegacyRetailerCommissionUi = ({ force = false } = {}) => {\n        if (!document.body) return;\n        if (!force && legacyRetailerCommissionUiInitialPassDone) return;\n        legacyRetailerCommissionUiInitialPassDone = true;\n\n        document.querySelectorAll("#affiliate-products-section").forEach((section) => {'''
          if old_fn not in text:
              raise SystemExit('Expected retailer cleanup function signature not found')
          text = text.replace(old_fn, new_fn, 1)

          old_listener = '    window.addEventListener("ccg:game-loaded", retireLegacyRetailerCommissionUi);'
          new_listener = '    window.addEventListener("ccg:game-loaded", () => retireLegacyRetailerCommissionUi({ force: true }));'
          if old_listener not in text:
              raise SystemExit('Expected ccg:game-loaded listener not found')
          text = text.replace(old_listener, new_listener, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('tests/ccg-mobile-lite-startup.mjs')
          test.write_text('''import fs from "node:fs";\n\nconst source = fs.readFileSync("js/ccg-mobile-lite.js", "utf8");\n\nfunction assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nassert(source.includes("let legacyRetailerCommissionUiInitialPassDone = false;"), "startup cleanup must track its completed initial pass");\nassert(source.includes("if (!document.body) return;"), "startup cleanup must defer safely when the body is unavailable");\nassert(source.includes("if (!force && legacyRetailerCommissionUiInitialPassDone) return;"), "normal repeated startup calls must avoid a second full DOM scan");\nassert(source.includes("legacyRetailerCommissionUiInitialPassDone = true;"), "a successful startup cleanup must mark the initial pass complete");\nassert(source.includes('window.addEventListener("ccg:game-loaded", () => retireLegacyRetailerCommissionUi({ force: true }));'), "dynamic game rendering must still force a fresh cleanup pass");\nassert(source.includes('document.querySelectorAll("a[href]").forEach((link) => {'), "legacy affiliate link cleanup behaviour must remain present");\n\nconsole.log("CCG mobile-lite startup optimisation guard passed.");\n''', encoding='utf-8')
          PY

      - name: Validate JavaScript and runtime guard
        shell: bash
        run: |
          node --check js/ccg-mobile-lite.js
          node tests/ccg-mobile-lite-startup.mjs

      - name: Commit runtime optimisation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reduce redundant public-page startup scanning"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
