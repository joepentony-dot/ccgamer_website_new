name: Fire King owner asset ZIP handoff

# Only the exact Fire King PR can use this tool. It imports zero files until
# the repository OWNER attaches the SHA-pinned ZIP in the PR discussion.
# Runs against this feature branch, never pushes directly to main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "games/games.json"
      - "scripts/import-fire-king-attachment.mjs"
      - "docs/ai-work/fire-king-1989-publication.md"
      - ".github/workflows/fire-king-binary-asset-import.yml"

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: fire-king-owner-binary-assets
  cancel-in-progress: false

jobs:
  import-owner-assets:
    if: github.event.pull_request.number == 2597 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'content/fire-king-1989-c64'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate asset importer syntax
        run: node --check scripts/import-fire-king-attachment.mjs
      - name: Import exact owner ZIP if it has been posted in PR #2597
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/import-fire-king-attachment.mjs
      - name: Commit only verified game assets to the Fire King feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            resources/images/thumbnails/all/fire-king.webp \
            resources/images/games/boxes-3d/fire-king.webp \
            resources/manuals/fireking-manual.pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No owner asset ZIP attached, or all three approved assets were already committed."
            exit 0
          fi
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Attach verified original Fire King artwork and manual"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "Three SHA-verified Fire King assets committed to the PR branch." >> "$GITHUB_STEP_SUMMARY"
