name: Bootstrap Deep Zzap64 Review Links

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  enrich:
    if: github.event.pull_request.head.ref == 'codex/zzap64-deep-direct-links'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: codex/zzap64-deep-direct-links
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply final generator patch
        run: node scripts/patch-zzap64-deep-generator.js

      - name: Validate resolver syntax
        run: |
          node --check scripts/generate-zzap64-review-links.js
          node --check scripts/zzap64-bible-client.js

      - name: Deep-refresh direct magazine links
        run: node scripts/generate-zzap64-review-links.js --live

      - name: Require direct scan coverage
        run: |
          node - <<'NODE'
          const data = require('./data/zzap64-review-links.json');
          const armalyte = data.entries['1988|november|c64|Armalyte'];
          if (!armalyte || armalyte.precision !== 'page' || Number(armalyte.issue) !== 43 || Number(armalyte.page) !== 24) {
            console.error('Armalyte was not resolved to Zzap!64 issue 43 page 24:', armalyte);
            process.exit(1);
          }
          const unresolved = Object.entries(data.entries).filter(([, row]) => row.precision !== 'page');
          console.log(`Direct coverage: ${data.totals.exactPages}/${data.totals.awards} (${data.totals.directCoveragePercent}%).`);
          if (unresolved.length) {
            console.error('Unresolved direct scan records:', unresolved.map(([key]) => key));
            process.exit(1);
          }
          NODE

      - name: Commit generator and enriched map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-zzap64-review-links.js data/zzap64-review-links.json
          if git diff --cached --quiet; then
            echo "Review-link generator and map already current."
            exit 0
          fi
          git commit -m "Resolve all Zzap64 awards to direct scans"
          git push origin HEAD:codex/zzap64-deep-direct-links
