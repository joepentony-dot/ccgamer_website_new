name: Lost Sizzler Verified Storage Promotion Once

on:
  push:
    branches:
      - codex/supabase-egress-containment
    paths:
      - '.github/workflows/lost-sizzler-storage-promotion-once.yml'

permissions:
  contents: write

jobs:
  promote-verified-music:
    name: Promote verified recovered MP3s locally
    if: github.ref == 'refs/heads/codex/supabase-egress-containment'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering branch revision
        uses: actions/checkout@v4
        with:
          ref: codex/supabase-egress-containment
          fetch-depth: 0

      - name: Download and verify the 16 already-recovered enabled objects
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://lcslgxpgmttaexsorxik.supabase.co/storage/v1/object/public/ccg-arcade-assets/'
          STAGE="$RUNNER_TEMP/lost-sizzler-verified-promotion"
          DEST='arcade/lost-sizzler/assets/audio/music'
          mkdir -p "$STAGE" "$DEST"

          while IFS='|' read -r source target expected_bytes expected_sha; do
            test -n "$source"
            tmp="$STAGE/$target"
            echo "Fetching verified object for $target"
            curl --fail --location --silent --show-error \
              --output "$tmp" \
              "${BASE}${source}"

            actual_bytes="$(stat -c '%s' "$tmp")"
            if [ "$actual_bytes" != "$expected_bytes" ]; then
              echo "Byte-size mismatch for $target: expected $expected_bytes, got $actual_bytes" >&2
              exit 1
            fi

            actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "SHA-256 mismatch for $target" >&2
              exit 1
            fi
          done <<'VERIFIED_OBJECTS'
          music/lostSizzlerDanger/1787411621547-0-combat-01.mp3|combat-01.mp3|3360888|70e5bd2e1dc2f70273b0f5ac60601df9afb8d262e124929002431a19f04d8224
          music/lostSizzlerDanger/1787411636390-14-combat-02.mp3|combat-02.mp3|5665656|0b2155e7f82c2fa1fdcb9d1e5cedcbd611412abe6ba8fe042d0d072b230dd36e
          music/lostSizzlerDanger/1787411622953-1-combat-03.mp3|combat-03.mp3|3999864|b4d73ca1b1c9daa21eb4699891f0732d2777283fca71a361ba52d976582dac90
          music/lostSizzlerExploration/1787411626645-5-exploration-01.mp3|exploration-01.mp3|7227773|6969f2115276a069c7aa48ce4a1001a2706c17ab7308ca7e042c88ba73139e15
          music/lostSizzlerExploration/1787411628149-6-exploration-02.mp3|exploration-02.mp3|4186493|a8a424a5f5051fb224336fe548a3bc701910535ac823c2baa3c26b84ebe505d0
          music/lostSizzlerExploration/1787411629062-7-exploration-03.mp3|exploration-03.mp3|6875261|196b3a4e19e5f160fdafb27c7b9380540d7a7e64282b102fd6efdf4705339f2c
          music/lostSizzlerExploration/1787411630429-8-exploration-04.mp3|exploration-04.mp3|4794749|336f40a2b39316a48c5cccab571b4ac5e728b8d2629113561384426d15510419
          music/lostSizzlerExploration/1787411631439-9-exploration-05.mp3|exploration-05.mp3|5446781|d022385d104c0c9b0363107880a26d7f5d9f8ccccf84d118e3fde10ace2cd218
          music/lostSizzlerNamed/1787411632588-10-named-01.mp3|named-01.mp3|5085047|4b5c112ac130b498404e3eb23d6c252c0e0d6446300b8545b982d0545158d57a
          music/lostSizzlerNamed/1787411633643-11-named-02.mp3|named-02.mp3|3331703|d9218b9ed563008569d16ca69b376f83bc71423df1b0cb7c786f900b0a4594ac
          music/lostSizzlerNamed/1787411637581-15-named-03.mp3|named-03.mp3|5134967|d06336ce08b7f562c56ca42faf35b3f891bab8b4154cdb8f14640b35a407230c
          music/lostSizzlerSanctuary/1787411634411-12-sanctuary-01.mp3|sanctuary-01.mp3|5025147|3a0f2dec847d63a7732ad523dccc8ad0b2cbdda9c6c742e18a2b0bddc7cc9f51
          music/lostSizzlerSanctuary/1787411635463-13-sanctuary-02.mp3|sanctuary-02.mp3|4168059|c356a99b59c4a9628cc4c748d41fc2bdc0eec20e8f6866431449fcb379fada68
          music/lostSizzlerStalker/1787411624060-2-count-loadula-01.mp3|count-loadula-01.mp3|2001535|e14a469c0170b345135ed4a24f99fcbf18e8fb777ba12fc7e52958ea23b6cd1a
          music/lostSizzlerStalker/1787411624977-3-count-loadula-02.mp3|count-loadula-02.mp3|1946239|7d00dcc19e6d851f2a2f78dbb35ec487e4a027e186179b579c1f94ce3518a4db
          music/lostSizzlerStalker/1787411625578-4-count-loadula-03.mp3|count-loadula-03.mp3|3982975|d66e9feb326d51fdaa1da6c5330463871d7df1b4d77fef579a27fc52be5f1e44
          VERIFIED_OBJECTS

          test "$(find "$STAGE" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 16
          cp "$STAGE"/*.mp3 "$DEST"/
          echo 'All 16 local MP3 promotion candidates passed exact byte-size and SHA-256 verification.'

      - name: Guard branch against concurrent movement
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/codex/supabase-egress-containment | awk '{print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Containment branch moved while promotion was running; refusing to push." >&2
            echo "Expected: $GITHUB_SHA" >&2
            echo "Remote:   $remote_sha" >&2
            exit 1
          fi

      - name: Commit verified binaries and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add arcade/lost-sizzler/assets/audio/music/*.mp3
          git rm .github/workflows/lost-sizzler-storage-promotion-once.yml

          test "$(git diff --cached --name-only -- 'arcade/lost-sizzler/assets/audio/music/*.mp3' | wc -l)" -eq 16
          git diff --cached --quiet && { echo 'No promotion changes staged.' >&2; exit 1; }

          git commit -m 'Promote verified Lost Sizzler music locally'
          git push origin HEAD:codex/supabase-egress-containment
