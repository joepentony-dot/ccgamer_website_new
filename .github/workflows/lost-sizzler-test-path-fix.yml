name: Lost Sizzler Test Path Fix

on:
  push:
    branches:
      - codex/lost-sizzler-consolidation
    paths:
      - '.github/workflows/lost-sizzler-test-path-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lost-sizzler-consolidation
          fetch-depth: 0
      - name: Fix migrated audio playlist test paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('arcade/lost-sizzler/tests/v10-7-audio-playlists.mjs')
          text=path.read_text(encoding='utf-8')
          text=text.replace("const repo=path.resolve(here,'../../../..');","const repo=path.resolve(here,'../../..');")
          text=text.replace("games/ccg-games/cheeky-commodore-quest/js/","arcade/lost-sizzler/js/")
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit path fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/lost-sizzler/tests/v10-7-audio-playlists.mjs
          git commit -m 'Fix migrated Lost Sizzler audio playlist test paths'
          git push origin HEAD:codex/lost-sizzler-consolidation
