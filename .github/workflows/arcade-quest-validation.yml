name: Arcade Quest Validation

on:
  pull_request:
    paths:
      - 'arcade/**'
      - 'admin/arcade-assets.html'
      - 'admin/js/arcade-assets.js'
      - 'admin/js/admin-nav.js'
      - 'admin/css/arcade-assets.css'
      - 'games/ccg-games/cheeky-commodore-quest/js/asset-overrides.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/admin-audio-overrides.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/audio-assets.js'
      - 'games/ccg-games/cheeky-commodore-quest/assets/asset-manifest.json'
      - 'games/ccg-games/cheeky-commodore-quest/assets/audio/music/**'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-ui-polish.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-menu-runtime-fix.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-dossier-polish.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-death-room-recovery.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-inventory-hud-fix.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-stalker-shop-balance.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/weekly-challenge.js'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-ui-polish.css'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-dossier-polish.css'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-inventory-hud-fix.css'
      - 'games/ccg-games/cheeky-commodore-quest/assets/item-icons/**'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-death-room-recovery.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-inventory-hud.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-stalker-shop-balance.mjs'
      - 'supabase/migrations/20260820_arcade_asset_manager.sql'
      - 'scripts/generate-lost-sizzler-audio.mjs'
      - 'scripts/validate-arcade-quest.js'
      - '.github/workflows/arcade-quest-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'arcade/**'
      - 'admin/arcade-assets.html'
      - 'admin/js/arcade-assets.js'
      - 'admin/js/admin-nav.js'
      - 'admin/css/arcade-assets.css'
      - 'games/ccg-games/cheeky-commodore-quest/js/asset-overrides.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/admin-audio-overrides.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/audio-assets.js'
      - 'games/ccg-games/cheeky-commodore-quest/assets/asset-manifest.json'
      - 'games/ccg-games/cheeky-commodore-quest/assets/audio/music/**'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-ui-polish.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-menu-runtime-fix.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-dossier-polish.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-death-room-recovery.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-inventory-hud-fix.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/v10-6-stalker-shop-balance.js'
      - 'games/ccg-games/cheeky-commodore-quest/js/weekly-challenge.js'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-ui-polish.css'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-dossier-polish.css'
      - 'games/ccg-games/cheeky-commodore-quest/css/v10-6-inventory-hud-fix.css'
      - 'games/ccg-games/cheeky-commodore-quest/assets/item-icons/**'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-death-room-recovery.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-inventory-hud.mjs'
      - 'games/ccg-games/cheeky-commodore-quest/tests/v10-6-stalker-shop-balance.mjs'
      - 'supabase/migrations/20260820_arcade_asset_manager.sql'
      - 'scripts/generate-lost-sizzler-audio.mjs'
      - 'scripts/validate-arcade-quest.js'
      - '.github/workflows/arcade-quest-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check arcade/quest/game/core.js
          node --check arcade/quest/game/balance.js
          node --check arcade/quest/game/assets-config.js
          node --check arcade/quest/game/remote-assets.js
          node --check arcade/quest/game/stages.js
          node --check arcade/quest/game/audio.js
          node --check arcade/quest/game/achievements.js
          node --check arcade/quest/game/main-v2.js
          node --check admin/js/arcade-assets.js
          node --check games/ccg-games/cheeky-commodore-quest/js/asset-overrides.js
          node --check games/ccg-games/cheeky-commodore-quest/js/admin-audio-overrides.js
          node --check games/ccg-games/cheeky-commodore-quest/js/audio-assets.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-ui-polish.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-menu-runtime-fix.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-dossier-polish.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-death-room-recovery.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-inventory-hud-fix.js
          node --check games/ccg-games/cheeky-commodore-quest/js/v10-6-stalker-shop-balance.js
          node --check games/ccg-games/cheeky-commodore-quest/js/weekly-challenge.js
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-6-death-room-recovery.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-6-inventory-hud.mjs
          node --check games/ccg-games/cheeky-commodore-quest/tests/v10-6-stalker-shop-balance.mjs
          node --check scripts/generate-lost-sizzler-audio.mjs
          node --check scripts/validate-arcade-quest.js

      - name: Validate final balance rules
        shell: bash
        run: |
          grep -F "fireOnly" arcade/quest/game/balance.js
          grep -F "extraAt = [4, 9, 14]" arcade/quest/game/balance.js
          grep -F "mode === 'invaders'" arcade/quest/game/balance.js
          grep -F 'src="game/balance.js"' arcade/quest/index.html

      - name: Validate Lost Sizzler owner music hooks
        shell: bash
        run: |
          grep -F "lostSizzlerExploration" admin/js/arcade-assets.js
          grep -F "lostSizzlerDanger" admin/js/arcade-assets.js
          grep -F "lostSizzlerSanctuary" admin/js/arcade-assets.js
          grep -F "lostSizzlerNamed" admin/js/arcade-assets.js
          grep -F "lostSizzlerStalker" admin/js/arcade-assets.js
          ! grep -F "lostSizzlerRoomVault" admin/js/arcade-assets.js
          ! grep -F "rooms:Object.freeze" games/ccg-games/cheeky-commodore-quest/js/audio-assets.js
          ! grep -F "namedEnemies:Object.freeze" games/ccg-games/cheeky-commodore-quest/js/audio-assets.js
          test "$(find games/ccg-games/cheeky-commodore-quest/assets/audio/music -maxdepth 1 -type f | wc -l)" -eq 5
          grep -F "admin-audio-overrides.js" games/ccg-games/cheeky-commodore-quest/js/asset-overrides.js
          grep -F "Weekly Dungeon" games/ccg-games/cheeky-commodore-quest/js/weekly-challenge.js
          grep -F "Weekly Dungeon" games/ccg-games/cheeky-commodore-quest/js/v10-6-menu-runtime-fix.js
          grep -F "dossier-scroll-cue" games/ccg-games/cheeky-commodore-quest/js/v10-6-dossier-polish.js

      - name: Validate Lost Sizzler sealed-room death recovery
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-6-death-room-recovery.mjs

      - name: Validate Lost Sizzler persistent inventory HUD
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-6-inventory-hud.mjs

      - name: Validate Lost Sizzler Stalker reward/shop balance
        run: node games/ccg-games/cheeky-commodore-quest/tests/v10-6-stalker-shop-balance.mjs

      - name: Validate Arcade Quest contract
        run: node scripts/validate-arcade-quest.js
