name: Phase 8B Home Hero LCP Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - "home.html"
      - ".github/workflows/phase-8b-home-hero-lcp.yml"
      - "scripts/apply-phase8b-home-hero-preload.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-8b-home-hero-lcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-home-hero-lcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase 8B tooling
        run: python -m py_compile scripts/apply-phase8b-home-hero-preload.py

      - name: Confirm hero preloads remain mobile-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("home.html").read_text(encoding="utf-8")
          corrected = [
              '    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-c64.png" fetchpriority="high" type="image/png">',
              '    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-amiga.png" fetchpriority="high" type="image/png">',
          ]
          desktop_only = [
              'href="resources/images/hero/ccg-hero-c64.png" media="(min-width: 1024px)"',
              'href="resources/images/hero/ccg-hero-amiga.png" media="(min-width: 1024px)"',
          ]

          for line in corrected:
              if source.count(line) != 1:
                  raise SystemExit(f"Expected one mobile-safe hero preload: {line}")

          for token in desktop_only:
              if token in source:
                  raise SystemExit(f"Desktop-only hero preload restriction returned: {token}")

          print("Phase 8B validation passed: both hero images remain preloaded on mobile and desktop.")
          PY

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD || git diff --check
