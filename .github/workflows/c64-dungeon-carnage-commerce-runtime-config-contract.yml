name: C64 Dungeon Carnage Commerce Runtime Config Contract

on:
  pull_request:
    paths:
      - 'services/ccg-backend/src/lost-sizzler-commerce-runtime-config.mjs'
      - 'services/ccg-backend/tests/commerce-runtime-config-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-commerce-runtime-config-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'services/ccg-backend/src/lost-sizzler-commerce-runtime-config.mjs'
      - 'services/ccg-backend/tests/commerce-runtime-config-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-commerce-runtime-config-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate syntax
        run: |
          node --check services/ccg-backend/src/lost-sizzler-commerce-runtime-config.mjs
          node --check services/ccg-backend/tests/commerce-runtime-config-contract.mjs

      - name: Run commerce runtime config contract
        run: node services/ccg-backend/tests/commerce-runtime-config-contract.mjs

      - name: Guard runtime config against embedded credentials
        run: |
          set -euo pipefail
          if grep -niE '(clientSecret\s*:\s*["'"'][^"'"']{12,}["'"']|PAYPAL_CLIENT_SECRET\s*=|service_role\s*=)' \
            services/ccg-backend/src/lost-sizzler-commerce-runtime-config.mjs; then
            echo 'ERROR: possible embedded commerce credential detected.' >&2
            exit 1
          fi
