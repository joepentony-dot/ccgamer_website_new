name: C64 Dungeon Carnage Portable Artifact Runtime Handoff

on:
  pull_request:
    paths:
      - 'scripts/build-lost-sizzler-portable-desktop-bundle.py'
      - 'scripts/build-lost-sizzler-package-artifact-descriptor.mjs'
      - 'scripts/export-lost-sizzler-package-runtime-env.mjs'
      - 'services/ccg-backend/tests/portable-artifact-runtime-handoff-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-portable-artifact-runtime-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate syntax
        run: |
          node --check scripts/build-lost-sizzler-package-artifact-descriptor.mjs
          node --check scripts/export-lost-sizzler-package-runtime-env.mjs
          node --check services/ccg-backend/tests/portable-artifact-runtime-handoff-contract.mjs
          python3 -m py_compile scripts/build-lost-sizzler-portable-desktop-bundle.py
      - name: Run portable artifact runtime handoff regression
        run: node services/ccg-backend/tests/portable-artifact-runtime-handoff-contract.mjs
      - name: Preserve protected scope
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | tee /tmp/changed.txt
          if grep -Eq '^(index\.html|resources/css/intro\.css|js/index-intro\.js|games/games\.json)$' /tmp/changed.txt; then
            echo 'Protected file changed.' >&2
            exit 1
          fi
      - name: Guard against secrets or public package URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('scripts/build-lost-sizzler-package-artifact-descriptor.mjs'),
              Path('scripts/export-lost-sizzler-package-runtime-env.mjs'),
          ]
          patterns = [
              re.compile(r'service[_-]?role', re.I),
              re.compile(r'client[_-]?secret', re.I),
              re.compile(r'password\s*=', re.I),
              re.compile(r'https?://[^\s\"\']+\.zip', re.I),
          ]
          for file in files:
              source = file.read_text(encoding='utf-8')
              for pattern in patterns:
                  if pattern.search(source):
                      raise SystemExit(f'Forbidden credential/public package coupling found in {file}: {pattern.pattern}')
          print('Portable artifact source guard passed.')
          PY
