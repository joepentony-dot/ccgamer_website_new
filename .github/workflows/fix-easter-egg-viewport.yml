name: Easter Egg Viewport Positioning

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/css/ccg-master.css'
      - 'resources/css/ccg-overlays.css'
      - 'scripts/test-easter-egg-viewport.mjs'
      - 'scripts/test-easter-egg-third-click-stability.mjs'
      - '.github/workflows/fix-easter-egg-viewport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-easter-egg-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: sha256sum index.html resources/css/intro.css js/index-intro.js games/games.json home.html > "$RUNNER_TEMP/viewport-protected.sha256"

      - name: Validate JavaScript and test sources
        run: |
          node --check js/ccg-global.js
          node --check scripts/test-easter-egg-viewport.mjs
          node --check scripts/test-easter-egg-third-click-stability.mjs

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          assert len(games) == 651, len(games)
          assert not any(str(game.get('slug', '')).strip().lower() == 'powerdrome' for game in games)
          print('Catalogue integrity passed: 651 games; Powerdrome absent.')
          PY

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Start local website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/viewport-http.log" 2>&1 &
          for attempt in {1..30}; do curl -sf http://127.0.0.1:4173/home.html >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/viewport-http.log"
          exit 1

      - name: Test portrait, landscape and desktop positioning
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: |
          mkdir -p "$RUNNER_TEMP/viewport-shots"
          node scripts/test-easter-egg-viewport.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output "$RUNNER_TEMP/viewport-evidence.json" \
            --report "$RUNNER_TEMP/viewport-validation.md" \
            --screenshots "$RUNNER_TEMP/viewport-shots"

      - name: Test third-click menu stability
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: |
          mkdir -p "$RUNNER_TEMP/third-click-shots"
          node scripts/test-easter-egg-third-click-stability.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output "$RUNNER_TEMP/third-click-evidence.json" \
            --report "$RUNNER_TEMP/third-click-validation.md" \
            --screenshots "$RUNNER_TEMP/third-click-shots"

      - name: Confirm protected files unchanged
        run: sha256sum --check "$RUNNER_TEMP/viewport-protected.sha256"

      - name: Upload viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easter-egg-viewport-and-third-click-stability
          path: |
            ${{ runner.temp }}/viewport-evidence.json
            ${{ runner.temp }}/viewport-validation.md
            ${{ runner.temp }}/viewport-shots
            ${{ runner.temp }}/third-click-evidence.json
            ${{ runner.temp }}/third-click-validation.md
            ${{ runner.temp }}/third-click-shots
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary dependencies
        if: always()
        run: rm -rf node_modules

      - name: Publish summary
        if: always()
        run: |
          test -f "$RUNNER_TEMP/viewport-validation.md" && cat "$RUNNER_TEMP/viewport-validation.md" >> "$GITHUB_STEP_SUMMARY" || true
          test -f "$RUNNER_TEMP/third-click-validation.md" && cat "$RUNNER_TEMP/third-click-validation.md" >> "$GITHUB_STEP_SUMMARY" || true
