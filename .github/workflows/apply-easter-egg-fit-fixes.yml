name: Apply Easter Egg Fit Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'resources/css/easter-eggs-datasette.css'
      - 'js/easter-eggs/basic-console.js'
      - 'resources/css/easter-eggs-basic.css'
      - 'resources/audio/easter-eggs/pacman.html'
      - 'resources/css/pacman-touch.css'
      - 'resources/css/easter-eggs-invaders.css'
      - 'scripts/apply-easter-egg-fit-fixes.py'
      - '.github/workflows/apply-easter-egg-fit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-pacman-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded Pac-Man and BASIC fixes
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          script_path = Path('scripts/apply-easter-egg-fit-fixes.py')
          spec = importlib.util.spec_from_file_location('ccg_fit_patch', script_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          pacman = Path('resources/audio/easter-eggs/pacman.html')
          raw = pacman.read_bytes()
          had_crlf = b'\r\n' in raw
          text = raw.decode('utf-8').replace('\r\n', '\n')
          updated = module.patch(text)
          module.validate(updated)
          if had_crlf:
              updated = updated.replace('\n', '\r\n')
          pacman.write_bytes(updated.encode('utf-8'))

          basic = Path('js/easter-eggs/basic-console.js')
          basic_text = basic.read_text(encoding='utf-8')
          old = "[40, 'FOR I=1 TO 5:PRINT I:NEXT'],"
          new = "[40, 'PRINT \"5 QUICK COMMANDS READY\"'],"
          if old in basic_text:
              basic_text = basic_text.replace(old, new, 1)
              basic.write_text(basic_text, encoding='utf-8')
          elif new not in basic_text:
              raise SystemExit('BASIC demo line marker was not found')

          print('Applied bounded Pac-Man patch and corrected BASIC demo program.')
          PY
          python scripts/apply-easter-egg-fit-fixes.py --check
          node --check js/easter-eggs/basic-console.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/audio/easter-eggs/pacman.html js/easter-eggs/basic-console.js
          if git diff --cached --quiet; then
            echo "Generated fixes already committed."
            exit 0
          fi
          git commit -m "Fit Pac-Man controls, sound and BASIC demo"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
