name: Native Mouse Wheel Scroll Contract

on:
  push:
    branches:
      - main
    paths:
      - "resources/css/**"
      - "resources/js/**"
      - "quiz/js/**"
      - "js/**"
      - "home.html"
      - "games/index.html"
      - "games/1942/index.html"
      - "games/genres/index.html"
      - "games/publishers/index.html"
      - "games/collections/index.html"
      - "games/collections/retro-specials.html"
      - "games/discover/index.html"
      - "videos/index.html"
      - "zzap64/index.html"
      - "about.html"
      - "emulation.html"
      - "quiz/quiz.html"
      - "contact.html"
      - "support.html"
      - "scripts/audit-native-wheel-contract.js"
      - ".github/workflows/native-mouse-wheel-scroll-contract.yml"
  pull_request:
    branches:
      - main
    paths:
      - "resources/css/**"
      - "resources/js/**"
      - "quiz/js/**"
      - "js/**"
      - "home.html"
      - "games/index.html"
      - "games/1942/index.html"
      - "games/genres/index.html"
      - "games/publishers/index.html"
      - "games/collections/index.html"
      - "games/collections/retro-specials.html"
      - "games/discover/index.html"
      - "videos/index.html"
      - "zzap64/index.html"
      - "about.html"
      - "emulation.html"
      - "quiz/quiz.html"
      - "contact.html"
      - "support.html"
      - "scripts/audit-native-wheel-contract.js"
      - ".github/workflows/native-mouse-wheel-scroll-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wheel-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate blocker syntax
        run: node --check scripts/audit-native-wheel-contract.js

      - name: Enforce native mouse-wheel scrolling
        run: node scripts/audit-native-wheel-contract.js
