name: CCG Site Safety

on:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - "**/*.xml"
      - "**/*.sql"
      - "**/*.svg"
      - "**/*.webp"
      - "_redirects"
      - "_headers"
      - "**/.htaccess"
      - "scripts/audit-site-safety.py"
      - "scripts/audit-legacy-game-routes.js"
      - "scripts/audit-music-navigation.js"
      - "scripts/audit-zzap64-awards.js"
      - "scripts/audit-zzap64-performance.js"
      - "scripts/audit-game-badges.js"
      - "scripts/audit-collections-index.js"
      - "scripts/audit-member-hub.js"
      - "scripts/audit-member-community.js"
      - "scripts/audit-member-safety-loyalty.js"
      - "scripts/audit-admin-master-data-gate.js"
      - "scripts/audit-member-custom-collections.js"
      - "scripts/audit-member-hub-phase7b.js"
      - "scripts/audit-member-hub-phase7c.js"
      - "scripts/audit-member-achievements.js"
      - "scripts/audit-member-public-profile-preview.js"
      - "scripts/audit-member-submissions-admin.js"
      - "scripts/audit-member-collection-insights.js"
      - "scripts/audit-member-hub-health.js"
      - "scripts/audit-responsive-layout.js"
      - "scripts/audit-responsive-browser.js"
      - "scripts/audit-scroll-reachability.js"
      - ".github/workflows/ccg-site-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit syntax
        run: python -m py_compile scripts/audit-site-safety.py

      - name: Validate critical JavaScript syntax
        run: |
          node --check js/ccg-nav-core.js
          node --check js/ccg-nav-fit.js
          node --check js/ccg-responsive-safety.js
          node --check js/ccg-header-auth-loader.js
          node --check js/ccg-music-navigation.js
          node --check js/ccg-music-config.js
          node --check js/ccg-legacy-url-consolidation.js
          node --check js/ccg-global-search.js
          node --check js/ccg-search-ranking.js
          node --check js/ccg-recently-viewed.js
          node --check js/ccg-archive-shortcuts.js
          node --check js/ccg-publisher-history.js
          node --check js/ccg-amiga-identity.js
          node --check js/ccg-recent-content.js
          node --check js/ccg-personal-library-controls.js
          node --check js/ccg-member-library-sync-loader.js
          node --check js/ccg-member-community-loader.js
          node --check js/ccg-member-public-preview-loader.js
          node --check js/ccg-member-custom-collections-loader.js
          node --check js/ccg-member-collection-insights-loader.js
          node --check js/ccg-member-loyalty-loader.js
          node --check js/ccg-member-achievements-loader.js
          node --check js/ccg-member-data-safety.js
          node --check js/ccg-zzap64-matcher.js
          node --check js/zzap64-awards-logo-styles.js
          node --check js/ccg-game-badges.js
          node --check js/game-discovery.js
          node --check js/zzap64-awards.js
          node --check admin/js/input-harden.js
          node --check admin/js/guard.js
          node --check admin/js/admin-nav.js
          node --check admin/js/member-submissions.js
          node --check admin/js/member-hub-health.js
          node --check resources/js/auth/profile-lists.js
          node --check resources/js/auth/member-hub.js
          node --check resources/js/auth/member-library-sync.js
          node --check resources/js/auth/member-community.js
          node --check resources/js/auth/member-public-profile-preview.js
          node --check resources/js/auth/member-custom-collections.js
          node --check resources/js/auth/member-collection-insights.js
          node --check resources/js/auth/member-loyalty-badges.js
          node --check resources/js/auth/member-achievement-badges.js
          node --check resources/js/auth/public-member.js
          node --check resources/js/community/community-api.js
          node --check scripts/audit-legacy-game-routes.js
          node --check scripts/audit-music-navigation.js
          node --check scripts/audit-zzap64-awards.js
          node --check scripts/audit-zzap64-performance.js
          node --check scripts/audit-game-badges.js
          node --check scripts/audit-collections-index.js
          node --check scripts/audit-member-hub.js
          node --check scripts/audit-member-community.js
          node --check scripts/audit-member-safety-loyalty.js
          node --check scripts/audit-admin-master-data-gate.js
          node --check scripts/audit-member-custom-collections.js
          node --check scripts/audit-member-hub-phase7b.js
          node --check scripts/audit-member-hub-phase7c.js
          node --check scripts/audit-member-achievements.js
          node --check scripts/audit-member-public-profile-preview.js
          node --check scripts/audit-member-submissions-admin.js
          node --check scripts/audit-member-collection-insights.js
          node --check scripts/audit-member-hub-health.js
          node --check scripts/audit-responsive-layout.js
          node --check scripts/audit-responsive-browser.js
          node --check scripts/audit-scroll-reachability.js

      - name: Run read-only site safety audit
        run: python scripts/audit-site-safety.py

      - name: Run responsive layout contract audit
        run: node scripts/audit-responsive-layout.js

      - name: Run rendered responsive browser audit
        run: node scripts/audit-responsive-browser.js

      - name: Run physical scroll reachability audit
        run: node scripts/audit-scroll-reachability.js

      - name: Run legacy game route audit
        run: node scripts/audit-legacy-game-routes.js

      - name: Run music navigation audit
        run: node scripts/audit-music-navigation.js

      - name: Run Zzap award data audit
        run: node scripts/audit-zzap64-awards.js

      - name: Run Zzap progressive loading audit
        run: node scripts/audit-zzap64-performance.js

      - name: Run game badge audit
        run: node scripts/audit-game-badges.js

      - name: Run collections index audit
        run: node scripts/audit-collections-index.js

      - name: Run Member Hub audit
        run: node scripts/audit-member-hub.js

      - name: Run Member Community audit
        run: node scripts/audit-member-community.js

      - name: Run Member Safety and Loyalty audit
        run: node scripts/audit-member-safety-loyalty.js

      - name: Run Admin Master Data Gate audit
        run: node scripts/audit-admin-master-data-gate.js

      - name: Run Member Custom Collections audit
        run: node scripts/audit-member-custom-collections.js

      - name: Run Phase 7B Member Hub audit
        run: node scripts/audit-member-hub-phase7b.js

      - name: Run Phase 7C Supabase compatibility audit
        run: node scripts/audit-member-hub-phase7c.js

      - name: Run Member Achievements audit
        run: node scripts/audit-member-achievements.js

      - name: Run Member Public Profile Preview audit
        run: node scripts/audit-member-public-profile-preview.js

      - name: Run Member Submissions Admin audit
        run: node scripts/audit-member-submissions-admin.js

      - name: Run Member Collection Insights audit
        run: node scripts/audit-member-collection-insights.js

      - name: Run Member Hub Health audit
        run: node scripts/audit-member-hub-health.js

      - name: Confirm audits made no repository changes
        run: |
          rm -rf scripts/__pycache__
          git diff --exit-code
          test -z "$(git status --porcelain)"