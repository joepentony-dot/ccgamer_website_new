name: Lost Sizzler Startup Promise Hardening

on:
  push:
    branches:
      - codex/lost-sizzler-consolidation
    paths:
      - '.github/workflows/lost-sizzler-startup-promises-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lost-sizzler-consolidation
          fetch-depth: 0
      - name: Harden startup media promises
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          audio=Path('arcade/lost-sizzler/js/audio.js')
          text=audio.read_text(encoding='utf-8')
          old='async function start(){if(!ensure())return false;try{await ctx.resume()}catch(_){}started=true;'
          new='async function start(){if(!ensure())return false;try{if(ctx.state!=="running"){const resume=ctx.resume();if(resume?.catch)resume.catch(()=>{})}}catch(_){}started=true;'
          if old not in text: raise SystemExit('Expected audio start block not found')
          audio.write_text(text.replace(old,new,1),encoding='utf-8')
          core=Path('arcade/lost-sizzler/js/game-core.js')
          text=core.read_text(encoding='utf-8')
          old='function requestPlayFullscreen(){const shell=document.querySelector(".ccg-game");if(!shell||document.fullscreenElement)return Promise.resolve(true);try{return Promise.resolve(shell.requestFullscreen()).then(()=>true).catch(()=>false)}catch(_){return Promise.resolve(false)}}'
          new='function requestPlayFullscreen(){const shell=document.querySelector(".ccg-game");if(!shell||document.fullscreenElement)return Promise.resolve(true);try{const requested=Promise.resolve(shell.requestFullscreen()).then(()=>true).catch(()=>false);return Promise.race([requested,new Promise(resolve=>setTimeout(()=>resolve(false),1000))])}catch(_){return Promise.resolve(false)}}'
          if old not in text: raise SystemExit('Expected fullscreen startup block not found')
          core.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit startup hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/lost-sizzler/js/audio.js arcade/lost-sizzler/js/game-core.js
          git commit -m 'Prevent Lost Sizzler startup media promise hangs'
          git push origin HEAD:codex/lost-sizzler-consolidation
