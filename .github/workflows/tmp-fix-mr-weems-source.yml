name: Temporary Mr Weems Source Fix

on:
  push:
    branches:
      - fix/publisher-thumbnail-magazine-reviews-20260813
    paths:
      - ".github/workflows/tmp-fix-mr-weems-source.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/publisher-thumbnail-magazine-reviews-20260813
          fetch-depth: 0
          show-progress: false

      - name: Correct Mr Weems source thumbnail
        run: node scripts/migrate-mr-weems-thumbnail.js

      - name: Commit source correction
        shell: bash
        run: |
          if git diff --quiet -- games/games.json; then
            echo "Mr Weems source already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- games/games.json
          git commit -m "Correct Mr Weems thumbnail source"
          git push origin HEAD:fix/publisher-thumbnail-magazine-reviews-20260813
