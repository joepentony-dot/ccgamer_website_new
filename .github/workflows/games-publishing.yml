name: Reliable Games Publishing

on:
  push:
    branches:
      - main
    paths:
      - "games/games.json"
      - "resources/images/thumbnails/all/**"
      - "resources/audio/games/**"
      - "scripts/rebuild-games.js"
      - "scripts/build-games.js"
      - "scripts/validate-games-source.js"
      - "scripts/generate-slug-pages.js"
      - "scripts/prepare-seo-game-routes.js"
      - "scripts/validate-seo-game-routes.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/generate-developer-pages.js"
      - "scripts/generate-composer-pages.js"
      - "scripts/generate-year-platform-pages.js"
      - "scripts/integrate-year-platform-discovery.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/update-downloads-static-pages.js"
      - "scripts/generate-sitemaps.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reliable-games-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Run authoritative publishing command
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Verify deterministic repeat
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          git diff --binary > "$RUNNER_TEMP/second.diff"
          cmp "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"
          git diff --check

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Commit generated publishing output
        shell: bash
        run: |
          git add \
            games \
            music \
            data \
            js \
            tools/seo/static-pages.json \
            sitemap.xml \
            sitemap-pages.xml \
            sitemap-games.xml \
            docs/seo-baseline

          git reset -- games/games.json
          git reset -- index.html home.html resources/css/intro.css js/index-intro.js

          if git diff --cached --quiet; then
            echo "Generated publishing output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish generated game archive output"
          git push origin HEAD:main
