name: Reliable Games Publishing

on:
  push:
    branches:
      - main
      - codex/correct-publisher-assignments
    paths:
      - "games/games.json"
      - "resources/images/thumbnails/all/**"
      - "resources/images/publishers/**"
      - "resources/audio/games/**"
      - "scripts/rebuild-games.js"
      - "scripts/build-games.js"
      - "scripts/validate-games-source.js"
      - "scripts/generate-slug-pages.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/generate-developer-pages.js"
      - "scripts/generate-composer-pages.js"
      - "scripts/generate-year-platform-pages.js"
      - "scripts/integrate-year-platform-discovery.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/update-downloads-static-pages.js"
      - "scripts/generate-sitemaps.js"
      - "scripts/apply-publisher-corrections.js"
      - ".github/workflows/games-publishing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reliable-games-publishing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Apply requested publisher corrections
        if: github.ref_name == 'codex/correct-publisher-assignments'
        run: |
          node --check scripts/apply-publisher-corrections.js
          node scripts/apply-publisher-corrections.js
          rm -f \
            resources/images/publishers/macmillan.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/ozisoft.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/peaksoft.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/reston-publishing-company.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/roflow-computer-software.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/titus.{png,webp,jpg,jpeg,svg} \
            resources/images/publishers/game_publisher_changes.csv \
            resources/images/publishers/remove_publishers.txt

      - name: Run authoritative publishing command
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Verify deterministic repeat
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          git diff --binary > "$RUNNER_TEMP/second.diff"
          cmp "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"
          git diff --check

      - name: Verify requested publisher corrections
        if: github.ref_name == 'codex/correct-publisher-assignments'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { buildPublisherGroups, getPublisherNames } = require('./scripts/publisher-utils');

          const games = JSON.parse(fs.readFileSync('games/games.json', 'utf8'));
          const expected = new Map([
            ['popeye-c64-popeye-donpriestley', 'Piranha'],
            ['give-my-regards-to-broad-street', 'Argus Press Software'],
            ['thing-on-a-spring', 'Gremlin Graphics'],
            ['soccer-boss', 'Alternative Software'],
            ['miner-2049er', 'Big Five Software'],
            ['black-knight', 'Interdisc'],
            ['arachnophobia', 'Titus Software'],
          ]);
          const removedSlugs = [
            'macmillan',
            'ozisoft',
            'peaksoft',
            'reston-publishing-company',
            'roflow-computer-software',
            'titus',
          ];

          const problems = [];
          for (const [slug, publisher] of expected) {
            const game = games.find((entry) => entry.slug === slug);
            if (!game) {
              problems.push(`Missing game record: ${slug}`);
              continue;
            }
            const publishers = getPublisherNames(game);
            if (publishers.length !== 1 || publishers[0] !== publisher) {
              problems.push(`${slug}: expected only ${publisher}, found ${publishers.join(' | ') || '(none)'}`);
            }
          }

          const groups = buildPublisherGroups(games);
          const groupSlugs = new Set(groups.map((group) => group.slug));
          for (const slug of removedSlugs) {
            if (groupSlugs.has(slug)) problems.push(`Retired publisher group still generated: ${slug}`);
            if (fs.existsSync(path.join('games', 'publishers', slug))) {
              problems.push(`Retired publisher directory still exists: games/publishers/${slug}`);
            }
          }

          if (!groupSlugs.has('titus-software')) {
            problems.push('Titus Software publisher group is missing.');
          }

          if (problems.length) {
            console.error(problems.join('\n'));
            process.exit(1);
          }

          console.log('Publisher correction validation passed.');
          NODE

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Commit generated publishing output
        shell: bash
        run: |
          git add \
            games \
            music \
            data \
            js \
            resources/images/publishers \
            tools/seo/static-pages.json \
            sitemap.xml \
            sitemap-pages.xml \
            sitemap-games.xml \
            docs/seo-baseline

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git reset -- games/games.json
          fi
          git reset -- index.html home.html resources/css/intro.css js/index-intro.js

          if git diff --cached --quiet; then
            echo "Generated publishing output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${GITHUB_REF_NAME}" = "codex/correct-publisher-assignments" ]; then
            git commit -m "Correct publisher assignments and regenerate archives"
          else
            git commit -m "Publish generated game archive output"
          fi

          git push origin "HEAD:${GITHUB_REF_NAME}"
