name: Reliable Games Publishing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/games-publishing.yml"
      - "games/game.html"
      - "games/games.json"
      - "games/genres/**"
      - "resources/images/thumbnails/all/**"
      - "resources/images/publishers/**"
      - "resources/audio/games/**"
      - "data/lemon-cache/**"
      - "data/magazine-review-records/**"
      - "data/publisher-secondary-credits.json"
      - "data/publisher-histories.json"
      - "js/game-secondary-publisher-runtime.js"
      - "js/ccg-publisher-history.js"
      - "scripts/rebuild-games.js"
      - "scripts/build-games.js"
      - "scripts/build-magazine-review-chunks.js"
      - "scripts/import-amiga-magazine-reviews.js"
      - "scripts/refresh-lemon-game-cache.js"
      - "scripts/ensure-magazine-review-runtime.js"
      - "scripts/ensure-secondary-publisher-runtime.js"
      - "scripts/ensure-publisher-history-runtime.js"
      - "scripts/sync-youtube-video-metadata.js"
      - "scripts/generate-video-seo.js"
      - "scripts/generate-video-library.js"
      - "scripts/validate-video-library.js"
      - "scripts/validate-games-source.js"
      - "scripts/generate-slug-pages.js"
      - "scripts/prepare-seo-game-routes.js"
      - "scripts/validate-seo-game-routes.js"
      - "scripts/prepare-seo-genre-links.js"
      - "scripts/validate-seo-genre-links.js"
      - "scripts/generate-publisher-pages.js"
      - "scripts/publisher-utils.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/validate-publisher-logo-output.js"
      - "scripts/validate-secondary-publisher-credits.js"
      - "scripts/audit-source-backed-publishers.js"
      - "scripts/generate-developer-pages.js"
      - "scripts/generate-composer-pages.js"
      - "scripts/generate-year-platform-pages.js"
      - "scripts/integrate-year-platform-discovery.js"
      - "scripts/generate-downloads-page.js"
      - "scripts/update-downloads-static-pages.js"
      - "scripts/validate-downloads-page.js"
      - "scripts/generate-sitemaps.js"
      - "scripts/validate-video-seo.js"
      - "tests/magazine-publishing-pipeline.test.mjs"
      - "tools/seo/static-pages.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reliable-games-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate magazine publishing pipeline
        run: node --test tests/magazine-publishing-pipeline.test.mjs

      - name: Cache Lemon magazine sources
        id: lemon_cache
        continue-on-error: true
        run: |
          node scripts/refresh-lemon-game-cache.js --base HEAD^
          node scripts/refresh-lemon-game-cache.js --check --base HEAD^

      - name: Report Lemon cache fallback
        if: steps.lemon_cache.outcome == 'failure'
        run: |
          echo "::warning title=Lemon magazine import fallback::The Lemon64/Lemon Amiga cache refresh failed. Publishing will continue using existing cached magazine data; no scores will be invented."

      - name: Import Lemon magazine reviews
        run: node scripts/import-amiga-magazine-reviews.js

      - name: Sync verified YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "[games-publishing] Syncing verified YouTube titles, descriptions, upload dates, durations and thumbnails..."
            node scripts/sync-youtube-video-metadata.js
          else
            echo "[games-publishing] YOUTUBE_API_KEY is not configured; keeping the verified metadata store unchanged."
          fi

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Run authoritative publishing command
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Verify generated publishing diff
        run: git diff --check

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Commit generated publishing output
        id: publish_output
        shell: bash
        run: |
          git add \
            games \
            music \
            data \
            js \
            videos \
            retro-events \
            retro-specials \
            amiga-demo-music \
            tools/seo/static-pages.json \
            sitemap.xml \
            sitemap-*.xml \
            docs/seo-baseline

          git reset -- games/games.json
          git reset -- index.html home.html resources/css/intro.css js/index-intro.js

          if git diff --cached --quiet; then
            echo "Generated publishing output is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT_BRANCH="automation/games-publishing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$OUTPUT_BRANCH"
          git commit -m "Publish generated game archive output"
          git push origin "HEAD:$OUTPUT_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$OUTPUT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open and merge generated output pull request
        if: steps.publish_output.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_BRANCH: ${{ steps.publish_output.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$OUTPUT_BRANCH" \
            --title "Publish generated game archive output" \
            --body "Automated generated game/archive output from Reliable Games Publishing run ${GITHUB_RUN_ID}. The authoritative rebuild, Lemon magazine-review import, YouTube metadata sync, publisher generation, download-index validation, video-library generation, sitemap checks, SEO validation and protected-file checks all passed before this PR was created.")

          echo "Created generated-output PR: $PR_URL"
          gh pr merge "$PR_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
