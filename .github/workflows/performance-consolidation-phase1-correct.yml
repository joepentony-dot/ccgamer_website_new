name: Performance consolidation phase 1 correction

on:
  push:
    branches:
      - codex/performance-consolidation-phase-1

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            home.html
            resources/css/home.css
            service-worker.js
            tests/performance-consolidation-phase1.mjs

      - name: Preserve existing LCP contract and cache-version contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('home.html')
          sw = Path('service-worker.js')
          test = Path('tests/performance-consolidation-phase1.mjs')

          home_text = home.read_text(encoding='utf-8')
          dynamic = '''    <script>\n        (function () {\n            try {\n                var mode = document.documentElement.getAttribute('data-ccg-mode') === 'amiga' ? 'amiga' : 'c64';\n                var preload = document.createElement('link');\n                preload.rel = 'preload';\n                preload.as = 'image';\n                preload.href = mode === 'amiga'\n                    ? 'resources/images/hero/ccg-hero-amiga.png'\n                    : 'resources/images/hero/ccg-hero-c64.png';\n                preload.setAttribute('fetchpriority', 'high');\n                preload.type = 'image/png';\n                document.head.appendChild(preload);\n            } catch (e) {}\n        })();\n    </script>'''
          static = '''    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-c64.png" fetchpriority="high" type="image/png">\n    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-amiga.png" fetchpriority="high" type="image/png">'''
          if dynamic not in home_text:
              raise SystemExit('Expected mode-aware hero preload block not found')
          home.write_text(home_text.replace(dynamic, static, 1), encoding='utf-8')

          sw_text = sw.read_text(encoding='utf-8')
          old = 'const CACHE_VERSION = "2026-09-14-public-release-v11-performance";'
          new = 'const CACHE_VERSION = "2026-09-14-public-release-v11";'
          if old not in sw_text:
              raise SystemExit('Expected descriptive cache version not found')
          sw.write_text(sw_text.replace(old, new, 1), encoding='utf-8')

          test.write_text('''import fs from "node:fs";\n\nconst home = fs.readFileSync("home.html", "utf8");\nconst homeCss = fs.readFileSync("resources/css/home.css", "utf8");\nconst sw = fs.readFileSync("service-worker.js", "utf8");\n\nfunction assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nconst c64Preload = '    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-c64.png" fetchpriority="high" type="image/png">';\nconst amigaPreload = '    <link rel="preload" as="image" href="resources/images/hero/ccg-hero-amiga.png" fetchpriority="high" type="image/png">';\n\nassert(!home.includes("home-debug.css"), "home.html must not request the retired home-debug.css file");\nassert(home.split(c64Preload).length - 1 === 1, "C64 hero preload must remain present exactly once");\nassert(home.split(amigaPreload).length - 1 === 1, "Amiga hero preload must remain present exactly once");\nassert(homeCss.includes("CONSOLIDATED FROM FORMER home-debug.css"), "home.css must retain the former production correction rules");\nassert(sw.includes('const CACHE_VERSION = "2026-09-14-public-release-v11";'), "service-worker cache version must follow the release contract");\nassert(sw.includes('? networkFirstAsset(request)\\n        : staleWhileRevalidate(request, ASSET_CACHE)'), "Lost Sizzler code must remain network-first while ordinary code assets use stale-while-revalidate");\n\nconsole.log("Performance consolidation phase 1 guards passed.");\n''', encoding='utf-8')
          PY

      - name: Run phase 1 guard
        run: node tests/performance-consolidation-phase1.mjs

      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve existing homepage LCP and cache contracts"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
