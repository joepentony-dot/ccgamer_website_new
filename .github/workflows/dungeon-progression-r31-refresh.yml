name: Dungeon Progression r31 Contract Refresh

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - .github/workflows/dungeon-progression-r31-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update r31 Gold compatibility and browser contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              actual=s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old[:120]!r}")
              p.write_text(s.replace(old,new))

          runtime='arcade/lost-sizzler/js/v10-41-r31-solo-dungeon-regressions.js'
          test='arcade/lost-sizzler/tests/browser/v10-41-r31-solo-dungeon-regressions.mjs'

          replace_exact(runtime,
              '      if(scoreNode)scoreNode.textContent=formatScore(score);\n      if(hudScore)hudScore.textContent=formatScore(score);',
              '      if(scoreNode){const hasGold=typeof PGR?.goldBalance==="function",gold=hasGold?PGR.goldBalance(run):0;scoreNode.textContent=hasGold?String(gold):formatScore(score);const label=scoreNode.parentElement?.firstChild;if(hasGold&&label)label.textContent="GOLD "}\n      if(hudScore)hudScore.textContent=formatScore(score);')
          replace_exact(runtime,
              '      if(nextNode){let next=1000;try{next=typeof shopScorePrice==="function"?shopScorePrice(activeShop):1000*(2**Math.max(0,Math.floor(Number(activeShop.scorePurchases)||0)))}catch(_){}nextNode.textContent=String(Math.max(0,Math.floor(Number(next)||0)))}',
              '      if(nextNode){let next=typeof PGR?.shopGoldPrice==="function"?PGR.shopGoldPrice(activeShop):1000;try{next=typeof shopScorePrice==="function"?shopScorePrice(activeShop):next}catch(_){}nextNode.textContent=String(Math.max(0,Math.floor(Number(next)||0)));const label=nextNode.parentElement?.firstChild;if(typeof PGR?.shopGoldPrice==="function"&&label)label.textContent="NEXT GOLD PRICE "}')

          replace_exact(test,
              '    score=100000;p1.armor=0;p1.inventorySlots=3;\n    window.__r31Shop={id:"r31-browser-shop",active:true,sold:{},scorePurchases:0};\n    const price=shopScorePrice(window.__r31Shop);openShop(window.__r31Shop,p1);\n    return{price,score:Number(score),capacity:PGR.inventoryCapacity(p1)};',
              '    score=100000;run.gold=100;p1.armor=0;p1.inventorySlots=3;\n    window.__r31Shop={id:"r31-browser-shop",active:true,sold:{},goldPurchases:0};\n    const price=shopScorePrice(window.__r31Shop);openShop(window.__r31Shop,p1);\n    return{price,score:Number(score),gold:PGR.goldBalance(run),capacity:PGR.inventoryCapacity(p1)};')
          replace_exact(test,
              '  assert.equal(shopSetup.score,100000,"browser shop fixture must have enough score to exercise four doubling prices");\n  assert.equal(shopSetup.price,1000,"the first normal purchase in a fresh shop must cost 1,000");',
              '  assert.equal(shopSetup.score,100000,"browser shop fixture keeps Score available as a separate run-performance value");\n  assert.equal(shopSetup.gold,100,"browser shop fixture must have enough Gold to exercise repeated purchases");\n  assert.equal(shopSetup.price,2,"the first standard purchase in a fresh shop must cost 2 Gold");')
          replace_exact(test,'window.__r31Shop.scorePurchases===1','window.__r31Shop.goldPurchases===1')
          replace_exact(test,'assert.equal(firstSlot.next,2000,"the second normal purchase must cost 2,000");','assert.equal(firstSlot.next,3,"the second standard purchase must cost 3 Gold");')
          replace_exact(test,'window.__r31Shop.scorePurchases===2','window.__r31Shop.goldPurchases===2')
          replace_exact(test,'assert.equal(secondSlot.next,4000,"the third normal purchase must cost 4,000");','assert.equal(secondSlot.next,4,"the third standard purchase must cost 4 Gold");')
          replace_exact(test,'window.__r31Shop.scorePurchases===3','window.__r31Shop.goldPurchases===3')
          replace_exact(test,'assert.equal(firstWeapon.next,8000,"the fourth normal purchase must cost 8,000");','assert.equal(firstWeapon.next,5,"the fourth standard purchase must cost 5 Gold");')
          replace_exact(test,'window.__r31Shop.scorePurchases===4','window.__r31Shop.goldPurchases===4')
          replace_exact(test,
              '    score:Number(score),scoreText:document.getElementById("shop-score")?.textContent||"",hudText:document.getElementById("hud-score")?.textContent||"",nextText:document.getElementById("shop-next-price")?.textContent||"",nextExpected:String(shopScorePrice(window.__r31Shop)),weaponDisabled:document.querySelector(\'[data-shop-buy="weapon"]\')?.disabled,soldKeys:Object.keys(window.__r31Shop.sold).filter(key=>key!=="banishmentScore"),purchases:Number(window.__r31Shop.scorePurchases||0),capacity:PGR.inventoryCapacity(p1),refreshes:window.CCGLostSizzlerV141R31SoloDungeon.state.shopWalletRefreshes',
              '    score:Number(score),gold:PGR.goldBalance(run),scoreText:document.getElementById("shop-score")?.textContent||"",hudText:document.getElementById("hud-score")?.textContent||"",nextText:document.getElementById("shop-next-price")?.textContent||"",nextExpected:String(shopScorePrice(window.__r31Shop)),weaponDisabled:document.querySelector(\'[data-shop-buy="weapon"]\')?.disabled,soldKeys:Object.keys(window.__r31Shop.sold).filter(key=>!["banishmentScore","banishmentGold"].includes(key)),purchases:Number(window.__r31Shop.goldPurchases||0),capacity:PGR.inventoryCapacity(p1),refreshes:window.CCGLostSizzlerV141R31SoloDungeon.state.shopWalletRefreshes')
          replace_exact(test,
              '  assert.equal(shopResult.score,100000-1000-2000-4000-8000,"each repeated purchase must deduct its exact doubling price immediately");\n  assert.equal(shopResult.scoreText,String(shopResult.score).padStart(6,"0"),"open shop score must update without a page refresh");\n  assert.equal(shopResult.hudText,String(shopResult.score).padStart(6,"0"),"live Solo HUD score must agree with the purchase immediately");\n  assert.equal(shopResult.nextText,shopResult.nextExpected,"open shop next-price ladder must update after a purchase");\n  assert.equal(shopResult.nextExpected,"16000","the next same-shop price after four purchases must be 16,000");',
              '  assert.equal(shopResult.score,100000,"shop purchases must not spend Score");\n  assert.equal(shopResult.gold,86,"four repeated purchases must spend the exact 2 + 3 + 4 + 5 Gold prices");\n  assert.equal(shopResult.scoreText,String(shopResult.gold),"open shop wallet must show Gold without a page refresh");\n  assert.equal(shopResult.hudText,String(shopResult.score).padStart(6,"0"),"live Solo HUD Score must remain unchanged by shopping");\n  assert.equal(shopResult.nextText,shopResult.nextExpected,"open shop next-Gold price must update after a purchase");\n  assert.equal(shopResult.nextExpected,"6","the next same-shop price after four purchases must be 6 Gold");')
          replace_exact(test,'assert.equal(shopResult.purchases,4,"the score purchase ladder must advance for every repeat purchase");','assert.equal(shopResult.purchases,4,"the Gold purchase ladder must advance for every repeat purchase");')
          PY
      - name: Syntax check touched files
        shell: bash
        run: |
          node --check arcade/lost-sizzler/js/v10-41-r31-solo-dungeon-regressions.js
          node --check arcade/lost-sizzler/tests/browser/v10-41-r31-solo-dungeon-regressions.mjs
      - name: Commit refreshed contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler/js/v10-41-r31-solo-dungeon-regressions.js arcade/lost-sizzler/tests/browser/v10-41-r31-solo-dungeon-regressions.mjs
          git rm .github/workflows/dungeon-progression-r31-refresh.yml
          git diff --cached --check
          git commit -m "test: align solo shop regression with Gold economy"
          git push origin HEAD:codex/dungeon-carnage-progression-foundation
