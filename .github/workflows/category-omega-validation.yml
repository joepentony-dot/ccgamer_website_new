name: Category Omega Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "games/genres/**"
      - "games/collections/**"
      - "music/index.html"
      - "js/ccg-category-omega.js"
      - "resources/css/ccg-category-omega.css"
      - "scripts/upgrade-category-pages.js"
      - "scripts/rebuild-games.js"
      - "tests/category-omega.test.mjs"
      - "scripts/generate-retro-pages.js"
      - "tests/retro-showdown-generator.test.mjs"
      - ".github/workflows/category-omega-validation.yml"
      - ".github/workflows/games-publishing.yml"
      - ".github/workflows/phase-6b-reliable-games-publishing.yml"
  push:
    branches: [main]
    paths:
      - "games/genres/**"
      - "games/collections/**"
      - "music/index.html"
      - "js/ccg-category-omega.js"
      - "resources/css/ccg-category-omega.css"
      - "scripts/upgrade-category-pages.js"
      - "scripts/rebuild-games.js"
      - "tests/category-omega.test.mjs"
      - "scripts/generate-retro-pages.js"
      - "tests/retro-showdown-generator.test.mjs"
      - ".github/workflows/category-omega-validation.yml"
      - ".github/workflows/games-publishing.yml"
      - ".github/workflows/phase-6b-reliable-games-publishing.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        run: |
          node --check js/ccg-category-omega.js
          node --check scripts/upgrade-category-pages.js
          node --check scripts/rebuild-games.js

      - name: Generate category SEO in validation workspace
        run: node scripts/upgrade-category-pages.js

      - name: Confirm generated category output is stable
        run: node scripts/upgrade-category-pages.js --check

      - name: Run Category Omega regression tests
        run: node --test tests/category-omega.test.mjs

      - name: Guard source-generated C64 vs Amiga showdown chapters
        run: node --test tests/retro-showdown-generator.test.mjs

      - name: Confirm generator touches only category HTML
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^games/(genres|collections)/.*\.html$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check

  # Compare the exact PR HTML against its current base in real Chromium/Lighthouse.
  # This is a bounded pre-merge non-regression check, not a claim of speed uplift.
  lighthouse-genre-comparison:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Lighthouse for measured comparison
        run: |
          mkdir -p /tmp/ccg-lighthouse
          cd /tmp/ccg-lighthouse
          npm install --no-save --no-package-lock --ignore-scripts lighthouse@12.8.2

      - name: Run mobile and desktop Lighthouse against both revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m http.server 8123 --bind 127.0.0.1 --directory baseline > /tmp/ccg-lh-baseline.log 2>&1 &
          BASE_SERVER=$!
          python3 -m http.server 8124 --bind 127.0.0.1 --directory candidate > /tmp/ccg-lh-candidate.log 2>&1 &
          CANDIDATE_SERVER=$!
          trap 'kill "$BASE_SERVER" "$CANDIDATE_SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/games/genres/role-playing-games.html && curl -fsS -o /dev/null http://127.0.0.1:8124/games/genres/role-playing-games.html; then break; fi
            sleep 1
          done
          # Balance runner warm-up/order: each revision runs first and second
          # equally often. Keep the exact original LCP/CLS acceptance ceilings.
          for mode in mobile desktop; do
            for repetition in 1 2 3 4; do
              if (( repetition % 2 == 1 )); then
                versions=(baseline candidate)
              else
                versions=(candidate baseline)
              fi
              for version in "${versions[@]}"; do
                port=8123
                if [ "$version" = candidate ]; then port=8124; fi
                options=()
                if [ "$mode" = desktop ]; then options+=(--preset=desktop); fi
                node /tmp/ccg-lighthouse/node_modules/lighthouse/cli/index.js "http://127.0.0.1:$port/games/genres/role-playing-games.html" \
                  --only-categories=performance --output=json \
                  --output-path="reports/${version}-${mode}-${repetition}.json" \
                  --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                  --quiet "${options[@]}"
              done
            done
          done

      - name: Compare measured LCP and CLS with lab-variance tolerance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const median = values => {
            const ordered = [...values].sort((a, b) => a - b);
            const mid = Math.floor(ordered.length / 2);
            return ordered.length % 2 ? ordered[mid] : (ordered[mid - 1] + ordered[mid]) / 2;
          };
          const samples = (version, mode) => [1,2,3,4].map(i => {
            const report = JSON.parse(fs.readFileSync(`reports/${version}-${mode}-${i}.json`, 'utf8'));
            return {
              lcp: report.audits['largest-contentful-paint']?.numericValue,
              cls: report.audits['cumulative-layout-shift']?.numericValue
            };
          });
          let failure = false;
          const summary = [];
          for (const mode of ['mobile','desktop']) {
            const baseRuns = samples('baseline', mode);
            const candidateRuns = samples('candidate', mode);
            for (const sample of [...baseRuns, ...candidateRuns]) {
              if (!Number.isFinite(sample.lcp) || !Number.isFinite(sample.cls)) {
                throw Error(`Missing Lighthouse metric for ${mode}`);
              }
            }
            const before = {lcp: median(baseRuns.map(r => r.lcp)), cls: median(baseRuns.map(r => r.cls))};
            const after = {lcp: median(candidateRuns.map(r => r.lcp)), cls: median(candidateRuns.map(r => r.cls))};
            // Keep original LCP and CLS allowances, but take the median of matched
            // candidate-minus-baseline run deltas to control high same-page variance.
            const pairedDelta = {
              lcp: median(baseRuns.map((sample, i) => candidateRuns[i].lcp - sample.lcp)),
              cls: median(baseRuns.map((sample, i) => candidateRuns[i].cls - sample.cls))
            };
            const lcpAllowance = before.lcp * 0.15 + 250;
            const clsAllowance = 0.03;
            const lcpCeiling = before.lcp + lcpAllowance;
            const clsCeiling = before.cls + clsAllowance;
            const passed = pairedDelta.lcp <= lcpAllowance && pairedDelta.cls <= clsAllowance;
            summary.push({mode, baseline: before, candidate: after, pairedDelta,
              lcpCeiling, clsCeiling, lcpAllowance, clsAllowance, passed});
            if (!passed) failure = true;
          }
          fs.writeFileSync('reports/summary.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          if (failure) throw Error('Genre Lighthouse regression exceeds bounded lab-variance tolerance');
          NODE

      - name: Preserve exact-head Lighthouse comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genre-lighthouse-comparison
          path: reports/
          if-no-files-found: warn
