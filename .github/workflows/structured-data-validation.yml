name: Structured Data Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.html"
      - "data/*.json"
      - "admin/templates/retro-video-template.html"
      - "scripts/generate-retro-pages.js"
      - "scripts/validate_structured_data.py"
      - "scripts/phase2a_structured_data_audit.py"
      - ".github/workflows/structured-data-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate tooling syntax
        run: |
          python -m py_compile scripts/validate_structured_data.py
          python -m py_compile scripts/phase2a_structured_data_audit.py
          node --check scripts/generate-retro-pages.js

      - name: Validate committed structured data
        run: python scripts/validate_structured_data.py

      - name: Regenerate retro pages for validation
        run: node scripts/generate-retro-pages.js

      - name: Validate regenerated structured data
        run: python scripts/validate_structured_data.py

      - name: Remove compiler bytecode before scope check
        if: always()
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Confirm generator writes only expected roots
        if: always()
        run: |
          python - <<'PY'
          import subprocess

          allowed_prefixes = (
              "retro-events/",
              "retro-specials/",
              "amiga-demo-music/",
          )
          output = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          )
          paths = []
          for line in output.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)
          unexpected = sorted(
              path for path in paths if not path.startswith(allowed_prefixes)
          )
          if unexpected:
              raise SystemExit(f"Generator changed unexpected paths: {unexpected}")
          print(f"Validated generator scope across {len(paths)} changed paths.")
          PY

      - name: Restore temporary generated output
        if: always()
        run: |
          git restore --source=HEAD -- retro-events retro-specials amiga-demo-music
          git clean -fd -- retro-events retro-specials amiga-demo-music
          test -z "$(git status --porcelain --untracked-files=all)"
