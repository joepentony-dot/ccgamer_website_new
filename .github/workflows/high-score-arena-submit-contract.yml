name: CCG Arena — Private Score Intake Contract

on:
  pull_request:
    paths:
      - "supabase/functions/ccg-arena-submit/**"
      - "tests/high-score-arena-submit-contract.test.mjs"
      - "tests/high-score-arena-submit-safety.test.mjs"
      - ".github/workflows/high-score-arena-submit-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-private-score-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run exact-media, score-bound, challenge, token and privacy tests
        shell: bash
        run: |
          set -euo pipefail
          node --check supabase/functions/ccg-arena-submit/contract.mjs
          node --test tests/high-score-arena-submit-contract.test.mjs
          node --test tests/high-score-arena-submit-safety.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check un-deployed Supabase Edge Function
        run: deno check supabase/functions/ccg-arena-submit/index.ts
