name: Rebuild retro outputs on retro data change

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/retro-events.json'
      - 'data/retro-specials.json'
      - 'data/amiga-demo-music.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  rebuild-retro-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild generated outputs atomically
        run: |
          echo "[rebuild-retro] Starting retro rebuild pipeline..."
          node scripts/generate-collection-stubs.js
          node scripts/rebuild-games.js
          echo "[rebuild-retro] Retro rebuild pipeline complete."

      - name: Commit generated outputs
        run: |
          echo "[rebuild-retro] Preparing commit (if any changes exist)..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-generate outputs"

      - name: Push generated outputs to PR branch
        run: |
          echo "[rebuild-retro] Pushing generated outputs commit (if any changes exist)..."
          git push origin HEAD:${{ github.head_ref }}
