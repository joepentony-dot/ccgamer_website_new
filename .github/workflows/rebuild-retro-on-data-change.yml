name: Rebuild retro outputs on retro data change

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/retro-events.json'
      - 'data/retro-specials.json'
      - 'data/amiga-demo-music.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  rebuild-retro-assets:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild generated outputs
        run: |
          echo "[rebuild-retro] Starting retro rebuild pipeline..."
          node scripts/rebuild-games.js
          echo "[rebuild-retro] Retro rebuild pipeline complete."

      - name: Commit generated outputs
        run: |
          set -euo pipefail
          echo "[rebuild-retro] Preparing commit (if any changes exist)..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore(retro): rebuild generated retro assets"

      - name: Push to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.head_ref }}"
