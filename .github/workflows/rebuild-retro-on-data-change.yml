name: Rebuild retro outputs on retro content change

on:
  push:
    branches:
      - main
    paths:
      - 'data/retro-events.json'
      - 'data/retro-specials.json'
      - 'data/amiga-demo-music.json'
      - 'admin/templates/retro-video-template.html'
      - 'scripts/generate-retro-pages.js'
      - 'resources/css/retro-video-pages.css'
      - '.github/workflows/rebuild-retro-on-data-change.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: retro-output-rebuild-main
  cancel-in-progress: true

jobs:
  rebuild-retro-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate retro generator syntax
        run: |
          node --check scripts/generate-retro-pages.js
          node --check scripts/generate-sitemaps.js
          node --check scripts/validate-sitemaps.js

      - name: Regenerate retro feature pages
        run: |
          echo "[rebuild-retro] Generating Retro Events, Retro Specials and Amiga Demo Music pages..."
          node scripts/generate-retro-pages.js

      - name: Refresh and validate sitemaps
        run: |
          node scripts/generate-sitemaps.js
          node scripts/validate-sitemaps.js

      - name: Check generated output whitespace
        run: git diff --check

      - name: Commit generated retro outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retro-events retro-specials amiga-demo-music sitemap.xml sitemap-pages.xml
          git diff --cached --quiet || git commit -m "Auto rebuild retro feature pages"

      - name: Push generated outputs
        run: |
          if git diff --quiet HEAD^ HEAD -- retro-events retro-specials amiga-demo-music sitemap.xml sitemap-pages.xml; then
            echo "[rebuild-retro] No generated commit was created."
            exit 0
          fi
          git push origin HEAD:main

      - name: Verify generated commit reached main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "[rebuild-retro] Generated retro output commit is on origin/main."
