name: Manual retro output rebuild

# Manual recovery path for generated retro output.
# Authoritative presentation inputs retained by this workflow contract:
# - admin/templates/retro-video-template.html
# - resources/css/retro-video-pages.css
# - resources/css/retro-video-discovery.css
# - admin/templates/video-library-template.html
# - resources/css/video-library.css

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: manual-retro-output-rebuild-main
  cancel-in-progress: false

jobs:
  rebuild-retro-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate retro generator syntax
        run: |
          node --check scripts/generate-retro-pages.js
          node --check scripts/normalize-public-header-shell.js
          node --check scripts/generate-retro-video-seo.js
          node --check scripts/validate-retro-video-seo.js
          node --check scripts/generate-video-library.js
          node --check scripts/validate-video-library.js
          node --check scripts/generate-sitemaps.js
          node --check scripts/validate-sitemaps.js
          node --check scripts/apply-seo-opportunity-plan.js

      - name: Validate SEO opportunity plan
        run: node --test tests/seo-opportunity-plan.test.mjs

      - name: Regenerate retro feature pages
        run: |
          echo "[rebuild-retro] Generating Retro Events, Retro Specials and Amiga Demo Music pages..."
          node scripts/generate-retro-pages.js

      - name: Require canonical shell on regenerated retro pages
        run: |
          node scripts/normalize-public-header-shell.js --root retro-events --check
          node scripts/normalize-public-header-shell.js --root retro-specials --check
          node scripts/normalize-public-header-shell.js --root amiga-demo-music --check

      - name: Generate retro watch-page video SEO
        run: |
          echo "[rebuild-retro] Applying dedicated watch-page markup and building the retro video sitemap..."
          node scripts/generate-retro-video-seo.js

      - name: Reapply Search Console opportunity metadata
        run: |
          node scripts/apply-seo-opportunity-plan.js --scope retro
          node scripts/apply-seo-opportunity-plan.js --scope retro --check

      - name: Generate video library and key moments
        run: |
          echo "[rebuild-retro] Building the CCG video library, chapters and internal game links..."
          node scripts/generate-video-library.js

      - name: Refresh and validate sitemaps
        run: |
          node scripts/generate-sitemaps.js
          node scripts/validate-sitemaps.js
          node scripts/validate-retro-video-seo.js
          node scripts/validate-video-library.js

      - name: Recheck canonical shell after enrichment
        run: |
          node scripts/normalize-public-header-shell.js --root retro-events --check
          node scripts/normalize-public-header-shell.js --root retro-specials --check
          node scripts/normalize-public-header-shell.js --root amiga-demo-music --check

      - name: Check generated output whitespace
        run: git diff --check

      - name: Commit generated retro outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retro-events retro-specials amiga-demo-music videos sitemap.xml sitemap-pages.xml sitemap-retro-videos.xml tools/seo/static-pages.json
          git diff --cached --quiet || git commit -m "Auto rebuild retro feature and video library pages [skip ci]"

      - name: Push generated outputs
        run: |
          git push origin HEAD:main

      - name: Verify generated commit reached main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "[rebuild-retro] Generated retro output commit is on origin/main."
