name: Rebuild retro outputs on retro data change

on:
  push:
    branches:
      - main
    paths:
      - 'data/retro-events.json'
      - 'data/retro-specials.json'
      - 'data/amiga-demo-music.json'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  rebuild-retro-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild generated outputs
        run: |
          echo "[rebuild-retro] Starting retro rebuild pipeline..."
          node scripts/rebuild-games.js
          echo "[rebuild-retro] Retro rebuild pipeline complete."

      - name: Commit generated outputs
        run: |
          echo "[rebuild-retro] Preparing commit (if any changes exist)..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto rebuild retro assets"

      - name: Push generated outputs
        run: |
          echo "[rebuild-retro] Pushing generated outputs commit (if any changes exist)..."
          git push || echo "No changes to push"
