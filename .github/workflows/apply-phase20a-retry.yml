name: Apply corrected Phase 20A archive fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/phase20a-apply.js"
      - ".github/workflows/apply-phase20a-retry.yml"
  push:
    branches:
      - codex/phase-20a-archive-quality-accuracy
    paths:
      - ".github/workflows/apply-phase20a-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'codex/phase-20a-archive-quality-accuracy'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-20a-archive-quality-accuracy
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record protected hashes
        run: sha256sum index.html home.html resources/css/intro.css js/index-intro.js > "$RUNNER_TEMP/protected.sha256"

      - name: Apply, rebuild and verify corrections
        run: node scripts/phase20a-apply.js

      - name: Verify protected files and diff
        run: |
          sha256sum --check "$RUNNER_TEMP/protected.sha256"
          git diff --check

      - name: Remove one-time automation and commit
        run: |
          rm -f \
            .github/workflows/apply-phase20a-archive-quality-accuracy.yml \
            .github/workflows/apply-phase20a-retry.yml \
            scripts/phase20a-apply.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Correct archive quality findings and rebuild games"
          git push origin HEAD:codex/phase-20a-archive-quality-accuracy
