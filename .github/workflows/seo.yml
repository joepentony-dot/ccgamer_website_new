name: SEO Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ccg-generated-seo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          echo "[seo] Installing dependencies (best effort)..."
          npm install || true

      # Verified public YouTube metadata is read via the repository secret below; never commit the API key itself.
      - name: Sync verified YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "[seo] Syncing verified YouTube titles, descriptions, upload dates, durations and thumbnails..."
            npm run sync:video-metadata
          else
            echo "[seo] YOUTUBE_API_KEY is not configured; keeping the verified metadata store unchanged."
          fi

      - name: Regenerate retro feature pages
        run: |
          echo "[seo] Regenerating Retro Specials, Retro Events and Amiga Demo Music from their authoritative datasets..."
          node scripts/generate-retro-pages.js

      - name: Generate game video SEO
        run: |
          echo "[seo] Generating static game video markup and game video sitemap..."
          npm run generate:video-seo

      - name: Generate retro watch page video SEO
        run: |
          echo "[seo] Generating Retro Specials, Retro Events and Amiga Demo Music watch-page video SEO..."
          npm run generate:retro-video-seo

      - name: Generate video library and key moments
        run: |
          echo "[seo] Generating the CCG video library, chapter links, Clip markup and internal game discovery..."
          npm run generate:video-library

      - name: Generate sitemap index
        run: |
          echo "[seo] Generating sitemap artifacts and indexing all child sitemaps..."
          npm run generate:sitemaps

      - name: Validate sitemaps
        run: npm run validate:sitemaps

      - name: Validate game video SEO
        run: npm run validate:video-seo

      - name: Validate retro watch page video SEO
        run: npm run validate:retro-video-seo

      - name: Validate video library and key moments
        run: npm run validate:video-library

      - name: Check generated output whitespace
        run: git diff --check

      - name: Commit generated SEO artifacts
        if: github.event_name != 'pull_request'
        run: |
          echo "[seo] Checking generated SEO diffs..."
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add sitemap.xml sitemap-*.xml data/video-metadata.json games/*/index.html retro-events retro-specials amiga-demo-music videos tools/seo/static-pages.json
          git diff --cached --quiet || git commit -m "Auto-update generated SEO and video pages [skip ci]"

      - name: Push generated SEO artifacts
        if: github.event_name != 'pull_request'
        run: |
          echo "[seo] Pushing generated SEO updates (if any)..."
          git push
