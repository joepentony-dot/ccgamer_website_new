name: SEO Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          echo "[seo] Installing dependencies (best effort)..."
          npm install || true

      - name: Generate sitemap
        run: |
          echo "[seo] Generating sitemap artifacts..."
          node scripts/generate-sitemaps.js

      - name: Commit sitemap if changed
        run: |
          set -euo pipefail
          echo "[seo] Checking sitemap diffs..."
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add sitemap.xml sitemap-games.xml sitemap-music.xml sitemap-retro.xml
          git diff --cached --quiet || git commit -m "chore(seo): auto-update sitemaps"

      - name: Push to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.head_ref }}"
