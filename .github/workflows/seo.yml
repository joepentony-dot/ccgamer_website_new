name: SEO Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install || true

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit sitemap if changed
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-update sitemap"

      - name: Push changes
        run: git push
