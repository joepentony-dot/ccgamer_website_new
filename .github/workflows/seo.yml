name: SEO Automation

on:
  push:
    branches:
      - main

concurrency:
  group: seo-automation
  cancel-in-progress: true

jobs:
  seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate game sitemap
        run: node tools/seo/generate-sitemap.js

      - name: Run SEO audit
        run: node tools/seo/seo-audit.js

      - name: Ensure sitemap files are up to date
        run: git diff --exit-code -- sitemap.xml sitemap-games.xml sitemap-pages.xml
