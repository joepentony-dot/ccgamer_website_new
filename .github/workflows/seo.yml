name: SEO Automation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          echo "[seo] Installing dependencies (best effort)..."
          npm install || true

      - name: Run atomic generation pipeline
        run: |
          node scripts/generate-collection-stubs.js
          node scripts/generate-retro-pages.js
          node tools/seo/generate-sitemap.js

      - name: Commit generated outputs
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-generate outputs"

      - name: Push changes to PR branch
        run: git push origin HEAD:${{ github.head_ref }}
