name: SEO Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          echo "[seo] Installing dependencies (best effort)..."
          npm install || true

      - name: Generate sitemap
        run: |
          echo "[seo] Generating sitemap artifacts..."
          if [ -f scripts/generate-sitemap.js ]; then
            node scripts/generate-sitemap.js
          else
            echo "[seo] No sitemap script found, skipping"
          fi

      - name: Commit sitemap if changed
        run: |
          echo "[seo] Checking sitemap diffs..."
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-update sitemap"

      - name: Push changes
        run: |
          echo "[seo] Pushing sitemap updates (if any)..."
          git push
