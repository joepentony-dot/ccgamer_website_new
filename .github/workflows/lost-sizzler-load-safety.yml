name: Lost Sizzler Load Safety

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'

permissions:
  contents: read

concurrency:
  group: lost-sizzler-load-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical game load safety
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every canonical Lost Sizzler JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check js/ccg-pwa.js
          find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find arcade/lost-sizzler/tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run canonical Node regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/*.mjs; do
            case "$(basename "$test")" in
              v10-6-browser.mjs|v10-28-browser-stability.mjs)
                continue
                ;;
            esac
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Chromium load and layout suite
        shell: bash
        run: |
          set -euo pipefail
          # The V10.6 harness historically preferred whatever system Chrome the
          # runner happened to provide. Pin it to Playwright's matching Chromium
          # so browser failures describe the game rather than protocol skew.
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"

          # Historical browser assumptions are normalised only in this disposable
          # checkout. V10.6 was copied from the deeper legacy /games/... tree and
          # still walked four directories up; from /arcade/lost-sizzler/tests that
          # serves the parent of the repository and therefore a 404 instead of the
          # game. Its channel-only Supabase mock is also deferred until gameReady.
          # V10.28 gets its current label and non-blocking held-fire sampler.
          python - <<'PY'
          from pathlib import Path

          stability=Path('arcade/lost-sizzler/tests/v10-28-browser-stability.mjs')
          source=stability.read_text(encoding='utf-8')
          source=source.replace('"THE LOST SIZZLER — V10.35","the current build subtitle must survive older deferred UI initialisers"','"THE LOST SIZZLER — V10.41","the current build subtitle must survive older deferred UI initialisers"',1)
          old='''    await state.page.keyboard.down("Space");
    const heldSwingSamples=await state.page.evaluate(async()=>{
      const values=new Set(),modes=new Set(),inputStates=new Set();
      const until=performance.now()+1250;
      while(performance.now()<until){const at=Number(p1?._meleeSwingAt||0);if(at>0)values.add(at);modes.add(mode);inputStates.add(input.has("Space"));await new Promise(resolve=>setTimeout(resolve,45));}
      return{values:[...values],modes:[...modes],inputStates:[...inputStates],fire1,fireBuffer1,hitStunMs:p1.hitStunMs};
    });
    await state.page.keyboard.up("Space");
    assert.ok(heldSwingSamples.values.length>=2,`holding the fire key must auto-repeat sword swings: ${JSON.stringify(heldSwingSamples)}`);'''
          new='''    await state.page.keyboard.down("Space");
    const heldValues=new Set(),heldModes=new Set(),heldInputs=new Set();
    const heldDeadline=Date.now()+2500;
    let heldLast={fire1:0,fireBuffer1:0,hitStunMs:0};
    while(Date.now()<heldDeadline&&heldValues.size<2){
      const sample=await state.page.evaluate(()=>({at:Number(p1?._meleeSwingAt||0),mode,inputState:input.has("Space"),fire1,fireBuffer1,hitStunMs:p1.hitStunMs}));
      if(sample.at>0)heldValues.add(sample.at);heldModes.add(sample.mode);heldInputs.add(sample.inputState);heldLast=sample;
      await state.page.waitForTimeout(75);
    }
    await state.page.keyboard.up("Space");
    const heldSwingSamples={values:[...heldValues],modes:[...heldModes],inputStates:[...heldInputs],fire1:heldLast.fire1,fireBuffer1:heldLast.fireBuffer1,hitStunMs:heldLast.hitStunMs};
    assert.ok(heldSwingSamples.values.length>=2,`holding the fire key must auto-repeat sword swings: ${JSON.stringify(heldSwingSamples)}`);'''
          if old not in source:
              raise SystemExit('V10.28 held-melee sampling marker not found')
          source=source.replace(old,new,1)
          stability.write_text(source,encoding='utf-8')

          legacy=Path('arcade/lost-sizzler/tests/v10-6-browser.mjs')
          source=legacy.read_text(encoding='utf-8')
          old='const repo=path.resolve(path.dirname(fileURLToPath(import.meta.url)),"../../../..");'
          new='const repo=path.resolve(path.dirname(fileURLToPath(import.meta.url)),"../../..");'
          if old not in source:
              raise SystemExit('V10.6 browser harness repository-root marker not found')
          source=source.replace(old,new,1)
          old='window.ccgSupabase={getClient:async()=>client()};'
          new='window.__ccgV106TestClientFactory=client;'
          if old not in source:
              raise SystemExit('V10.6 browser harness Supabase bootstrap marker not found')
          source=source.replace(old,new,1)
          old='await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.locator("#player-name").fill(name);return page}'
          new='await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.evaluate(()=>{window.ccgSupabase={getClient:async()=>window.__ccgV106TestClientFactory()}});await page.locator("#player-name").fill(name);return page}'
          if old not in source:
              raise SystemExit('V10.6 browser harness makePage marker not found')
          source=source.replace(old,new,1)
          legacy.write_text(source,encoding='utf-8')
          PY

          for test in \
            arcade/lost-sizzler/tests/v10-6-browser.mjs \
            arcade/lost-sizzler/tests/v10-28-browser-stability.mjs \
            arcade/lost-sizzler/tests/browser/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
