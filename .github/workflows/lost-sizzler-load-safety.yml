name: Lost Sizzler Load Safety

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lost-sizzler-load-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical game load safety
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical Lost Sizzler structure
        shell: bash
        run: |
          set -euo pipefail
          test -f arcade/lost-sizzler/index.html
          test -f arcade/lost-sizzler/version.json
          test -f arcade/lost-sizzler/js/asset-overrides.js
          test -f arcade/lost-sizzler/js/game-main.js
          test -f arcade/lost-sizzler/js/v10-16-voice-director.js
          test -f arcade/lost-sizzler/js/v10-41-r47-all-mode-optimisation.js
          test -d arcade/lost-sizzler/assets/audio/music
          test -d arcade/lost-sizzler/assets/audio/voice
          grep -q 'The Lost Sizzler' arcade/lost-sizzler/index.html
          grep -q 'https://www.cheekycommodoregamer.co.uk/arcade/lost-sizzler/' arcade/lost-sizzler/index.html
          grep -q '/arcade/lost-sizzler/' games/ccg-games/cheeky-commodore-quest/index.html
          grep -q '/arcade/lost-sizzler/' games/the-lost-sizzler/index.html
          grep -q 'isEditableKeyboardTarget' arcade/lost-sizzler/js/game-main.js
          if grep -R --line-number --fixed-strings '/games/ccg-games/cheeky-commodore-quest/' arcade/lost-sizzler/js arcade/lost-sizzler/index.html arcade/lost-sizzler/version.json --include='*.html' --include='*.js' --include='*.json' --exclude='v10-41-cache-guard.js'; then
            echo 'Stale Lost Sizzler self-reference found inside canonical arcade runtime.' >&2
            exit 1
          fi

      - name: Syntax check every canonical Lost Sizzler JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check js/ccg-pwa.js
          find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find arcade/lost-sizzler/tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run canonical Node regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/*.mjs; do
            case "$(basename "$test")" in
              v10-6-browser.mjs|v10-28-browser-stability.mjs)
                continue
                ;;
            esac
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Chromium load and layout suite
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/lost-sizzler-browser-current.txt"
          current_log="$RUNNER_TEMP/lost-sizzler-browser-current.log"
          rm -f "$marker" "$current_log"

          capture_failure() {
            local test="$1"
            {
              printf '%s\n\n' "$test"
              echo '--- failure output tail ---'
              tail -n 160 "$current_log" 2>/dev/null || true
            } > "$marker"
          }

          run_browser_test() {
            local test="$1"
            printf '%s\n' "$test" > "$marker"
            : > "$current_log"
            echo "::group::$test"
            if node "$test" 2>&1 | tee "$current_log"; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            capture_failure "$test"
            return 1
          }

          run_legacy_browser_test() {
            local test="$1"
            printf '%s (attempt 1)\n' "$test" > "$marker"
            : > "$current_log"
            echo "::group::$test (attempt 1)"
            if node "$test" 2>&1 | tee "$current_log"; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            echo "Legacy browser test timed out or failed on attempt 1; retrying once on a fresh browser process: $test"
            printf '%s (attempt 2)\n' "$test" > "$marker"
            : > "$current_log"
            echo "::group::$test (attempt 2)"
            if node "$test" 2>&1 | tee "$current_log"; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            capture_failure "$test (attempt 2)"
            return 1
          }

          run_long_soak_test() {
            local test="$1"
            printf '%s (attempt 1)\n' "$test" > "$marker"
            : > "$current_log"
            echo "::group::$test (attempt 1)"
            if node "$test" 2>&1 | tee "$current_log"; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            echo "Long-session soak failed on attempt 1; retrying once on a fresh browser process to distinguish runner sampling starvation from a deterministic regression: $test"
            printf '%s (attempt 2)\n' "$test" > "$marker"
            : > "$current_log"
            echo "::group::$test (attempt 2)"
            if node "$test" 2>&1 | tee "$current_log"; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            capture_failure "$test (attempt 2)"
            return 1
          }

          run_legacy_browser_test arcade/lost-sizzler/tests/v10-6-browser.mjs
          run_legacy_browser_test arcade/lost-sizzler/tests/support/v10-28-browser-stability-deterministic.mjs

          for test in arcade/lost-sizzler/tests/browser/*.mjs; do
            case "$(basename "$test")" in
              v10-41-solo-long-session-soak.mjs)
                run_long_soak_test "$test"
                ;;
              *)
                run_browser_test "$test"
                ;;
            esac
          done
          rm -f "$marker" "$current_log"

      - name: Upload failing Chromium contract marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-sizzler-failing-browser-contract
          path: ${{ runner.temp }}/lost-sizzler-browser-current.txt
          if-no-files-found: ignore
          retention-days: 1