name: Lost Sizzler Load Safety

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/ccg-games/cheeky-commodore-quest/index.html'
      - 'games/the-lost-sizzler/index.html'
      - 'js/ccg-home-community.js'
      - 'resources/css/home-lost-sizzler-cta.css'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lost-sizzler-load-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Canonical structure and Node contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical Lost Sizzler structure
        shell: bash
        run: |
          set -euo pipefail
          test -f arcade/lost-sizzler/index.html
          test -f arcade/lost-sizzler/version.json
          test -f arcade/lost-sizzler/js/asset-overrides.js
          test -f arcade/lost-sizzler/js/game-main.js
          test -f arcade/lost-sizzler/js/v10-16-voice-director.js
          test -f arcade/lost-sizzler/js/v10-41-r47-all-mode-optimisation.js
          test -d arcade/lost-sizzler/assets/audio/music
          test -d arcade/lost-sizzler/assets/audio/voice
          grep -q 'C64 Dungeon Carnage' arcade/lost-sizzler/index.html
          grep -q 'https://www.cheekycommodoregamer.co.uk/arcade/lost-sizzler/' arcade/lost-sizzler/index.html
          grep -q '/arcade/lost-sizzler/' games/ccg-games/cheeky-commodore-quest/index.html
          grep -q '/arcade/lost-sizzler/' games/the-lost-sizzler/index.html
          grep -q 'isEditableKeyboardTarget' arcade/lost-sizzler/js/game-main.js
          if grep -R --line-number --fixed-strings '/games/ccg-games/cheeky-commodore-quest/' arcade/lost-sizzler/js arcade/lost-sizzler/index.html arcade/lost-sizzler/version.json --include='*.html' --include='*.js' --include='*.json' --exclude='v10-41-cache-guard.js'; then
            echo 'Stale Lost Sizzler self-reference found inside canonical arcade runtime.' >&2
            exit 1
          fi

      - name: Syntax check every canonical Lost Sizzler JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check js/ccg-pwa.js
          find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find arcade/lost-sizzler/tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run canonical Node regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/*.mjs; do
            case "$(basename "$test")" in
              v10-6-browser.mjs|v10-28-browser-stability.mjs|horde-survivor-contract.mjs|sizzler-saboteurs-contract.mjs|v10-33-special-modes-polish.mjs|v10-37-horde-*.mjs|v10-38-horde-*.mjs|v10-39-horde-*.mjs|v10-40-horde-*.mjs|v10-41-horde-*.mjs|v10-41-r25-spy-*.mjs|v10-41-r26-spy-*.mjs|v10-41-r27-spy-*.mjs|v10-41-r29-spy-*.mjs|v10-41-r36-spy-*.mjs|v10-41-r41-colyseus-spy.mjs|v10-41-r45-spy-*.mjs|v10-41-r58-spy-*.mjs|v10-41-spy-*.mjs|v10-41-ui-spy-*.mjs|v10-42-r11-spy-*.mjs)
                continue
                ;;
            esac
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

  browser-manifest:
    name: Discover Chromium contracts
    needs: core
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build sharded browser contract matrix
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const retiredModeTests=new Set([
            'v10-41-menu-leaderboard-stability.mjs',
            'v10-41-mode-controller-isolation.mjs',
            'v10-41-stage11-release-cross-mode-lifecycle.mjs',
            // These diagnostics exercise only retired Spy/Horde ownership.
            'v10-41-r57-desktop-prep-stability.mjs',
            'v10-41-r60-damage-owner-transition-diagnostic.mjs'
          ]);
          const tests=[
            'arcade/lost-sizzler/tests/v10-6-browser.mjs',
            'arcade/lost-sizzler/tests/v10-9-stability.mjs',
            'arcade/lost-sizzler/tests/support/v10-28-browser-stability-deterministic.mjs',
            ...fs.readdirSync('arcade/lost-sizzler/tests/browser')
              .filter(name=>name.endsWith('.mjs'))
              .filter(name=>!/(?:horde|spy)/i.test(name))
              .filter(name=>!retiredModeTests.has(name))
              .sort()
              .map(name=>`arcade/lost-sizzler/tests/browser/${name}`)
          ];
          const shardCount=6;
          const duplicateTests=tests.filter((test,index)=>tests.indexOf(test)!==index);
          if (duplicateTests.length) {
            throw new Error(`Duplicate browser contracts in manifest: ${duplicateTests.join(', ')}`);
          }
          const shards=Array.from({length:shardCount},()=>[]);
          for (const [index,test] of tests.entries()) {
            shards[index%shardCount].push(test);
          }
          const shardedTests=shards.flat();
          if (shardedTests.length!==tests.length || new Set(shardedTests).size!==tests.length) {
            throw new Error('Browser contract sharding omitted or duplicated a retained contract.');
          }
          process.stdout.write(`matrix=${JSON.stringify({include:shards.map((tests,index)=>({shard:index+1,tests:JSON.stringify(tests)}))})}\n`);
          NODE

  browser-contract:
    name: Chromium shard ${{ matrix.shard }}
    needs: browser-manifest
    runs-on: ubuntu-latest
    # Each shard runs the retained active contracts after one Chromium install.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.browser-manifest.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          # Playwright downloads its own Chromium; the preinstalled Google Chrome
          # repository is not required for its Ubuntu dependency installation.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          npx playwright install --with-deps chromium

      - name: Run browser contracts in shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TESTS_JSON: ${{ matrix.tests }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/lost-sizzler-browser-shard-$SHARD.log"
          : > "$log"
          failures=()
          while IFS= read -r test_file; do
            name="$(basename "$test_file")"
            attempts=1
            case "$name" in
              v10-6-browser.mjs|v10-28-browser-stability-deterministic.mjs|v10-41-solo-long-session-soak.mjs)
                attempts=2
                ;;
            esac
            passed=false
            for attempt in $(seq 1 "$attempts"); do
              echo "::group::$test_file (attempt $attempt/$attempts)"
              echo "=== $test_file attempt $attempt/$attempts ===" | tee -a "$log"
              if node "$test_file" 2>&1 | tee -a "$log"; then
                passed=true
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Browser contract failed on attempt $attempt; retrying on a fresh process: $test_file" | tee -a "$log"
                echo >> "$log"
              fi
            done
            if [ "$passed" != true ]; then
              failures+=("$test_file")
            fi
          done < <(node -e 'JSON.parse(process.env.TESTS_JSON).forEach(test => console.log(test))')
          if [ "${#failures[@]}" -gt 0 ]; then
            for test_file in "${failures[@]}"; do
              echo "::error title=Lost Sizzler browser regression::$test_file failed in Chromium shard $SHARD"
            done
            echo "Chromium shard $SHARD failed contracts: ${failures[*]}" | tee -a "$log"
            exit 1
          fi

      - name: Upload failing Chromium shard log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-sizzler-browser-shard-${{ matrix.shard }}-failure
          path: ${{ runner.temp }}/lost-sizzler-browser-shard-${{ matrix.shard }}.log
          if-no-files-found: error
          retention-days: 7
