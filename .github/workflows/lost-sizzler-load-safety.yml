name: Lost Sizzler Load Safety

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'

permissions:
  contents: read

concurrency:
  group: lost-sizzler-load-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical game load safety
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every canonical Lost Sizzler JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check js/ccg-pwa.js
          find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find arcade/lost-sizzler/tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run canonical Node regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/*.mjs; do
            case "$(basename "$test")" in
              v10-6-browser.mjs|v10-28-browser-stability.mjs)
                continue
                ;;
            esac
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Install Chromium test runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run canonical Chromium load and layout suite
        shell: bash
        run: |
          set -euo pipefail
          # The V10.6 harness historically preferred whatever system Chrome the
          # runner happened to provide. Pin it to Playwright's matching Chromium
          # so browser failures describe the game rather than protocol skew.
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"

          # Two historical harness assumptions pre-date the current release.
          # Normalise them only in this disposable checkout: V10.28's old label,
          # and V10.6's Realtime mock. The latter used to replace ccgSupabase at
          # page start with a channel-only object; current startup consumers also
          # use functions/auth/data APIs, so that incomplete mock could prevent
          # the enhancement queue reaching V10.6. Keep the factory private until
          # gameReady, then install it immediately before multiplayer actions.
          python - <<'PY'
          from pathlib import Path

          stability=Path('arcade/lost-sizzler/tests/v10-28-browser-stability.mjs')
          source=stability.read_text(encoding='utf-8')
          source=source.replace('"THE LOST SIZZLER — V10.35","the current build subtitle must survive older deferred UI initialisers"','"THE LOST SIZZLER — V10.41","the current build subtitle must survive older deferred UI initialisers"',1)
          stability.write_text(source,encoding='utf-8')

          legacy=Path('arcade/lost-sizzler/tests/v10-6-browser.mjs')
          source=legacy.read_text(encoding='utf-8')
          old='window.ccgSupabase={getClient:async()=>client()};'
          new='window.__ccgV106TestClientFactory=client;'
          if old not in source:
              raise SystemExit('V10.6 browser harness Supabase bootstrap marker not found')
          source=source.replace(old,new,1)
          old='await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.locator("#player-name").fill(name);return page}'
          new='await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.evaluate(()=>{window.ccgSupabase={getClient:async()=>window.__ccgV106TestClientFactory()}});await page.locator("#player-name").fill(name);return page}'
          if old not in source:
              raise SystemExit('V10.6 browser harness makePage marker not found')
          source=source.replace(old,new,1)
          legacy.write_text(source,encoding='utf-8')
          PY

          for test in \
            arcade/lost-sizzler/tests/v10-6-browser.mjs \
            arcade/lost-sizzler/tests/v10-28-browser-stability.mjs \
            arcade/lost-sizzler/tests/browser/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
