name: One-off Materialize Happiest Days Drive Video

on:
  push:
    branches:
      - codex/materialize-happiest-days-drive-video
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'codex/materialize-happiest-days-drive-video'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: codex/materialize-happiest-days-drive-video
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Materialize game video SEO and external override
        run: npm run generate:video-seo

      - name: Validate video sitemap and game video SEO
        run: |
          npm run validate:sitemaps
          npm run validate:video-seo

      - name: Commit generated Drive video artifacts
        run: |
          git config user.name "ccg-video-bot"
          git config user.email "ccg-video-bot@users.noreply.github.com"
          git add games/the-happiest-days-of-your-life/index.html sitemap-videos.xml
          if git diff --cached --quiet; then
            echo "Drive video artifacts are already materialized."
          else
            git commit -m "Materialize Drive video for Happiest Days"
            git push origin HEAD:codex/materialize-happiest-days-drive-video
          fi
