name: Lost Sizzler R21 Live Join Dedupe

on:
  push:
    branches:
      - fix/lost-sizzler-browser-stability-gameplay
    paths:
      - '.github/workflows/lost-sizzler-r21-live-join-dedupe.yml'

permissions:
  contents: write

jobs:
  dedupe-live-join:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-sizzler-browser-stability-gameplay
          fetch-depth: 0

      - name: Remove duplicate dated live-presence loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root=Path('arcade/lost-sizzler')
          network=root/'js/network.js'
          source=network.read_text(encoding='utf-8')
          old='''(()=>{\n  if(document.querySelector('script[data-ccg-v141-live-join-presence="true"]'))return;\n  const script=document.createElement("script");\n  script.src="js/v10-41-live-join-presence.js?v=20260825a";\n  script.async=false;\n  script.dataset.ccgV141LiveJoinPresence="true";\n  document.head.appendChild(script);\n})();'''
          new='''(()=>{\n  if(document.querySelector('script[data-ccg-v141-live-join-presence="true"]'))return;\n  const releaseRev=String(document.querySelector('meta[name="ccg-lost-sizzler-cache"]')?.content||document.querySelector('meta[name="ccg-lost-sizzler-build"]')?.content||"latest").trim();\n  const script=document.createElement("script");\n  script.src=`js/v10-41-live-join-presence.js?v=${encodeURIComponent(releaseRev)}`;\n  script.async=false;\n  script.dataset.ccgV141LiveJoinPresence="true";\n  document.head.appendChild(script);\n})();'''
          if old not in source:
              raise SystemExit('Expected dated live-join loader was not found in network.js')
          network.write_text(source.replace(old,new,1),encoding='utf-8')

          index=root/'index.html'
          html=index.read_text(encoding='utf-8')
          direct='<script src="js/v10-41-live-join-presence.js?v=20260825r21"></script>\n'
          if direct not in html:
              raise SystemExit('Expected duplicate direct live-join script was not found in index.html')
          index.write_text(html.replace(direct,'',1),encoding='utf-8')

          test=root/'tests/v10-41-live-join-presence.mjs'
          text=test.read_text(encoding='utf-8')
          text=text.replace(
              'assert.match(network,/v10-41-live-join-presence\\.js\\?v=20260825a/,"network core must load the V10.41 late-join hardening layer");',
              'assert.match(network,/v10-41-live-join-presence\\.js\\?v=\\$\\{encodeURIComponent\\(releaseRev\\)\\}/,"network core must load the V10.41 late-join hardening layer through the current release token");'
          )
          text=text.replace('current r20 build','current r21 build').replace('current r20 cache generation','current r21 cache generation').replace('current r20 network runtime','current r21 network runtime')
          text=text.replace(
              'assert.match(index,/js\\/network\\.js\\?v=20260825r21/,"published page must keep browsers on the current r21 network runtime");',
              'assert.match(index,/js\\/network\\.js\\?v=20260825r21/,"published page must keep browsers on the current r21 network runtime");\nassert.doesNotMatch(index,/v10-41-live-join-presence\\.js/,"published HTML must not duplicate the live-join module already owned by network.js");'
          )
          test.write_text(text,encoding='utf-8')

          delivery=root/'tests/v10-41-r21-release-delivery.mjs'
          d=delivery.read_text(encoding='utf-8')
          if 'const network=read("js/network.js");' not in d:
              d=d.replace('const late=read("js/v10-41-lake-item-safety.js");','const late=read("js/v10-41-lake-item-safety.js");\nconst network=read("js/network.js");')
          if 'network core must not retain' not in d:
              d=d.replace(
                  'assert.match(late,/script\\.src=`\\$\\{path\\}\\?v=\\$\\{encodeURIComponent\\(releaseRev\\)\\}`/,"late stability modules must share the published release token");',
                  'assert.match(late,/script\\.src=`\\$\\{path\\}\\?v=\\$\\{encodeURIComponent\\(releaseRev\\)\\}`/,"late stability modules must share the published release token");\nassert.doesNotMatch(network,/v10-41-live-join-presence\\.js\\?v=20260825a/,"network core must not retain the dated live-join cache URL");\nassert.match(network,/v10-41-live-join-presence\\.js\\?v=\\$\\{encodeURIComponent\\(releaseRev\\)\\}/,"network live-join loader must inherit r21 from page metadata");'
              )
          delivery.write_text(d,encoding='utf-8')
          PY

      - name: Validate live-presence delivery
        shell: bash
        run: |
          set -euo pipefail
          node --check arcade/lost-sizzler/js/network.js
          node arcade/lost-sizzler/tests/v10-41-live-join-presence.mjs
          node arcade/lost-sizzler/tests/v10-41-r21-release-delivery.mjs

      - name: Commit dedupe and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lost-sizzler-r21-live-join-dedupe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler .github/workflows/lost-sizzler-r21-live-join-dedupe.yml
          git commit -m "Deduplicate Lost Sizzler r21 live presence loader"
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
