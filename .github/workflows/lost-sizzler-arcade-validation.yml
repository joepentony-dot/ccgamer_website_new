name: Lost Sizzler Arcade Validation

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - '.github/workflows/lost-sizzler-arcade-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - '.github/workflows/lost-sizzler-arcade-validation.yml'

permissions:
  contents: write

jobs:
  sync-browser-harnesses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gameplay branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-sizzler-browser-stability-gameplay
          fetch-depth: 0

      - name: Make historical browser harnesses deterministic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tutorial=Path('arcade/lost-sizzler/tests/v10-28-browser-stability.mjs')
          text=tutorial.read_text(encoding='utf-8')
          old='''    await state.page.locator("#ccg-tutorial-stage-modal [data-stage-continue]").click();
    await state.page.keyboard.press("Tab");await state.page.waitForTimeout(180);await state.page.keyboard.press("Tab");
    await withTimeout(state.page.waitForFunction(()=>window.CCGLostSizzlerOnboardingV120.state.step===4&&!document.getElementById("ccg-tutorial-stage-modal")?.classList.contains("hidden"),null,{timeout:6000}),8000,"Tutorial information stages");'''
          new='''    await state.page.locator("#ccg-tutorial-stage-modal [data-stage-continue]").click();
    await state.page.keyboard.press("Tab");
    await withTimeout(state.page.waitForFunction(()=>window.CCGLostSizzlerOnboardingV120?.state?.inventoryOpened===true,null,{timeout:3000}),4000,"Tutorial inventory open");
    await state.page.keyboard.press("Tab");
    await withTimeout(state.page.waitForFunction(()=>window.CCGLostSizzlerOnboardingV120?.state?.inventoryClosed===true,null,{timeout:3000}),4000,"Tutorial inventory close");
    await withTimeout(state.page.waitForFunction(()=>window.CCGLostSizzlerOnboardingV120.state.step===4&&!document.getElementById("ccg-tutorial-stage-modal")?.classList.contains("hidden"),null,{timeout:6000}),8000,"Tutorial information stages");'''
          if old not in text:
              raise SystemExit('Tutorial inventory timing marker not found')
          tutorial.write_text(text.replace(old,new,1),encoding='utf-8')

          v106=Path('arcade/lost-sizzler/tests/v10-6-browser.mjs')
          text=v106.read_text(encoding='utf-8')
          replacements=[
            (
              'bc.onmessage=event=>{const data=event.data;for(const row of events)if(row.type==="broadcast"&&row.filter?.event===data.event)row.callback({payload:data.payload})};',
              'bc.onmessage=event=>{const data=event.data;if(data?.type==="presence"){firePresence();return}for(const row of events)if(row.type==="broadcast"&&row.filter?.event===data.event)row.callback({payload:data.payload})};',
              'V10.6 presence receiver'
            ),
            (
              'async track(payload){mine={...payload};localStorage.setItem(`${prefix}${key}`,JSON.stringify(mine));firePresence();return"ok"}',
              'async track(payload){mine={...payload};localStorage.setItem(`${prefix}${key}`,JSON.stringify(mine));firePresence();bc.postMessage({type:"presence"});return"ok"}',
              'V10.6 presence track'
            ),
            (
              'async untrack(){localStorage.removeItem(`${prefix}${key}`);mine=null;firePresence();return"ok"}',
              'async untrack(){localStorage.removeItem(`${prefix}${key}`);mine=null;firePresence();bc.postMessage({type:"presence"});return"ok"}',
              'V10.6 presence untrack'
            )
          ]
          for before,after,label in replacements:
              if before not in text:
                  raise SystemExit(f'{label} marker not found')
              text=text.replace(before,after,1)
          v106.write_text(text,encoding='utf-8')
          PY

          node --check arcade/lost-sizzler/tests/v10-28-browser-stability.mjs
          node --check arcade/lost-sizzler/tests/v10-6-browser.mjs

      - name: Commit browser harness fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/lost-sizzler/tests/v10-28-browser-stability.mjs arcade/lost-sizzler/tests/v10-6-browser.mjs
          git commit -m 'Make final Lost Sizzler browser harnesses deterministic'
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
