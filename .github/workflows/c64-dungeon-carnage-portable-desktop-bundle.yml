name: C64 Dungeon Carnage Portable Desktop Bundle

on:
  pull_request:
    paths:
      - 'scripts/build-lost-sizzler-portable-desktop-bundle.py'
      - 'arcade/lost-sizzler/tests/portable-desktop-bundle-contract.py'
      - '.github/workflows/c64-dungeon-carnage-portable-desktop-bundle.yml'
      - 'scripts/verify-lost-sizzler-package-tree.mjs'
      - 'scripts/build-lost-sizzler-package-provenance.mjs'
      - 'scripts/assemble-lost-sizzler-desktop-staging.mjs'

permissions:
  contents: read

jobs:
  portable-desktop-bundle-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          python3 -m py_compile scripts/build-lost-sizzler-portable-desktop-bundle.py
          python3 -m py_compile arcade/lost-sizzler/tests/portable-desktop-bundle-contract.py
          node --check scripts/verify-lost-sizzler-package-tree.mjs
          node --check scripts/build-lost-sizzler-package-provenance.mjs

      - name: Portable desktop bundle regression
        run: python3 arcade/lost-sizzler/tests/portable-desktop-bundle-contract.py

      - name: Protected scope guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(index\.html|resources/css/intro\.css|js/index-intro\.js|games/games\.json)$'; then
            echo 'Portable desktop bundle PR touched a protected file.' >&2
            exit 1
          fi
