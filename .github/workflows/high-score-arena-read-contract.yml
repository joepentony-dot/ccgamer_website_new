name: CCG Arena Public Leaderboard Read Contract

on:
  pull_request:
    paths:
      - "supabase/functions/ccg-arena-leaderboard/**"
      - "tests/high-score-arena-read-contract.test.mjs"
      - "tests/high-score-arena-board-model.test.mjs"
      - "js/high-score-arena/arena-board.mjs"
      - "resources/css/high-score-arena-board.css"
      - ".github/workflows/high-score-arena-read-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reusable response parser and privacy contract
        run: |
          node --check supabase/functions/ccg-arena-leaderboard/contract.mjs
          node --test tests/high-score-arena-read-contract.test.mjs
          node --check js/high-score-arena/arena-board.mjs
          node --test tests/high-score-arena-board-model.test.mjs
      - name: Fail if read-only endpoint gains score submissions or secret-key access
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '\.(insert|update|delete|upsert|rpc)\(' supabase/functions/ccg-arena-leaderboard/index.ts; then
            echo 'Read endpoint must not mutate user data'
            exit 1
          fi
          if grep -Ei 'SERVICE_ROLE_KEY|service_role' supabase/functions/ccg-arena-leaderboard/index.ts | grep -v 'Never switch this to a service-role client' ; then
            echo 'Read endpoint must never hold privileged keys'
            exit 1
          fi
