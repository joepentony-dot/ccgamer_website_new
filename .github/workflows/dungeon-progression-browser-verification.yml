name: Dungeon Progression Browser Verification

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - .github/workflows/dungeon-progression-browser-verification.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium regression runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise Solo Dungeon progression in Chromium
        shell: bash
        run: |
          set -euo pipefail
          node arcade/lost-sizzler/tests/browser/v10-41-r31-solo-dungeon-regressions.mjs
