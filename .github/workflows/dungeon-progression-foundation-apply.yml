name: Dungeon Progression Foundation Apply

on:
  push:
    branches:
      - codex/dungeon-carnage-progression-foundation
    paths:
      - scripts/dungeon-progression-foundation-patch.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded progression patch
        run: node scripts/dungeon-progression-foundation-patch.mjs
      - name: Syntax checks
        shell: bash
        run: |
          node --check arcade/lost-sizzler/js/progression.js
          node --check arcade/lost-sizzler/js/game-core.js
          node --check arcade/lost-sizzler/js/game-network.js
          node --check arcade/lost-sizzler/js/game-play.js
          node --check arcade/lost-sizzler/js/systems.js
          node --check arcade/lost-sizzler/js/v10-14-gilded-elf.js
          node --check arcade/lost-sizzler/js/v10-15-rare-events.js
          node --check arcade/lost-sizzler/js/v10-15-rare-events-balance.js
          node --check arcade/lost-sizzler/js/v10-25-melee-ammo-balance.js
          node --check arcade/lost-sizzler/js/v10-31-multiplayer-sync.js
          node --check arcade/lost-sizzler/js/v10-41-gambler-devroom.js
      - name: Progression regressions
        shell: bash
        run: |
          node arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          node arcade/lost-sizzler/tests/horde-survivor-contract.mjs
          node arcade/lost-sizzler/tests/sizzler-saboteurs-contract.mjs
      - name: Commit guarded implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            arcade/lost-sizzler/index.html \
            arcade/lost-sizzler/js/progression.js \
            arcade/lost-sizzler/js/game-core.js \
            arcade/lost-sizzler/js/game-network.js \
            arcade/lost-sizzler/js/game-play.js \
            arcade/lost-sizzler/js/systems.js \
            arcade/lost-sizzler/js/v10-14-gilded-elf.js \
            arcade/lost-sizzler/js/v10-15-rare-events.js \
            arcade/lost-sizzler/js/v10-15-rare-events-balance.js \
            arcade/lost-sizzler/js/v10-25-melee-ammo-balance.js \
            arcade/lost-sizzler/js/v10-31-multiplayer-sync.js \
            arcade/lost-sizzler/js/v10-41-gambler-devroom.js \
            arcade/lost-sizzler/tests/dungeon-progression-foundation-contract.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No implementation changes produced"; exit 1; }
          git commit -m "feat: add dungeon gold and weapon progression foundation"
          git push origin HEAD:codex/dungeon-carnage-progression-foundation
