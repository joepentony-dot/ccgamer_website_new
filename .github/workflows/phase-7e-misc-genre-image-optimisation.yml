name: Phase 7E Misc Genre Image Optimisation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase-7e-misc-genre-image-optimisation.yml"
      - "scripts/apply-phase7e-misc-genre-image-optimisation.py"
      - "resources/images/genres/miscellaneous.png"
      - "games/genres/index.html"
      - "docs/seo-baseline/phase-7e-misc-genre-image-optimisation.md"
      - "docs/seo-baseline/phase-7e-misc-genre-image-optimisation-evidence.json"

permissions:
  contents: read

concurrency:
  group: phase-7e-misc-genre-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-misc-genre-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate optimiser source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-phase7e-misc-genre-image-optimisation.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Phase 7E Misc genre image optimiser compiles.")
          PY

      - name: Validate optimised image, evidence and HTML contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from PIL import Image

          image_path = Path("resources/images/genres/miscellaneous.png")
          html_path = Path("games/genres/index.html")
          evidence_path = Path("docs/seo-baseline/phase-7e-misc-genre-image-optimisation-evidence.json")

          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          if evidence.get("phase") != "7E":
              raise SystemExit("Invalid Phase 7E evidence identity")
          if evidence.get("correction") != "miscellaneous-genre-image-optimisation":
              raise SystemExit("Invalid Phase 7E correction identity")
          if evidence.get("target") != image_path.as_posix():
              raise SystemExit("Invalid Phase 7E evidence target")
          if evidence.get("html_reference") != html_path.as_posix():
              raise SystemExit("Invalid Phase 7E HTML reference")

          digest = hashlib.sha256(image_path.read_bytes()).hexdigest()
          actual_bytes = image_path.stat().st_size
          recorded_after = evidence.get("after", {})
          if digest != recorded_after.get("sha256"):
              raise SystemExit("Miscellaneous image hash no longer matches Phase 7E evidence")
          if actual_bytes != int(recorded_after.get("bytes", -1)):
              raise SystemExit("Miscellaneous image byte size no longer matches Phase 7E evidence")
          if actual_bytes > 300000:
              raise SystemExit("Optimised Miscellaneous image exceeds the 300 KB ceiling")

          with Image.open(image_path) as image:
              image.load()
              if image.size != (460, 213):
                  raise SystemExit(f"Unexpected optimised dimensions: {image.size}")
              if image.format != "PNG":
                  raise SystemExit(f"Unexpected optimised format: {image.format}")
              if image.mode in {"RGBA", "LA"} and image.getchannel("A").getextrema()[0] < 255:
                  raise SystemExit("Optimised image unexpectedly contains transparency")
              if image.mode == "P" and "transparency" in image.info:
                  raise SystemExit("Optimised image unexpectedly contains palette transparency")

          if float(evidence.get("reduction", {}).get("percent", 0)) < 55:
              raise SystemExit("Recorded Phase 7E reduction fell below 55%")
          if float(evidence.get("aspect_ratio_delta_percent", 1)) > 0.05:
              raise SystemExit("Recorded Phase 7E aspect-ratio drift exceeds 0.05%")

          html = html_path.read_text(encoding="utf-8")
          tag_prefix = '<img src="../../resources/images/genres/miscellaneous.png" alt="Miscellaneous" width="460" height="213"'
          if html.count(tag_prefix) != 1:
              raise SystemExit("Corrected Miscellaneous intrinsic dimensions are missing or duplicated")
          if 'miscellaneous.png" alt="Miscellaneous" width="1024" height="474"' in html:
              raise SystemExit("Old Miscellaneous intrinsic dimensions remain in genre index")

          print(json.dumps({
              "sha256": digest,
              "bytes": actual_bytes,
              "dimensions": [460, 213],
              "reduction_percent": evidence["reduction"]["percent"],
          }, indent=2))
          PY

      - name: Confirm validation is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish guard summary
        run: |
          {
            echo "## Phase 7E Misc Genre Image Guard"
            echo
            echo "- optimised PNG hash and byte size match recorded evidence"
            echo "- dimensions remain 460×213 and opaque"
            echo "- recorded reduction remains above 55%"
            echo "- genre index retains the corrected intrinsic dimensions"
            echo "- additional non-dimensional image attributes are permitted"
            echo "- validation makes no repository changes"
          } >> "$GITHUB_STEP_SUMMARY"
