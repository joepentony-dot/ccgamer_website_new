name: Header First-Frame Stability

on:
  pull_request:
    branches:
      - main
    paths:
      - "resources/css/ccg-nav-fit.css"
      - "js/ccg-nav-fit.js"
      - "js/ccg-music-navigation.js"
      - "scripts/normalize-public-header-shell.js"
      - "scripts/normalize-public-header-shell-core.js"
      - "scripts/audit-header-frame-local.js"
      - "scripts/audit-music-first-paint.js"
      - "tests/music-first-paint-stage.test.mjs"
      - ".github/workflows/header-frame-local.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: header-first-frame-stability
  cancel-in-progress: true

jobs:
  validate-frame-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out proposed release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate first-frame audit syntax
        run: |
          node --check scripts/audit-header-frame-local.js
          node --check scripts/audit-music-first-paint.js
          node --check scripts/normalize-public-header-shell.js
          node --check scripts/normalize-public-header-shell-core.js

      - name: Validate staged Music first-paint shell
        run: node --test tests/music-first-paint-stage.test.mjs

      - name: Enforce first-frame header stability
        run: node scripts/audit-header-frame-local.js

      - name: Enforce Music navigation first-paint stability
        run: node scripts/audit-music-first-paint.js
