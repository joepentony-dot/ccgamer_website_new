name: Easter Egg E2 BASIC Console

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/easter-eggs/basic-console.js'
      - 'resources/css/easter-eggs-basic.css'
      - 'scripts/apply-easter-egg-e2-basic-console.py'
      - 'scripts/test-easter-egg-e2-basic-console.mjs'
      - '.github/workflows/easter-egg-e2-basic-console.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-basic-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: sha256sum index.html resources/css/intro.css js/index-intro.js home.html games/games.json > "$RUNNER_TEMP/e2-protected.sha256"

      - name: Validate syntax and registration
        run: |
          node --check js/ccg-global.js
          node --check js/easter-eggs/basic-console.js
          python -m py_compile scripts/apply-easter-egg-e2-basic-console.py
          grep -q 'data-ccg-secret-code="basic"' js/ccg-global.js
          grep -q '"basic": launchContext => triggerBasic(launchContext)' js/ccg-global.js
          grep -q 'CCG EASTER EGG E2 BASIC CONSOLE' resources/css/easter-eggs-basic.css

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          assert len(games) == 651, len(games)
          assert not any(str(game.get('slug', '')).strip().lower() == 'powerdrome' for game in games)
          print('Catalogue integrity passed: 651 games; Powerdrome absent.')
          PY

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Start local website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/e2-http.log" 2>&1 &
          for attempt in {1..30}; do curl -sf http://127.0.0.1:4173/home.html >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/e2-http.log"
          exit 1

      - name: Test BASIC console
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: |
          node scripts/test-easter-egg-e2-basic-console.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output "$RUNNER_TEMP/e2-basic-evidence.json" \
            --report "$RUNNER_TEMP/e2-basic-validation.md"

      - name: Confirm protected files unchanged
        run: sha256sum --check "$RUNNER_TEMP/e2-protected.sha256"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easter-egg-e2-basic-console
          path: |
            ${{ runner.temp }}/e2-basic-evidence.json
            ${{ runner.temp }}/e2-basic-validation.md
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary dependencies
        if: always()
        run: rm -rf node_modules scripts/__pycache__

      - name: Publish summary
        if: always()
        run: test -f "$RUNNER_TEMP/e2-basic-validation.md" && cat "$RUNNER_TEMP/e2-basic-validation.md" >> "$GITHUB_STEP_SUMMARY" || true
