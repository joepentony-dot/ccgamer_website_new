name: Phase 7F Redirect-Route Performance Review

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase-7f-redirect-route-performance.yml"
      - "scripts/apply-phase7f-redirect-route-performance.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-7f-redirect-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect-route-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out Phase 7F branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Fetch main baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/phase7f-protected.sha256"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Validate Phase 7F tooling
        run: |
          python -m py_compile scripts/apply-phase7f-redirect-route-performance.py
          node --check scripts/rebuild-games.js

      - name: Record redirect baseline
        run: |
          python scripts/apply-phase7f-redirect-route-performance.py inspect \
            --output "$RUNNER_TEMP/phase-7f-before.json"

      - name: Remove redirect-only delivery requests
        run: python scripts/apply-phase7f-redirect-route-performance.py apply

      - name: Run authoritative game publishing command
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          python scripts/apply-phase7f-redirect-route-performance.py apply

      - name: Verify deterministic repeat generation
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/phase7f-first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          python scripts/apply-phase7f-redirect-route-performance.py apply
          git diff --binary > "$RUNNER_TEMP/phase7f-second.diff"
          if ! cmp -s "$RUNNER_TEMP/phase7f-first.diff" "$RUNNER_TEMP/phase7f-second.diff"; then
            echo "Phase 7F repeat-generation mismatch:"
            diff -u "$RUNNER_TEMP/phase7f-first.diff" "$RUNNER_TEMP/phase7f-second.diff" || true
            exit 1
          fi
          git diff --check

      - name: Record corrected redirect state
        run: |
          python scripts/apply-phase7f-redirect-route-performance.py inspect \
            --output "$RUNNER_TEMP/phase-7f-after.json"

      - name: Validate corrections and compose report
        run: |
          python scripts/apply-phase7f-redirect-route-performance.py validate \
            --before "$RUNNER_TEMP/phase-7f-before.json" \
            --after "$RUNNER_TEMP/phase-7f-after.json" \
            --report docs/seo-baseline/phase-7f-redirect-route-performance.md \
            --evidence docs/seo-baseline/phase-7f-redirect-route-performance-evidence.json
          sed -i 's/[[:space:]]\+$//' docs/seo-baseline/phase-7f-redirect-route-performance.md
          git diff --check

      - name: Upload detailed Phase 7F evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-7f-redirect-route-performance-evidence
          path: |
            ${{ runner.temp }}/phase-7f-before.json
            ${{ runner.temp }}/phase-7f-after.json
            docs/seo-baseline/phase-7f-redirect-route-performance.md
            docs/seo-baseline/phase-7f-redirect-route-performance-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/phase7f-protected.sha256"

      - name: Confirm exact Phase 7F scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          protected = {
              "index.html",
              "home.html",
              "resources/css/intro.css",
              "js/index-intro.js",
              "games/games.json",
          }
          allowed_exact = {
              ".github/workflows/phase-7f-redirect-route-performance.yml",
              "scripts/apply-phase7f-redirect-route-performance.py",
              "docs/seo-baseline/phase-7f-redirect-route-performance.md",
              "docs/seo-baseline/phase-7f-redirect-route-performance-evidence.json",
              "admin/js/games-editor.js",
          }

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted({*tracked, *untracked})

          unexpected = []
          for path in changed:
              if path in allowed_exact:
                  continue
              if path in protected:
                  unexpected.append(path)
                  continue
              if path.endswith(".html"):
                  if path.startswith("data/lemon-cache/") or path.startswith("admin/js/_backup_2026-02-working/"):
                      unexpected.append(path)
                  continue
              suffix = Path(path).suffix.lower()
              if path.startswith("scripts/") and suffix in {".py", ".js", ".mjs"}:
                  continue
              if path.startswith("templates/") and suffix in {".html", ".js", ".mjs", ".py"}:
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit(f"Unexpected Phase 7F paths: {unexpected}")
          if any(path.endswith(".css") for path in changed):
              raise SystemExit("Phase 7F must not modify CSS source files.")
          if protected.intersection(changed):
              raise SystemExit("A protected file entered the Phase 7F diff.")

          print(f"Validated Phase 7F scope ({len(changed)} files).")
          PY
          git diff --check

      - name: Commit validated Phase 7F output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -u
          git add \
            docs/seo-baseline/phase-7f-redirect-route-performance.md \
            docs/seo-baseline/phase-7f-redirect-route-performance-evidence.json

          git reset -- \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json

          if git diff --cached --quiet; then
            echo "Phase 7F output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Phase 7F redirect-route performance review"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
