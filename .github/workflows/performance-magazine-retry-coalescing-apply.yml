name: Performance magazine retry coalescing apply

on:
  push:
    branches:
      - codex/performance-magazine-retry-coalescing

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            js/magazine-game-reviews-runtime.js
            tests

      - name: Skip redundant delayed magazine rebuilds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/magazine-game-reviews-runtime.js')
          source = path.read_text(encoding='utf-8')
          old = '''    function init() {\n        const isGamePage = document.documentElement.matches('[data-ccg-page="single-game"]')\n            || document.querySelector(".ccg-page--single-game");\n        if (!isGamePage) return;\n        render();\n        observe();\n        window.setTimeout(render, 500);\n        window.setTimeout(render, 1500);\n    }\n'''
          new = '''    function retryRender() {\n        const container = document.getElementById("gameMagazineReviews")\n            || document.getElementById("gameLemonLinks");\n        if (container?.querySelector(`[${PANEL_ATTR}="true"]`)) return;\n        render();\n    }\n\n    function init() {\n        const isGamePage = document.documentElement.matches('[data-ccg-page="single-game"]')\n            || document.querySelector(".ccg-page--single-game");\n        if (!isGamePage) return;\n        render();\n        observe();\n        window.setTimeout(retryRender, 500);\n        window.setTimeout(retryRender, 1500);\n    }\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one magazine init block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/magazine-runtime-retry-coalescing.mjs')
          test.write_text('''import fs from "node:fs";\n\nconst source = fs.readFileSync("js/magazine-game-reviews-runtime.js", "utf8");\n\nfunction assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nassert(source.includes("function retryRender()"), "magazine runtime must retain delayed recovery through retryRender");\nassert(source.includes('container?.querySelector(`[${PANEL_ATTR}=\\"true\\"]`)'), "delayed retries must detect the completed interactive panel");\nassert(source.includes("window.setTimeout(retryRender, 500);"), "500ms recovery retry must remain");\nassert(source.includes("window.setTimeout(retryRender, 1500);"), "1500ms recovery retry must remain");\nassert(!source.includes("window.setTimeout(render, 500);"), "500ms retry must not blindly rebuild an existing interactive panel");\nassert(!source.includes("window.setTimeout(render, 1500);"), "1500ms retry must not blindly rebuild an existing interactive panel");\nassert(source.includes("render();\\n        observe();"), "initial runtime upgrade and mutation recovery must remain");\nassert(source.includes("new MutationObserver(() =>"), "MutationObserver recovery must remain intact");\nassert(source.includes('panel.setAttribute(PANEL_ATTR, "true");'), "interactive panel marker must remain intact");\n\nconsole.log("Magazine retry coalescing guard passed.");\n''', encoding='utf-8')
          PY

      - name: Validate magazine runtime and guard
        run: |
          node --check js/magazine-game-reviews-runtime.js
          node tests/magazine-runtime-retry-coalescing.mjs
          git diff --check

      - name: Commit guarded changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/magazine-game-reviews-runtime.js tests/magazine-runtime-retry-coalescing.mjs
          git commit -m "Skip redundant delayed magazine rebuilds"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
