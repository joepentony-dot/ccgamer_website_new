name: Deploy GitHub Pages (Omega Stable)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# 🚨 CRITICAL — prevents overlapping/cancelled builds
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload entire site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      # Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
