name: Deploy GitHub Pages (Omega Stable)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public website only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='supabase/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='*.sql' \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='*.ps1' \
            --exclude='*.bat' \
            --exclude='*.sh' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ _site/

          touch _site/.nojekyll

      - name: Build and validate canonical game, retro, genre and sitemap SEO
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-seo-game-routes.js --output-root _site
          node scripts/prepare-seo-genre-links.js --root _site
          node scripts/generate-retro-pages.js --root _site
          node scripts/validate-seo-game-routes.js --root _site
          node scripts/validate-seo-genre-links.js --root _site
          (cd _site && node ../scripts/validate-sitemaps.js)

      - name: Canonicalize first-paint public header shell
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-public-header-shell.js --root _site
          node scripts/normalize-public-header-shell.js --root _site --check

      - name: Verify staged public features
        shell: bash
        run: |
          set -euo pipefail

          # Phase 20B announcement files.
          test -f _site/admin/announce.html
          test -f _site/admin/js/announce.js
          test -f _site/data/retro-specials.json
          test -f _site/data/retro-events.json
          test -f _site/data/amiga-demo-music.json
          test -f _site/admin/templates/retro-video-template.html
          test -f _site/games/games.json
          grep -Fq 'Content Announcements' _site/admin/announce.html
          grep -Fq 'announceContentFilter' _site/admin/announce.html
          grep -Fq 'RETRO_SPECIALS_DATA_PATH' _site/admin/js/announce.js

          # Every representative public shell must be canonical before upload, not repaired after first paint.
          shell_pages=(
            _site/home.html
            _site/games/index.html
            _site/zzap64/index.html
            _site/quiz/quiz.html
            _site/emulation.html
            _site/games/1942/index.html
            _site/community/profile.html
          )
          for page in "${shell_pages[@]}"; do
            test -f "$page"
            grep -Fq 'data-ccg-static-shell="2026-08-19-v1"' "$page"
            grep -Fq '>Publishers</a>' "$page"
            grep -Fq '>Music Hub</a>' "$page"
            grep -Fq '>Find Me a Game</a>' "$page"
            grep -Fq '>Zzap!64 Reviews &amp; Awards</a>' "$page"
            grep -Fq '>Install CCG App</a>' "$page"
            grep -Fq 'class="ccg-auth-slot" data-ccg-auth-pending="true"' "$page"
            grep -Fq 'ccg-socials__icon--yt' "$page"
            grep -Fq 'ccg-socials__icon--patreon' "$page"
            grep -Fq 'ccg-socials__icon--paypal' "$page"
            grep -Fq 'ccg-socials__icon--x' "$page"
            grep -Fq 'ccg-socials__icon--fb' "$page"
            grep -Fq 'ccg-socials__icon--discord' "$page"
            grep -Fq 'src="/js/ccg-header-auth-loader.js"' "$page"
            grep -Fq 'src="/js/ccg-nav-fit.js"' "$page"
          done

          # Retro editorial collections must publish the unified collection presentation.
          for page in \
            _site/games/collections/retro-specials.html \
            _site/games/collections/retro-events.html \
            _site/games/collections/amiga-demo-music.html
          do
            test -f "$page"
            grep -Fq '/resources/css/retro-events.css' "$page"
          done
          test -f _site/resources/css/retro-events.css
          grep -Fq 'CCG RETRO CONTENT COLLECTIONS' _site/resources/css/retro-events.css
          grep -Fq '.ccg-collection-skeleton' _site/resources/css/retro-events.css
          grep -Fq 'aspect-ratio: 16 / 9' _site/resources/css/retro-events.css

          # Representative generated retro pages must use the new full detail template.
          retro_pages=(
            "_site/amiga-demo-music/red-sector-folow-me/index.html|https://www.cheekycommodoregamer.co.uk/amiga-demo-music/red-sector-folow-me/"
            "_site/retro-specials/50-essential-amiga-games/index.html|https://www.cheekycommodoregamer.co.uk/retro-specials/50-essential-amiga-games/"
          )
          for entry in "${retro_pages[@]}"; do
            page="${entry%%|*}"
            canonical="${entry#*|}"
            test -f "$page"
            grep -Fq 'class="ccg-header"' "$page"
            grep -Fq 'data-ccg-mode-toggle' "$page"
            grep -Fq 'retro-video-page__hero-media' "$page"
            grep -Fq 'retro-video-page__watch' "$page"
            grep -Fq 'retro-video-page__related-media' "$page"
            grep -Fq "<link rel=\"canonical\" href=\"${canonical}\"" "$page"
          done

          # Quiz enhancement assets must be present in the published artifact.
          test -f _site/quiz/quiz.html
          test -f _site/resources/js/quiz-ui-fixes.js
          test -f _site/resources/css/quiz-experience.css
          grep -Fq 'Choose a pack' _site/resources/js/quiz-ui-fixes.js
          grep -Fq 'Choose a Pack First' _site/resources/js/quiz-ui-fixes.js
          grep -Fq 'quiz-ux-flow' _site/resources/js/quiz-ui-fixes.js
          grep -Fq -- '--quiz-progress' _site/resources/css/quiz-experience.css

          # Canonical game routes must be full indexable pages, never redirect shells.
          for slug in 1942 cops-n-robbers the-human-race; do
            page="_site/games/${slug}/index.html"
            test -f "$page"
            grep -Fq "<link rel=\"canonical\" id=\"game-canonical\" href=\"https://www.cheekycommodoregamer.co.uk/games/${slug}/\">" "$page"
            grep -Fq '<meta name="robots" content="index,follow">' "$page"
            grep -Fq "<meta name=\"twitter:url\" content=\"https://www.cheekycommodoregamer.co.uk/games/${slug}/\">" "$page"
            if grep -Fq 'Game not found' "$page"; then
              echo "Crawler-visible Game not found copy remains in ${page}." >&2
              exit 1
            fi
            if grep -Fq '/games/game.html?id=' "$page"; then
              echo "Canonical game route still redirects through game.html?id= in ${page}." >&2
              exit 1
            fi
            if grep -Fqi 'http-equiv="refresh"' "$page"; then
              echo "Canonical game route still contains a meta refresh in ${page}." >&2
              exit 1
            fi
          done

          # Genre pages must expose crawlable canonical game links before JavaScript runs.
          genre_page="_site/games/genres/fighting-games.html"
          test -f "$genre_page"
          grep -Fq '<!-- CCG STATIC GENRE FALLBACK START -->' "$genre_page"
          grep -Fq 'data-ccg-static-genre-fallback="true"' "$genre_page"
          grep -Eq 'href="/games/[a-z0-9-]+/"' "$genre_page"
          if grep -Fq 'game.html?id=' "$genre_page"; then
            echo "Genre fallback contains a query-string game route." >&2
            exit 1
          fi

          # Support pages must publish in their understated form.
          test -f _site/shop.html
          test -f _site/support.html
          test -f _site/supporters.html
          test -f _site/resources/css/passive-income.css
          grep -Fq 'url=/support.html' _site/shop.html
          grep -Fq 'The former shop page has moved' _site/shop.html
          grep -Fq 'Quietly keeping CCG going' _site/support.html
          grep -Fq 'YouTube Membership' _site/support.html
          grep -Fq 'Buy Joe a Beer' _site/support.html
          grep -Fq 'CCG Supporters' _site/support.html
          grep -Fq '.ccg-passive-revenue-panel__actions a[href="/shop.html"]' _site/resources/css/passive-income.css
          grep -Fq '.ccg-passive-revenue-panel__actions a[href="/supporters.html"]' _site/resources/css/passive-income.css

          if grep -Fq 'Retro Merchandise' _site/shop.html; then
            echo 'The retired duplicate merchandise panel is still present in shop.html.' >&2
            exit 1
          fi

          if grep -Fq 'Digital Products' _site/shop.html; then
            echo 'The retired duplicate digital-products panel is still present in shop.html.' >&2
            exit 1
          fi

      - name: Check published-site size
        shell: bash
        run: |
          set -euo pipefail
          site_bytes="$(du -sb _site | cut -f1)"
          site_mib="$((site_bytes / 1024 / 1024))"
          file_count="$(find _site -type f | wc -l | tr -d ' ')"

          {
            echo '### GitHub Pages artifact'
            echo
            echo "- Files: ${file_count}"
            echo "- Size: ${site_mib} MiB"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$site_bytes" -ge 1000000000 ]; then
            echo "Public site artifact is ${site_mib} MiB and exceeds the 1 GB GitHub Pages limit." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed public pages
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          announcement_target="${PAGE_URL%/}/admin/announce.html?deployment=${GITHUB_SHA}"
          support_target="${PAGE_URL%/}/support.html?deployment=${GITHUB_SHA}"
          shop_target="${PAGE_URL%/}/shop.html?deployment=${GITHUB_SHA}"
          genre_target="${PAGE_URL%/}/games/genres/fighting-games.html?deployment=${GITHUB_SHA}"
          retro_css_target="${PAGE_URL%/}/resources/css/retro-events.css?deployment=${GITHUB_SHA}"
          quiz_js_target="${PAGE_URL%/}/resources/js/quiz-ui-fixes.js?deployment=${GITHUB_SHA}"
          quiz_css_target="${PAGE_URL%/}/resources/css/quiz-experience.css?deployment=${GITHUB_SHA}"

          game_targets=(
            "${PAGE_URL%/}/games/1942/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/cops-n-robbers/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/the-human-race/?deployment=${GITHUB_SHA}"
          )
          retro_targets=(
            "${PAGE_URL%/}/amiga-demo-music/red-sector-folow-me/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/retro-specials/50-essential-amiga-games/?deployment=${GITHUB_SHA}"
          )
          shell_targets=(
            "${PAGE_URL%/}/home.html?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/zzap64/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/quiz/quiz.html?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/emulation.html?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/1942/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/community/profile.html?deployment=${GITHUB_SHA}"
          )

          for attempt in $(seq 1 18); do
            announcement_body="$(curl --fail --silent --show-error --location --max-time 30 "$announcement_target" || true)"
            support_body="$(curl --fail --silent --show-error --location --max-time 30 "$support_target" || true)"
            shop_body="$(curl --fail --silent --show-error --max-time 30 "$shop_target" || true)"
            genre_body="$(curl --fail --silent --show-error --max-time 30 "$genre_target" || true)"
            retro_css_body="$(curl --fail --silent --show-error --max-time 30 "$retro_css_target" || true)"
            quiz_js_body="$(curl --fail --silent --show-error --max-time 30 "$quiz_js_target" || true)"
            quiz_css_body="$(curl --fail --silent --show-error --max-time 30 "$quiz_css_target" || true)"

            games_ok=true
            for target in "${game_targets[@]}"; do
              game_body="$(curl --fail --silent --show-error --max-time 30 "$target" || true)"
              if ! printf '%s' "$game_body" | grep -Fq '<meta name="robots" content="index,follow">' \
                || ! printf '%s' "$game_body" | grep -Fq '<meta name="twitter:url" content="https://www.cheekycommodoregamer.co.uk/games/' \
                || printf '%s' "$game_body" | grep -Fq 'Game not found' \
                || printf '%s' "$game_body" | grep -Fq '/games/game.html?id=' \
                || printf '%s' "$game_body" | grep -Fqi 'http-equiv="refresh"'; then
                games_ok=false
                break
              fi
            done

            shell_ok=true
            for target in "${shell_targets[@]}"; do
              shell_body="$(curl --fail --silent --show-error --location --max-time 30 "$target" || true)"
              if ! printf '%s' "$shell_body" | grep -Fq 'data-ccg-static-shell="2026-08-19-v1"' \
                || ! printf '%s' "$shell_body" | grep -Fq '>Publishers</a>' \
                || ! printf '%s' "$shell_body" | grep -Fq '>Music Hub</a>' \
                || ! printf '%s' "$shell_body" | grep -Fq '>Find Me a Game</a>' \
                || ! printf '%s' "$shell_body" | grep -Fq '>Install CCG App</a>' \
                || ! printf '%s' "$shell_body" | grep -Fq 'class="ccg-auth-slot" data-ccg-auth-pending="true"' \
                || ! printf '%s' "$shell_body" | grep -Fq 'ccg-socials__icon--discord' \
                || ! printf '%s' "$shell_body" | grep -Fq 'src="/js/ccg-header-auth-loader.js"'; then
                shell_ok=false
                break
              fi
            done

            genre_ok=false
            if printf '%s' "$genre_body" | grep -Fq '<!-- CCG STATIC GENRE FALLBACK START -->' \
              && printf '%s' "$genre_body" | grep -Fq 'data-ccg-static-genre-fallback="true"' \
              && printf '%s' "$genre_body" | grep -Eq 'href="/games/[a-z0-9-]+/"' \
              && ! printf '%s' "$genre_body" | grep -Fq 'game.html?id='; then
              genre_ok=true
            fi

            retro_ok=true
            for target in "${retro_targets[@]}"; do
              retro_body="$(curl --fail --silent --show-error --location --max-time 30 "$target" || true)"
              if ! printf '%s' "$retro_body" | grep -Fq 'class="ccg-header"' \
                || ! printf '%s' "$retro_body" | grep -Fq 'retro-video-page__hero-media' \
                || ! printf '%s' "$retro_body" | grep -Fq 'retro-video-page__watch' \
                || ! printf '%s' "$retro_body" | grep -Fq 'retro-video-page__related-media' \
                || ! printf '%s' "$retro_body" | grep -Fq 'data-ccg-mode-toggle'; then
                retro_ok=false
                break
              fi
            done

            retro_assets_ok=false
            if printf '%s' "$retro_css_body" | grep -Fq 'CCG RETRO CONTENT COLLECTIONS' \
              && printf '%s' "$retro_css_body" | grep -Fq '.ccg-collection-skeleton' \
              && printf '%s' "$retro_css_body" | grep -Fq 'aspect-ratio: 16 / 9'; then
              retro_assets_ok=true
            fi

            quiz_ok=false
            if printf '%s' "$quiz_js_body" | grep -Fq 'Choose a Pack First' \
              && printf '%s' "$quiz_js_body" | grep -Fq 'quiz-ux-flow' \
              && printf '%s' "$quiz_css_body" | grep -Fq -- '--quiz-progress' \
              && printf '%s' "$quiz_css_body" | grep -Fq '.quiz-pack-btn__desc'; then
              quiz_ok=true
            fi

            if printf '%s' "$announcement_body" | grep -Fq 'Content Announcements' \
              && printf '%s' "$announcement_body" | grep -Fq 'announceContentFilter' \
              && printf '%s' "$support_body" | grep -Fq 'Quietly keeping CCG going' \
              && printf '%s' "$support_body" | grep -Fq 'YouTube Membership' \
              && printf '%s' "$support_body" | grep -Fq 'Buy Joe a Beer' \
              && printf '%s' "$shop_body" | grep -Fq 'url=/support.html' \
              && ! printf '%s' "$shop_body" | grep -Fq 'Retro Merchandise' \
              && ! printf '%s' "$shop_body" | grep -Fq 'Digital Products' \
              && [ "$games_ok" = true ] \
              && [ "$shell_ok" = true ] \
              && [ "$genre_ok" = true ] \
              && [ "$retro_ok" = true ] \
              && [ "$retro_assets_ok" = true ] \
              && [ "$quiz_ok" = true ]; then
              echo "Verified canonical first-paint public shell, announcement and support pages, canonical game routes, crawlable genre links, retro detail layouts, collection assets, and quiz experience assets."
              exit 0
            fi

            echo "Deployment not fully visible yet (attempt ${attempt}/18)."
            sleep 10
          done

          echo "The deployment completed, but the canonical first-paint shell or another expected public feature was not visible after three minutes." >&2
          exit 1
