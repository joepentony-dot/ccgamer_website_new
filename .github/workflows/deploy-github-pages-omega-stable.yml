name: Deploy GitHub Pages (Omega Stable)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public website only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a --prune-empty-dirs \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            --exclude='supabase/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='*.sql' \
            --exclude='*.ts' \
            --exclude='*.tsx' \
            --exclude='*.ps1' \
            --exclude='*.bat' \
            --exclude='*.sh' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ _site/

          touch _site/.nojekyll

      - name: Build and validate canonical game routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-seo-game-routes.js --output-root _site
          node scripts/validate-seo-game-routes.js --root _site

      - name: Verify staged public features
        shell: bash
        run: |
          set -euo pipefail

          # Phase 20B announcement files.
          test -f _site/admin/announce.html
          test -f _site/admin/js/announce.js
          test -f _site/data/retro-specials.json
          test -f _site/games/games.json
          grep -Fq 'Content Announcements' _site/admin/announce.html
          grep -Fq 'announceContentFilter' _site/admin/announce.html
          grep -Fq 'RETRO_SPECIALS_DATA_PATH' _site/admin/js/announce.js

          # Canonical game routes must be full indexable pages, never redirect shells.
          for slug in 1942 cops-n-robbers the-human-race; do
            page="_site/games/${slug}/index.html"
            test -f "$page"
            grep -Fq "<link rel=\"canonical\" id=\"game-canonical\" href=\"https://www.cheekycommodoregamer.co.uk/games/${slug}/\">" "$page"
            grep -Fq '<meta name="robots" content="index,follow">' "$page"
            if grep -Fq 'Game not found' "$page"; then
              echo "Crawler-visible Game not found copy remains in ${page}." >&2
              exit 1
            fi
            if grep -Fq '/games/game.html?id=' "$page"; then
              echo "Canonical game route still redirects through game.html?id= in ${page}." >&2
              exit 1
            fi
            if grep -Fqi 'http-equiv="refresh"' "$page"; then
              echo "Canonical game route still contains a meta refresh in ${page}." >&2
              exit 1
            fi
          done

          # Support pages must publish in their understated form.
          test -f _site/shop.html
          test -f _site/support.html
          test -f _site/supporters.html
          test -f _site/resources/css/passive-income.css
          grep -Fq 'url=/support.html' _site/shop.html
          grep -Fq 'The former shop page has moved' _site/shop.html
          grep -Fq 'Quietly keeping CCG going' _site/support.html
          grep -Fq 'YouTube Membership' _site/support.html
          grep -Fq 'Buy Joe a Beer' _site/support.html
          grep -Fq 'CCG Supporters' _site/support.html
          grep -Fq '.ccg-passive-revenue-panel__actions a[href="/shop.html"]' _site/resources/css/passive-income.css
          grep -Fq '.ccg-passive-revenue-panel__actions a[href="/supporters.html"]' _site/resources/css/passive-income.css

          if grep -Fq 'Retro Merchandise' _site/shop.html; then
            echo 'The retired duplicate merchandise panel is still present in shop.html.' >&2
            exit 1
          fi

          if grep -Fq 'Digital Products' _site/shop.html; then
            echo 'The retired duplicate digital-products panel is still present in shop.html.' >&2
            exit 1
          fi

      - name: Check published-site size
        shell: bash
        run: |
          set -euo pipefail
          site_bytes="$(du -sb _site | cut -f1)"
          site_mib="$((site_bytes / 1024 / 1024))"
          file_count="$(find _site -type f | wc -l | tr -d ' ')"

          {
            echo '### GitHub Pages artifact'
            echo
            echo "- Files: ${file_count}"
            echo "- Size: ${site_mib} MiB"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$site_bytes" -ge 1000000000 ]; then
            echo "Public site artifact is ${site_mib} MiB and exceeds the 1 GB GitHub Pages limit." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed public pages
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          announcement_target="${PAGE_URL%/}/admin/announce.html?deployment=${GITHUB_SHA}"
          support_target="${PAGE_URL%/}/support.html?deployment=${GITHUB_SHA}"
          shop_target="${PAGE_URL%/}/shop.html?deployment=${GITHUB_SHA}"

          game_targets=(
            "${PAGE_URL%/}/games/1942/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/cops-n-robbers/?deployment=${GITHUB_SHA}"
            "${PAGE_URL%/}/games/the-human-race/?deployment=${GITHUB_SHA}"
          )

          for attempt in $(seq 1 18); do
            announcement_body="$(curl --fail --silent --show-error --location --max-time 30 "$announcement_target" || true)"
            support_body="$(curl --fail --silent --show-error --location --max-time 30 "$support_target" || true)"
            shop_body="$(curl --fail --silent --show-error --max-time 30 "$shop_target" || true)"

            games_ok=true
            for target in "${game_targets[@]}"; do
              game_body="$(curl --fail --silent --show-error --max-time 30 "$target" || true)"
              if ! printf '%s' "$game_body" | grep -Fq '<meta name="robots" content="index,follow">' \
                || printf '%s' "$game_body" | grep -Fq 'Game not found' \
                || printf '%s' "$game_body" | grep -Fq '/games/game.html?id=' \
                || printf '%s' "$game_body" | grep -Fqi 'http-equiv="refresh"'; then
                games_ok=false
                break
              fi
            done

            if printf '%s' "$announcement_body" | grep -Fq 'Content Announcements' \
              && printf '%s' "$announcement_body" | grep -Fq 'announceContentFilter' \
              && printf '%s' "$support_body" | grep -Fq 'Quietly keeping CCG going' \
              && printf '%s' "$support_body" | grep -Fq 'YouTube Membership' \
              && printf '%s' "$support_body" | grep -Fq 'Buy Joe a Beer' \
              && printf '%s' "$shop_body" | grep -Fq 'url=/support.html' \
              && ! printf '%s' "$shop_body" | grep -Fq 'Retro Merchandise' \
              && ! printf '%s' "$shop_body" | grep -Fq 'Digital Products' \
              && [ "$games_ok" = true ]; then
              echo "Verified announcement, understated support pages, and canonical game routes."
              exit 0
            fi

            echo "Deployment not fully visible yet (attempt ${attempt}/18)."
            sleep 10
          done

          echo "The deployment completed, but the expected public pages or canonical game routes were not visible after three minutes." >&2
          exit 1
