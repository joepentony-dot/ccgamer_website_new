name: Phase 5B Low-Risk Internal Discovery Corrections

# Historical correction workflow retained for deliberate manual verification.
# Later publishing phases have their own current-data validators and must not be
# compared against Phase 5B's original registry ordering.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-5b-internal-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        shell: bash
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > /tmp/phase5b-protected.sha256

      - name: Snapshot current registry and sitemaps
        shell: bash
        run: |
          mkdir -p /tmp/phase5b-baseline
          cp tools/seo/static-pages.json /tmp/phase5b-baseline/static-pages.json
          cp sitemap.xml sitemap-pages.xml sitemap-games.xml /tmp/phase5b-baseline/

      - name: Validate correction tooling
        run: |
          python -m py_compile scripts/apply-phase5b-discovery-corrections.py
          python -m py_compile scripts/apply-phase5b-phase4d-compatibility.py
          python -m py_compile scripts/validate-phase5b-discovery-corrections.py
          python -m py_compile scripts/phase5a_internal_link_audit.py
          node --check tools/seo/generate-sitemap.js
          node --check scripts/generate-sitemaps.js
          node --check scripts/preserve-sitemap-lastmods.js
          node --check scripts/validate-sitemaps.js

      - name: Confirm Phase 5B decisions remain applied
        run: |
          python scripts/apply-phase5b-discovery-corrections.py
          node scripts/generate-sitemaps.js
          node scripts/preserve-sitemap-lastmods.js /tmp/phase5b-baseline
          node scripts/validate-sitemaps.js

      - name: Rerun Phase 5A internal-link audit
        run: |
          python scripts/phase5a_internal_link_audit.py \
            --json-output "$RUNNER_TEMP/phase-5b-link-evidence.json" \
            --report-output "$RUNNER_TEMP/phase-5b-phase5a-report.md"

      - name: Verify current discovery outcomes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("phase-5b-link-evidence.json").read_text())
          summary = evidence["summary"]
          required = {
              "orphan_indexable_pages": 0,
              "sitemap_only_indexable_pages": 0,
              "broken_internal_link_edges": 0,
              "canonical_game_pages_missing": 0,
              "games_without_meaningful_static_discovery": 0,
              "games_with_one_or_zero_discovery_dimensions": 0,
          }
          failures = [f"{key}: {summary.get(key)}" for key, value in required.items() if summary.get(key) != value]
          if summary.get("minimum_archive_routes_per_game", 0) < 4:
              failures.append("minimum_archive_routes_per_game fell below 4")
          if failures:
              raise SystemExit("Phase 5B discovery regression: " + "; ".join(failures))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload Phase 5B link evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-5b-internal-discovery-evidence
          path: ${{ runner.temp }}/phase-5b-link-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Confirm protected files are unchanged
        run: sha256sum --check /tmp/phase5b-protected.sha256

      - name: Confirm manual verification is read only
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
