name: CCG C64 guarded 202 direct-CRT post-migration audit
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ccg-c64-202-direct-crt-stage.yml
      - docs/ccg-crt-review/direct-crt-202-retirement-manifest.json
      - scripts/ccg-retire-202-direct-crt-prgs.mjs
      - scripts/ccg-c64-202-baseline-preservation.mjs
      - emulator/c64/library.json
      - emulator/c64/media/blast/**
      - emulator/c64/media/prg-archive/**
      - emulator/c64/media/cartridge-replacements/**
permissions:
  contents: read
jobs:
  verify-exact-head-staged-202:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/c64-direct-crt-202-prg-retirement-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact PR head and unchanged source-media baseline on main
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          test -n "$base"
          git diff --quiet "$base" origin/main -- emulator/c64/library.json emulator/c64/media/blast emulator/c64/media/prg-archive emulator/c64/media/cartridge-replacements
          other_media="$(git diff --name-only "$base" HEAD -- emulator/c64/media | grep -vE '^emulator/c64/media/(blast|prg-archive)/' || true)"
          test -z "$other_media"
          git diff --check "$base" HEAD
      - name: Verify all 202 retirements, 2458 bookmarks, 136 CRTs, 9269 survivor slices and all 59 pack digests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ccg-retire-202-direct-crt-prgs.mjs
          node scripts/ccg-retire-202-direct-crt-prgs.mjs --verify-post
          node --check scripts/ccg-c64-202-baseline-preservation.mjs
          node scripts/ccg-c64-202-baseline-preservation.mjs
          test -z "$(git status --porcelain)"
