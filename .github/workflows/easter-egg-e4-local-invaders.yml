name: Easter Egg E4 Local Invaders

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/easter-eggs/invaders-game.js'
      - 'resources/audio/easter-eggs/invaders.html'
      - 'resources/css/easter-eggs-invaders.css'
      - 'scripts/apply-easter-egg-e4-invaders.py'
      - 'scripts/test-easter-egg-e4-invaders.mjs'
      - '.github/workflows/easter-egg-e4-local-invaders.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-local-invaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out submitted revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record protected hashes
        run: sha256sum index.html resources/css/intro.css js/index-intro.js home.html games/games.json > "$RUNNER_TEMP/e4-protected.sha256"

      - name: Confirm bounded integration is already applied
        run: |
          python scripts/apply-easter-egg-e4-invaders.py
          git diff --exit-code -- js/ccg-global.js js/easter-eggs/easter-egg-registry.js

      - name: Validate syntax and local assets
        run: |
          node --check js/ccg-global.js
          node --check js/easter-eggs/invaders-game.js
          node --check js/easter-eggs/easter-egg-registry.js
          node --check scripts/test-easter-egg-e4-invaders.mjs
          grep -q 'CCG EASTER EGG E4 LOCAL INVADERS' js/ccg-global.js
          grep -q 'getEasterEggAsset("invaders.html")' js/ccg-global.js
          grep -q 'mobile: true.*runtime: "local".*phase: "E4"' js/easter-eggs/easter-egg-registry.js
          test -f resources/audio/easter-eggs/invaders.html
          test -f resources/css/easter-eggs-invaders.css
          ! grep -q 'dwmkerr.github.io/spaceinvaders' js/ccg-global.js
          ! grep -q 'AVAILABLE ON DESKTOP ONLY' js/ccg-global.js

      - name: Confirm catalogue integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          games = json.loads(Path('games/games.json').read_text(encoding='utf-8'))
          assert len(games) == 651, len(games)
          print('Catalogue integrity passed: 651 games.')
          PY

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock playwright-core@1.58.2

      - name: Start local website
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/e4-http.log" 2>&1 &
          for attempt in {1..30}; do curl -sf http://127.0.0.1:4173/home.html >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/e4-http.log"
          exit 1

      - name: Test local Invaders on desktop and mobile
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: |
          node scripts/test-easter-egg-e4-invaders.mjs \
            --base-url http://127.0.0.1:4173/ \
            --output "$RUNNER_TEMP/e4-invaders-evidence.json" \
            --report "$RUNNER_TEMP/e4-invaders-validation.md"

      - name: Confirm protected files unchanged
        run: sha256sum --check "$RUNNER_TEMP/e4-protected.sha256"

      - name: Remove temporary dependencies
        if: always()
        run: rm -rf node_modules scripts/__pycache__

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easter-egg-e4-local-invaders
          path: |
            ${{ runner.temp }}/e4-invaders-evidence.json
            ${{ runner.temp }}/e4-invaders-validation.md
          retention-days: 30
