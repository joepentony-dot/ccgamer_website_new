name: Canonicalize Committed Public Shell Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/source-shell-canonicalize-once.yml"

permissions:
  contents: write

concurrency:
  group: "source-shell-canonicalize-once"
  cancel-in-progress: true

jobs:
  canonicalize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canonicalize committed public HTML
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-public-header-shell.js --root .
          node scripts/normalize-public-header-shell.js --root . --check

      - name: Commit canonical public shell source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.html'; then
            echo "Committed public HTML already uses the canonical shell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'

          if git diff --cached --quiet; then
            echo "No tracked public HTML changes to commit."
            exit 0
          fi

          git commit -m "Canonicalize committed public header shell"
          git push origin HEAD:main
