name: Restore unrelated staging files 2026-08-04

on:
  push:
    branches:
      - fix/consolidate-argus-press-software-20260804
    paths:
      - ".github/workflows/restore-unrelated-staging-20260804.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidate-argus-press-software-20260804
          fetch-depth: 1

      - name: Restore unrelated main-branch staging files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- .ccg-tmp
          rm -f .github/workflows/restore-unrelated-staging-20260804.yml

      - name: Commit narrowed correction scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Narrow Argus Press correction scope"
          git push origin HEAD:fix/consolidate-argus-press-software-20260804
