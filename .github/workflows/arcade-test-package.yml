name: Arcade Test Package

on:
  pull_request:
    paths:
      - 'arcade/**'
      - '.github/workflows/arcade-test-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply pending arcade firing tune
        shell: bash
        run: |
          if grep -q "input.down('KeyZ','ControlLeft')&&P.fire<=0" arcade/quest/game/main-v2.js; then
            python scripts/apply-arcade-final-fire-tune.py
            node --check arcade/quest/game/main-v2.js
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add arcade/quest/game/main-v2.js scripts/validate-arcade-quest.js
            git commit -m 'Tune one-shot firing and arcade pressure'
            git push origin HEAD:${{ github.head_ref }}
          else
            echo 'Arcade firing tune already applied.'
          fi

      - name: Build arcade-only test ZIP
        shell: bash
        run: |
          zip -r ccg-arcade-test.zip arcade \
            -x 'arcade/**/.DS_Store' \
            -x 'arcade/**/Thumbs.db'

      - name: Upload arcade test package
        uses: actions/upload-artifact@v4
        with:
          name: ccg-arcade-test
          path: ccg-arcade-test.zip
          if-no-files-found: error
          retention-days: 7
