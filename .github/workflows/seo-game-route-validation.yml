name: SEO Game Route Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "games/game.html"
      - "games/games.json"
      - "sitemap-games.xml"
      - "scripts/prepare-seo-game-routes.js"
      - "scripts/validate-seo-game-routes.js"
      - "scripts/rebuild-games.js"
      - ".github/workflows/games-publishing.yml"
      - ".github/workflows/deploy-github-pages-omega-stable.yml"
      - ".github/workflows/seo-game-route-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-game-route-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record protected hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/protected.sha256"

      - name: Validate script syntax
        run: |
          node --check scripts/prepare-seo-game-routes.js
          node --check scripts/validate-seo-game-routes.js
          node --check scripts/rebuild-games.js

      - name: Generate canonical game routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-seo-game-routes.js --output-root .
          node scripts/validate-seo-game-routes.js --root .
          git diff --check
          git diff --binary > "$RUNNER_TEMP/first.diff"
          git status --short > "$RUNNER_TEMP/first.status"

      - name: Require deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-seo-game-routes.js --output-root .
          node scripts/validate-seo-game-routes.js --root .
          git diff --binary > "$RUNNER_TEMP/second.diff"
          git status --short > "$RUNNER_TEMP/second.status"

          if ! cmp -s "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff"; then
            echo "::error::Canonical route generation is not deterministic"
            echo "=== status after pass one ==="
            cat "$RUNNER_TEMP/first.status"
            echo "=== status after pass two ==="
            cat "$RUNNER_TEMP/second.status"
            echo "=== generated patch difference (first 400 lines) ==="
            diff -u "$RUNNER_TEMP/first.diff" "$RUNNER_TEMP/second.diff" | head -n 400 || true
            exit 1
          fi

      - name: Check legacy generator compatibility
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/second.diff" "$RUNNER_TEMP/before-legacy.diff"

          # The older command may format generated files differently, but it must
          # never reintroduce invalid SEO semantics.
          node scripts/generate-slug-pages.js
          node scripts/validate-seo-game-routes.js --root .

          # The authoritative generator must then restore the exact deterministic
          # canonical output used by publishing and deployment.
          node scripts/prepare-seo-game-routes.js --output-root .
          node scripts/validate-seo-game-routes.js --root .
          git diff --binary > "$RUNNER_TEMP/after-legacy-repair.diff"
          cmp "$RUNNER_TEMP/before-legacy.diff" "$RUNNER_TEMP/after-legacy-repair.diff"

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/protected.sha256"

      - name: Summarize generated migration
        shell: bash
        run: |
          set -euo pipefail
          changed_games="$(git status --porcelain -- games | wc -l | tr -d ' ')"
          {
            echo '### Canonical game route validation'
            echo
            echo '- Result: PASS'
            echo "- Generated game files changed from current wrappers: ${changed_games}"
            echo '- Protected intro files: unchanged'
            echo '- games/games.json: unchanged'
            echo '- Legacy slug generator semantic compatibility: PASS'
            echo '- Authoritative regeneration after legacy command: deterministic PASS'
          } >> "$GITHUB_STEP_SUMMARY"
