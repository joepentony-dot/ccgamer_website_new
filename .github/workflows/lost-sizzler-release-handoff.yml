name: Lost Sizzler Release Handoff

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'games/games.json'
      - 'scripts/build-lost-sizzler-package-manifest.mjs'
      - 'scripts/build-lost-sizzler-package-provenance.mjs'
      - 'scripts/materialize-lost-sizzler-package-tree.mjs'
      - 'scripts/verify-lost-sizzler-package-tree.mjs'
      - 'scripts/assemble-lost-sizzler-release-handoff.mjs'
      - '.github/workflows/lost-sizzler-release-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-handoff:
    name: Verified release handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check release handoff tooling
        run: |
          set -euo pipefail
          node --check scripts/build-lost-sizzler-package-manifest.mjs
          node --check scripts/build-lost-sizzler-package-provenance.mjs
          node --check scripts/materialize-lost-sizzler-package-tree.mjs
          node --check scripts/verify-lost-sizzler-package-tree.mjs
          node --check scripts/assemble-lost-sizzler-release-handoff.mjs

      - name: Run release handoff self-test
        run: |
          set -euo pipefail
          node scripts/assemble-lost-sizzler-release-handoff.mjs --self-test

      - name: Assemble verified repository package handoff
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lost-sizzler-release-handoff"
          MANIFEST="$ROOT/package-manifest.json"
          PROVENANCE="$ROOT/package-provenance.json"
          PACKAGE="$ROOT/package"
          PROFILE="$ROOT/user-data"
          HANDOFF="$ROOT/release-handoff"

          mkdir -p "$ROOT" "$PROFILE"
          printf '%s\n' '{"floor":21,"source":"external-tier-a"}' > "$PROFILE/solo-save.json"
          PROFILE_BEFORE="$(sha256sum "$PROFILE/solo-save.json" | awk '{print $1}')"

          node scripts/build-lost-sizzler-package-manifest.mjs --output "$MANIFEST"
          node scripts/build-lost-sizzler-package-provenance.mjs --manifest "$MANIFEST" --output "$PROVENANCE"
          node scripts/build-lost-sizzler-package-provenance.mjs --manifest "$MANIFEST" --verify "$PROVENANCE"
          node scripts/materialize-lost-sizzler-package-tree.mjs --manifest "$MANIFEST" --output "$PACKAGE"
          node scripts/verify-lost-sizzler-package-tree.mjs --manifest "$MANIFEST" --root "$PACKAGE"

          node scripts/assemble-lost-sizzler-release-handoff.mjs \
            --package-root "$PACKAGE" \
            --manifest "$MANIFEST" \
            --provenance "$PROVENANCE" \
            --user-data-root "$PROFILE" \
            --output "$HANDOFF"

          node scripts/verify-lost-sizzler-package-tree.mjs \
            --manifest "$HANDOFF/metadata/package-manifest.json" \
            --root "$HANDOFF/application"
          node scripts/build-lost-sizzler-package-provenance.mjs \
            --manifest "$HANDOFF/metadata/package-manifest.json" \
            --verify "$HANDOFF/metadata/package-provenance.json"

          test "$(sha256sum "$PROFILE/solo-save.json" | awk '{print $1}')" = "$PROFILE_BEFORE"
          test ! -e "$HANDOFF/user-data"
          test ! -e "$HANDOFF/solo-save.json"
          find "$HANDOFF" -type l -print -quit | grep -q . && {
            echo 'Release handoff unexpectedly contains a symbolic link.' >&2
            exit 1
          } || true

          echo "Lost Sizzler verified release handoff assembled with Tier-A persistence excluded."
