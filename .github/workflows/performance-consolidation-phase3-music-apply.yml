name: Performance consolidation phase 3 music apply

on:
  push:
    branches:
      - codex/performance-consolidation-phase-3-music

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            js/ccg-shared-music-player.js
            tests

      - name: Consolidate shared music probing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/ccg-shared-music-player.js')
          text = path.read_text(encoding='utf-8')
          marker = '''\n(function (global) {\n  global.CCGSharedMusicPlayer = global.CCGSharedMusicPlayer || {};\n  const NS = global.CCGSharedMusicPlayer;\n\n  const _probeCache = new Map();'''
          start = text.rfind(marker)
          if start < 0:
              raise SystemExit('Expected duplicate game-page probe block not found')

          replacement = '''\n(function (global) {\n  global.CCGSharedMusicPlayer = global.CCGSharedMusicPlayer || {};\n  const NS = global.CCGSharedMusicPlayer;\n\n  NS.renderIfPlayableOnGamePage = async function (container, slug, opts = {}) {\n    const { logCtx = \"\" } = opts;\n    if (!container || !slug) return false;\n\n    const resolveMp3Url = typeof NS._resolveMp3Url === \"function\"\n      ? NS._resolveMp3Url\n      : (value) => `https://pub-2f6ac7261f6347f59524930d84e71a92.r2.dev/${value}.mp3`;\n    const probeAudioMetadata = typeof NS._probeAudioMetadata === \"function\"\n      ? NS._probeAudioMetadata\n      : null;\n\n    if (!probeAudioMetadata) return false;\n\n    const url = resolveMp3Url(slug);\n    const result = await probeAudioMetadata(url, { timeoutMs: 6000, logCtx });\n\n    if (!result || !result.ok) {\n      container.innerHTML = \"\";\n      console.log(`[CCG MUSIC] missing/unplayable ${logCtx} slug=${slug}`);\n      return false;\n    }\n\n    container.innerHTML = \"\";\n    if (\n      global.ccgGameMusic &&\n      typeof global.ccgGameMusic.renderOmegaGameMusicPlayer === \"function\"\n    ) {\n      global.ccgGameMusic.renderOmegaGameMusicPlayer(container, slug, { logCtx });\n      console.log(`[CCG MUSIC] rendered Omega game player ${logCtx} slug=${slug}`);\n      return true;\n    }\n\n    return false;\n  };\n})(window);\n'''

          text = text[:start] + replacement
          path.write_text(text, encoding='utf-8')

          test = Path('tests/shared-music-probe-consolidation.mjs')
          test.write_text('''import fs from \"node:fs\";\n\nconst source = fs.readFileSync(\"js/ccg-shared-music-player.js\", \"utf8\");\n\nfunction assert(condition, message) {\n  if (!condition) throw new Error(message);\n}\n\nconst probeCacheCount = (source.match(/const _probeCache/g) || []).length;\nassert(probeCacheCount === 1, `expected one shared music probe cache, found ${probeCacheCount}`);\nassert(!source.includes(\"function probePlayable(\"), \"duplicate game-page probe implementation must be removed\");\nassert(source.includes(\"NS._probeAudioMetadata\"), \"game-page music rendering must reuse the shared metadata probe\");\nassert(source.includes(\"NS._resolveMp3Url\"), \"game-page music rendering must reuse the shared URL resolver\");\nassert(source.includes(\"NS.renderIfPlayableOnGamePage = async function\"), \"game-page music API must remain available\");\nassert(source.includes(\"renderOmegaGameMusicPlayer(container, slug, { logCtx })\"), \"Omega game player rendering must remain intact\");\nassert(source.includes(\"NS.renderIfPlayable = async function\"), \"general shared music API must remain intact\");\n\nconsole.log(\"Shared music probe consolidation guard passed.\");\n''', encoding='utf-8')
          PY

      - name: Validate shared music runtime and guard
        run: |
          node --check js/ccg-shared-music-player.js
          node tests/shared-music-probe-consolidation.mjs

      - name: Commit guarded changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ccg-shared-music-player.js tests/shared-music-probe-consolidation.mjs
          git commit -m "Reuse shared music probe on game pages"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
