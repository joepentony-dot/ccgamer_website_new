name: Manual legacy collection stub validation

# Historical stub generator retained only as a manual diagnostic.
# SEO Automation (.github/workflows/seo.yml) is the authoritative automatic
# writer for Retro Specials, Retro Events, Amiga Demo Music, video-library and
# sitemap output after their source datasets change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate stub generator syntax
        run: node --check scripts/generate-collection-stubs.js

      - name: Generate collection stubs in validation workspace
        run: node scripts/generate-collection-stubs.js

      - name: Validate generated diff
        run: git diff --check

      - name: Explain publishing ownership
        run: |
          echo "This workflow is validation-only."
          echo "SEO Automation publishes full retro pages, video-library output and sitemaps."
