name: Generate collection stubs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/retro-specials.json'
      - 'data/retro-events.json'
      - 'data/amiga-demo-music.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stubs:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate collection stubs
        run: node scripts/generate-collection-stubs.js

      - name: Commit newly created stubs only
        run: |
          set -euo pipefail
          echo "[stubs] Detecting newly created stub files..."
          mapfile -t NEW_FILES < <(git ls-files --others --exclude-standard -- \
            'retro-specials/*.html' 'retro-specials/*/index.html' \
            'retro-events/*.html' 'retro-events/*/index.html' \
            'amiga-demo-music/*.html' 'amiga-demo-music/*/index.html')

          if [ "${#NEW_FILES[@]}" -eq 0 ]; then
            echo "[stubs] No new files to commit."
            exit 0
          fi

          printf '%s\n' "${NEW_FILES[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${NEW_FILES[@]}"
          git commit -m "chore(stubs): add generated collection stub pages"

      - name: Push to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.head_ref }}"
