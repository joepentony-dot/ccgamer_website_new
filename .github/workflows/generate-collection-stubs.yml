name: Generate collection stubs

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/retro-specials.json'
      - 'data/retro-events.json'
      - 'data/amiga-demo-music.json'

permissions:
  contents: write

jobs:
  generate-stubs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate stubs + pages + sitemap (atomic)
        run: |
          node scripts/generate-collection-stubs.js
          node scripts/generate-retro-pages.js
          node tools/seo/generate-sitemap.js

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-generate outputs"

      - name: Push changes to PR branch
        run: git push origin HEAD:${{ github.head_ref }}
