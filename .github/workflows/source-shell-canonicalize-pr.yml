name: Canonicalize Public Shell Source PR

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/source-shell-canonicalize.trigger"

permissions:
  contents: write

concurrency:
  group: "source-shell-canonicalize-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  canonicalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Canonicalize committed public HTML
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-public-header-shell.js --root .
          node scripts/normalize-public-header-shell.js --root . --check

          if git diff --quiet -- '*.html'; then
            echo "PR branch public HTML already uses the canonical shell."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --check
          git commit -m "Canonicalize committed public header shell"
          git push origin HEAD:${{ github.head_ref }}
