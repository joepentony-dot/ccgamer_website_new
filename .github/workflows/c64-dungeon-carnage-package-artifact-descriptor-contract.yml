name: C64 Dungeon Carnage Package Artifact Descriptor Contract

on:
  pull_request:
    paths:
      - 'scripts/build-lost-sizzler-package-artifact-descriptor.mjs'
      - 'services/ccg-backend/tests/package-artifact-descriptor-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-package-artifact-descriptor-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check scripts/build-lost-sizzler-package-artifact-descriptor.mjs
          node --check services/ccg-backend/tests/package-artifact-descriptor-contract.mjs
      - name: Run descriptor contract
        run: node services/ccg-backend/tests/package-artifact-descriptor-contract.mjs
      - name: Exercise CLI descriptor generation
        run: |
          tmp="$(mktemp -d)"
          printf 'release-artifact-fixture\n' > "$tmp/game.zip"
          node scripts/build-lost-sizzler-package-artifact-descriptor.mjs \
            --artifact "$tmp/game.zip" \
            --package-id c64-dungeon-carnage-windows \
            --version 10.42.0 \
            --object-key releases/c64-dungeon-carnage/10.42.0/windows.zip \
            --output "$tmp/descriptor.json"
          node -e "const d=require('$tmp/descriptor.json'); if(d.bytes<=0||!/^[a-f0-9]{64}$/.test(d.sha256)) process.exit(1)"
      - name: Guard scope
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | tee /tmp/changed.txt
          if grep -Eq '^(index\.html|resources/css/intro\.css|js/index-intro\.js|games/games\.json)$' /tmp/changed.txt; then
            echo 'Protected file changed.' >&2
            exit 1
          fi
