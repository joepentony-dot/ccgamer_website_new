name: Community SEO Refresh

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate community SEO pages
        env:
          CCG_SUPABASE_URL: ${{ secrets.CCG_SUPABASE_URL }}
          CCG_SUPABASE_ANON_KEY: ${{ secrets.CCG_SUPABASE_ANON_KEY }}
        run: node tools/community-seo/generate-community-seo.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community/seo/*.html
          git commit -m "chore: refresh community SEO pages"
          git push
