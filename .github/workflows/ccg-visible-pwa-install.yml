name: CCG Visible PWA Installation

on:
  pull_request:
    paths:
      - "install-app.html"
      - "service-worker.js"
      - "js/ccg-nav-core.js"
      - "js/ccg-pwa-visible-install.js"
      - "resources/css/ccg-pwa-install-page.css"
      - "scripts/audit-visible-pwa-install.js"
      - "docs/phase-17b-visible-app-installation.md"
      - ".github/workflows/ccg-visible-pwa-install.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-pwa-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript syntax
        run: |
          node --check service-worker.js
          node --check js/ccg-nav-core.js
          node --check js/ccg-pwa-visible-install.js
          node --check scripts/audit-visible-pwa-install.js

      - name: Run visible installation audit
        run: node scripts/audit-visible-pwa-install.js

      - name: Confirm audit made no repository changes
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
