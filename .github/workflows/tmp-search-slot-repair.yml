name: Temporary CCG Search Slot Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add static search-command slot contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Canonical shell: global search CSS must be render-blocking.
          replace(
              'scripts/normalize-public-header-shell.js',
              '  "/resources/css/ccg-nav-fit.css",\n  "/resources/css/ccg-socials.css",',
              '  "/resources/css/ccg-nav-fit.css",\n  "/resources/css/ccg-global-search.css",\n  "/resources/css/ccg-socials.css",'
          )

          p = Path('scripts/normalize-public-header-shell.js')
          text = p.read_text(encoding='utf-8')
          anchor = '''function ensureRequiredAssets(html) {\n  let output = html;\n  REQUIRED_STYLES.forEach((href) => {\n    output = ensureDirectStylesheet(output, href);\n  });\n\n  REQUIRED_SCRIPTS.forEach((src) => {\n    output = ensureHeadAsset(\n      output,\n      `<script src="${src}" defer data-ccg-static-shell-script="true"></script>`,\n      src,\n      "script",\n      "src"\n    );\n  });\n  return output;\n}\n'''
          addition = anchor + '''\nfunction ensureSearchCommandSlot(html) {\n  if (/\\bdata-ccg-search-command-slot\\s*=\\s*["']true["']/i.test(html)) return html;\n  if (/\\bclass\\s*=\\s*["'][^"']*\\bccg-home-search-command\\b[^"']*["']/i.test(html)) return html;\n\n  const tagPattern = /<([a-z][a-z0-9:-]*)\\b[^>]*>/ig;\n  let match;\n  while ((match = tagPattern.exec(html))) {\n    if (!classListFromTag(match[0]).includes("ccg-main")) continue;\n    const markup = `\n    <div class="ccg-home-search-command" role="search" aria-label="Search the CCG website" data-ccg-search-command-slot="true"></div>`;\n    return `${html.slice(0, tagPattern.lastIndex)}${markup}${html.slice(tagPattern.lastIndex)}`;\n  }\n  return html;\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit('normalizer: ensureRequiredAssets anchor missing')
          text = text.replace(anchor, addition, 1)
          replace_call = '''  output = ensureRequiredAssets(output);\n  return { html: output, applicable: true, changed: output !== html, malformed: false };'''
          replace_new = '''  output = ensureRequiredAssets(output);\n  output = ensureSearchCommandSlot(output);\n  return { html: output, applicable: true, changed: output !== html, malformed: false };'''
          if text.count(replace_call) != 1:
              raise SystemExit('normalizer: normaliseHtml asset call missing')
          text = text.replace(replace_call, replace_new, 1)
          text = text.replace('  normaliseHtml,\n  processRoot,', '  normaliseHtml,\n  ensureSearchCommandSlot,\n  processRoot,', 1)
          p.write_text(text, encoding='utf-8')

          # Empty static slot must reserve the same box height as the populated command.
          p = Path('resources/css/ccg-global-search.css')
          text = p.read_text(encoding='utf-8')
          anchor = '''.ccg-home-search-command::before {\n'''
          reserve = '''.ccg-home-search-command[data-ccg-search-command-slot="true"]:empty {\n    min-height: 76px;\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('global search css: command pseudo anchor missing')
          text = text.replace(anchor, reserve + anchor, 1)
          mobile_anchor = '''    .ccg-home-search-command {\n        width: calc(100% - 12px);\n        margin-top: 6px;\n    }\n'''
          mobile_new = mobile_anchor + '''\n    .ccg-home-search-command[data-ccg-search-command-slot="true"]:empty {\n        min-height: 74px;\n    }\n'''
          if text.count(mobile_anchor) != 1:
              raise SystemExit('global search css: mobile command anchor missing')
          text = text.replace(mobile_anchor, mobile_new, 1)
          small_anchor = '''@media (max-width: 440px) {\n    .ccg-global-search-trigger--home {\n'''
          small_new = '''@media (max-width: 440px) {\n    .ccg-home-search-command[data-ccg-search-command-slot="true"]:empty {\n        min-height: 72px;\n    }\n\n    .ccg-global-search-trigger--home {\n'''
          if text.count(small_anchor) != 1:
              raise SystemExit('global search css: small media anchor missing')
          text = text.replace(small_anchor, small_new, 1)
          p.write_text(text, encoding='utf-8')

          # Normalizer fixture gets a real main and asserts the slot/CSS contract.
          p = Path('tests/public-header-stage-normalizer.test.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('  normaliseHtml,\n  processRoot,', '  normaliseHtml,\n  ensureSearchCommandSlot,\n  processRoot,', 1)
          old = '''  </header>\n  ${extraBody}\n</body>'''
          new = '''  </header>\n  <main class="ccg-main">${extraBody}</main>\n</body>'''
          if text.count(old) != 1:
              raise SystemExit('normalizer test: fixture body anchor missing')
          text = text.replace(old, new, 1)
          assertion_anchor = '''  assert.match(result.html, /class="ccg-socials-fallback" hidden aria-hidden="true"><\\/div>/);\n});'''
          assertion_new = '''  assert.match(result.html, /class="ccg-socials-fallback" hidden aria-hidden="true"><\\/div>/);\n  assert.match(result.html, /class="ccg-home-search-command" role="search" aria-label="Search the CCG website" data-ccg-search-command-slot="true"><\\/div>/);\n  assert.equal(ensureSearchCommandSlot(result.html), result.html);\n});'''
          if text.count(assertion_anchor) != 1:
              raise SystemExit('normalizer test: canonical shell assertion anchor missing')
          text = text.replace(assertion_anchor, assertion_new, 1)
          style_anchor = '''  assert.match(result.html, /href="\\/resources\\/css\\/ccg-community\\.css" data-ccg-static-shell-style="true"/);\n});'''
          style_new = '''  assert.match(result.html, /href="\\/resources\\/css\\/ccg-community\\.css" data-ccg-static-shell-style="true"/);\n  assert.match(result.html, /href="\\/resources\\/css\\/ccg-global-search\\.css" data-ccg-static-shell-style="true"/);\n});'''
          if text.count(style_anchor) != 1:
              raise SystemExit('normalizer test: style assertion anchor missing')
          text = text.replace(style_anchor, style_new, 1)
          p.write_text(text, encoding='utf-8')

          # Real-pointer audit: DOM-ready navigation is enough; also verify all v8 changed assets live.
          p = Path('scripts/audit-nav-more-browser.js')
          text = p.read_text(encoding='utf-8')
          asset_anchor = '''    ["/resources/css/ccg-mode-identity.css", "resources/css/ccg-mode-identity.css"]\n'''
          asset_new = '''    ["/resources/css/ccg-mode-identity.css", "resources/css/ccg-mode-identity.css"],\n    ["/js/ccg-global-search.js", "js/ccg-global-search.js"],\n    ["/js/zzap64-awards.js", "js/zzap64-awards.js"],\n    ["/resources/css/ccg-global-search.css", "resources/css/ccg-global-search.css"],\n    ["/resources/css/zzap64-performance.css", "resources/css/zzap64-performance.css"]\n'''
          if text.count(asset_anchor) != 1:
              raise SystemExit('browser audit: live asset anchor missing')
          text = text.replace(asset_anchor, asset_new, 1)
          cap_anchor = '''        alwaysMatch: {\n          browserName: "chrome",\n          "goog:chromeOptions": {'''
          cap_new = '''        alwaysMatch: {\n          browserName: "chrome",\n          pageLoadStrategy: "eager",\n          "goog:chromeOptions": {'''
          if text.count(cap_anchor) != 1:
              raise SystemExit('browser audit: capabilities anchor missing')
          text = text.replace(cap_anchor, cap_new, 1)
          p.write_text(text, encoding='utf-8')

          # Syntax/tests before normalizing source.
          for js in ['scripts/normalize-public-header-shell.js','scripts/audit-nav-more-browser.js']:
              subprocess.run(['node','--check',js], check=True)
          subprocess.run(['node','--test','tests/public-header-stage-normalizer.test.mjs'], check=True)

          # Normalize all committed public shared-header HTML to the same first-paint contract.
          subprocess.run(['node','scripts/normalize-public-header-shell.js','--root','.'], check=True)
          subprocess.run(['node','scripts/normalize-public-header-shell.js','--root','.','--check'], check=True)
          subprocess.run(['node','--test','tests/public-header-stage-normalizer.test.mjs'], check=True)
          subprocess.run(['node','--check','scripts/audit-header-frame-local.js'], check=True)

          # Protected files must remain untouched by this repair.
          protected = ['index.html','resources/css/intro.css','js/index-intro.js','games/games.json']
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          bad = [path for path in protected if path in changed]
          if bad:
              raise SystemExit('Protected files changed: ' + ', '.join(bad))
      - name: Commit canonical first-paint search slots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/normalize-public-header-shell.js resources/css/ccg-global-search.css tests/public-header-stage-normalizer.test.mjs scripts/audit-nav-more-browser.js
          git add -- '*.html'
          git diff --cached --check
          git commit -m "Reserve global search command before first paint [repair-bot]"
          git push origin HEAD:${{ github.head_ref }}
