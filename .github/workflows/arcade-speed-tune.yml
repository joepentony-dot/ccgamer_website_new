name: Arcade Speed Tune

on:
  push:
    branches:
      - codex/arcade-quest-foundation
    paths:
      - 'arcade/.speed-tune-trigger'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout arcade branch
        uses: actions/checkout@v4
        with:
          ref: codex/arcade-quest-foundation

      - name: Apply speed/projectile tune
        run: python scripts/apply-arcade-speed-tune.py

      - name: Commit tuned engine
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/quest/game/main-v2.js scripts/validate-arcade-quest.js
          if ! git diff --cached --quiet; then
            git commit -m "Tune bead and Alien Formation speeds"
            git push origin HEAD:codex/arcade-quest-foundation
          fi
