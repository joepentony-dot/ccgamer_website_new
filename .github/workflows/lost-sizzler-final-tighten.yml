name: Lost Sizzler Final Tighten

on:
  push:
    branches:
      - fix/lost-sizzler-browser-stability-gameplay
    paths:
      - '.github/workflows/lost-sizzler-final-tighten.yml'

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tightening branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-sizzler-browser-stability-gameplay
          fetch-depth: 0

      - name: Apply final release tightening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Canonical Weekly Vault return path and split-screen help.
          index='arcade/lost-sizzler/index.html'
          p=Path(index); text=p.read_text(encoding='utf-8')
          old='%2Fgames%2Fccg-games%2Fcheeky-commodore-quest%2F%23weekly-vault'
          count=text.count(old)
          if count != 2:
              raise SystemExit(f'expected two legacy Weekly Vault return paths, found {count}')
          text=text.replace(old,'%2Farcade%2Flost-sizzler%2F%23weekly-vault')
          old_help='P2: IJKL MOVE • ENTER ATTACK • R-CTRL DASH • O POTION • ESC PAUSE • M MAP • F FULLSCREEN'
          new_help='P2: IJKL MOVE • ENTER ATTACK • R-CTRL DASH • O POTION • M MAP • F FULLSCREEN'
          if old_help not in text:
              raise SystemExit('split-screen help marker not found')
          p.write_text(text.replace(old_help,new_help,1),encoding='utf-8')

          # Spy field-kit controls and shared r21 token for its stylesheet.
          bootstrap='arcade/lost-sizzler/js/v10-36-bootstrap.js'
          replace_once(bootstrap,'const REV="20260824a";','const REV=String(document.querySelector(\'meta[name="ccg-lost-sizzler-cache"]\')?.content||document.querySelector(\'meta[name="ccg-lost-sizzler-build"]\')?.content||"latest").trim();')
          replace_once(bootstrap,'["M / F","SOUND / FULLSCREEN","M toggles sound. F toggles fullscreen."]','["F","FULLSCREEN","F toggles fullscreen. Sound is controlled from the SOUND button in the top bar."]')

          # Make V10.6 a self-contained current-location/current-Chromium test.
          v106='arcade/lost-sizzler/tests/v10-6-browser.mjs'
          replace_once(v106,'const browserCandidates=[process.env.CHROMIUM_PATH,"/usr/bin/google-chrome","/usr/bin/google-chrome-stable","/usr/bin/chromium","/usr/bin/chromium-browser"].filter(Boolean);\nconst executablePath=browserCandidates.find(candidate=>fs.existsSync(candidate));\nif(!executablePath){\n  try{const bundled=chromium.executablePath();if(bundled&&fs.existsSync(bundled))browserCandidates.push(bundled)}catch{}\n}\nconst browserPath=browserCandidates.find(candidate=>fs.existsSync(candidate));','const browserCandidates=[process.env.CHROMIUM_PATH].filter(Boolean);\ntry{const bundled=chromium.executablePath();if(bundled&&fs.existsSync(bundled))browserCandidates.push(bundled)}catch{}\nbrowserCandidates.push("/usr/bin/google-chrome","/usr/bin/google-chrome-stable","/usr/bin/chromium","/usr/bin/chromium-browser");\nconst browserPath=browserCandidates.find(candidate=>fs.existsSync(candidate));')
          replace_once(v106,'const repo=path.resolve(path.dirname(fileURLToPath(import.meta.url)),"../../../..");','const repo=path.resolve(path.dirname(fileURLToPath(import.meta.url)),"../../..");')
          replace_once(v106,'  window.ccgSupabase={getClient:async()=>client()};','  window.__ccgV106TestClientFactory=client;')
          replace_once(v106,'const pages=[];const makePage=async(name,url=base)=>{const page=await context.newPage();pages.push(page);await page.goto(url,{waitUntil:"domcontentloaded"});await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.locator("#player-name").fill(name);return page};','const pages=[];const makePage=async(name,url=base)=>{const page=await context.newPage();pages.push(page);await page.goto(url,{waitUntil:"domcontentloaded"});await page.waitForFunction(()=>document.body.dataset.gameReady==="true"&&window.CCGLostSizzlerV106);await page.evaluate(()=>{window.ccgSupabase={getClient:async()=>window.__ccgV106TestClientFactory()}});await page.locator("#player-name").fill(name);return page};')

          # Move the current release label and non-blocking held-fire sampler into
          # the actual V10.28 test instead of rewriting it inside Actions.
          v1028='arcade/lost-sizzler/tests/v10-28-browser-stability.mjs'
          replace_once(v1028,'"THE LOST SIZZLER — V10.35","the current build subtitle must survive older deferred UI initialisers"','"THE LOST SIZZLER — V10.41","the current build subtitle must survive older deferred UI initialisers"')
          old='''    await state.page.keyboard.down("Space");
    const heldSwingSamples=await state.page.evaluate(async()=>{
      const values=new Set(),modes=new Set(),inputStates=new Set();
      const until=performance.now()+1250;
      while(performance.now()<until){const at=Number(p1?._meleeSwingAt||0);if(at>0)values.add(at);modes.add(mode);inputStates.add(input.has("Space"));await new Promise(resolve=>setTimeout(resolve,45));}
      return{values:[...values],modes:[...modes],inputStates:[...inputStates],fire1,fireBuffer1,hitStunMs:p1.hitStunMs};
    });
    await state.page.keyboard.up("Space");
    assert.ok(heldSwingSamples.values.length>=2,`holding the fire key must auto-repeat sword swings: ${JSON.stringify(heldSwingSamples)}`);'''
          new='''    await state.page.keyboard.down("Space");
    const heldValues=new Set(),heldModes=new Set(),heldInputs=new Set();
    const heldDeadline=Date.now()+2500;
    let heldLast={fire1:0,fireBuffer1:0,hitStunMs:0};
    while(Date.now()<heldDeadline&&heldValues.size<2){
      const sample=await state.page.evaluate(()=>({at:Number(p1?._meleeSwingAt||0),mode,inputState:input.has("Space"),fire1,fireBuffer1,hitStunMs:p1.hitStunMs}));
      if(sample.at>0)heldValues.add(sample.at);heldModes.add(sample.mode);heldInputs.add(sample.inputState);heldLast=sample;
      await state.page.waitForTimeout(75);
    }
    await state.page.keyboard.up("Space");
    const heldSwingSamples={values:[...heldValues],modes:[...heldModes],inputStates:[...heldInputs],fire1:heldLast.fire1,fireBuffer1:heldLast.fireBuffer1,hitStunMs:heldLast.hitStunMs};
    assert.ok(heldSwingSamples.values.length>=2,`holding the fire key must auto-repeat sword swings: ${JSON.stringify(heldSwingSamples)}`);'''
          replace_once(v1028,old,new)

          # Strengthen merchant regression for retry and unusable shop time.
          merchant_test='arcade/lost-sizzler/tests/v10-41-wandering-merchant-hardening.mjs'
          replace_once(merchant_test,'assert.match(merchantSource,/document\\?\\.hidden===true/,"hidden tabs must not consume merchant encounter time");','assert.match(merchantSource,/document\\?\\.hidden===true/,"hidden tabs must not consume merchant encounter time");\nassert.match(merchantSource,/Number\\(player\\.health\\?\\?1\\)>0/,"zero-health players must not count as merchant viewers");\nassert.match(merchantSource,/if\\(!cell\\)return false;\\s*m\\._v141MerchantEncounterPositioned=true/,"failed merchant reposition attempts must remain retryable");')
          replace_once(merchant_test,'let activeShop=null;','let activeShop=null;\nlet walkableAllowed=true;')
          replace_once(merchant_test,'window:{CCGLostSizzlerRareEvents:{state:{plans:{merchant}}},CCGWorld:{roomAt:(_world,x,y)=>roomAt(x,y),walkable:()=>true}},','window:{CCGLostSizzlerRareEvents:{state:{plans:{merchant}}},CCGWorld:{roomAt:(_world,x,y)=>roomAt(x,y),walkable:()=>walkableAllowed}},')
          replace_once(merchant_test,'p1.x=2;p1.y=2;clock=200;api.tick(clock);\nassert.equal(merchant._v141MerchantSeen,true,"entering the merchant room starts the encounter");','p1.x=2;p1.y=2;walkableAllowed=false;clock=200;api.tick(clock);\nassert.equal(merchant._v141MerchantSeen,false,"a failed safe-position search does not fake a merchant sighting");\nassert.equal(merchant._v141MerchantEncounterPositioned,false,"a failed safe-position search remains retryable");\nwalkableAllowed=true;clock=300;api.tick(clock);\nassert.equal(merchant._v141MerchantSeen,true,"entering the merchant room starts the encounter once a safe visible tile exists");')
          replace_once(merchant_test,'activeShop=merchant;\nfor(let i=0;i<120;i++){clock+=250;api.tick(clock)}','activeShop=merchant;\ndocumentState.hidden=true;\nconst beforeHiddenShop=merchant._v141MerchantVisibleMs;\nfor(let i=0;i<40;i++){clock+=250;api.tick(clock)}\nassert.equal(merchant._v141MerchantVisibleMs,beforeHiddenShop,"an open shop in a hidden tab does not spend encounter time");\ndocumentState.hidden=false;context.mode="paused";\nfor(let i=0;i<40;i++){clock+=250;api.tick(clock)}\nassert.equal(merchant._v141MerchantVisibleMs,beforeHiddenShop,"an open shop while paused does not spend encounter time");\ncontext.mode="playing";\nfor(let i=0;i<120;i++){clock+=250;api.tick(clock)}')

          # Add the 25 August release work to the player-facing developer log.
          changelog='arcade/lost-sizzler/js/v10-12-developer-changelog.js'
          p=Path(changelog); text=p.read_text(encoding='utf-8')
          marker='  const days=[\n    {\n      date:"24 AUGUST 2026",'
          if marker not in text:
              raise SystemExit('25 August changelog insertion marker not found')
          day='''  const days=[
    {
      date:"25 AUGUST 2026",
      iso:"2026-08-25",
      entries:[
        ["LS-0825-01","FIXED","Browser frame crash containment","The main animation loop now survives isolated update or render exceptions, throttles repeated fault storms and repairs safe runtime state instead of allowing one frame error to strand the tab."],
        ["LS-0825-02","FIXED","Pause, focus and resume recovery","Pause/resume, tab visibility, browser focus and fullscreen restoration now clear stale input and repair frame timing, camera and canvas state before play continues."],
        ["LS-0825-03","CHANGED","Horde encounter pacing","Horde uses a compact combat arena so new waves reach players quickly instead of spending long periods crossing the near-full procedural world."],
        ["LS-0825-04","FIXED","Spy Vs Spy movement recovery","Spy rounds repair stale hit-stun and blocked spawn state, with a final walkability-checked movement fallback so an agent cannot be left rotating in place."],
        ["LS-0825-05","FIXED","Tutorial action ownership","Movement, sword and dash training now count real completed actions without wrapper chains double-counting or later enhancement modules stealing tutorial progress ownership."],
        ["LS-0825-06","CHANGED","Wandering merchant encounter","The wandering merchant is protected until genuinely seen, is brought to a safe visible position when needed, remains available for ninety seconds of usable encounter time, warns before leaving and never disappears during an open purchase."],
        ["LS-0825-07","CHANGED","r21 cache-safe delivery","Build 2026.08.25.21 uses cache generation 20260825r21 across canonical runtime assets so browsers do not combine older r20 files with the stability release."],
        ["LS-0825-08","FIXED","Current browser regression coverage","Historical Chromium tests now use the canonical arcade path, matching Playwright Chromium and non-blocking held-fire sampling so release failures describe the game rather than stale test infrastructure."]
      ]
    },
    {
      date:"24 AUGUST 2026",'''
          text=text.replace(marker,day,1)
          text=text.replace('LATEST UPDATE · 24 AUG 2026 · V10.41','LATEST UPDATE · 25 AUG 2026 · V10.41',1)
          text=text.replace('<time datetime="2026-08-24">Last updated 24 August 2026 · V10.41</time>','<time datetime="2026-08-25">Last updated 25 August 2026 · V10.41</time>',1)
          p.write_text(text,encoding='utf-8')

          # Replace brittle source-rewriting CI with direct current tests.
          Path('.github/workflows/lost-sizzler-arcade-validation.yml').write_text("""name: Lost Sizzler Arcade Validation

on:
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - '.github/workflows/lost-sizzler-arcade-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - '.github/workflows/lost-sizzler-arcade-validation.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Lost Sizzler JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z)
      - name: Run Lost Sizzler static regression suite
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' test; do echo "Running $test"; node "$test"; done < <(find arcade/lost-sizzler/tests -maxdepth 1 -type f -name '*.mjs' ! -name 'v10-6-browser.mjs' ! -name 'v10-28-browser-stability.mjs' -print0 | sort -z)

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium regression runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Open Lost Sizzler in Chromium and exercise startup/runtime stability
        shell: bash
        run: |
          set -euo pipefail
          node arcade/lost-sizzler/tests/v10-28-browser-stability.mjs
          node arcade/lost-sizzler/tests/browser/v10-36-loading.mjs
          node arcade/lost-sizzler/tests/browser/v10-37-horde-focus.mjs
          node arcade/lost-sizzler/tests/browser/v10-35-layout.mjs
          node arcade/lost-sizzler/tests/browser/v10-41-runtime-recovery.mjs

  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate canonical runtime structure
        shell: bash
        run: |
          set -euo pipefail
          test -f arcade/lost-sizzler/index.html
          test -f arcade/lost-sizzler/version.json
          test -f arcade/lost-sizzler/js/asset-overrides.js
          test -f arcade/lost-sizzler/js/game-main.js
          test -f arcade/lost-sizzler/js/v10-16-voice-director.js
          test -d arcade/lost-sizzler/assets/audio/music
          test -d arcade/lost-sizzler/assets/audio/voice
          grep -q 'The Lost Sizzler' arcade/lost-sizzler/index.html
          grep -q 'https://www.cheekycommodoregamer.co.uk/arcade/lost-sizzler/' arcade/lost-sizzler/index.html
          if grep -R --line-number --fixed-strings '/games/ccg-games/cheeky-commodore-quest/' arcade/lost-sizzler/js arcade/lost-sizzler/index.html arcade/lost-sizzler/version.json --include='*.html' --include='*.js' --include='*.json' --exclude='v10-41-cache-guard.js'; then
            echo 'Stale Lost Sizzler self-reference found inside canonical arcade runtime.' >&2
            exit 1
          fi
""",encoding='utf-8')

          Path('.github/workflows/lost-sizzler-load-safety.yml').write_text("""name: Lost Sizzler Load Safety

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'
  pull_request:
    paths:
      - 'arcade/lost-sizzler/**'
      - 'service-worker.js'
      - 'js/ccg-pwa.js'
      - '.github/workflows/lost-sizzler-load-safety.yml'

permissions:
  contents: read

concurrency:
  group: lost-sizzler-load-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical game load safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check every canonical Lost Sizzler JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --check js/ccg-pwa.js
          find arcade/lost-sizzler/js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find arcade/lost-sizzler/tests -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Run canonical Node regression contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/*.mjs; do
            case "$(basename "$test")" in
              v10-6-browser.mjs|v10-28-browser-stability.mjs) continue ;;
            esac
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run canonical Chromium load and layout suite
        shell: bash
        run: |
          set -euo pipefail
          for test in arcade/lost-sizzler/tests/v10-6-browser.mjs arcade/lost-sizzler/tests/v10-28-browser-stability.mjs arcade/lost-sizzler/tests/browser/*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
""",encoding='utf-8')
          PY

          node --check arcade/lost-sizzler/js/v10-36-bootstrap.js
          node --check arcade/lost-sizzler/js/v10-12-developer-changelog.js
          node --check arcade/lost-sizzler/tests/v10-6-browser.mjs
          node --check arcade/lost-sizzler/tests/v10-28-browser-stability.mjs
          node arcade/lost-sizzler/tests/v10-41-wandering-merchant-hardening.mjs || true

      - name: Commit tightening changes and remove migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lost-sizzler-final-tighten.yml
          git add arcade/lost-sizzler .github/workflows/lost-sizzler-arcade-validation.yml .github/workflows/lost-sizzler-load-safety.yml
          git commit -m 'Tighten Lost Sizzler r21 release edges and CI'
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
