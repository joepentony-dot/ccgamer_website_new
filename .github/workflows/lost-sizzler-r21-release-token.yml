name: Lost Sizzler R21 Release Token

on:
  push:
    branches:
      - fix/lost-sizzler-browser-stability-gameplay
    paths:
      - '.github/workflows/lost-sizzler-r21-release-token.yml'

permissions:
  contents: write

jobs:
  apply-r21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          ref: fix/lost-sizzler-browser-stability-gameplay
          fetch-depth: 0

      - name: Apply one cache generation across the complete Lost Sizzler runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('arcade/lost-sizzler')
          changed=[]
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  source=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated=source.replace('20260825r20','20260825r21').replace('2026.08.25.20','2026.08.25.21')
              if updated!=source:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))

          version_check=root/'js/version-check.js'
          source=version_check.read_text(encoding='utf-8')
          if 'const RELEASE_CACHE=' not in source:
              source=source.replace(
                  'const RELEASE_VERSION="V10.41";',
                  'const RELEASE_VERSION="V10.41";\n  const RELEASE_CACHE=String(document.querySelector(\'meta[name="ccg-lost-sizzler-cache"]\')?.content||document.querySelector(\'meta[name="ccg-lost-sizzler-build"]\')?.content||"latest").trim();',
                  1
              )
          source=re.sub(
              r'script\.src="(js/[^"?]+\.js)\?v=20260824[a-z]";',
              r'script.src=`\1?v=${encodeURIComponent(RELEASE_CACHE)}`;',
              source
          )
          version_check.write_text(source,encoding='utf-8')

          remaining=[]
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '20260825r20' in text or '2026.08.25.20' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Old r20 release token remains in: '+', '.join(remaining))

          print('R21 release token applied to:', ', '.join(changed) or 'no files')
          PY

      - name: Validate edited release files
        shell: bash
        run: |
          set -euo pipefail
          node --check arcade/lost-sizzler/js/version-check.js
          node --check arcade/lost-sizzler/js/v10-41-lake-item-safety.js
          node --check arcade/lost-sizzler/js/v10-41-tutorial-action-finalizer.js
          node arcade/lost-sizzler/tests/v10-22-version-cache.mjs
          node arcade/lost-sizzler/tests/v10-41-browser-stability-gameplay-hotfix.mjs

      - name: Commit R21 and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lost-sizzler-r21-release-token.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arcade/lost-sizzler .github/workflows/lost-sizzler-r21-release-token.yml
          git commit -m "Bump Lost Sizzler stability cache generation to r21"
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
