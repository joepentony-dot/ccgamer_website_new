name: Manual Viewer Validation

on:
  pull_request:
    paths:
      - "js/ccg-manual-viewer-polish.js"
      - "resources/css/ccg-manual-viewer-polish.css"
      - "scripts/ensure-manual-viewer-polish.js"
      - "scripts/rebuild-games.js"
      - "tests/manual-viewer-polish.test.mjs"
      - ".github/workflows/manual-viewer-validation.yml"
  push:
    branches: [main]
    paths:
      - "js/ccg-manual-viewer-polish.js"
      - "resources/css/ccg-manual-viewer-polish.css"
      - "scripts/ensure-manual-viewer-polish.js"
      - "scripts/rebuild-games.js"
      - "tests/manual-viewer-polish.test.mjs"
      - ".github/workflows/manual-viewer-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check js/ccg-manual-viewer-polish.js
          node --check scripts/ensure-manual-viewer-polish.js
      - name: Manual viewer regression tests
        run: node --test tests/manual-viewer-polish.test.mjs
