name: Refresh Zzap64 Review Links

on:
  push:
    branches:
      - main
    paths:
      - "data/zzap64-awards/**"
      - "data/zzap64-review-overrides.json"
      - "data/zzap64-game-reviews/**"
      - "data/lemon-cache/**"
      - "games/games.json"
      - "scripts/generate-zzap64-review-links.js"
      - "scripts/enrich-zzap64-game-reviews.js"
      - "scripts/build-zzap64-game-review-chunks.js"
      - "scripts/refresh-lemon-game-cache.js"
      - "scripts/zzap64-bible-client.js"
      - "scripts/audit-game-badges.js"
      - "js/zzap64-awards.js"
      - "js/zzap64-game-link-fix.js"
      - "js/zzap64-review-browser.js"
      - "js/zzap64-game-reviews-runtime.js"
      - "js/ccg-game-badges.js"
      - "js/ccg-schema.js"
      - "zzap64/index.html"
      - "resources/css/zzap64-reviews.css"
      - "resources/css/ccg-game-badges.css"
      - "tests/zzap64-review-links.test.mjs"
      - "tests/game-zzap-links.test.mjs"
      - "tests/zzap64-game-review-chunks.test.mjs"
      - "tests/zzap64-review-browser-lazy.test.mjs"
      - "tests/lemon-game-cache-refresh.test.mjs"
      - ".github/workflows/zzap64-review-links-refresh.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zzap64-review-link-refresh-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate resolver syntax
        run: |
          node --check scripts/generate-zzap64-review-links.js
          node --check scripts/enrich-zzap64-game-reviews.js
          node --check scripts/build-zzap64-game-review-chunks.js
          node --check scripts/refresh-lemon-game-cache.js
          node --check scripts/zzap64-bible-client.js
          node --check scripts/audit-game-badges.js
          node --check js/zzap64-awards.js
          node --check js/zzap64-game-link-fix.js
          node --check js/zzap64-review-browser.js
          node --check js/zzap64-game-reviews-runtime.js
          node --check js/ccg-game-badges.js
          node --check js/ccg-schema.js

      - name: Cache Lemon pages for newly added or changed games
        id: lemon_cache
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          node scripts/refresh-lemon-game-cache.js --base HEAD^
          node scripts/refresh-lemon-game-cache.js --check --base HEAD^

      - name: Report Lemon cache fallback
        if: github.event_name == 'push' && steps.lemon_cache.outcome == 'failure'
        run: |
          echo "::warning title=Lemon cache unavailable::The live Lemon cache refresh failed. Continuing with existing cache plus explicit Zzap review URLs from games.json so one external fetch cannot block all review publishing."

      - name: Refresh live award references when run manually
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/generate-zzap64-review-links.js --live

      - name: Rebuild verified award scan index
        run: |
          node scripts/generate-zzap64-review-links.js
          node scripts/generate-zzap64-review-links.js --check

      - name: Add all linked game reviews and re-reviews
        run: |
          node scripts/enrich-zzap64-game-reviews.js
          node scripts/enrich-zzap64-game-reviews.js --check
          node scripts/build-zzap64-game-review-chunks.js
          node scripts/build-zzap64-game-review-chunks.js --check

      - name: Validate direct scan coverage
        run: |
          node --test tests/lemon-game-cache-refresh.test.mjs
          node --test tests/zzap64-review-links.test.mjs
          node --test tests/game-zzap-links.test.mjs
          node --test tests/zzap64-game-review-chunks.test.mjs
          node --test tests/zzap64-review-browser-lazy.test.mjs
          node scripts/audit-zzap64-awards.js
          node scripts/audit-game-badges.js
          git diff --check

      - name: Commit refreshed review data
        id: review_output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/lemon-cache data/zzap64-review-links.json data/zzap64-game-reviews
          if git diff --cached --quiet; then
            echo "Zzap review data already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Do not open duplicate generated review PRs. Only reuse a
          # byte-identical complete patch on a same-repo current-main branch.
          DUPLICATE_PR=$(node scripts/deduplicate-generated-publishing.mjs --zzap)
          if [ -n "$DUPLICATE_PR" ]; then
            echo "[zzap] Identical review output already pending in PR #$DUPLICATE_PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT_BRANCH="automation/zzap64-review-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$OUTPUT_BRANCH"
          git commit -m "Auto refresh Zzap64 all-game review links"
          git push origin "HEAD:$OUTPUT_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$OUTPUT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft refreshed review data pull request (no automatic merge)
        if: steps.review_output.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_BRANCH: ${{ steps.review_output.outputs.branch }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$OUTPUT_BRANCH" \
            --draft \
            --title "Refresh Zzap64 all-game review data" \
            --body "Generated Zzap64 review links, re-reviews and compact review data from run ${GITHUB_RUN_ID}. Generation checks passed, but this PR is NOT qualified for merge. Leave DRAFT until exact-head executed CI, any required review, fresh-main reconciliation and guarded owner-authorised release.")

          echo "Created DRAFT refreshed-review PR: $PR_URL"
          echo "::notice::[zzap] Review output is staged only; the single website release coordinator owns guarded qualification and merge."

      - name: Verify refreshed review PR remains draft
        if: steps.review_output.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_BRANCH: ${{ steps.review_output.outputs.branch }}
        run: |
          PR_STATE=$(gh pr view "$OUTPUT_BRANCH" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,state,baseRefName --jq '.isDraft and .state == "OPEN" and .baseRefName == "main"')
          if [ "$PR_STATE" != "true" ]; then
            echo "::error::Refreshed review output was not staged as an open DRAFT PR on main."
            exit 1
          fi
          echo "[zzap] Draft review PR verified. No main merge was attempted."
