name: Lost Sizzler r23 Token Audit

on:
  push:
    branches:
      - fix/lost-sizzler-browser-stability-gameplay
    paths:
      - '.github/workflows/lost-sizzler-r23-token-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: List current r22 release references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 2026.08.25.22 occurrences ==='
          grep -RIn --fixed-strings '2026.08.25.22' arcade/lost-sizzler || true
          echo '=== 20260825r22 occurrences ==='
          grep -RIn --fixed-strings '20260825r22' arcade/lost-sizzler || true
