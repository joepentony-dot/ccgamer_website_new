name: C64 Dungeon Carnage Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'arcade/lost-sizzler/**'
      - 'supabase/functions/lost-sizzler-feedback/**'
      - 'supabase/functions/ccq-weekly-challenge/**'
      - 'supabase/migrations/**lost_sizzler**'
      - '.github/workflows/lost-sizzler-production-smoke.yml'
      - 'scripts/install-dungeon-chromium.sh'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lost-sizzler-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    # Playwright 1.55.0 cannot install Chromium dependencies on Ubuntu 26.04.
    # Pin the runner; preserve all live smoke assertions and commands.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium smoke runtime
        shell: bash
        run: bash scripts/install-dungeon-chromium.sh

      - name: Verify deployed C64 Dungeon Carnage browser and backend
        shell: bash
        run: |
          set -euo pipefail
          node arcade/lost-sizzler/tests/production/v10-41-r47-production-smoke.mjs
