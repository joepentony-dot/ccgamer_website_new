name: C64 Dungeon Carnage Commerce App Contract

on:
  pull_request:
    paths:
      - 'services/ccg-backend/src/lost-sizzler-commerce-app.mjs'
      - 'services/ccg-backend/tests/commerce-app-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-commerce-app-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'services/ccg-backend/src/lost-sizzler-commerce-app.mjs'
      - 'services/ccg-backend/tests/commerce-app-contract.mjs'
      - '.github/workflows/c64-dungeon-carnage-commerce-app-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate syntax
        run: |
          node --check services/ccg-backend/src/lost-sizzler-commerce-app.mjs
          node --check services/ccg-backend/tests/commerce-app-contract.mjs

      - name: Run commerce application composition contract
        run: node services/ccg-backend/tests/commerce-app-contract.mjs

      - name: Guard production composition against embedded secrets
        run: |
          set -euo pipefail
          if grep -niE '(PAYPAL_CLIENT_SECRET\s*=|SUPABASE_SERVICE_ROLE|service_role\s*=|clientSecret\s*:\s*["'"'][^"'"']{12,}["'"'])' \
            services/ccg-backend/src/lost-sizzler-commerce-app.mjs; then
            echo 'ERROR: possible embedded commerce secret detected in application composition.' >&2
            exit 1
          fi
