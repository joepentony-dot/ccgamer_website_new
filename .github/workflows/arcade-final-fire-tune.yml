name: Arcade Final Fire Tune

on:
  push:
    branches:
      - codex/arcade-quest-foundation
    paths:
      - 'scripts/apply-arcade-final-fire-tune.py'
      - '.github/workflows/arcade-final-fire-tune.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/arcade-quest-foundation
          fetch-depth: 0

      - name: Apply tuning
        run: python scripts/apply-arcade-final-fire-tune.py

      - name: Validate JavaScript
        run: node --check arcade/quest/game/main-v2.js

      - name: Commit tuned game
        shell: bash
        run: |
          if git diff --quiet -- arcade/quest/game/main-v2.js scripts/validate-arcade-quest.js; then
            echo 'No tuning changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade/quest/game/main-v2.js scripts/validate-arcade-quest.js
          git commit -m 'Tune one-shot firing and arcade pressure'
          git push origin HEAD:codex/arcade-quest-foundation
