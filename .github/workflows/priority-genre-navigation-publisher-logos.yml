name: Manual Priority Genre Navigation and Publisher Logo Validation

# Historical correction workflow retained as a manual read-only diagnostic.
# Reliable Games Publishing and the dedicated publisher archive workflow own
# current automatic game/archive output. This workflow must never mutate a PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-priority-genre-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/priority-fix-protected.sha256"

      - name: Validate tooling
        run: |
          node --check scripts/rebuild-games.js
          node --check scripts/apply-priority-discovery-navigation.js
          node --check scripts/fetch-publisher-logos.js
          node --check scripts/apply-publisher-logos.js
          node --check scripts/validate-publisher-logo-output.js
          node --check scripts/remove-invalid-publisher-labels.js
          node --check scripts/integrate-year-platform-discovery.js
          node --check scripts/validate-year-platform-discovery.js

      - name: Apply historical discovery correction in runner workspace
        run: node scripts/apply-priority-discovery-navigation.js

      - name: Validate generated diff safety
        run: git diff --check

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/priority-fix-protected.sha256"

      - name: Explain ownership
        run: |
          echo "This workflow is manual and validation-only."
          echo "Reliable Games Publishing owns current automatic game/archive generation."
          echo "Refresh Publisher Archives owns dedicated publisher archive generation."
