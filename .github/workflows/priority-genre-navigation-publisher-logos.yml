name: Priority Genre Navigation and Publisher Logos

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/priority-genre-navigation-publisher-logos.yml"
      - ".github/workflows/publisher-archives.yml"
      - "scripts/rebuild-games.js"
      - "scripts/apply-priority-discovery-navigation.js"
      - "scripts/fetch-publisher-logos.js"
      - "scripts/apply-publisher-logos.js"
      - "scripts/validate-publisher-logo-output.js"
      - "scripts/integrate-year-platform-discovery.js"
      - "scripts/validate-year-platform-discovery.js"
      - "scripts/generate-publisher-pages.js"
      - "data/publisher-logo-sources.json"
      - "resources/css/publisher-logos.css"
      - "resources/images/publishers/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: priority-genre-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Fetch main baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Record protected hashes
        run: |
          sha256sum \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json \
            > "$RUNNER_TEMP/priority-fix-protected.sha256"

      - name: Validate initial tooling
        run: |
          node --check scripts/rebuild-games.js
          node --check scripts/apply-priority-discovery-navigation.js
          node --check scripts/fetch-publisher-logos.js
          node --check scripts/apply-publisher-logos.js
          node --check scripts/validate-publisher-logo-output.js

      - name: Fetch vetted publisher logos
        env:
          CCG_PUBLISHER_LOGOS_STRICT: "0"
        run: node scripts/fetch-publisher-logos.js

      - name: Apply permanent discovery source correction
        run: |
          node scripts/apply-priority-discovery-navigation.js
          node --check scripts/integrate-year-platform-discovery.js
          node --check scripts/validate-year-platform-discovery.js

      - name: Run authoritative games rebuild
        run: |
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md

      - name: Validate requested public output
        shell: bash
        run: |
          node scripts/validate-publisher-logo-output.js

          grep -q 'href="/games/genres/">Browse by Genre</a>' games/index.html
          ! grep -q '>Browse by Platform</a>' games/index.html
          grep -q 'dedicated release-year pages and the complete genre library' games/index.html

          grep -q 'href="/resources/css/publisher-logos.css"' games/publishers/index.html
          grep -q 'data-publisher-logo="activision"' games/publishers/index.html
          grep -Eq 'src="/resources/images/publishers/activision\.(webp|png|svg|jpg|jpeg)"' games/publishers/index.html

          grep -q 'href="/resources/css/publisher-logos.css"' games/publishers/activision/index.html
          grep -q 'data-publisher-page-logo="activision"' games/publishers/activision/index.html
          grep -Eq 'src="/resources/images/publishers/activision\.(webp|png|svg|jpg|jpeg)"' games/publishers/activision/index.html

      - name: Verify deterministic repeat generation
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/priority-fix-first.diff"
          node scripts/rebuild-games.js
          rm -f seo-audit-report.md
          git diff --binary > "$RUNNER_TEMP/priority-fix-second.diff"
          if ! cmp -s "$RUNNER_TEMP/priority-fix-first.diff" "$RUNNER_TEMP/priority-fix-second.diff"; then
            echo "Priority fix repeat-generation mismatch:"
            diff -u "$RUNNER_TEMP/priority-fix-first.diff" "$RUNNER_TEMP/priority-fix-second.diff" || true
            exit 1
          fi
          git diff --check

      - name: Confirm protected files are unchanged
        run: sha256sum --check "$RUNNER_TEMP/priority-fix-protected.sha256"

      - name: Confirm exact correction scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          protected = {
              "index.html",
              "home.html",
              "resources/css/intro.css",
              "js/index-intro.js",
              "games/games.json",
          }
          allowed_exact = {
              ".github/workflows/priority-genre-navigation-publisher-logos.yml",
              ".github/workflows/publisher-archives.yml",
              "scripts/rebuild-games.js",
              "scripts/apply-priority-discovery-navigation.js",
              "scripts/fetch-publisher-logos.js",
              "scripts/apply-publisher-logos.js",
              "scripts/validate-publisher-logo-output.js",
              "scripts/integrate-year-platform-discovery.js",
              "scripts/validate-year-platform-discovery.js",
              "data/publisher-logo-sources.json",
              "resources/css/publisher-logos.css",
              "games/index.html",
              "games/developers/index.html",
              "games/archive-navigation.json",
              "tools/seo/static-pages.json",
              "sitemap.xml",
              "sitemap-pages.xml",
              "sitemap-games.xml",
              "docs/seo-baseline/phase-4c-year-platform-discovery.md",
              "docs/seo-baseline/phase-4d-year-platform-validation.md",
          }
          allowed_prefixes = (
              "games/publishers/",
              "resources/images/publishers/",
          )

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted({*tracked, *untracked})

          unexpected = []
          for path in changed:
              if path in allowed_exact:
                  continue
              if path.startswith(allowed_prefixes):
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit(f"Unexpected priority-fix paths: {unexpected}")
          if protected.intersection(changed):
              raise SystemExit("A protected file entered the priority-fix diff.")

          print(f"Validated priority correction scope ({len(changed)} files).")
          PY
          git diff --check

      - name: Commit validated output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add -A
          git reset -- \
            index.html \
            home.html \
            resources/css/intro.css \
            js/index-intro.js \
            games/games.json

          if git diff --cached --quiet; then
            echo "Priority correction output is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply publisher logo library"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
