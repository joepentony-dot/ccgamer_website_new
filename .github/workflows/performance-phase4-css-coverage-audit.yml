name: Performance phase 4 CSS coverage audit

on:
  push:
    branches:
      - codex/performance-phase4-css-coverage-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false

      - name: Audit public-header stylesheet coverage and order
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files", "*.html"], text=True).splitlines()
          rows = []
          link_pattern = re.compile(r"<link\b[^>]*\bhref\s*=\s*['\"]([^'\"]+\.css(?:[?#][^'\"]*)?)['\"][^>]*>", re.I)

          for raw in tracked:
              path = Path(raw)
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if "data-ccg-header" not in text:
                  continue

              html_tag = re.search(r"<html\b[^>]*>", text, re.I)
              page_type = ""
              if html_tag:
                  match = re.search(r"\bdata-ccg-page\s*=\s*['\"]([^'\"]+)['\"]", html_tag.group(0), re.I)
                  if match:
                      page_type = match.group(1)

              styles = [m.group(1).split('?', 1)[0].split('#', 1)[0] for m in link_pattern.finditer(text)]
              mobile_indices = [i for i, href in enumerate(styles) if href.endswith("/ccg-mobile-lite.css") or href == "ccg-mobile-lite.css" or href.endswith("ccg-mobile-lite.css")]
              nav_indices = [i for i, href in enumerate(styles) if href.endswith("/ccg-nav-fit.css") or href == "ccg-nav-fit.css" or href.endswith("ccg-nav-fit.css")]
              mobile_index = mobile_indices[0] if mobile_indices else None
              nav_index = nav_indices[0] if nav_indices else None

              rows.append({
                  "path": raw,
                  "page_type": page_type,
                  "mobile_lite": mobile_index is not None,
                  "nav_fit": nav_index is not None,
                  "mobile_before_nav": mobile_index is not None and nav_index is not None and mobile_index < nav_index,
                  "styles_between": styles[mobile_index + 1:nav_index] if mobile_index is not None and nav_index is not None and mobile_index < nav_index else [],
              })

          both_rows = [r for r in rows if r["mobile_lite"] and r["nav_fit"]]
          between_patterns = {}
          for row in both_rows:
              key = tuple(row["styles_between"])
              between_patterns[key] = between_patterns.get(key, 0) + 1

          summary = {
              "public_header_pages": len(rows),
              "both": len(both_rows),
              "mobile_lite_only": sum(r["mobile_lite"] and not r["nav_fit"] for r in rows),
              "nav_fit_only": sum(r["nav_fit"] and not r["mobile_lite"] for r in rows),
              "neither": sum(not r["mobile_lite"] and not r["nav_fit"] for r in rows),
              "mobile_before_nav": sum(r["mobile_before_nav"] for r in both_rows),
              "nav_before_mobile": sum(not r["mobile_before_nav"] for r in both_rows),
          }

          report = {
              "summary": summary,
              "mobile_lite_without_nav_fit": [r for r in rows if r["mobile_lite"] and not r["nav_fit"]],
              "nav_fit_without_mobile_lite": [r for r in rows if r["nav_fit"] and not r["mobile_lite"]],
              "stylesheet_between_patterns": [
                  {"count": count, "styles_between": list(pattern)}
                  for pattern, count in sorted(between_patterns.items(), key=lambda item: (-item[1], item[0]))
              ],
              "order_exceptions": [r for r in both_rows if not r["mobile_before_nav"]],
          }

          Path("phase4-css-coverage.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Confirm read-only audit
        run: git diff --exit-code

      - uses: actions/upload-artifact@v4
        with:
          name: phase4-css-coverage
          path: phase4-css-coverage.json
          if-no-files-found: error
