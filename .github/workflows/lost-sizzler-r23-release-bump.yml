name: Lost Sizzler r23 Release Bump

on:
  push:
    branches:
      - fix/lost-sizzler-browser-stability-gameplay
    paths:
      - '.github/workflows/lost-sizzler-r23-release-bump.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply r23 release generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('arcade/lost-sizzler')
          old_build = '2026.08.25.22'
          new_build = '2026.08.25.23'
          old_cache = '20260825r22'
          new_cache = '20260825r23'

          expected_build_files = {
              root/'version.json',
              root/'index.html',
              root/'js/v10-12-developer-changelog.js',
              root/'tests/v10-22-version-cache.mjs',
              root/'tests/v10-41-horde-isolation-stability.mjs',
              root/'tests/v10-41-live-join-presence.mjs',
              root/'tests/v10-41-r22-release-delivery.mjs',
          }
          expected_cache_files = expected_build_files | {
              root/'tests/v10-31-gameplay-weekly.mjs',
              root/'tests/v10-20-onboarding-safety.mjs',
              root/'tests/browser/v10-41-load-safety.mjs',
          }

          def files_with(token):
              found=set()
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  try: text=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  if token in text: found.add(p)
              return found

          actual_build=files_with(old_build)
          actual_cache=files_with(old_cache)
          if actual_build != expected_build_files:
              raise SystemExit(f'Unexpected {old_build} file set: expected {sorted(map(str,expected_build_files))}, got {sorted(map(str,actual_build))}')
          if actual_cache != expected_cache_files:
              raise SystemExit(f'Unexpected {old_cache} file set: expected {sorted(map(str,expected_cache_files))}, got {sorted(map(str,actual_cache))}')

          replace_files=(expected_build_files|expected_cache_files)-{root/'js/v10-12-developer-changelog.js'}
          for p in sorted(replace_files):
              text=p.read_text(encoding='utf-8')
              text=text.replace(old_build,new_build).replace(old_cache,new_cache)
              # These selected regression files describe the current release generation.
              if '/tests/' in p.as_posix():
                  text=text.replace('r22','r23').replace('build .22','build .23')
              p.write_text(text,encoding='utf-8')

          old_test=root/'tests/v10-41-r22-release-delivery.mjs'
          new_test=root/'tests/v10-41-r23-release-delivery.mjs'
          if not old_test.exists():
              raise SystemExit('Expected r22 release-delivery regression is missing')
          if new_test.exists():
              raise SystemExit('r23 release-delivery regression already exists unexpectedly')
          old_test.rename(new_test)

          changelog=root/'js/v10-12-developer-changelog.js'
          text=changelog.read_text(encoding='utf-8')
          anchor='        ["LS-0825-08","FIXED","Current browser regression coverage","Historical Chromium tests now use the canonical arcade path, matching Playwright Chromium and non-blocking held-fire sampling so release failures describe the game rather than stale test infrastructure."]'
          if text.count(anchor)!=1:
              raise SystemExit('Developer changelog insertion anchor was not found exactly once')
          additions='''        ["LS-0825-08","FIXED","Current browser regression coverage","Historical Chromium tests now use the canonical arcade path, matching Playwright Chromium and non-blocking held-fire sampling so release failures describe the game rather than stale test infrastructure."],\n        ["LS-0825-09","FIXED","Lost Adventurer escort and rescue","The Lost Adventurer now recruits reliably, follows with bounded pathfinding and catch-up recovery, renders as a friendly human and awards 1,000 score plus 200 XP after reaching a Sanctuary."],\n        ["LS-0825-10","CHANGED","Solo ammo and timed-room combat","Normal Solo enemies now drop exactly five rounds without multiplier or duplicate abuse. Timed chambers use controlled three-enemy waves with health recovery between cleared waves, and rooms are limited to one named enemy."],\n        ["LS-0825-11","FIXED","Weekly and Horde leaderboard stability","The Weekly Vault remains bounded and scrollable, while Horde leaderboard decoration is idempotent and requestAnimationFrame-coalesced so repeated category switching cannot create a MutationObserver feedback loop."],\n        ["LS-0825-12","FIXED","Weekly rollover and retry safety","A reserved Weekly Dungeon attempt can finish across the Monday UTC reset, and simultaneous result retries project only the persisted winning result into the leaderboard."],\n        ["LS-0825-13","CHANGED","r23 consolidated release delivery","Build 2026.08.25.23 uses cache generation 20260825r23 for the combined V10.41 stability, gameplay and Weekly safety release, forcing browsers onto the final integrated runtime assets."]'''
          text=text.replace(anchor,additions)
          changelog.write_text(text,encoding='utf-8')

          # r22 is now allowed only in its historical changelog entry.
          remaining_build=files_with(old_build)
          remaining_cache=files_with(old_cache)
          historical={changelog}
          if remaining_build != historical or remaining_cache != historical:
              raise SystemExit(f'Unexpected old release references remain: build={sorted(map(str,remaining_build))}, cache={sorted(map(str,remaining_cache))}')

          # Verify the new release identifiers are present in the publication surface.
          index=(root/'index.html').read_text(encoding='utf-8')
          manifest=(root/'version.json').read_text(encoding='utf-8')
          if new_build not in index or new_cache not in index or new_build not in manifest or new_cache not in manifest:
              raise SystemExit('r23 publication identifiers were not written to both index.html and version.json')
          PY

          git rm .github/workflows/lost-sizzler-r23-token-audit.yml
          git rm .github/workflows/lost-sizzler-r23-release-bump.yml
          git diff --check
          echo '=== r23 changed files ==='
          git status --short

      - name: Commit r23 release generation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Lost Sizzler V10.41 r23 consolidated release'
          git push origin HEAD:fix/lost-sizzler-browser-stability-gameplay
