name: Materialize public growth SEO fixes

# One-shot branch workflow. It removes itself after the guarded materializer succeeds.
on:
  push:
    branches:
      - codex/seo-public-growth-fixes
    paths:
      - .github/workflows/seo-public-growth-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/seo-public-growth-fixes
          fetch-depth: 0

      - name: Apply guarded SEO and discovery fixes
        run: node scripts/materialize-public-growth-seo.js

      - name: Remove one-shot materializer workflow
        run: rm .github/workflows/seo-public-growth-materialize.yml

      - name: Commit materialized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 0
          fi
          git commit -m "Materialize public growth SEO fixes"
          git push origin HEAD:codex/seo-public-growth-fixes
