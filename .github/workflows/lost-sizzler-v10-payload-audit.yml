name: Lost Sizzler V10 Payload Audit

on:
  push:
    branches:
      - "audit/lost-sizzler-v10-3-payload"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decode and inspect original V10.3 packaging attempts
        shell: python
        run: |
          import base64, binascii, gzip, hashlib, pathlib, re, subprocess

          release='origin/release/commodore-quest-v10-3-public'
          subprocess.run(['git','fetch','origin','release/commodore-quest-v10-3-public:refs/remotes/origin/release/commodore-quest-v10-3-public','--depth=30'],check=True)
          base='games/commodore-quest/payload-parts/'
          names=['part-%02d.txt'%i for i in range(11)]+['probe-00.txt','probe-formatted.txt']
          whitespace=set(b' \t\r\n\f\v')
          alphabet=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')

          def get(name):
              return subprocess.check_output(['git','show',f'{release}:{base}{name}'])
          def clean(raw):
              return bytes(b for b in raw if b not in whitespace)
          blobs={n:get(n) for n in names}
          cleans={n:clean(v) for n,v in blobs.items()}

          print('===== ORIGINAL FILE MAP =====')
          for n in names:
              raw=blobs[n]; c=cleans[n]
              bad=[(i,b) for i,b in enumerate(c) if b not in alphabet]
              marker=c.find(b'[...ELLIPSIZATION...]')
              print(n,'raw=',len(raw),'clean=',len(c),'mod4=',len(c)%4,'bad=',bad[:20],'marker=',marker,'head=',repr(c[:36]),'tail=',repr(c[-36:]))

          print('\n===== CHUNK RELATIONSHIPS =====')
          pf=cleans['probe-formatted.txt']; p0=cleans['probe-00.txt']; broken=cleans['part-00.txt']
          print('probe-formatted == probe-00[:len] =>',pf==p0[:len(pf)])
          print('probe-formatted clean length =>',len(pf))
          print('probe-00 clean length =>',len(p0))
          print('broken part00 first10000 == probe00 =>',broken[:10000]==p0)
          for n in ['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt','part-09.txt','part-10.txt']:
              needle=cleans[n][:120]
              pos=p0.find(needle)
              print(n,'first120 in probe00 at',pos)
          # Critical expected continuity: final 2000 chars of probe00 should equal first 2000 of part01 if part01 starts at offset 8000.
          print('probe00[8000:10000] == part01[:2000] =>',p0[8000:10000]==cleans['part-01.txt'][:2000])
          print('probe-formatted tail -> part01 boundary',repr(pf[-50:]),repr(cleans['part-01.txt'][:50]))

          candidates={
              'BROKEN_LOADER_00_04': b''.join(cleans[f'part-{i:02d}.txt'] for i in range(5)),
              'PROBEFMT_PLUS_01_04': pf+b''.join(cleans[f'part-{i:02d}.txt'] for i in range(1,5)),
              'PROBEFMT_PLUS_01_10': pf+b''.join(cleans[f'part-{i:02d}.txt'] for i in range(1,11)),
              'PROBE00_PLUS_02_10': p0+b''.join(cleans[f'part-{i:02d}.txt'] for i in range(2,11)),
              'BROKENMARKER_REMOVED_PLUS_01_10': broken.replace(b'[...ELLIPSIZATION...]',b'')+b''.join(cleans[f'part-{i:02d}.txt'] for i in range(1,11)),
          }

          decoded_text=None
          winner=None
          print('\n===== CANDIDATE DECODE TESTS =====')
          for label,c in candidates.items():
              bad=[b for b in c if b not in alphabet]
              print(label,'chars=',len(c),'mod4=',len(c)%4,'bad_count=',len(bad),'sha256=',hashlib.sha256(c).hexdigest())
              try:
                  packed=base64.b64decode(c,validate=True)
                  print(label,'BASE64_OK packed=',len(packed),'packed_sha=',hashlib.sha256(packed).hexdigest())
                  payload=gzip.decompress(packed)
                  text=payload.decode('utf-8')
                  print(label,'GZIP_UTF8_OK chars=',len(text),'text_sha=',hashlib.sha256(payload).hexdigest())
                  if decoded_text is None:
                      decoded_text=text; winner=label
              except Exception as exc:
                  print(label,'FAIL',type(exc).__name__,repr(str(exc)))

          if decoded_text is None:
              raise SystemExit('No packaging candidate reconstructed a valid gzip UTF-8 payload.')

          text=decoded_text
          print('\nWINNER=',winner)
          markers=['/*__CCG_PAYLOAD_CSS_7C2F__*/','/*__CCG_PAYLOAD_CORE_19A4__*/','/*__CCG_PAYLOAD_GAME_37B1__*/','/*__CCG_PAYLOAD_MOBILE_8E5C__*/']
          print('MARKERS=',{m:text.count(m) for m in markers})

          def compact(s): return re.sub(r'\s+',' ',s).strip()
          def contexts(label,pattern,max_hits=12,radius=220):
              print(f'\n===== {label} =====')
              hits=list(re.finditer(pattern,text,re.I)); print('COUNT=',len(hits))
              out=[]
              for m in hits:
                  ctx=compact(text[max(0,m.start()-radius):min(len(text),m.end()+radius)])
                  if ctx.lower() not in [x.lower() for x in out]: out.append(ctx)
                  if len(out)>=max_hits: break
              for i,ctx in enumerate(out,1): print(f'[{i}] {ctx}')

          scans=[
            ('VERSION',r'v10(?:\.\d+)?|version|build'),('TITLE_ART',r'lost-sizzler|sizzler\.(?:webp|png|jpg|jpeg|svg)|title(?:Art|Image|Logo)?'),
            ('LIGHT_VISIBILITY',r'light|visibility|vision|fog|radius'),('TORCH',r'torch|flaming'),('INACTIVITY',r'inactiv|idle|loiter|punish'),('AMMO',r'ammo|ammunition|shots?'),
            ('DAILY_DUNGEON',r'daily dungeon|dailyDungeon|daily_run|dailyRun|one attempt|one life'),('QUIT_ESCAPE',r'quit|escape|continue'),
            ('DEATH_CACHE',r'death cache|deathCache|recover your stash|xp lost|stash|dropped loot'),('ARTEFACT',r'artefact|artifact|trading|trade'),
            ('GENERATOR',r'generator|spawned creatures|active enemies|diminishing'),('NAMED_ENEMIES',r'named enem|dossier|encounter|enemy name'),
            ('VOID_STALKER',r'void stalker|death stalker|stalker'),('BANISHMENT',r'banishment flask|banish'),('IMMUNE',r'immune|immunity'),('SIGIL',r'sigil|gauntlet'),
            ('SECRETS_SWITCHES',r'secret|switch|clue'),('ROOMS_SCENERY',r'furniture|scenery|bookcase|chair|pillar|room shading|shade'),('DOORS',r'door|hinge|swing'),
            ('INFO_POPUPS',r'\binfo\b|popup|banner|message strip|notification'),('HUD_RADAR_DOSSIER',r'hud|radar|dossier|command deck|command-deck'),
            ('PICKUPS',r'pickup|collected|neon'),('POTION',r'potion'),('MULTIPLAYER',r'multiplayer|co-op|create room|join room|room code|room-code|create / join'),
            ('GAMEPAD',r'gamepad|controller'),('RULEBOOK_DONATE',r'rulebook|donate'),('MOBILE_ROTATE',r'rotate phone|orientation|portrait|landscape|100dvh|safe-area'),
            ('FLOORS',r'five floors|5 floors|floor [1-5]|currentFloor|floorIndex'),('PUZZLES',r'puzzle')]
          for label,pat in scans: contexts(label,pat)

          print('\n===== NUMERIC / CONFIG LINES =====')
          for line in text.splitlines():
              if re.search(r'(light|vision|radius|torch|ammo|idle|inactiv|generator|spawn|daily|death|enemy)',line,re.I) and re.search(r'\d',line):
                  s=compact(line)
                  if len(s)<500: print(s)

          print('\n===== REQUIRED TEXT COUNTS =====')
          required=['ROTATE PHONE TO LANDSCAPE','RECOVER YOUR STASH','XP LOST','Q = TORCH','Banishment Flask','Void Stalker','Death Stalker','Daily Dungeon','Rulebook','Donate','Create Room','Join Room','room code','SIGIL']
          for s in required: print(repr(s),'=>',text.lower().count(s.lower()))
