name: Lost Sizzler V10 Payload Audit

on:
  push:
    branches:
      - "audit/lost-sizzler-v10-3-payload"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Exhaustively reconstruct V10.3 and audit features
        shell: python
        run: |
          import base64, gzip, hashlib, itertools, re, subprocess, zlib
          release='origin/release/commodore-quest-v10-3-public'
          subprocess.run(['git','fetch','origin','release/commodore-quest-v10-3-public:refs/remotes/origin/release/commodore-quest-v10-3-public','--depth=30'],check=True)
          base='games/commodore-quest/payload-parts/'
          ws=set(b' \t\r\n\f\v')
          def get(n): return subprocess.check_output(['git','show',f'{release}:{base}{n}'])
          def clean(x): return bytes(b for b in x if b not in ws)
          p={f'{i:02d}':clean(get(f'part-{i:02d}.txt')) for i in range(11)}
          pf=clean(get('probe-formatted.txt'))
          fixed=pf+b''.join(p[f'{i:02d}'] for i in range(1,5))
          print('FIXED_PREFIX_CHARS',len(fixed),'sha',hashlib.sha256(fixed).hexdigest())
          # Confirm fixed prefix itself is a valid gzip prefix.
          fixed_packed=base64.b64decode(fixed,validate=True)
          d=zlib.decompressobj(16+zlib.MAX_WBITS)
          fixed_out=d.decompress(fixed_packed)
          print('FIXED_PREFIX_STREAM_OK out',len(fixed_out),'eof',d.eof,'tail',repr(fixed_out[-120:]))

          unresolved=['05','06','07','08','09','10']
          successes=[]; deepest=[]
          for idx,perm in enumerate(itertools.permutations(unresolved),1):
              enc=fixed+b''.join(p[x] for x in perm)
              encpad=enc+b'='*((-len(enc))%4)
              try:
                  packed=base64.b64decode(encpad,validate=True)
                  dz=zlib.decompressobj(16+zlib.MAX_WBITS)
                  out=dz.decompress(packed)
                  score=len(out)
                  if len(deepest)<12 or score>deepest[-1][0]:
                      deepest.append((score,perm,dz.eof,repr(out[-80:])))
                      deepest=sorted(deepest,reverse=True)[:12]
                  if dz.eof:
                      # Full gzip validation including CRC/trailer.
                      full=gzip.decompress(packed)
                      text=full.decode('utf-8')
                      successes.append((perm,enc,packed,text))
                      print('SUCCESS_ORDER',perm,'encoded',len(enc),'packed',len(packed),'text',len(text),'text_sha',hashlib.sha256(full).hexdigest())
              except Exception:
                  pass
          print('PERMUTATIONS_TESTED',idx)
          print('SUCCESS_COUNT',len(successes))
          print('DEEPEST_STREAMS')
          for x in deepest: print(x)
          if not successes:
              raise SystemExit('No permutation of parts 05-10 yields a complete valid V10.3 gzip payload.')
          perm,winning_encoded,packed,text=successes[0]
          print('\nWINNING_ORDER',('PF','01','02','03','04')+perm)
          print('ENCODED_CHARS',len(winning_encoded),'ENC_SHA',hashlib.sha256(winning_encoded).hexdigest(),'PACKED_SHA',hashlib.sha256(packed).hexdigest())

          markers=['/*__CCG_PAYLOAD_CSS_7C2F__*/','/*__CCG_PAYLOAD_CORE_19A4__*/','/*__CCG_PAYLOAD_GAME_37B1__*/','/*__CCG_PAYLOAD_MOBILE_8E5C__*/']
          print('MARKERS',{m:text.count(m) for m in markers})
          def compact(s): return re.sub(r'\s+',' ',s).strip()
          def contexts(label,pat,max_hits=14,radius=250):
              hits=list(re.finditer(pat,text,re.I)); print('\n===',label,'count',len(hits),'===')
              seen=[]
              for m in hits:
                  ctx=compact(text[max(0,m.start()-radius):min(len(text),m.end()+radius)])
                  if ctx.lower() not in [x.lower() for x in seen]: seen.append(ctx)
                  if len(seen)>=max_hits: break
              for i,x in enumerate(seen,1): print(i,x)
          scans=[
            ('VERSION',r'v10(?:\.\d+)?|version|build'),('TITLE_ART',r'lost-sizzler|sizzler\.(?:webp|png|jpg|jpeg|svg)|title(?:Art|Image|Logo)?'),
            ('LIGHT',r'light|visibility|vision|fog|radius'),('TORCH',r'torch|flaming'),('INACTIVITY',r'inactiv|idle|loiter|punish'),('AMMO',r'ammo|ammunition|shots?'),
            ('DAILY',r'daily dungeon|dailyDungeon|daily_run|dailyRun|one attempt|one life'),('QUIT',r'quit|escape|continue'),('DEATH',r'death cache|deathCache|recover your stash|xp lost|stash|dropped loot'),
            ('ARTEFACT',r'artefact|artifact|trading|trade'),('GENERATOR',r'generator|spawned creatures|active enemies|diminishing'),('NAMED',r'named enem|dossier|encounter|enemy name'),
            ('STALKER',r'void stalker|death stalker|stalker'),('BANISHMENT',r'banishment flask|banish'),('IMMUNE',r'immune|immunity'),('SIGIL',r'sigil|gauntlet'),
            ('SECRETS',r'secret|switch|clue'),('SCENERY',r'furniture|scenery|bookcase|chair|pillar|room shading|shade'),('DOORS',r'door|hinge|swing'),
            ('INFO_POPUPS',r'\binfo\b|popup|banner|message strip|notification'),('HUD',r'hud|radar|dossier|command deck|command-deck'),('PICKUPS',r'pickup|collected|neon'),('POTION',r'potion'),
            ('MULTIPLAYER',r'multiplayer|co-op|create room|join room|room code|room-code|create / join'),('GAMEPAD',r'gamepad|controller'),('RULEBOOK',r'rulebook|donate'),
            ('MOBILE',r'rotate phone|orientation|portrait|landscape|100dvh|safe-area'),('FLOORS',r'five floors|5 floors|floor [1-5]|currentFloor|floorIndex'),('PUZZLES',r'puzzle')]
          for label,pat in scans: contexts(label,pat)

          print('\n=== CONFIG/NUMERIC LINES ===')
          for line in text.splitlines():
              if re.search(r'(light|vision|radius|torch|ammo|idle|inactiv|generator|spawn|daily|death|enemy)',line,re.I) and re.search(r'\d',line):
                  s=compact(line)
                  if len(s)<750: print(s)

          print('\n=== EXACT TEXT COUNTS ===')
          req=['ROTATE PHONE TO LANDSCAPE','RECOVER YOUR STASH','XP LOST','Q = TORCH','Banishment Flask','Void Stalker','Death Stalker','Daily Dungeon','Rulebook','Donate','Create Room','Join Room','room code','SIGIL','lost-sizzler.webp']
          for s in req: print(repr(s),text.lower().count(s.lower()))
