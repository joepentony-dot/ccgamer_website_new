<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/analytics.js" defer></script>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex,follow">
<title>Redirecting…</title>

  <script>
    (function() {
      // parse the “id” query parameter
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("id");

      if (slug) {
        // construct the new structured path
        const target = "/games/" + encodeURIComponent(slug) + "/";

        // inject canonical tag for search engines
        const link = document.createElement("link");
        link.rel = "canonical";
        link.href = "https://www.cheekycommodoregamer.co.uk" + target;
        document.head.appendChild(link);

        // perform client redirect
        window.location.replace(target);
      } else {
        // no id → fallback to games hub
        window.location.replace("/games/");
      }
    })();
  </script>

  <!-- non-JS fallback -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=/games/" />
  </noscript>
</head>
<body>
  <p>Redirecting to game…</p>
</body>
</html>
