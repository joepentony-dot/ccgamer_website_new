<!DOCTYPE html>
<html lang="en" data-ccg-page="collection-single">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Top Picks | Cheeky Commodore Gamer</title>

    <meta name="description"
          content="Top Picks — Cheeky Commodore Gamer’s personal selection of standout Commodore 64 and Amiga classics." />

    <link rel="icon" href="../../favicon.ico" />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../resources/css/ccg-master.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-mode.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-effects.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-anim.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-overlays.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-modal.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-socials.css" />
    <link rel="stylesheet" href="../../resources/css/genre.css" />
</head>

<body class="ccg-body"
      data-ccg-mode="c64"
      data-collection="top-picks">

    <div class="ccg-bg">
        <div class="ccg-bg-starfield"></div>
        <div class="ccg-bg-grid"></div>
        <div class="ccg-bg-crt-overlay"></div>
    </div>

    <div class="ccg-page ccg-page--collection-single">

        <header class="ccg-header">
            <div class="ccg-header-inner">
                <a href="../../home.html" class="ccg-brand">
                    <img src="../../resources/images/ccgamer-logo.png" class="ccg-brand__logo" alt="">
                    <div class="ccg-brand__text">
                        <span class="ccg-brand__neon-cheeky">CHEEKY</span>
                        <span class="ccg-brand__neon-sub">COMMODORE GAMER</span>
                    </div>
                </a>
            </div>
            <div class="ccg-header-neon-strip"></div>
        </header>

        <main class="ccg-main">
            <section class="ccg-genre-hero ccg-collection-hero">
                <div class="ccg-genre-hero__inner">
                    <h1 class="ccg-genre-hero__title">Top Picks</h1>
                    <p class="ccg-genre-hero__tagline">
                        Personal favourites from the CCG vault.
                    </p>
                    <div class="ccg-genre-meta">
                        <span><span id="genreGamesCount">0</span> games in this collection</span>
                    </div>
                </div>
            </section>

            <section class="ccg-genre-main">
                <div id="collectionGamesGrid" class="ccg-genre-grid"></div>
            </section>
        </main>

        <footer class="ccg-footer">
            <p class="ccg-footer__text">© <span data-ccg-year></span> Cheeky Commodore Gamer.</p>
        </footer>

    </div>

    <script src="../../js/ccg-global.js" defer></script>
    <script src="../../js/ccg-mode-engine.js" defer></script>
    <script src="../../js/ccg-card-builder.js" defer></script>
    <script src="../../js/collection-loader.js" defer></script>

</body>
</html>
