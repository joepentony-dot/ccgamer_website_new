<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/arcade/lost-sizzler/">
  <meta http-equiv="refresh" content="0;url=/arcade/lost-sizzler/">
  <title>The Lost Sizzler — Moved</title>
</head>
<body>
  <p>The Lost Sizzler has moved to <a id="lost-sizzler-destination" href="/arcade/lost-sizzler/">its new arcade location</a>.</p>
  <script>
    (()=>{
      const destination=new URL('/arcade/lost-sizzler/',location.origin);
      destination.search=location.search;
      destination.hash=location.hash;
      const link=document.getElementById('lost-sizzler-destination');
      if(link)link.href=destination.href;
      location.replace(destination.href);
    })();
  </script>
</body>
</html>
