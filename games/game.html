<!DOCTYPE html>
<html lang="en" data-ccg-page="single-game">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="game-meta-title">Game | Cheeky Commodore Gamer</title>
    <meta name="description"
          id="game-meta-description"
          content="Full details for this Commodore 64 or Amiga game — including video, manual, screenshots and metadata.">

    <link rel="icon" href="../favicon.ico">

    <!-- REQUIRED FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../resources/css/ccg-master.css">
    <link rel="stylesheet" href="../resources/css/ccg-mode.css">
    <link rel="stylesheet" href="../resources/css/ccg-effects.css">
    <link rel="stylesheet" href="../resources/css/ccg-anim.css">
    <link rel="stylesheet" href="../resources/css/ccg-overlays.css">
    <link rel="stylesheet" href="../resources/css/ccg-modal.css">
    <link rel="stylesheet" href="../resources/css/ccg-socials.css">
    <link rel="stylesheet" href="../resources/css/ccg-cards.css">
    <link rel="stylesheet" href="../resources/css/games.css">
    <link rel="stylesheet" href="../resources/css/ccg-footer.css">

    <!-- WOW POLISH (SINGLE GAME ONLY) -->
    <link rel="stylesheet" href="../resources/css/ccg-single-game-wow.css">
</head>

<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">

<div class="ccg-bg">
    <div class="ccg-bg-starfield"></div>
    <div class="ccg-bg-grid"></div>
    <div class="ccg-bg-crt-overlay"></div>
</div>

<div class="ccg-page ccg-page--single-game">

    <!-- HEADER (LOCKED PARITY) -->
    <header class="ccg-header">
        <div class="ccg-header-inner">

            <a href="../home.html" class="ccg-brand">
                <img src="../resources/images/ccgamer-logo.png"
                     class="ccg-brand__logo"
                     width="56"
                     height="56"
                     alt="Cheeky Commodore Gamer logo">

                <div class="ccg-brand__text">
                    <div class="ccg-brand__kicker">Stay a while, stay forever!</div>
                    <div class="ccg-brand__title">
                        <span class="ccg-brand__neon-cheeky">CHEEKY</span>
                        <span class="ccg-brand__neon-sub">COMMODORE GAMER</span>
                    </div>
                </div>
            </a>

            <nav class="ccg-nav" aria-label="Primary navigation">
                <ul class="ccg-nav__list">

                    <li><a href="../home.html" class="ccg-nav__link">Home</a></li>
                    <li><a href="index.html" class="ccg-nav__link">Browse Games</a></li>
                    <li><a href="genres/index.html" class="ccg-nav__link">Browse by Genre</a></li>
                    <li><a href="collections/index.html" class="ccg-nav__link">Collections</a></li>

                    <li class="ccg-nav__more">
                        <button class="ccg-nav__link ccg-nav__more-btn"
                                type="button"
                                aria-haspopup="true"
                                aria-expanded="false">
                            More ▾
                        </button>

                        <ul class="ccg-nav__dropdown">
                            <li><a href="../quiz/quiz.html" class="ccg-nav__dropdown-link">Trivia &amp; Leaderboard</a></li>
                            <li><a href="../emulation.html" class="ccg-nav__dropdown-link">Emulation</a></li>
                            <li><a href="../complete-index.html" class="ccg-nav__dropdown-link">Index</a></li>
                            <li><a href="../about.html" class="ccg-nav__dropdown-link">About</a></li>
                            <li><a href="../contact.html" class="ccg-nav__dropdown-link">Contact</a></li>
                        </ul>
                    </li>

                </ul>
            </nav>

            <div class="ccg-header-actions">

                <button class="ccg-mode-toggle"
                        type="button"
                        aria-label="Toggle between C64 and Amiga modes"
                        data-ccg-mode-toggle>
                    <span class="ccg-mode-toggle__pill">
                        <span class="ccg-mode-toggle__label ccg-mode-toggle__label--c64">C64</span>
                        <span class="ccg-mode-toggle__label ccg-mode-toggle__label--amiga">Amiga</span>
                        <span class="ccg-mode-toggle__thumb"></span>
                    </span>
                </button>

                <div class="ccg-header-socials">
                    <a href="https://www.youtube.com/@CheekyCommodoreGamer" aria-label="YouTube"><span class="ccg-socials__icon ccg-socials__icon--yt"></span></a>
                    <a href="https://patreon.com/CheekyCommodoreGamer" aria-label="Patreon"><span class="ccg-socials__icon ccg-socials__icon--patreon"></span></a>
                    <a href="https://www.paypal.com/donate/?hosted_button_id=LGG86ZV9P4YKL" aria-label="PayPal"><span class="ccg-socials__icon ccg-socials__icon--paypal"></span></a>
                    <a href="https://twitter.com/CheekyC64Gamer" aria-label="X/Twitter"><span class="ccg-socials__icon ccg-socials__icon--x"></span></a>
                    <a href="https://www.facebook.com/cheekycommodoregamer" aria-label="Facebook"><span class="ccg-socials__icon ccg-socials__icon--fb"></span></a>
                    <a href="https://discord.gg/83Xw9ktAn4" aria-label="Discord"><span class="ccg-socials__icon ccg-socials__icon--discord"></span></a>
                </div>

            </div>
        </div>

        <div class="ccg-header-neon-strip"></div>
    </header>

    <main class="ccg-main ccg-main--single-game">

        <!-- HERO -->
        <section class="game-hero">
            <div id="gameHeroBG" class="game-hero__bg"></div>

            <div class="game-hero__inner">
                <div class="game-hero__media">
                    <img id="gameHeroThumb"
                         class="game-hero__thumb"
                         alt=""
                         loading="lazy">
                </div>

                <div class="game-hero__content">
                    <h1 id="gameHeroTitle" class="game-hero__title"></h1>

                    <div class="game-hero__meta">
                        <span id="gameMetaYear" class="game-meta__item"></span>
                        <span class="game-meta__sep">•</span>
                        <span id="gameMetaSystem" class="game-meta__item"></span>
                        <span class="game-meta__sep">•</span>
                        <span id="gameMetaDeveloper" class="game-meta__item"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- (rest of page unchanged) -->

    </main>
</div>

<!-- MODAL -->
<div id="ccgModal" class="ccg-modal" aria-hidden="true">
    <button class="ccg-modal-nav ccg-modal-nav--prev" aria-label="Previous screenshot">‹</button>

    <div class="ccg-modal-content">
        <span class="ccg-modal-close" aria-label="Close modal">&times;</span>
        <iframe id="ccgModalFrame" class="ccg-pdf-frame" loading="lazy"></iframe>
    </div>

    <button class="ccg-modal-nav ccg-modal-nav--next" aria-label="Next screenshot">›</button>
</div>

<script src="../js/ccg-global.js" defer></script>
<script src="../js/ccg-mode-engine.js" defer></script>
<script src="../js/load-single-game.js" defer></script>

</body>
</html>
