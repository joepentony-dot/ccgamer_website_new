<!DOCTYPE html>
<html lang="en" data-ccg-page="game">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title id="game-meta-title">Game | Cheeky Commodore Gamer</title>
    <meta id="game-meta-description" name="description" content="Loading game details…">

    <link rel="icon" href="../favicon.ico" />

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../resources/css/ccg-master.css" />
    <link rel="stylesheet" href="../resources/css/ccg-mode.css" />
    <link rel="stylesheet" href="../resources/css/ccg-effects.css" />
    <link rel="stylesheet" href="../resources/css/ccg-anim.css" />
    <link rel="stylesheet" href="../resources/css/ccg-overlays.css" />
    <link rel="stylesheet" href="../resources/css/ccg-modal.css" />

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="../resources/css/games.css" />
</head>

<body class="ccg-body" data-ccg-mode="c64">

    <!-- GLOBAL BACKGROUND -->
    <div class="ccg-bg">
        <div class="ccg-bg-starfield"></div>
        <div class="ccg-bg-grid"></div>
        <div class="ccg-bg-crt-overlay"></div>
    </div>

    <div class="ccg-page ccg-page--game">

        <!-- =====================================================
             UNIVERSAL HEADER (OMEGA SUBPAGE VERSION)
        ===================================================== -->
        <header class="ccg-header">
            <div class="ccg-header-inner">

                <!-- Logo -->
                <a href="../home.html" class="ccg-logo-link">
                    <img src="../resources/ccgamer_logo.png" class="ccg-logo-img" alt="Cheeky Commodore Gamer logo">
                </a>

                <!-- Navigation -->
                <nav class="ccg-nav">
                    <a href="../home.html" class="nav-item">Home</a>
                    <a href="../games/index.html" class="nav-item">Games</a>
                    <a href="../games/genres/index.html" class="nav-item">Genres</a>
                    <a href="../quiz/quiz.html" class="nav-item">Quiz</a>
                    <a href="../complete-index.html" class="nav-item">Index</a>
                    <a href="../about.html" class="nav-item">About</a>
                    <a href="../contact.html" class="nav-item">Contact</a>
                </nav>

                <!-- Mode Toggle -->
                <button
                    class="ccg-mode-toggle is-c64"
                    type="button"
                    aria-label="Toggle system mode"
                    data-ccg-mode-toggle="true"
                >
                    <span
                        class="ccg-mode-toggle-pill ccg-mode-toggle-pill--c64"
                        data-mode-target="c64"
                        data-ccg-mode="c64"
                    >
                        <span class="ccg-mode-toggle-icon">
                            <img src="../resources/icons/c64.svg" alt="">
                        </span>
                        <span class="ccg-mode-toggle-label">C64</span>
                    </span>

                    <span class="ccg-mode-toggle-knob" aria-hidden="true"></span>

                    <span
                        class="ccg-mode-toggle-pill ccg-mode-toggle-pill--amiga"
                        data-mode-target="amiga"
                        data-ccg-mode="amiga"
                    >
                        <span class="ccg-mode-toggle-icon">
                            <img src="../resources/icons/amiga.svg" alt="">
                        </span>
                        <span class="ccg-mode-toggle-label">Amiga</span>
                    </span>
                </button>

            </div>

            <!-- Social Icons (Subpage Compact Row) -->
            <div class="ccg-header-socials">
                <a href="https://www.youtube.com/@CheekyCommodoreGamer" target="_blank">
                    <img src="../resources/icons/youtube.svg" alt="YouTube">
                </a>
                <a href="https://patreon.com/CheekyCommodoreGamer" target="_blank">
                    <img src="../resources/icons/patreon.svg" alt="Patreon">
                </a>
                <a href="https://www.paypal.com/donate/?hosted_button_id=LGG86ZV9P4YKL" target="_blank">
                    <img src="../resources/icons/paypal.svg" alt="PayPal">
                </a>
                <a href="https://www.facebook.com/cheekycommodoregamer" target="_blank">
                    <img src="../resources/icons/facebook.svg" alt="Facebook">
                </a>
                <a href="https://twitter.com/CheekyC64Gamer" target="_blank">
                    <img src="../resources/icons/twitter.svg" alt="X / Twitter">
                </a>
                <a href="https://discord.gg/83Xw9ktAn4" target="_blank">
                    <img src="../resources/icons/discord.svg" alt="Discord">
                </a>
            </div>
        </header>

        <!-- =====================================================
             MAIN GAME CONTENT
        ===================================================== -->
        <main class="ccg-main ccg-main--game" id="main">

            <!-- HERO PANEL -->
            <section class="game-hero">
                <div class="game-hero-inner">

                    <!-- HERO IMAGE -->
                    <div class="game-hero-media">
                        <img id="game-hero-image"
                             src="../resources/images/thumbnails/all/fallback.jpg"
                             alt="Game cover"
                             class="game-hero-img">
                        <div class="game-hero-overlay-scan"></div>
                        <div class="game-hero-overlay-glow"></div>
                    </div>

                    <!-- HERO CONTENT -->
                    <div class="game-hero-content">
                        <h1 id="game-title" class="game-title">Loading…</h1>

                        <div class="game-meta">
                            <span id="game-system" class="game-meta-pill">SYSTEM</span>
                            <span id="game-year" class="game-meta-pill">YEAR</span>
                        </div>

                        <p id="game-genres" class="game-genres">Genres loading…</p>

                        <div class="game-hero-buttons">
                            <a id="game-play-video"
                               href="#"
                               target="_blank"
                               class="ccg-btn ccg-btn-primary"
                               hidden>
                               Watch Video
                            </a>

                            <a id="game-open-manual"
                               href="#"
                               target="_blank"
                               class="ccg-btn ccg-btn-secondary"
                               hidden>
                               Read Manual
                            </a>

                            <a href="index.html" class="ccg-btn ccg-btn-ghost">
                               Back to Games
                            </a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- DESCRIPTION -->
            <section class="game-section">
                <h2 class="game-section-title">Overview</h2>
                <p id="game-description" class="game-description">
                    Loading game description…
                </p>
            </section>

            <!-- VIDEO -->
            <section class="game-section" id="game-video-section" hidden>
                <h2 class="game-section-title">Gameplay Video</h2>

                <div class="game-video-frame">
                    <iframe id="game-video-embed"
                            class="game-video-embed"
                            src=""
                            allowfullscreen></iframe>
                </div>
            </section>

            <!-- MANUAL -->
            <section class="game-section" id="game-manual-section" hidden>
                <h2 class="game-section-title">Game Manual</h2>

                <a id="game-manual-link"
                   href="#"
                   target="_blank"
                   class="ccg-btn ccg-btn-primary">
                    Open Manual PDF
                </a>
            </section>

        </main>

        <!-- FOOTER -->
        <footer class="ccg-footer">
            <div class="ccg-footer-inner">
                <p class="ccg-footer-text">© <span id="ccg-year">2025</span> Cheeky Commodore Gamer.</p>
                <p class="ccg-footer-text ccg-footer-text--small">
                    Not affiliated with Commodore or Amiga brands.
                </p>
            </div>
        </footer>

    </div>

    <!-- JS -->
    <script src="../js/ccg-mode-engine.js" defer></script>
    <script src="../js/ccj-global.js" defer></script>

    <!-- SINGLE GAME LOADER -->
    <script src="load-single-game.js" defer></script>

</body>
</html>
