<!DOCTYPE html>
<html lang="en" data-ccg-page="single-game">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="game-title-meta">Game | Cheeky Commodore Gamer</title>
    <meta name="description"
          content="Full details for this Commodore 64 or Amiga game — including video, manual, screenshots and metadata.">

    <link rel="icon" href="../favicon.ico">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../resources/css/ccg-master.css">
    <link rel="stylesheet" href="../resources/css/ccg-mode.css">
    <link rel="stylesheet" href="../resources/css/ccg-effects.css">
    <link rel="stylesheet" href="../resources/css/ccg-anim.css">
    <link rel="stylesheet" href="../resources/css/ccg-overlays.css">
    <link rel="stylesheet" href="../resources/css/ccg-modal.css">
    <link rel="stylesheet" href="../resources/css/games.css">
    <link rel="stylesheet" href="../resources/css/hero.css">
</head>

<body class="ccg-body" data-ccg-mode="c64">

    <!-- BACKGROUND -->
    <div class="ccg-bg">
        <div class="ccg-bg-starfield"></div>
        <div class="ccg-bg-grid"></div>
        <div class="ccg-bg-crt-overlay"></div>
    </div>

    <div class="ccg-page ccg-page--single-game">

        <!-- ░░ OMEGA HEADER (Final Version) ░░ -->
        <header class="ccg-header">
            <div class="ccg-header-inner">

                <!-- BRAND -->
                <a href="../home.html" class="ccg-brand">
                    <img src="../resources/images/ccgamer-logo.png"
                         alt="Cheeky Commodore Gamer logo"
                         class="ccg-brand__logo" loading="lazy">

                    <div class="ccg-brand__text">
                        <div class="ccg-brand__kicker">Stay a while, stay forever!</div>
                        <div class="ccg-brand__title">
                            <span class="ccg-brand__neon-cheeky">CHEEKY</span>
                            <span class="ccg-brand__neon-sub">COMMODORE GAMER</span>
                        </div>
                    </div>
                </a>

                <!-- NAV -->
                <nav class="ccg-nav">
                    <ul class="ccg-nav__list">
                        <li><a href="../home.html" class="ccg-nav__link">Home</a></li>
                        <li><a href="../games/index.html" class="ccg-nav__link">Browse Games</a></li>
                        <li><a href="../games/genres/index.html" class="ccg-nav__link">Browse by Genre</a></li>
                        <li><a href="../games/collections/index.html" class="ccg-nav__link">Collections</a></li>
                        <li><a href="../quiz/quiz.html" class="ccg-nav__link">Trivia</a></li>
                        <li><a href="../complete-index.html" class="ccg-nav__link">Index</a></li>
                        <li><a href="../about.html" class="ccg-nav__link">About</a></li>
                        <li><a href="../contact.html" class="ccg-nav__link">Contact</a></li>
                    </ul>
                </nav>

                <!-- MODE + SOCIALS -->
                <div class="ccg-header-actions">
                    <button class="ccg-mode-toggle" type="button" data-ccg-mode-toggle>
                        <span class="ccg-mode-toggle__pill">
                            <span class="ccg-mode-toggle__label ccg-mode-toggle__label--c64">C64</span>
                            <span class="ccg-mode-toggle__label ccg-mode-toggle__label--amiga">Amiga</span>
                            <span class="ccg-mode-toggle__thumb"></span>
                        </span>
                    </button>

                    <div class="ccg-socials">
                        <a href="https://www.youtube.com/@CheekyCommodoreGamer"
                           class="ccg-socials__link">
                            <span class="ccg-socials__icon ccg-socials__icon--yt"></span>
                            <span class="ccg-socials__label">Subscribe</span>
                        </a>
                        <a href="https://patreon.com/CheekyCommodoreGamer" class="ccg-socials__icon-btn">
                            <span class="ccg-socials__icon ccg-socials__icon--patreon"></span>
                        </a>
                        <a href="https://www.paypal.com/donate/?hosted_button_id=LGG86ZV9P4YKL"
                           class="ccg-socials__icon-btn">
                            <span class="ccg-socials__icon ccg-socials__icon--paypal"></span>
                        </a>
                        <a href="https://twitter.com/CheekyC64Gamer" class="ccg-socials__icon-btn">
                            <span class="ccg-socials__icon ccg-socials__icon--x"></span>
                        </a>
                        <a href="https://www.facebook.com/cheekycommodoregamer"
                           class="ccg-socials__icon-btn">
                            <span class="ccg-socials__icon ccg-socials__icon--fb"></span>
                        </a>
                        <a href="https://discord.gg/83Xw9ktAn4" class="ccg-socials__icon-btn">
                            <span class="ccg-socials__icon ccg-socials__icon--discord"></span>
                        </a>
                    </div>
                </div>

            </div>
            <div class="ccg-header-neon-strip"></div>
        </header>

        <!-- ░░ OMEGA CINEMATIC GAME HERO ░░ -->
        <section class="ccg-section hero hero--single-game">

            <div class="game-hero-bg"></div>
            <div class="game-hero-overlay"></div>

            <div class="game-hero-inner">

                <!-- THUMBNAIL -->
                <div class="game-hero-thumb-wrap">
                    <img id="game-hero-image"
                         src=""
                         alt="Game artwork"
                         class="game-hero-thumb">
                </div>

                <!-- TEXT SIDE -->
                <div class="game-hero-copy">
                    <h1 id="game-title" class="game-hero-title">Game Title</h1>

                    <div id="game-meta" class="game-hero-meta"></div>

                    <div id="game-genres" class="game-hero-genres"></div>

                    <div class="game-hero-actions">
                        <div id="manual-links"></div>
                        <div id="disk-links"></div>
                    </div>
                </div>

            </div>

        </section>

        <!-- ░░ VIDEO SECTION ░░ -->
        <section class="ccg-section game-video-section">
            <h2 class="ccg-section-title">Gameplay Video</h2>
            <div id="video-frame" class="game-video-frame"></div>
        </section>

        <!-- FOOTER -->
        <footer class="ccg-footer">
            <div class="ccg-footer-inner">
                <p class="ccg-footer-text">© 2025 Cheeky Commodore Gamer.</p>
                <p class="ccg-footer-text ccg-footer-text--small">
                    Not affiliated with Commodore, Amiga or any publishers.
                </p>
            </div>
        </footer>

    </div>

    <!-- JS -->
    <script src="../js/ccj-global.js" defer></script>
    <script src="../js/ccg-mode-engine.js" defer></script>
    <script src="../js/load-single-game.js" defer></script>

</body>
</html>
