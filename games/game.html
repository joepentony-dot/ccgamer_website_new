<!DOCTYPE html>
<html lang="en" data-ccg-page="single-game">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="game-meta-title">Game | Cheeky Commodore Gamer</title>
    <meta name="description"
          id="game-meta-description"
          content="Full details for this Commodore 64 or Amiga game — including video, manual, screenshots and metadata.">

    <link rel="icon" href="../favicon.ico">

    <!-- REQUIRED FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../resources/css/ccg-master.css">
    <link rel="stylesheet" href="../resources/css/ccg-mode.css">
    <link rel="stylesheet" href="../resources/css/ccg-effects.css">
    <link rel="stylesheet" href="../resources/css/ccg-anim.css">
    <link rel="stylesheet" href="../resources/css/ccg-overlays.css">
    <link rel="stylesheet" href="../resources/css/ccg-modal.css">
    <link rel="stylesheet" href="../resources/css/ccg-socials.css">
    <link rel="stylesheet" href="../resources/css/ccg-cards.css">
    <link rel="stylesheet" href="../resources/css/games.css">
    <link rel="stylesheet" href="../resources/css/ccg-footer.css">
</head>

<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">

<div class="ccg-bg">
    <div class="ccg-bg-starfield"></div>
    <div class="ccg-bg-grid"></div>
    <div class="ccg-bg-crt-overlay"></div>
</div>

<div class="ccg-page ccg-page--single-game">
    <main class="ccg-main ccg-main--single-game">

        <!-- HERO -->
        <section class="game-hero">
            <div id="gameHeroBG" class="game-hero__bg"></div>

            <div class="game-hero__inner">
                <div class="game-hero__media">
                    <img id="gameHeroThumb"
                         class="game-hero__thumb"
                         alt=""
                         loading="lazy">
                </div>

                <div class="game-hero__content">
                    <h1 id="gameHeroTitle" class="game-hero__title"></h1>

                    <div class="game-hero__meta">
                        <span id="gameMetaYear" class="game-meta__item"></span>
                        <span class="game-meta__sep">•</span>
                        <span id="gameMetaSystem" class="game-meta__item"></span>
                        <span class="game-meta__sep">•</span>
                        <span id="gameMetaDeveloper" class="game-meta__item"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- DESCRIPTION -->
        <section id="game-description-section" class="game-section game-section--description" hidden>
            <h2 class="game-section__title">Overview</h2>
            <div class="game-description">
                <p id="gameDescription"></p>
            </div>
        </section>

        <!-- VIDEO -->
        <section id="game-video-section" class="game-section game-section--video" hidden>
            <h2 class="game-section__title">Gameplay Video</h2>
            <div class="game-video">
                <div class="game-video__embed">
                    <iframe id="game-video-embed" loading="lazy" allowfullscreen></iframe>
                </div>
                <div class="game-video__actions">
                    <a id="gameVideoBtn"
                       class="ccg-btn ccg-btn--secondary"
                       target="_blank"
                       hidden>
                        Watch on YouTube
                    </a>
                </div>
            </div>
        </section>

        <!-- MANUALS & DOWNLOADS -->
        <section class="game-section game-section--downloads" hidden>
            <h2 class="game-section__title">Manuals &amp; Downloads</h2>

            <div class="game-downloads">

                <!-- PRIMARY ACTIONS -->
                <div class="game-downloads__primary">

                    <a id="gameManualBtn"
                       class="ccg-btn ccg-btn--primary ccg-btn--icon ccg-btn--pdf"
                       href="#"
                       hidden>
                        <span class="ccg-btn__icon" aria-hidden="true"></span>
                        <span class="ccg-btn__label">View Manual (PDF)</span>
                    </a>

                    <a id="gameDiskBtn"
                       class="ccg-btn ccg-btn--primary ccg-btn--icon ccg-btn--download"
                       target="_blank"
                       hidden>
                        <span class="ccg-btn__icon" aria-hidden="true"></span>
                        <span class="ccg-btn__label">Play / Download</span>
                    </a>

                </div>

                <!-- SECONDARY / ARCHIVE -->
                <div class="game-downloads__secondary" id="gameArchiveLinks" hidden>
                    <span class="game-downloads__archive-label">Archive reference:</span>

                    <a id="gameLemonBtn"
                       class="ccg-btn ccg-btn--secondary ccg-btn--icon ccg-btn--lemon"
                       target="_blank">
                        <span class="ccg-btn__icon" aria-hidden="true"></span>
                        <span class="ccg-btn__label">Lemon64 Entry</span>
                    </a>
                </div>

                <p class="game-downloads__disclaimer">
                    Manuals and game files are provided for archival and educational purposes.
                    Please ensure you own the original media where required.
                </p>

            </div>
        </section>

        <!-- RELATED -->
        <section class="game-section game-section--related">
            <h2 class="game-section__title"></h2>
            <div id="relatedGamesGrid" class="ccg-cards-grid"></div>
        </section>

    </main>
</div>

<!-- MODAL -->
<div id="ccgModal" class="ccg-modal" aria-hidden="true">
    <button class="ccg-modal-nav ccg-modal-nav--prev" aria-label="Previous screenshot">‹</button>

    <div class="ccg-modal-content">
        <span class="ccg-modal-close" aria-label="Close modal">&times;</span>
        <iframe id="ccgModalFrame" class="ccg-pdf-frame" loading="lazy"></iframe>
    </div>

    <button class="ccg-modal-nav ccg-modal-nav--next" aria-label="Next screenshot">›</button>
</div>

<script src="../js/ccg-global.js" defer></script>
<script src="../js/ccg-mode-engine.js" defer></script>
<script src="../js/load-single-game.js" defer></script>

</body>
</html>
