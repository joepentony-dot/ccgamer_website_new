<!DOCTYPE html>
<html lang="en" data-page="genre">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cheeky Commodore Gamer | Casino Games</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="../../resources/css/ccg-master.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-effects.css" />
    <link rel="stylesheet" href="../../resources/css/ccg-mode.css" />
    <link rel="stylesheet" href="../../resources/css/home.css" />
    <link rel="stylesheet" href="../../resources/css/genre.css" />

    <link rel="icon" href="../../resources/CCG_FAVICON.png" />
</head>

<body data-page="genre" data-mode="c64" data-genre="casino-games">

<!-- FX LAYERS -->
<canvas id="starfield"></canvas>
<div class="crt-overlay"></div>
<div class="crt-glow"></div>
<div class="neon-grid"></div>

<div class="ccg-shell">

    <!-- HEADER / HUD -->
    <header class="ccg-hud">

        <div class="ccg-logo-wrap">
            <button class="ccg-logo-button" id="logoModeToggle">
                <img src="../../resources/CCGAMER LOGO.png" alt="CCG Logo" />
            </button>

            <div>
                <div class="ccg-logo-caption">CASINO GAMES</div>
                <div style="opacity:0.85; font-size:0.9rem;">Card sharks, high rollers and risky spins.</div>
            </div>
        </div>

        <div class="ccg-mode-status">
            <span id="currentModeText">SYSTEM MODE: C64 NEON</span>
        </div>

        <div class="ccg-hud-right">
            <div class="ccg-hud-right-line"><strong>CASINO BROWSER</strong></div>
            <div class="ccg-hud-right-line">STATUS: DEALING…</div>
        </div>

    </header>

    <!-- HERO PANEL -->
    <section class="ccg-panel ccg-panel--hero">

        <div class="ccg-panel-header">
            <div class="ccg-panel-title"><span>CASINO GAMES</span></div>
            <div class="ccg-panel-tag">Gamble & Play</div>
        </div>

        <div class="ccg-hero-text">
            Poker, blackjack, slot machines, roulette.
            <span class="ccg-hero-highlight">Try your luck — retro style.</span>
        </div>

        <div class="ccg-hero-actions">

            <button class="ccg-button" onclick="window.location.href='../../home.html'">
                <i class="fa-solid fa-house"></i> <span>Home Hub</span>
            </button>

            <button class="ccg-button" id="randomInGenreBtn">
                <i class="fa-solid fa-dice"></i> <span>Random Casino Game</span>
            </button>

            <button class="ccg-button" onclick="window.location.href='../index.html'">
                <i class="fa-solid fa-list"></i> <span>All Genres</span>
            </button>

        </div>

    </section>

    <!-- GAME GRID -->
    <section class="ccg-panel">

        <div class="ccg-panel-header">
            <div class="ccg-panel-title"><span>AVAILABLE TITLES</span></div>
            <div class="ccg-panel-tag" id="gameCount">Loading…</div>
        </div>

        <div class="ccg-grid" id="genreGamesGrid">
            <div>Loading games…</div>
        </div>

    </section>

    <!-- FOOTER -->
    <footer class="ccg-footer">
        <div>© <span id="ccgYear"></span> Cheeky Commodore Gamer</div>
        <div>Casino Games Browser</div>
    </footer>

</div>

<!-- JS -->
<script src="../../js/ccg-mode-engine.js"></script>
<script src="../../js/ccj-global.js"></script>
<script src="../../js/genre-loader.js"></script>

<script>
(function () {

    const body = document.body;
    const modeText = document.getElementById("currentModeText");
    const logo = document.getElementById("logoModeToggle");
    const year = document.getElementById("ccgYear");
    const genreSlug = body.dataset.genre;
    const grid = document.getElementById("genreGamesGrid");
    const count = document.getElementById("gameCount");
    const randomBtn = document.getElementById("randomInGenreBtn");

    if (year) year.textContent = new Date().getFullYear();

    /* MODE SWITCHING */
    function updateModeLabel() {
        if (!window.CCGModeEngine || !modeText) return;
        modeText.textContent =
            "SYSTEM MODE: " + window.CCGModeEngine.getMode().toUpperCase() + " NEON";
    }

    if (logo) {
        logo.addEventListener("click", () => {
            if (!window.CCGModeEngine) return;
            window.CCGModeEngine.toggleMode();
            updateModeLabel();
        });
    }
    updateModeLabel();

    /* LOAD GAMES */
    if (typeof window.loadGenreGames === "function") {
        window.loadGenreGames(genreSlug, grid, count);
    } else {
        count.textContent = "Loader missing";
    }

    /* RANDOM GAME */
    if (randomBtn) {
        randomBtn.addEventListener("click", async () => {

            if (typeof window.randomGameInGenre === "function") {
                window.randomGameInGenre(genreSlug);
                return;
            }

            try {
                const res = await fetch("../games.json", { cache: "no-cache" });
                const data = await res.json();
                const games = Array.isArray(data) ? data : (data.games || []);

                const filtered = games.filter(g =>
                    (g.genreSlug === genreSlug) ||
                    (g.genres && g.genres.includes("Casino")) ||
                    (g.genre && g.genre.toLowerCase().includes("casino"))
                );

                const list = filtered.length ? filtered : games;
                const game = list[Math.floor(Math.random() * list.length)];

                if (game && game.id) {
                    window.location.href = "../game.html?id=" + encodeURIComponent(game.id);
                }

            } catch (err) {
                console.error("Random casino game error", err);
            }
        });
    }

    /* STARFIELD */
    const canvas = document.getElementById("starfield");
    if (canvas && canvas.getContext) {

        const ctx = canvas.getContext("2d");

        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;

        const STAR_COUNT = 120;
        const stars = [];

        function initStars() {
            stars.length = 0;

            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    z: Math.random() * 0.8 + 0.2,
                    speed: Math.random() * 0.5 + 0.2
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            const mode = body.dataset.mode || "c64";
            let base = "rgba(112,255,240,";   // C64 cyan
            if (mode === "amiga") base = "rgba(255,210,111,";  // warm Amiga
            if (mode === "zx") base = "rgba(0,255,0,";  // ZX green

            for (const s of stars) {
                s.y += s.speed * (0.5 + s.z);

                if (s.y > h) {
                    s.y = 0;
                    s.x = Math.random() * w;
                    s.z = Math.random() * 0.8 + 0.2;
                }

                const size = s.z * 2;
                const alpha = 0.3 + s.z * 0.7;

                ctx.fillStyle = base + alpha.toFixed(2) + ")";
                ctx.fillRect(s.x, s.y, size, size);
            }

            requestAnimationFrame(draw);
        }

        initStars();
        draw();

        window.addEventListener("resize", () => {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            initStars();
        });
    }

})();
</script>

</body>
</html>
