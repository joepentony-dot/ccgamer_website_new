<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Games | Cheeky Commodore Gamer</title>

    <link rel="icon" href="../../favicon.ico">
    <!-- Core Styles -->
    <link rel="stylesheet" href="../../css/engine.css">
    <link rel="stylesheet" href="../../css/ccg-master.css">
    <link rel="stylesheet" href="../../css/ccg-genres.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="mode-c64" data-genre="arcade">
<div class="ccg-shell genre-shell">
    <header class="ccg-header neon-header">
        <a href="../../home.html" class="ccg-logo-link">
            <img src="../../resources/CCGAMER LOGO.png" alt="Cheeky Commodore Gamer" class="ccg-logo">
        </a>
        <div class="ccg-header-text">
            <h1 class="ccg-title">Arcade Games</h1>
            <p class="ccg-subtitle">
                Hyper-neon arcade hits for C64 &amp; Amiga — pure joystick joy.
            </p>
        </div>
        <button id="mode-toggle" class="mode-toggle-btn">C64 MODE</button>
    </header>

    <nav class="ccg-breadcrumb">
        <a href="../../home.html" class="crumb-link">🏠 Game Hub</a>
        <span class="crumb-separator">/</span>
        <span class="crumb-current">Arcade</span>
    </nav>

    <main class="ccg-main">
        <section class="genre-hero">
            <div class="hero-text">
                <h2 id="genre-label" class="genre-label">Arcade</h2>
                <p class="genre-description">
                    Quick-fire blasts, high scores, and one-more-go greatness.
                </p>
            </div>
            <div class="hero-glow-panel">
                <span class="hero-tag">FAST ACTION</span>
                <span class="hero-tag">HIGH SCORES</span>
                <span class="hero-tag">INSTANT FUN</span>
            </div>
        </section>

        <section id="game-list" class="game-grid" aria-live="polite">
            <!-- Filled by genre-loader.js -->
        </section>

        <section id="pagination" class="pagination">
            <!-- Filled by genre-loader.js -->
        </section>
    </main>

    <footer class="ccg-footer">
        <p>Cheeky Commodore Gamer · Arcade Classics • C64 &amp; Amiga 😇🕹️👌</p>
    </footer>
</div>

<script src="../../js/genre-loader.js"></script>
</body>
</html>
