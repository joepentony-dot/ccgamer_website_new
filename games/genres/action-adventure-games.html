<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Adventure Games | Cheeky Commodore Gamer</title>

    <link rel="icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../css/engine.css">
    <link rel="stylesheet" href="../../css/ccg-master.css">
    <link rel="stylesheet" href="../../css/ccg-genres.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="mode-c64" data-genre="action-adventure">
<div class="ccg-shell genre-shell">
    <header class="ccg-header neon-header">
        <a href="../../home.html" class="ccg-logo-link">
            <img src="../../resources/CCGAMER LOGO.png" alt="Cheeky Commodore Gamer" class="ccg-logo">
        </a>
        <div class="ccg-header-text">
            <h1 class="ccg-title">Action Adventure Games</h1>
            <p class="ccg-subtitle">
                Explore, fight, loot, repeat — epic journeys on 8 &amp; 16-bit.
            </p>
        </div>
        <button id="mode-toggle" class="mode-toggle-btn">C64 MODE</button>
    </header>

    <nav class="ccg-breadcrumb">
        <a href="../../home.html" class="crumb-link">🏠 Game Hub</a>
        <span class="crumb-separator">/</span>
        <span class="crumb-current">Action Adventure</span>
    </nav>

    <main class="ccg-main">
        <section class="genre-hero">
            <div class="hero-text">
                <h2 id="genre-label" class="genre-label">Action Adventure</h2>
                <p class="genre-description">
                    Story-driven quests with plenty of sword-swinging and peril.
                </p>
            </div>
            <div class="hero-glow-panel">
                <span class="hero-tag">EPIC QUESTS</span>
                <span class="hero-tag">EXPLORATION</span>
                <span class="hero-tag">COMBAT</span>
            </div>
        </section>

        <section id="game-list" class="game-grid" aria-live="polite"></section>
        <section id="pagination" class="pagination"></section>
    </main>

    <footer class="ccg-footer">
        <p>Cheeky Commodore Gamer · Action Adventure Greats 😇🕹️👌</p>
    </footer>
</div>

<script src="../../js/genre-loader.js"></script>
</body>
</html>
