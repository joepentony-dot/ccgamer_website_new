    <meta name="description" content="Ace of Aces is a 1986 Commodore 64 World War II flight combat game published by Accolade. Played from a first-person cockpit view, it places the player in control of a British RAF Mosquito fighter-bomber on a series of combat missions. Objectives include intercepting V-1 flying bombs, attacking trains and U-boats, and engaging enemy aircraft, combining arcade action with light simulation elements. The game is widely remembered for its cinematic presentation and immersive atmosphere on the C64." />
