<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/analytics.js"></script>
  <title>Forgot Password | CCG Auth</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div id="authStatusBadge" class="auth-badge" aria-live="polite"></div>

    <section class="auth-card">
      <h1>Forgot Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link.</p>

      <form id="forgotForm" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div id="formMessage" class="auth-message" aria-live="polite"></div>

        <button type="submit" class="auth-btn">Send Reset Email</button>
      </form>

      <nav class="auth-links">
        <a href="./login.html">Back to login</a>
        <a href="./register.html">Create account</a>
      </nav>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>

  <script type="module">
    import { sendPasswordReset } from '../resources/js/auth/auth-core.js';
    import { byId, setMessage } from '../resources/js/auth/ui-helpers.js';
    import { initAuthBadge } from '../resources/js/auth/auth-status.js';

    const form = byId('forgotForm');
    const message = byId('formMessage');

    initAuthBadge();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage(message, 'Sending reset email...', 'info');

      const email = byId('email').value;
      const redirectTo = 'https://www.cheekycommodoregamer.co.uk/auth/reset.html';

      const { error } = await sendPasswordReset(email, redirectTo);

      if (error) {
        setMessage(message, error.message || 'Unable to send reset email right now.', 'error');
        if (error.detail) {
          console.error('[CCG-AUTH] forgot-ui', { category: error.category, detail: error.detail });
        }
        return;
      }

      setMessage(message, 'Password reset email sent. Please check your inbox.', 'success');
    });
  </script>
</body>
</html>
