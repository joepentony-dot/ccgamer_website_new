<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | CCG Auth</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div id="authStatusBadge" class="auth-badge" aria-live="polite"></div>

    <section class="auth-card">
      <h1>Login</h1>
      <p class="auth-subtitle">Access your account with email and password.</p>

      <form id="loginForm" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password"></button>
          </div>
        </div>

        <div id="formMessage" class="auth-message" aria-live="polite"></div>

        <button type="submit" class="auth-btn">Log In</button>
      </form>

      <nav class="auth-links">
        <a href="./register.html">Create account</a>
        <a href="./forgot.html">Forgot password?</a>
      </nav>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>

  <script type="module">
    import { getCurrentUser, loginUser } from '../resources/js/auth/auth-core.js';
    import { attachPasswordToggle, byId, setMessage } from '../resources/js/auth/ui-helpers.js';
    import { initAuthBadge } from '../resources/js/auth/auth-status.js';

    const form = byId('loginForm');
    const message = byId('formMessage');
    const toggleBtn = byId('togglePassword');
    const passwordInput = byId('password');
    let hasRedirected = false;

    function getSafeReturnPath() {
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get('returnTo');

      if (!returnTo || !returnTo.startsWith('/')) {
        return '/';
      }

      const target = new URL(returnTo, window.location.origin);
      const currentPath = `${window.location.pathname}${window.location.search}`;
      const targetPath = `${target.pathname}${target.search}`;

      if (targetPath === currentPath) {
        return '/';
      }

      return returnTo;
    }

    function redirectAfterLogin() {
      if (hasRedirected) {
        return;
      }

      hasRedirected = true;
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get('returnTo');
      if (returnTo && returnTo.startsWith('/')) {
        window.location.replace(getSafeReturnPath());
      } else {
        window.location.replace('/');
      }
    }

    async function redirectIfAlreadyAuthenticated() {
      try {
        const currentUser = await getCurrentUser();
        if (currentUser) {
          redirectAfterLogin();
        }
      } catch (_error) {
        // Silent fallback: user can still login manually.
      }
    }

    attachPasswordToggle(toggleBtn, passwordInput);
    initAuthBadge();
    redirectIfAlreadyAuthenticated();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage(message, 'Signing in...', 'info');

      const email = byId('email').value;
      const password = byId('password').value;

      const { error } = await loginUser(email, password);

      if (error) {
        setMessage(message, error.message || 'Unable to login right now.', 'error');
        if (error.detail) {
          console.error('[CCG-AUTH] login-ui', { category: error.category, detail: error.detail });
        }
        return;
      }

      setMessage(message, 'Login successful.', 'success');
      redirectAfterLogin();
    });
  </script>
</body>
</html>
