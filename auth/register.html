<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register | CCG Auth</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div id="authStatusBadge" class="auth-badge" aria-live="polite"></div>

    <section class="auth-card">
      <h1>Create Account</h1>
      <p class="auth-subtitle">Register using a secure email + password account.</p>

      <form id="registerForm" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password"></button>
          </div>
        </div>

        <div id="formMessage" class="auth-message" aria-live="polite"></div>

        <button type="submit" class="auth-btn">Register</button>
      </form>

      <nav class="auth-links">
        <a href="./login.html">Already have an account? Log in</a>
        <a href="./forgot.html">Forgot password?</a>
      </nav>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>

  <script type="module">
    import { registerUser } from '../resources/js/auth/auth-core.js';
    import { attachPasswordToggle, byId, setMessage } from '../resources/js/auth/ui-helpers.js';
    import { initAuthBadge } from '../resources/js/auth/auth-status.js';

    const form = byId('registerForm');
    const message = byId('formMessage');

    attachPasswordToggle(byId('togglePassword'), byId('password'));
    initAuthBadge();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage(message, 'Creating account...', 'info');

      const email = byId('email').value;
      const password = byId('password').value;

      const { data, error } = await registerUser(email, password);

      if (error) {
        const duplicate = error.category === 'duplicate_email';
        if (duplicate) {
          message.innerHTML = 'Already registered. <a href="./forgot.html">Reset your password</a>.';
          message.classList.remove('is-success', 'is-info');
          message.classList.add('is-error');
        } else {
          setMessage(message, error.message || 'Unable to create account right now.', 'error');
        }
        if (error.detail) {
          console.error('[CCG-AUTH] register-ui', { category: error.category, detail: error.detail });
        }
        return;
      }

      if (data?.user && !data?.session) {
        setMessage(
          message,
          'Registration successful. Check your email to confirm your account before logging in.',
          'success'
        );
        return;
      }

      setMessage(message, 'Registration successful and signed in.', 'success');
    });
  </script>
</body>
</html>
