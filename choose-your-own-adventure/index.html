<script type="application/json" id="story-data">{"s001":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"living","title":"1983. Your brother. And trouble waiting to happen.","body":["Britain, 1983. Saturday afternoon. The telly takes ages to warm up, you can hear your brother in the next room, and somebody in the house has said the words “home computer”. Everything stops.","You don't know it yet, but this decision will lead to arcade triumphs, family arguments, romantic disasters, cassette-loading torture and, a few years down the line, a notorious game called Friday the 13th. There will be fake blood. There will be tears. You will never hear the end of it.","First, though, you have a more immediate problem: how do you get your hands on a Commodore 64?"],"choices":[{"label":"See what your brother knows","to":"s002","sub":"He looks suspiciously well informed.","effect":"b+1"},{"label":"Go to the newsagent","to":"s003","sub":"There is an entire shelf of temptation.","effect":""},{"label":"Ask around at school","to":"s004","sub":"The playground has already chosen sides.","effect":"r+1"}],"caption":"The first page of a very long argument.","item":"C64 OR NOTHING","photo":""},"s002":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"living","title":"Your brother has opinions","body":["Your brother is sitting cross-legged in front of the television with a magazine. He points at a photograph of a beige computer as though he's discovered buried treasure.","“That's the Commodore 64,” he says. “And we're not getting one if you spend all your money on sweets.” You were not aware your sweet consumption was under investigation. His argument is irritatingly sound.","He also promises to show you some games when you finally get one. At this point, you still trust him. That will change."],"choices":[{"label":"Join him at the computer shop","to":"s005","sub":"Put theory to the test.","effect":"b+1"},{"label":"Mock his computer obsession","to":"s006","sub":"A risky opening move.","effect":"b-2,r+1"},{"label":"Start saving immediately","to":"s011","sub":"Your pocket money needs a plan.","effect":"m+1"}],"caption":"Older brothers: educational, occasionally dangerous.","item":"BROTHER +1","photo":""},"s003":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"news","title":"A newsagent full of impossible dreams","body":["The computer magazines are lined up between football comics and publications you are definitely not supposed to browse. Bright screenshots promise worlds you can't yet afford.","You unfold a poster, nearly knock over a display of birthday cards and decide you must have a computer, preferably before Christmas. The shopkeeper starts watching you with the expression reserved for children who have been reading the same magazine for twenty minutes."],"choices":[{"label":"Read about the Commodore 64","to":"s005","sub":"The bigger colour screenshots win you over.","effect":"r+1"},{"label":"Listen to a Spectrum evangelist","to":"s010","sub":"A rubber-keyed sales pitch.","effect":""},{"label":"Pocket your change and make a plan","to":"s011","sub":"Every 10p counts.","effect":"m+1"}],"caption":"A whole universe for the price of a magazine.","item":"NEWSPAPER","photo":""},"s004":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"school","title":"The playground computer war","body":["By first break the playground has split into two factions. One boy says the Spectrum is the future. Another says the Commodore has better sound. A third claims his uncle owns a computer from NASA. Nobody asks to see it.","Your potential reputation is at stake, though the main requirement for survival is getting through double maths without a detention."],"choices":[{"label":"Defend the C64","to":"s005","sub":"Make your allegiance known.","effect":"r+2"},{"label":"Pretend the Spectrum is just as good","to":"s010","sub":"The beginning of a regrettable compromise.","effect":"r-1"},{"label":"Make a deal with your brother","to":"s002","sub":"He might help you make the case.","effect":"b+1"}],"caption":"The war was fought with playground rumours.","item":"C64 VS 48K","photo":""},"s005":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"shop","title":"The computer shop","body":["Two machines sit on the demonstration table: a real Commodore 64 with its reassuring chunky keys, and a Sinclair ZX Spectrum with a rubber keyboard that feels as though somebody has cut it from an old car mat.","The salesman says both are excellent. He's professionally obliged to say that. You hear a C64 game making noises from the far end of the shop and instinctively turn your head.","Then comes the question. Which one do you actually want?"],"choices":[{"label":"Ask to try the Commodore 64","to":"s009","sub":"Hear the SID chip for yourself.","effect":"r+1"},{"label":"Give the Spectrum a fair chance","to":"s015","sub":"It can only get worse from here.","effect":""},{"label":"Ask what it all costs","to":"s011","sub":"You're about to learn a harsh lesson.","effect":""}],"caption":"The choice that starts the whole argument.","item":"SHOWROOM","photo":"c64"},"s006":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"living","title":"An early lesson about older brothers","body":["You tell your brother the computer obsession is getting a bit silly. He looks wounded for approximately two seconds, then begins describing all the things he will refuse to let you play once the machine arrives.","For the rest of the afternoon he calls you “Mr Calculator”. He promises he can scare you with a computer game one day. You laugh. He smiles. Something about that smile should concern you."],"choices":[{"label":"Apologise and join forces","to":"s005","sub":"You need his help.","effect":"b+2"},{"label":"Declare yourself the real gaming expert","to":"s008","sub":"This could backfire.","effect":"r+1,b-1"}],"caption":"He has already started plotting.","item":"SIBLING RIVALRY","photo":""},"s008":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"school","title":"The expert with no computer","body":["At school you confidently explain what the best home computer can do. The teacher asks which machine you own. You say, “Not yet.” The class finds this more entertaining than you had anticipated.","A girl two desks away asks whether you'd like to borrow a pencil. Your dignity has suffered its first major casualty."],"choices":[{"label":"Get to the showroom at last","to":"s005","sub":"Evidence beats bluffing.","effect":""},{"label":"Work for the money","to":"s020","sub":"Less talking, more earning.","effect":"m+1"}],"caption":"An authority on the subject, with no equipment.","item":"REPUTATION -1","photo":""},"s009":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"c64","title":"The first touch of a C64","body":["The keyboard is solid beneath your fingers. The blue screen appears. The shop assistant types a command and a cheerful sound bursts from the speaker.","Your brother gives you a look that says, “See?” You don't even try to argue. This is the machine you want. The small problem of paying for it has not gone away."],"choices":[{"label":"Take the C64 case to your parents","to":"s012","sub":"A difficult sales meeting awaits.","effect":"b+1"},{"label":"Ask the salesman to demonstrate another game","to":"s013","sub":"Just five more minutes.","effect":"r+1"},{"label":"Price up a game as well","to":"s014","sub":"A second financial catastrophe.","effect":""}],"caption":"Beige plastic. Blue screen. An obsession begins.","item":"THE REAL THING","photo":"c64"},"s010":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"spectrum","title":"A dangerous idea","body":["A boy with a ZX Spectrum assures you the rubber keys “take a bit of getting used to”. He says this while struggling to type a simple command and accidentally setting off a long string of beeps.","The price is tempting. But a cheaper mistake is still a mistake, and your brother's face has gone pale."],"choices":[{"label":"Try the Spectrum yourself","to":"s015","sub":"For the sake of fairness.","effect":"n-1"},{"label":"Buy one to save money","to":"s016","sub":"You may regret this for years.","effect":"r-2,b-2"},{"label":"Back away and choose the C64","to":"s009","sub":"There is still time.","effect":"n+1"}],"caption":"A terrible idea comes in a compact black case.","item":"DANGER","photo":"spectrum"},"s011":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"money","title":"The great pocket-money audit","body":["Your savings consist of some coins, a bus ticket, a marble and a button you can't account for. The Commodore 64 is well outside your purchasing power.","Your brother offers to help if you do something other than ask for money every six minutes. A notebook becomes your financial headquarters. You write C64 FUND in enormous letters. Underneath, you write “SWEETS — NONE”. This lasts until Tuesday."],"choices":[{"label":"Do jobs around the house","to":"s017","sub":"Hard labour for a few quid.","effect":"m+2"},{"label":"Try the Saturday market","to":"s018","sub":"There might be a cheaper route.","effect":"m+1"},{"label":"Pitch your parents an investment opportunity","to":"s012","sub":"You have a presentation.","effect":""},{"label":"Ask your brother for a small loan","to":"s019","sub":"A very informal finance arrangement.","effect":"b+1"}],"caption":"Every penny has its own dramatic importance.","item":"POCKET MONEY","photo":""},"s012":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"kitchen","title":"The parental finance committee","body":["Mum listens to your proposal while making tea. Dad asks whether it will help you with your schoolwork. Your brother immediately volunteers to explain the educational advantages of computer games.","You describe programming, typing and a wonderful new world of learning. Nobody mentions that your current ambition is to spend six hours shooting things on the television.","The committee requests evidence of responsibility. In other words: chores."],"choices":[{"label":"Offer to earn a share of the price","to":"s020","sub":"Work and negotiation.","effect":"m+2,r+1"},{"label":"Let your brother do the convincing","to":"s021","sub":"A united front.","effect":"b+2"},{"label":"Throw an enormous tantrum","to":"e03","sub":"That always works on television.","effect":"r-3"}],"caption":"A schoolwork argument is wheeled out for the first time.","item":"NEGOTIATIONS","photo":""},"s013":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"shop","title":"One more demonstration","body":["The assistant loads another C64 demonstration. Your brother is practically standing inside the television, listening to the sound.","A woman walks in and asks to see the Spectrum. The assistant looks between the two families like a referee who has lost control of the match."],"choices":[{"label":"Commit to the C64","to":"s012","sub":"Time to persuade the adults.","effect":"r+1"},{"label":"Ask about second-hand computers","to":"s024","sub":"There may be another way.","effect":""},{"label":"Try the Spectrum instead","to":"s015","sub":"What could possibly go wrong?","effect":""}],"caption":"You can almost hear the future calling.","item":"DEMO UNIT","photo":"c64"},"s014":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"tape","title":"The price of happiness","body":["The game cassette is smaller than you expected. The price on it is not. Even if you persuade your family to buy the computer, you won't have a fortune left for games.","Your brother suggests swapping games with friends and saving for special purchases. You imagine owning shelves of cassettes. The shopkeeper imagines you leaving the counter."],"choices":[{"label":"Save for the computer first","to":"s011","sub":"One crisis at a time.","effect":""},{"label":"Ask about cheaper games","to":"s027","sub":"You don't need the most expensive one.","effect":""},{"label":"Look for a used machine","to":"s024","sub":"Maybe the market can help.","effect":""}],"caption":"Even a cassette has become a luxury item.","item":"EMPTY WALLET","photo":"tape"},"s015":{"year":"1983","chapter":"01 · THE FIRST SPARK","theme":"spectrum","title":"Rubber-keyed reality","body":["You sit down at the Spectrum. The rubber keys are strange, the display flashes, and somehow the keyboard seems to be conducting a private argument with your fingertips.","You accidentally erase the programme the salesman was showing. He says it's fine. The veins in his forehead suggest otherwise. Your brother silently points at the C64."],"choices":[{"label":"Admit defeat and return to the C64","to":"s009","sub":"A sensible escape route.","effect":"n+1"},{"label":"Insist the Spectrum is actually better","to":"e02","sub":"Pride before an almighty fall.","effect":"r-3"},{"label":"Order the Spectrum anyway","to":"s016","sub":"A financial and emotional error.","effect":"b-2"}],"caption":"The first test does not go well.","item":"SPECTRUM TRAP","photo":"spectrum"},"s016":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"spectrum","title":"The bargain that costs everything","body":["You proudly carry the ZX Spectrum home. Your brother stares at the box as if you've brought home a garden hose instead of a computer.","You spend the evening trying to convince yourself you made the right decision. Every time the television makes a noise, you wonder what it would have sounded like on the Commodore."],"choices":[{"label":"Double down on your decision","to":"e01","sub":"The rubber-key years begin.","effect":""},{"label":"Admit the mistake before opening everything","to":"s028","sub":"Maybe the shop will accept a return.","effect":"r-2"}],"caption":"Two words: buyer’s remorse.","item":"WRONG COMPUTER","photo":"spectrum"},"s017":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"kitchen","title":"Saturday: paid employment","body":["You clean the car, tidy the garage and discover an object under the sofa that may once have been a sandwich. Your brother offers helpful commentary from the doorway without moving a muscle.","You finish exhausted and richer by a few precious pounds. Mum says the effort counts. You decide not to reveal that you have already allocated every penny to computer-related expenses."],"choices":[{"label":"Take your earnings to the second-hand stall","to":"s024","sub":"Make the money go further.","effect":"m+2"},{"label":"Show your parents how serious you are","to":"s021","sub":"Look, actual responsibility.","effect":"r+1"},{"label":"Buy a game first, somehow","to":"s023","sub":"Temptation is difficult to resist.","effect":""}],"caption":"The road to 64K runs through the garage.","item":"WAGES EARNED","photo":""},"s018":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"market","title":"Saturday market: treasure and tat","body":["The market has everything: socks, fruit, second-hand toys, suspect batteries and a stall run by a bloke who claims every computer he sells is “fully tested”.","A Commodore 64 sits on a folding table between a travel iron and three alarm clocks. You have never wanted an item on a folding table more in your life."],"choices":[{"label":"Talk to the seller about the C64","to":"s025","sub":"Ask some difficult questions.","effect":"r+1"},{"label":"Buy the suspiciously cheap tape bundle","to":"s027","sub":"A gamble on five cassettes.","effect":"m-1"},{"label":"Go home and earn more money","to":"s020","sub":"Less glamorous, more sensible.","effect":"m+1"}],"caption":"The Saturday market is an adventure in itself.","item":"MARKET DAY","photo":"c64"},"s019":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"kitchen","title":"The great borrowing scheme","body":["You ask your brother whether you can borrow his savings. He asks what collateral you propose. You offer your football stickers. He says he'd rather have an actual football.","The idea of owing your brother money is troubling. Not because he will charge interest, but because he will remember it forever."],"choices":[{"label":"Agree to repay him through chores","to":"s026","sub":"A risky family loan.","effect":"b+1,m+2"},{"label":"Change your mind and ask your parents","to":"s012","sub":"Less interest, more lectures.","effect":""},{"label":"Give up on the dream","to":"e04","sub":"A very short adventure.","effect":""}],"caption":"Bank of Brother is open. Terms apply.","item":"FAMILY LOAN","photo":""},"s020":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"kitchen","title":"One more job, one more coin","body":["You wash up, sweep the kitchen and volunteer for a task nobody has ever volunteered for before: cleaning the skirting boards.","Dad examines your handiwork. Mum examines the skirting boards. The verdict is a qualified success. Your brother says you missed a bit behind the cupboard."],"choices":[{"label":"Try again with your parents","to":"s022","sub":"They've noticed the effort.","effect":"m+2,r+1"},{"label":"Check the second-hand market","to":"s024","sub":"More cash means more options.","effect":"m+2"},{"label":"Quit in protest","to":"e04","sub":"This is going nowhere.","effect":"r-2"}],"caption":"There was never a more determined cleaner.","item":"MORE SAVINGS","photo":""},"s021":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"kitchen","title":"The family pact","body":["Your brother sits beside you when Mum and Dad call you in. He promises to teach you the basics. You promise not to treat the living-room television like a personal possession. Everyone pretends to believe this.","The family agrees to help you towards a Commodore 64, provided you're sensible, share it and do your schoolwork. It sounds fair. You agree much too quickly."],"choices":[{"label":"Accept the conditions","to":"s022","sub":"The best deal of your childhood.","effect":"b+2,r+1"},{"label":"Demand a disk drive as well","to":"e03","sub":"Let's see how that goes.","effect":"r-3"}],"caption":"A momentous deal is struck around the kitchen table.","item":"DEAL DONE","photo":""},"s022":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"c64","title":"There it is. The Commodore 64.","body":["The box comes home. A genuine Commodore 64. Your brother carries it through the front door like a priceless artefact. You follow with the cables and a face that has forgotten how to behave normally.","The television flickers, the blue screen appears, and the room becomes your favourite place in the entire world. The first time you hear sound from the machine you can hardly believe the noise is coming from a home computer.","Whatever happens next, you've made the right choice. Well, mostly. You still have an older brother."],"choices":[{"label":"Load the first cassette","to":"s029","sub":"A new form of patience awaits.","effect":"b+1"},{"label":"Learn a little BASIC","to":"s030","sub":"Perhaps Dad was onto something.","effect":"r+1"},{"label":"Invite a mate over","to":"s031","sub":"Show the world your triumph.","effect":"r+1"}],"caption":"The authentic 1982-era Commodore 64. The dream is real.","item":"64K OF MAGIC","photo":"c64"},"s023":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"tape","title":"The game you can't play","body":["You buy a cheap game cassette before you own a computer. At home you examine the cover for so long that the corners begin to curl.","Your brother says, “You do realise you can't load it into the telly?” You tell him it's called planning ahead. He calls it something else."],"choices":[{"label":"Take it to your brother and discuss the C64","to":"s022","sub":"The family finally makes it happen.","effect":"m-1,b+1"},{"label":"Ask the market seller for a trade","to":"s024","sub":"Maybe the cassette has value.","effect":""}],"caption":"An entire game, entirely unplayable.","item":"GAMELESS","photo":"tape"},"s024":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"market","title":"The used-machine negotiation","body":["The seller claims the C64 works beautifully. You ask him to demonstrate it. He attempts to locate the power supply in a box of cassette players and Christmas lights.","Your brother has come along to inspect the machine and asks about the keyboard, picture and ports. For once, having him around feels like a remarkable advantage."],"choices":[{"label":"Insist on seeing it working","to":"s022","sub":"And walk away if he can't.","effect":"b+1,r+1"},{"label":"Trust the seller's smile","to":"e06","sub":"A bargain with a catch.","effect":"m-2"},{"label":"Buy the cheaper Spectrum on the next stall","to":"s028","sub":"Some temptations are dangerous.","effect":""}],"caption":"Always make them plug it in.","item":"SECOND-HAND","photo":"c64"},"s025":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"market","title":"The trader's great offer","body":["The trader offers to throw in two unidentified cassettes and a joystick with a worrying amount of tape around the handle. He says the joystick “just needs a dab of glue”.","A genuine C64 is on the table, but so is the possibility of taking home a very expensive ornament."],"choices":[{"label":"Take your brother's advice and test it","to":"s022","sub":"Worth the extra five minutes.","effect":"b+1"},{"label":"Buy everything without checking","to":"e06","sub":"Nothing ventured, nothing working.","effect":"r-1"},{"label":"Choose the rubber-keyed alternative","to":"s028","sub":"The stallholder gets excited.","effect":""}],"caption":"A bargain is only a bargain if it turns on.","item":"THE HAGGLE","photo":""},"s026":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"living","title":"The loan agreement","body":["Your brother loans you his money on one condition: he gets first go on the computer twice a week. He pretends this is a generous offer. It's a hostage situation written on the back of a cereal packet.","Still, you've got enough help to make the family C64 plan work."],"choices":[{"label":"Accept the deal and bring home the C64","to":"s022","sub":"The pact is sealed.","effect":"b+2"},{"label":"Refuse to share anything","to":"e04","sub":"The loan is immediately withdrawn.","effect":"b-3"}],"caption":"A sibling contract. Not legally enforceable, but terrifying.","item":"DEBT OWED","photo":""},"s027":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"tape","title":"The £2 cassette gamble","body":["The market stall offers three games for the price of one. One cassette has no label, the second looks as though it's survived a house fire, and the third has “GOOD GAME” written on it in pencil.","You're tempted. Your wallet is not."],"choices":[{"label":"Keep the money for the C64","to":"s022","sub":"A rare sensible decision.","effect":"m+1"},{"label":"Buy the mystery bundle","to":"s023","sub":"It might actually work.","effect":"m-2"}],"caption":"You cannot judge a game by handwritten labels.","item":"MYSTERY TAPE","photo":"tape"},"s028":{"year":"1983","chapter":"02 · THE MONEY PROBLEM","theme":"spectrum","title":"Return of the rubber-keyed mistake","body":["The Spectrum sits in its box while you rehearse your return speech. The salesman asks whether anything is wrong. You begin to explain the keyboard, the sound and the terrible feeling of having ignored the C64.","He looks at you with the patience of a man who has heard all this before."],"choices":[{"label":"Trade towards the Commodore 64","to":"s022","sub":"You recover, barely.","effect":"r+1,b+1"},{"label":"Keep the Spectrum out of stubbornness","to":"e05","sub":"An historic error becomes permanent.","effect":"r-3"}],"caption":"Sometimes the greatest victory is admitting defeat.","item":"LAST CHANCE","photo":"spectrum"},"s029":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"tape","title":"PRESS PLAY ON TAPE","body":["You type LOAD, press RETURN and obey the message. The Datasette starts turning. The room falls silent. You and your brother watch coloured lines as if the fate of the nation depends on them.","Five minutes later, the tape is still going. You ask whether this is normal. Your brother says yes. Three minutes after that, you begin to wonder whether you've aged into adulthood."],"choices":[{"label":"Keep waiting","to":"s032","sub":"Hope is a powerful thing.","effect":"n+1"},{"label":"Stop it and fiddle with the tape head","to":"s033","sub":"An experimental approach.","effect":"n-1"},{"label":"Ask your brother what to do","to":"s036","sub":"Older-sibling technical support.","effect":"b+1"}],"caption":"The most famous instruction in C64 history.","item":"PRESS PLAY","photo":"datasette"},"s030":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"code","title":"Ten lines of BASIC, endless ambition","body":["Dad is delighted you've opened the programming manual. You type a tiny programme that prints your name in a loop. When it works you feel like a genius. When your brother types RUN again it fills the screen with your name for the next three minutes.","You are, technically, developing software. You would quite like to develop a game in which your brother loses."],"choices":[{"label":"Build a game to annoy your brother","to":"s034","sub":"Revenge through programming.","effect":"r+1"},{"label":"Return to the joy of cassette games","to":"s032","sub":"Enough education for today.","effect":""},{"label":"Show a girl at school your creation","to":"s038","sub":"A risky social experiment.","effect":"r-1"}],"caption":"Everyone begins somewhere: 10 PRINT.","item":"READY.","photo":"c64"},"s031":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"living","title":"Your first audience","body":["You invite a friend round to admire the C64. He brings a Spectrum magazine and asks whether it was really worth the extra money. Your brother turns up precisely as the title music begins.","Nobody says much for the next minute. The friend eventually asks whether he can have a go. This is as close to an apology as you're getting."],"choices":[{"label":"Arrange a gaming contest","to":"s039","sub":"Settle things properly.","effect":"r+2"},{"label":"Talk about it at school","to":"s035","sub":"Your reputation is improving.","effect":"r+1"},{"label":"Make your brother share the joystick","to":"s036","sub":"A diplomatic crisis.","effect":"b-1"}],"caption":"The C64 does some of the arguing for you.","item":"VISITORS","photo":"c64"},"s032":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"crt","title":"A game finally loads","body":["The cassette stops. A title screen appears. MUSIC! COLOUR! MOVEMENT! You and your brother turn to each other with the kind of look usually reserved for a winning lottery ticket.","The opening sequence lasts barely a minute before one of you runs out of lives. You immediately demand another go. He reminds you that you've already been playing for an hour — of which most was loading."],"choices":[{"label":"Take the triumph to school","to":"s035","sub":"They have to hear about this.","effect":"r+2"},{"label":"Challenge your brother","to":"s036","sub":"One joystick, two opinions.","effect":"b+1"},{"label":"Look for a better game at the market","to":"s037","sub":"Your collection begins here.","effect":"m-1"}],"caption":"At last: an actual game.","item":"LOAD COMPLETE","photo":"c64"},"s033":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"tape","title":"LOAD ERROR. The two cruelest words.","body":["The tape stops. You wait. Nothing happens. You press the spacebar, because pressing something must surely help. Then the screen throws up a loading error.","Your brother says it might be the cassette. You say it might be the universe. He turns the cassette over, tries again and looks irritatingly calm. This would all be easier if you weren't paying for the electricity through your parents' patience."],"choices":[{"label":"Try again, carefully","to":"s032","sub":"Maybe it'll work this time.","effect":"n+1"},{"label":"Give up for the night","to":"s035","sub":"Tomorrow is another day.","effect":"n-1"},{"label":"Throw the cassette at the wall","to":"e07","sub":"An expensive moment of passion.","effect":"b-2,r-1"}],"caption":"You waited for ages. It was not personal. It felt personal.","item":"LOAD ERROR","photo":"datasette"},"s034":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"code","title":"The game your brother cannot win","body":["You create a tiny BASIC “game” with one possible answer and a secret rule: if your brother enters anything, he loses. He accuses you of cheating. You explain that you are the programmer and therefore the rules are final.","He takes the cassette you meant to save it on and threatens to hide it in his room. Technological progress has reached its natural conclusion: an argument."],"choices":[{"label":"Make peace with your brother","to":"s036","sub":"You might need him later.","effect":"b+2"},{"label":"Take your programming genius to school","to":"s038","sub":"A new audience is waiting.","effect":"r+1"}],"caption":"A masterpiece with unfair difficulty.","item":"PROGRAMMER","photo":""},"s035":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"school","title":"New year, same computer argument","body":["It's 1984. At school your status has risen because you've got a C64, though most of your classmates still care considerably more about football.","A girl you like asks whether you can help her with a class project. At that exact moment your friend mentions a new computer game. Two completely different futures open up."],"choices":[{"label":"Help with the project","to":"s040","sub":"Human interaction: the ultimate hard mode.","effect":"r+2"},{"label":"Head to the newsagent","to":"s041","sub":"There are new reviews to study.","effect":"m-1"},{"label":"Go straight home and play","to":"s042","sub":"Homework can wait.","effect":"r-1"}],"caption":"A computer can win you friends. It can lose you other things.","item":"SCHOOL 1984","photo":""},"s036":{"year":"1983","chapter":"03 · THE BLUE SCREEN","theme":"living","title":"Two brothers. One joystick.","body":["Your brother claims he was winning until you distracted him. You claim he was rubbish anyway. He offers you the joystick, which may be an act of kindness or a calculated attempt to watch you fail.","The next ten minutes feature repeated deaths, loud protests and at least one accusation involving the television's brightness control."],"choices":[{"label":"Shake hands and play fairly","to":"s039","sub":"Best of three.","effect":"b+2"},{"label":"Accuse him of sabotaging the game","to":"s043","sub":"The row moves into its second half.","effect":"b-2"},{"label":"Escape to school tomorrow","to":"s035","sub":"You need other people to talk to.","effect":""}],"caption":"A lifetime of arguments measured in extra lives.","item":"SIBLING DUEL","photo":"joystick"},"s037":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"market","title":"The beginning of a collection","body":["By now you've learned the layout of every shop and market stall that sells C64 games. Some cassettes have covers worth framing. Some turn out to be two minutes of frustration.","The trouble is deciding what to buy when you've only got enough money for one game. Your brother insists that you read reviews. You insist that the one with the best monster on the cover must win."],"choices":[{"label":"Check the magazine reviews first","to":"s041","sub":"A sensible precaution.","effect":"r+1"},{"label":"Risk everything on a mystery bargain","to":"s048","sub":"The market awaits.","effect":"m-2"},{"label":"Challenge your brother with what you have","to":"s039","sub":"It's free.","effect":"b+1"}],"caption":"The collection starts with one cassette and ambition.","item":"GAME HUNT","photo":"tape"},"s038":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"romance","title":"A BASIC programme for a girl","body":["You show her the programme you've written. Her name appears on the screen, followed by an unfortunate spelling mistake. She laughs. You claim it was a debugging exercise.","She asks whether computers are all you talk about. You say no, then spend the next forty seconds explaining sprites. The conversation has entered dangerous territory."],"choices":[{"label":"Ask her about what she likes","to":"s045","sub":"A revolutionary strategy.","effect":"r+2"},{"label":"Explain the SID chip in greater detail","to":"s044","sub":"That should impress her.","effect":"r-1"},{"label":"Run away to the newsagent","to":"s041","sub":"At least magazines don't judge.","effect":""}],"caption":"Not every problem can be fixed with POKE.","item":"FIRST CRUSH","photo":""},"s039":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"joystick","title":"The Saturday championship","body":["Your brother sets up a competition on the C64. Winner chooses the next game. Loser makes the tea. It begins civilly and deteriorates after the second life is lost.","At one point he performs an impossible recovery. You respond with a score that looks suspiciously like a fluke. He calls it luck. You call it talent."],"choices":[{"label":"Accept the result gracefully","to":"s040","sub":"A rare display of maturity.","effect":"b+2"},{"label":"Demand a rematch immediately","to":"s043","sub":"This can last until Sunday.","effect":"b-1"},{"label":"Go hunting for a new challenge","to":"s048","sub":"The market has fresh bait.","effect":""}],"caption":"No trophies, no mercy, no second television.","item":"HIGH SCORE","photo":"joystick"},"s040":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"school","title":"An ordinary school day goes wrong","body":["The teacher announces group presentations. You have prepared something about computers, which surprises nobody. The girl you like has to present immediately after you.","A classmate whispers that you'll never get a girlfriend if you only talk about games. This is a dreadful thing to say to somebody who has just memorised the specifications of the SID chip."],"choices":[{"label":"Work with her and be normal","to":"s044","sub":"Try listening for once.","effect":"r+2"},{"label":"Spend lunch reading a game magazine","to":"s047","sub":"Everything else can wait.","effect":"r-1"},{"label":"Head to the arcade after school","to":"s046","sub":"You need to unwind.","effect":"m-1"}],"caption":"Real life does not come with a restart button.","item":"DOUBLE LESSON","photo":""},"s041":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"news","title":"The review-score obsession","body":["You read a glowing review and immediately decide the game is essential. Your brother asks if you've actually got enough money. You turn the page, which is not an answer.","Every magazine issue now feels like a shopping list designed specifically to make you miserable. Still, that glorious artwork is impossible to resist."],"choices":[{"label":"Save for a really good release","to":"s047","sub":"Quality over quantity.","effect":"m+1"},{"label":"Try the Saturday market","to":"s048","sub":"Maybe someone's selling it cheaper.","effect":"m-1"},{"label":"Go back to school and be sociable","to":"s040","sub":"Other humans exist.","effect":""},{"label":"Ignore the review and buy by cover art","to":"s053","sub":"Surely the artwork cannot lie.","effect":"m-1"}],"caption":"Ten pages of dreams, fifteen pence of reality.","item":"REVIEWED","photo":""},"s042":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"bedroom","title":"Just one more game","body":["You promised to start homework at six. At five to six, you're on your last life. At seven, you're still on your last life, for the ninth time.","Mum appears in the doorway. “Have you done your homework?” You answer, “Nearly.” There are no books on the desk. The computer is not even trying to look innocent."],"choices":[{"label":"Turn it off and start work","to":"s049","sub":"You may have saved the evening.","effect":"r+2"},{"label":"Ask your brother to cover for you","to":"s050","sub":"Dangerous politics.","effect":"b-1"},{"label":"Lie and keep playing","to":"e08","sub":"The great confiscation begins.","effect":"r-3"}],"caption":"A simple question, answered very badly.","item":"HOMEWORK?","photo":"c64"},"s043":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"living","title":"The longest argument in the house","body":["The argument begins over whose turn it is and somehow reaches the question of who last used the good towel. Mum says you can both stop playing if you can't behave.","You and your brother exchange a look. A ceasefire is immediately negotiated. Neither of you wants to see the C64 unplugged."],"choices":[{"label":"Call a truce","to":"s044","sub":"Shared enemies are powerful.","effect":"b+2"},{"label":"Storm off to the market","to":"s048","sub":"At least the traders are friendly.","effect":"b-1"}],"caption":"The cold war ends at the power socket.","item":"CEASEFIRE","photo":""},"s044":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"school","title":"A surprise invitation","body":["The class is planning a weekend trip. The girl you like asks whether you're going. You try to answer casually and produce a noise that isn't quite a word.","Your brother says you should go. Your friend says there's a game tournament the same day. You realise grown-ups have lied to you: childhood is full of difficult decisions."],"choices":[{"label":"Go on the trip","to":"s052","sub":"There may be life beyond computer games.","effect":"r+2"},{"label":"Stay home and practise","to":"s051","sub":"The C64 isn't going anywhere.","effect":"b+1"},{"label":"Ask her to visit and see the C64 sometime","to":"s045","sub":"What could go wrong?","effect":"r+1"}],"caption":"A weekend suddenly becomes complicated.","item":"INVITATION","photo":""},"s045":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"romance","title":"The almost-date","body":["You invite her over, then spend the morning tidying your bedroom so it looks as if you own something other than cassettes. You remove a sock from the television. Your brother asks whether you've joined a secret society.","She arrives, sees the computer and asks to play. You are delighted. Then you discover she is rather good at it."],"choices":[{"label":"Cheer her on","to":"s052","sub":"Being decent seems to work.","effect":"r+2"},{"label":"Complain that she must be cheating","to":"e10","sub":"Romance ends before it starts.","effect":"r-3"},{"label":"Challenge her to a rematch","to":"s051","sub":"Friendship and fierce competition.","effect":"r+1"}],"caption":"There are more important things than winning. Apparently.","item":"VERY NERVOUS","photo":""},"s046":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"arcade","title":"The arcade eats your pocket money","body":["The arcade is full of noise: pinball, flashing cabinets, coins vanishing at a frightening rate. Your friend reckons he can finish a game on one credit. He can't. You quietly enjoy that fact.","Your final 10p sits in your hand. You could spend it here or save it towards something you can play for as long as you like at home."],"choices":[{"label":"Put the coin in the savings jar","to":"s051","sub":"A small victory over temptation.","effect":"m+1"},{"label":"Spend it on one last game","to":"s047","sub":"It was never going to be one last game.","effect":"m-1"}],"caption":"The arcade always wins the coin battle.","item":"10P LEFT","photo":""},"s047":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"news","title":"The magazine verdict","body":["You discover an upcoming C64 game that looks excellent. Your brother agrees — a historic occasion. He suggests you save for it instead of buying the next three disasters from the bargain bin.","You write the game's name on a piece of paper and leave it beside the television, like a sacred document."],"choices":[{"label":"Save patiently for 1985","to":"s051","sub":"Sometimes restraint pays.","effect":"m+2"},{"label":"Go to the market right now","to":"s054","sub":"You know patience isn't your strength.","effect":"m-1"}],"caption":"A rare moment of fiscal responsibility.","item":"WISH LIST","photo":""},"s048":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"market","title":"The cassette with no cover","body":["A stallholder has a tub of loose tapes. None have covers. Several have labels written by somebody who appears to have been holding the pen in their mouth.","You find one marked “AMAZING!!” with two exclamation marks. Your brother says that is not evidence of quality. You remind him that life would be dull without risk."],"choices":[{"label":"Leave it and wait for a reviewed game","to":"s051","sub":"The sensible future.","effect":"m+1"},{"label":"Buy the mystery cassette","to":"s054","sub":"What could possibly be on it?","effect":"m-1"},{"label":"Try to trade your least favourite game","to":"s060","sub":"A business opportunity.","effect":""}],"caption":"A label in biro is not a quality guarantee.","item":"MYSTERY BIN","photo":"tape"},"s049":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"school","title":"Homework saved your hide","body":["You hand in the work, get through the test and feel annoyingly pleased with yourself. Your teacher even compliments your computer-related project.","Your brother says the best thing about doing homework is that nobody can stop you playing afterwards. For once, he has identified an excellent system."],"choices":[{"label":"Celebrate with your brother","to":"s051","sub":"A new gaming year is coming.","effect":"b+2"},{"label":"See whether your school crush wants to visit","to":"s052","sub":"Life gets interesting.","effect":"r+1"}],"caption":"Work first, C64 afterwards. It might catch on.","item":"A PASS","photo":""},"s050":{"year":"1984","chapter":"04 · SCHOOL DAYS","theme":"living","title":"The great cover story","body":["Your brother tells Mum you're doing a computer project. Mum asks to see it. He stares at the game screen, where your character has just fallen off a cliff.","“A physics simulation,” he says. You can't decide whether to hug him or report him for fraud."],"choices":[{"label":"Admit everything and do your homework","to":"s051","sub":"Damage limitation.","effect":"r+1,b+1"},{"label":"Keep pretending","to":"e09","sub":"Mum has had enough.","effect":"r-2,b-2"}],"caption":"The most unconvincing physics experiment of 1984.","item":"COVER BLOWN","photo":""},"s051":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"news","title":"1985. One word: Commando.","body":["It's 1985, and your brother has a new obsession. *Commando* has arrived on the C64, and the two of you can't stop talking about it.","The arcade version has already eaten enough pocket money to finance a modest extension to the house. Now there's the possibility of fighting through it on your own machine, taking turns with your brother and arguing about whose score counts.","The immediate problem is familiar: you haven't got enough money for every game you want."],"choices":[{"label":"Head to the market to search for it","to":"s055","sub":"The Saturday expedition begins.","effect":""},{"label":"Ask your brother to go halves","to":"s056","sub":"A financial alliance.","effect":"b+1"},{"label":"Do a job to earn the difference","to":"s057","sub":"The garage awaits, again.","effect":"m+2"}],"caption":"Your next obsession has arrived.","item":"COMMANDO 1985","photo":"c64"},"s052":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"romance","title":"The girl, the game and the bus stop","body":["You meet her after school. She asks about your weekend. You start describing the new C64 game and stop halfway through when you notice she has gone quiet.","She says she quite likes games, but would also like a conversation that isn't about high scores. You realise you are dealing with a sophisticated opponent."],"choices":[{"label":"Ask her to the arcade","to":"s058","sub":"A date with video games, naturally.","effect":"r+2"},{"label":"Apologise and talk about school","to":"s066","sub":"There might be hope.","effect":"r+2"},{"label":"Explain how Commando works in full","to":"e10","sub":"You have chosen poorly.","effect":"r-2"}],"caption":"A surprisingly difficult conversation.","item":"CRUSH STATUS","photo":""},"s053":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"tape","title":"An extravagant purchase","body":["You see a glossy new game in the shop and fall in love with the cover. It's not Commando. It's not even a game you've read about. But the art looks incredible.","Your brother says, “Think for once.” You ignore him and hand over the money you'd been putting aside."],"choices":[{"label":"Open it and hope for the best","to":"s059","sub":"You have committed.","effect":"m-3"},{"label":"Return it unopened and save","to":"s051","sub":"That was close.","effect":"r+1"}],"caption":"The cover art has won an easy victory.","item":"IMPULSE BUY","photo":"tape"},"s054":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"market","title":"The market stall of dreams","body":["Saturday morning. The bus is late, the sky is threatening rain and the market seller has a stack of cassettes you're certain were not there last week.","You look for Commando. He looks at your wallet and gives you the expression of a man who knows he's holding all the cards."],"choices":[{"label":"Inspect the cassettes and negotiate","to":"s060","sub":"Put your bargaining skills to use.","effect":"r+1"},{"label":"Save for a genuine copy","to":"s055","sub":"No shortcuts.","effect":"m+1"},{"label":"Buy an unlabelled tape instead","to":"s063","sub":"Potentially an epic mistake.","effect":"m-1"}],"caption":"Bargains and bad decisions live side by side.","item":"STALL 17","photo":"tape"},"s055":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"market","title":"The Commando price tag","body":["There it is: the game you want. A proper-looking cassette, cover intact, with a price that makes your stomach sink. You count your coins twice. They don't multiply.","You are short. Your brother has a few quid. The stallholder isn't going to run a charity. You have some decisions to make."],"choices":[{"label":"Pool your money with your brother","to":"s061","sub":"A family investment.","effect":"b+2,m-2"},{"label":"Settle for a cheap substitute","to":"s062","sub":"You might be disappointed.","effect":"m-1"},{"label":"Take a punt on the stallholder's bargain","to":"s063","sub":"It says “works on most machines”.","effect":"m-1"},{"label":"Ask your brother for a loan","to":"s065","sub":"You need a fallback plan.","effect":"b+1"}],"caption":"Not enough coins. Too much temptation.","item":"SHORT OF CASH","photo":"tape"},"s056":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"living","title":"The brotherly business partnership","body":["You pitch the idea of buying Commando together. Your brother agrees, on condition that turns are timed and neither of you starts a new game during the other's turn.","The agreement lasts exactly long enough to get you both to the shop. Still, the thought of a joint high-score assault is magnificent."],"choices":[{"label":"Accept the shared-game contract","to":"s064","sub":"Nobody may interfere with a life in progress.","effect":"b+2"},{"label":"Demand ownership of the game yourself","to":"s065","sub":"This could cost you.","effect":"b-2"}],"caption":"The treaty of 1985. Fragile but promising.","item":"FAMILY DEAL","photo":""},"s057":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"money","title":"Jobs, jobs and more jobs","body":["You wash the car again. Your brother does a very convincing impression of a supervisor. Dad offers extra money if you clear out the shed. You decide the shed has been neglected for long enough.","Under a pile of old paint tins you discover a broken toy, a half-used tin of polish and exactly no hidden treasure. You earn your money the old-fashioned way."],"choices":[{"label":"Buy Commando with your savings","to":"s061","sub":"A hard-won reward.","effect":"m+2"},{"label":"Ask your brother for a final loan","to":"s065","sub":"Borrowing has consequences.","effect":"b+1,m+1"}],"caption":"The arcade hero was funded by domestic labour.","item":"EXTRA CASH","photo":""},"s058":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"arcade","title":"The arcade date","body":["You meet her at the arcade, having rehearsed several sensible conversation topics. She puts a coin in a cabinet and beats your score. You're stunned. You're also rather impressed.","Then she asks whether you want to go for chips. You look longingly at the game cabinet. Something has to give."],"choices":[{"label":"Go for chips","to":"s066","sub":"The machines will survive without you.","effect":"r+2"},{"label":"Insist on another high-score attempt","to":"s071","sub":"One more try. Surely.","effect":"r-1"}],"caption":"A date interrupted by a high score.","item":"ARCADE DATE","photo":""},"s059":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"tape","title":"A terrible use of your savings","body":["You finally load your new game. The title screen is glorious. The gameplay is a disaster. A character appears, walks into a wall and falls over. That is nearly the whole game.","Your brother watches for a minute and then starts laughing. He doesn't stop for the next hour. You haven't just bought a bad game. You've bought him material."],"choices":[{"label":"Admit defeat and save for Commando","to":"s051","sub":"You have learned an expensive lesson.","effect":"m-2"},{"label":"Insist the game is excellent","to":"e11","sub":"Become a legendary bad-taste expert.","effect":"r-3"}],"caption":"The box art was the best bit.","item":"REGRET","photo":"tape"},"s060":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"market","title":"The trade of the century","body":["You offer the market trader two games and a football sticker album for his used copy of Commando. He says he doesn't want the football stickers.","Your brother quietly suggests an even trade: one game, a few quid and a promise never to bring the sticker album back. The man smiles. You have a deal within reach."],"choices":[{"label":"Take the sensible trade","to":"s061","sub":"A good day's bargaining.","effect":"m-1,b+1"},{"label":"Accept an untested tape for less","to":"s076","sub":"The dreaded loading lottery.","effect":"m-1"},{"label":"Swap your brother's favourite without asking","to":"e12","sub":"A terrible family decision.","effect":"b-3"}],"caption":"Never trade a brother's favourite game.","item":"SWAP SHOP","photo":""},"s061":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"commando","title":"Commando. The first proper session.","body":["The cassette loads. There it is: *Commando* on your Commodore 64. Your brother grabs the joystick. You demand the first go. He points out that you had the first go on the last three games.","The soldiers start coming, bullets move across the screen and your attempt at heroism lasts seconds. Your brother takes over and immediately does better. You refuse to comment.","The music and action have you both hooked. It's going to be a long afternoon."],"choices":[{"label":"Try to beat his score","to":"s067","sub":"This has become personal.","effect":"r+1"},{"label":"Play fairly and take turns","to":"s068","sub":"An excellent way to preserve peace.","effect":"b+2"},{"label":"Listen to the soundtrack instead","to":"s069","sub":"That music is half the reason you're here.","effect":"n+1"}],"caption":"One joystick, two brothers, no mercy.","item":"COMMANDO!","photo":"joystick"},"s062":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"tape","title":"A substitute is not the real thing","body":["You buy a cheaper game and spend the journey home persuading yourself it's almost like Commando. It isn't.","Your brother asks why you've bought something you didn't want. You tell him to stop making sense. He puts your old copy of the real game review beside you and says nothing."],"choices":[{"label":"Save a bit more and get Commando","to":"s061","sub":"The correct decision.","effect":"m-1"},{"label":"Play the substitute until payday","to":"s067","sub":"An unconvincing warm-up.","effect":""}],"caption":"A near miss, and not in a good way.","item":"BUDGET CUT","photo":"tape"},"s063":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"market","title":"The mysterious tape","body":["The trader hands you an unlabelled cassette. “It's definitely got a shoot-'em-up on it,” he says. That's hardly a scientific guarantee.","Back home you load it. The first thing that appears is a dancing stick figure and a high-pitched noise. You may have acquired the world's least military version of Commando."],"choices":[{"label":"Cut your losses and buy the real game","to":"s061","sub":"At least you tried.","effect":"m-2"},{"label":"Keep loading the mystery cassette","to":"s070","sub":"There might be a second game.","effect":"n-1"}],"caption":"What exactly have you bought?","item":"UNKNOWN GAME","photo":"tape"},"s064":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"living","title":"The two-player agreement","body":["You and your brother draw up a scoreboard on a sheet of lined paper. He writes his name in large letters. You write yours larger.","The rules are simple: take turns, no elbowing, no screaming over the soundtrack and no touching the joystick while the other person's life is in progress. All four rules are broken within twenty minutes."],"choices":[{"label":"Start the Commando battle","to":"s068","sub":"May the least distracting brother win.","effect":"b+1"},{"label":"Demand a practice turn to yourself","to":"s067","sub":"Trust is already fraying.","effect":"b-1"}],"caption":"A fair competition, in theory.","item":"SCORE SHEET","photo":""},"s065":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"money","title":"A loan with embarrassing conditions","body":["Your brother has the last few pounds you need. He agrees to lend them, but only if you promise he can choose the next game you buy.","He suggests a game you already hate. He is enjoying himself far too much. You suspect this is less a loan than an elaborate act of revenge."],"choices":[{"label":"Accept the loan and buy Commando","to":"s061","sub":"The price of glory.","effect":"b+1,m+2"},{"label":"Refuse and accuse him of profiteering","to":"e13","sub":"No game. No peace.","effect":"b-3"}],"caption":"The Bank of Brother has reopened.","item":"INTEREST RATE","photo":""},"s066":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"romance","title":"Chips, conversation and a surprise","body":["You sit on a wall sharing chips and talking about school, films and the ridiculous things your brothers get up to. The conversation feels easier now that you've stopped trying to steer it back to computers.","She says she might like to come round and play a game sometime. You say “Great” at a volume usually reserved for a goal in the Cup Final."],"choices":[{"label":"Invite her over for a game","to":"s071","sub":"This could be interesting.","effect":"r+2"},{"label":"Get home for your Commando session","to":"s067","sub":"The competition is still on.","effect":"b+1"}],"caption":"The rarest high score: a successful conversation.","item":"GOOD EVENING","photo":""},"s067":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"commando","title":"The screen fills with enemies","body":["Your Commando run starts brilliantly. Then enemies appear from both sides, you get caught against the scenery and one of your lives vanishes. You blame the controls, the television and the weather.","Your brother takes his turn and advances past the point where you died. He doesn't look at you. His silence is worse than any amount of shouting."],"choices":[{"label":"Study the patterns and try again","to":"s073","sub":"You are getting better.","effect":"n+1"},{"label":"Throw down the joystick in disgust","to":"s072","sub":"Not your finest moment.","effect":"b-1"},{"label":"Hand him a fair turn","to":"s074","sub":"Maybe watching will teach you something.","effect":"b+1"}],"caption":"The enemy is everywhere. So is your brother's smugness.","item":"ONE LIFE LEFT","photo":"joystick"},"s068":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"commando","title":"The great Commando shoot-out","body":["You take turns on Commando for an entire afternoon. You swear he gets easier enemy patterns. He swears you start with a better joystick. Neither theory withstands scrutiny.","At the end of the session the scores are close. Your brother points out the difference. You point out that he had more practice. Your Mum points out that tea is ready."],"choices":[{"label":"Agree on a rematch tomorrow","to":"s074","sub":"The battle can wait.","effect":"b+2"},{"label":"Declare yourself the true champion","to":"s073","sub":"A bold claim.","effect":"r+1"},{"label":"Keep playing through teatime","to":"e15","sub":"There are consequences to ignoring Mum.","effect":"r-2,b-1"}],"caption":"The longest Saturday in the family record books.","item":"FAMILY RIVALRY","photo":"joystick"},"s069":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"crt","title":"That SID-chip soundtrack","body":["You stop playing just long enough to listen. There is something about the sound of this machine that the shop demonstrations never quite captured. Music fills the room while your brother waits for you to stop being sentimental.","He complains that it's his turn. You tell him you're appreciating art. He says he'll appreciate it while playing."],"choices":[{"label":"Hand the joystick over","to":"s075","sub":"Some songs are better with gunfire.","effect":"b+1"},{"label":"Get back into the action","to":"s073","sub":"The score is still there to beat.","effect":""}],"caption":"The C64 makes music you want to hear again.","item":"SID POWER","photo":"c64"},"s070":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"tape","title":"Side B contains a surprise","body":["You rewind the mystery tape, flip it over and try again. After a worrying amount of whistling, a game does appear. It is not Commando. It is not anything you would knowingly have bought.","Your brother calls it a miracle that it loaded at all. You decide you've had enough gambling for one weekend."],"choices":[{"label":"Save for a decent game","to":"s073","sub":"You've learned the lesson.","effect":""},{"label":"Keep buying untested tapes forever","to":"e16","sub":"Your collection becomes a museum of misery.","effect":"m-2"}],"caption":"The mystery is solved. The game is awful.","item":"SIDE B","photo":"datasette"},"s071":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"romance","title":"The visitor and the joystick","body":["She arrives just as you and your brother are preparing another Commando contest. You offer her the joystick. She survives longer than either of you did on the last attempt.","Your brother looks impressed. You look both delighted and concerned. She asks whether she gets to put her initials on the score sheet. You say yes. Your brother objects. A new rivalry has been born."],"choices":[{"label":"Celebrate her score","to":"s077","sub":"You may have learned something.","effect":"r+2"},{"label":"Demand your place at the top back","to":"s073","sub":"A final challenge.","effect":"r-1"}],"caption":"At last, someone who can beat both of you.","item":"NEW CHAMPION","photo":""},"s072":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"joystick","title":"A joystick in danger","body":["You slam the joystick down. It makes a sound that no joystick should ever make. Your brother picks it up, turns it over and says, “If you've broken that...”","You haven't broken it completely, but it now leans slightly to the left. The two of you look at one another in absolute horror. A computer without a working joystick is a dreadful prospect."],"choices":[{"label":"Apologise and fix it together","to":"s073","sub":"A dab of patience might help.","effect":"b+1"},{"label":"Blame your brother and walk away","to":"e14","sub":"The family gaming alliance collapses.","effect":"b-3"}],"caption":"Do not take your frustrations out on the hardware.","item":"HARDWARE ERROR","photo":"joystick"},"s073":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"commando","title":"The high-score moment","body":["After hours of practice, you get a run that feels different. You dodge the bullets, work out where the enemies appear and push a little further than before.","Your brother leans forward. For once he isn't taking the mickey. When the game finally ends, you both stare at the score. It may not be a world record. In your house, it's enormous."],"choices":[{"label":"Write your name on the score sheet","to":"s078","sub":"Nobody is forgetting this.","effect":"r+2,b+1"},{"label":"Go to school and tell everyone","to":"s079","sub":"They may not believe you.","effect":"r+1"}],"caption":"The afternoon has finally paid off.","item":"PERSONAL BEST","photo":"joystick"},"s074":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"living","title":"Some things are better shared","body":["Your brother watches your latest attempt and gives you a tip. It works. You have to acknowledge that he knows what he's doing. He looks almost as surprised as you are.","You take it in turns without a row for the rest of the evening. It's an astonishing achievement. The game is brilliant, but this is the bit you will remember."],"choices":[{"label":"Tell him he was right","to":"s078","sub":"A rare admission.","effect":"b+2"},{"label":"Try one final solo high-score run","to":"s073","sub":"The challenge remains.","effect":"r+1"}],"caption":"The real prize wasn't on the screen.","item":"BROTHER BONUS","photo":""},"s075":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"crt","title":"The music stays in your head","body":["You find yourself humming the Commando music on the way to school. Your teacher asks what the tune is. You say “Nothing”. He looks unconvinced.","That night your brother hums it too, loudly and just out of tune, as revenge for you doing the same thing at breakfast."],"choices":[{"label":"Admit you're both obsessed","to":"s078","sub":"It could be worse.","effect":"b+1"},{"label":"Launch another high-score attempt","to":"s073","sub":"One more go.","effect":""}],"caption":"A computer game follows you to school.","item":"EARWORM","photo":""},"s076":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"tape","title":"The cassette that eats afternoons","body":["The bargain game refuses to load. You rewind, try again, adjust everything and finally give it a sharp stare, as though shame might help.","Nothing. Your brother gently places the real Commando cassette beside it. He is making a point without saying a word."],"choices":[{"label":"Give up the gamble and play something reliable","to":"s078","sub":"Life is too short.","effect":"b+1"},{"label":"Keep trusting bargain tapes","to":"e16","sub":"Your Saturdays disappear into loading screens.","effect":"m-1"}],"caption":"The entire afternoon was the loading screen.","item":"TAPE ERROR","photo":"datasette"},"s077":{"year":"1985","chapter":"05 · COMMANDO FEVER","theme":"romance","title":"A small victory outside the game","body":["The girl you like asks when the next gaming session is. You say she can come round if she wants. Your brother raises an eyebrow and makes a ridiculous kissing noise once she's left.","You tell him to grow up. He points out that you were the one who spent a whole afternoon trying to impress somebody with a joystick."],"choices":[{"label":"Laugh and carry on","to":"s078","sub":"For once, the joke doesn't hurt.","effect":"b+1,r+1"},{"label":"Give your brother the silent treatment","to":"s079","sub":"It will last until tea.","effect":"b-1"}],"caption":"A rare success in school romance.","item":"CRUSH +1","photo":""},"s078":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"horror","title":"1986. The game that frightened you.","body":["You are older now, and by 1986 the C64 has become part of the furniture. So has the noise of your brother telling you to get off it.","Then somebody mentions *Friday the 13th*, a horror game associated with the films and sold with little capsules of fake blood. Your brother finds this information far more interesting than he should.","You cannot possibly know where this is heading. He can."],"choices":[{"label":"Buy or borrow Friday the 13th","to":"s080","sub":"A decision you will remember.","effect":"n+1"},{"label":"Say it sounds too frightening","to":"s081","sub":"You may be wiser than you realise.","effect":"n-1"},{"label":"Let your brother bring it home","to":"s082","sub":"He is far too keen.","effect":"b+1"}],"caption":"The game and blood capsules belong to the mid-1980s, not 1983.","item":"THE HORROR GAME","photo":"c64"},"s079":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"school","title":"The playground dares you","body":["A mate says there's a terrifying horror game for the C64. You reply that you don't scare easily. He asks if you'll prove it by playing in the dark. You agree before checking what the game is.","At home, your brother has already heard about the fake blood capsules. He hasn't stopped smiling since breakfast."],"choices":[{"label":"Find the game","to":"s080","sub":"A dare is a dare.","effect":"r+1"},{"label":"Let your brother handle it","to":"s082","sub":"He is up to something.","effect":"b-1"}],"caption":"Bravery is easy until the bedroom light goes off.","item":"DARE ACCEPTED","photo":""},"s080":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"horror","title":"A cassette with a warning","body":["The package has horror imagery on the cover and, incredibly, fake-blood capsules. You look at them. Your brother looks at you looking at them.","You're supposed to be excited about the game. Instead, your mind begins wondering why a cassette needs pretend blood included. Your brother says it's just a bit of fun. That is exactly what worries you."],"choices":[{"label":"Give the capsules to your brother to examine","to":"s083","sub":"You have made an error.","effect":"b+1"},{"label":"Load the game before anything else","to":"s084","sub":"Keep your eyes on the screen.","effect":"n+1"}],"caption":"Some game packaging was an adventure of its own.","item":"FAKE BLOOD","photo":"datasette"},"s081":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"living","title":"You say you aren't bothered","body":["You tell your brother you don't want to play that horror game. He shrugs too casually and offers to demonstrate it himself. You return to your comic, determined not to look interested.","Then a strange sound comes from the television. You peer over the page. Your brother catches you looking. Of course he does."],"choices":[{"label":"Sit down and watch","to":"s082","sub":"One look won't hurt.","effect":"n-1"},{"label":"Ask about the blood capsules","to":"s083","sub":"A mistake dressed as curiosity.","effect":""},{"label":"Discuss the horror films instead","to":"s085","sub":"You are much braver with the light on.","effect":""}],"caption":"Nobody believes the words “I'm not bothered”.","item":"NOT SCARED","photo":""},"s082":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"horror","title":"Your brother is suspiciously cheerful","body":["Your brother appears in the doorway holding the game and tells you it's going to be brilliant. You ask why he has that look on his face. He says, “What look?” The look gets worse.","He gets the cassette loading. The sound from the C64 is unsettling. The room seems darker than it was ten minutes ago."],"choices":[{"label":"Ask to see the capsules","to":"s083","sub":"The trap begins to close.","effect":"n-1"},{"label":"Watch him play","to":"s084","sub":"Maybe the game is harmless.","effect":"n+1"}],"caption":"You should never trust that particular grin.","item":"BROTHER’S PLAN","photo":"c64"},"s083":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"blood","title":"Those little blood capsules","body":["There they are: two tiny capsules filled with fake blood. They look ridiculous in daylight. Your brother says they're for a practical joke and asks whether you're scared.","You tell him of course you're not. You wish you hadn't said that. He pockets one of the capsules, and you return to the game. You're too occupied with the screen to notice what he's doing."],"choices":[{"label":"Let him show you the “special effect”","to":"s086","sub":"This is the point of no return.","effect":"n-2"},{"label":"Make him put the capsules away","to":"s087","sub":"You might avoid the worst of it.","effect":"n+1"}],"caption":"The most dangerous objects in the room are tiny.","item":"BLOOD CAPSULES","photo":""},"s084":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"horror","title":"Something moves on the screen","body":["The music gets under your skin. You wander about the game's setting, not entirely certain what you're supposed to do. Your brother keeps telling you to go into places you'd rather avoid.","You are so focused on the screen that you don't notice him standing behind your chair. He is still holding one of the capsules."],"choices":[{"label":"Turn around and see what he wants","to":"s086","sub":"Too late.","effect":"n-1"},{"label":"Ignore him and carry on","to":"s088","sub":"The tension gets worse.","effect":"n-1"}],"caption":"You're watching the wrong source of danger.","item":"KEEP WATCHING","photo":""},"s085":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"horror","title":"The horror film argument","body":["You try to prove you're not frightened by talking about the films. Your brother says the game is worse because you're in control. You aren't convinced. Then somebody drops something in the kitchen and you jump about a foot.","Your brother laughs so hard he nearly falls off the sofa."],"choices":[{"label":"Go and see the game yourself","to":"s082","sub":"Time to stop pretending.","effect":""},{"label":"Inspect the fake blood","to":"s083","sub":"Why are you doing this?","effect":""}],"caption":"The kitchen has won the jump-scare competition.","item":"HORROR NIGHT","photo":""},"s086":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"blood","title":"The blood-capsule incident","body":["You're concentrating on the game when your brother makes a terrible noise. You look round. There's red stuff where red stuff really should not be. For one horrible second you think something dreadful has happened to him.","You panic. You cry. Actual tears. Your brother cannot keep a straight face. The red stuff is fake blood from the capsule. He's fine. You are absolutely furious.","To this day, he can probably make you feel eleven years old again simply by mentioning it. Brothers can be absolute buggers."],"choices":[{"label":"Burst into tears and tell Mum","to":"s089","sub":"An entirely understandable reaction.","effect":"n-2"},{"label":"Launch yourself into an argument","to":"s090","sub":"You have a grievance.","effect":"b-2"},{"label":"Realise it's a trick and laugh eventually","to":"s091","sub":"Eventually being the key word.","effect":"b+1,n+1"}],"caption":"Inspired by the real memory: the prank ended in tears.","item":"THE REAL MEMORY","photo":""},"s087":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"blood","title":"You spot the prank before it happens","body":["You notice the capsule in your brother's hand and ask what exactly he's planning. He looks disappointed. You look triumphant. For once, you've caught him at it.","You could take the moral high ground and end the whole business. Or you could try to be clever. The second option is dangerous."],"choices":[{"label":"Call his bluff and make peace","to":"s093","sub":"The adult thing to do.","effect":"b+2"},{"label":"Plan a harmless return prank","to":"s092","sub":"What could possibly go wrong?","effect":"b-1"}],"caption":"A rare victory for the younger sibling.","item":"TRAP SPOTTED","photo":""},"s088":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"crt","title":"The sound that made you jump","body":["The television makes a noise, the game changes abruptly and your hand jerks on the joystick. Your brother shouts, “LOOK OUT!” from behind your shoulder.","You spin round just as he squeezes the capsule. Your brain has no time to sort reality from play. Your heart has already made its decision."],"choices":[{"label":"Face the prank","to":"s086","sub":"You've had enough.","effect":"n-2"},{"label":"Make him explain himself first","to":"s089","sub":"Get to the truth.","effect":"n-1"}],"caption":"Bad timing is the entire trick.","item":"JUMP SCARE","photo":""},"s089":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"blood","title":"Yes. You really cried.","body":["Mum asks what's happened. Your brother tries to explain through laughter that it was fake blood. You are sobbing, furious and embarrassed all at once.","When you've calmed down, you discover that the most irritating part isn't the scare. It's that your brother will probably tell this story for years. You decide the only fair thing is to remind everyone how he lost badly at Commando."],"choices":[{"label":"Let him apologise","to":"s093","sub":"You'll forgive him. Eventually.","effect":"b+2,n+1"},{"label":"Stay angry for the whole weekend","to":"s094","sub":"A long sulk begins.","effect":"b-2"},{"label":"Swear off the C64 for good","to":"e17","sub":"A disastrous overreaction.","effect":"b-2"}],"caption":"Some childhood memories never fade.","item":"TEARS & TROUBLE","photo":""},"s090":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"living","title":"A shouting match of historic proportions","body":["You call your brother every name your vocabulary can provide. He responds by explaining the scientific difference between fake blood and actual injury. You tell him that is not remotely the point.","Mum orders you both to stop. The game is turned off. The capsules disappear. Your brother is still laughing under his breath."],"choices":[{"label":"Accept a peace offering","to":"s093","sub":"The family can recover.","effect":"b+1"},{"label":"Refuse to speak to him","to":"s095","sub":"This may last a while.","effect":"b-2"}],"caption":"The game loses; family law takes over.","item":"ARGUMENT","photo":""},"s091":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"living","title":"The laugh afterwards","body":["Eventually the sheer stupidity of the trick gets to you. You start laughing, which annoys you because you're still cross with him.","He admits it was a rotten thing to do and offers you the next turn. It's not much of an apology. But for brothers, it is practically a signed document."],"choices":[{"label":"Take the controller and move on","to":"s093","sub":"A new chapter begins.","effect":"b+2,n+2"},{"label":"Plan a revenge scare","to":"s092","sub":"The temptation is strong.","effect":"b-1"}],"caption":"Laughter and fury coexist quite happily.","item":"PEACE OFFERING","photo":""},"s092":{"year":"1986","chapter":"06 · FRIDAY THE 13TH","theme":"blood","title":"Revenge is a dangerous game","body":["You find an old red felt-tip and prepare an elaborate fake injury. Your brother notices the cap still stuck to the end of the pen. He gives you a very tired look.","You are not naturally gifted at practical jokes. But you could still choose to give up gracefully."],"choices":[{"label":"Admit it was a rubbish idea","to":"s093","sub":"Your brother is delighted.","effect":"b+2"},{"label":"Carry out a more alarming trick","to":"e19","sub":"You get both of you banned from gaming.","effect":"b-3"}],"caption":"Never start a prank war without a plan.","item":"REVENGE?","photo":""},"s093":{"year":"1986","chapter":"07 · THE YEARS FLY BY","theme":"living","title":"Brothers are strange things","body":["The next day you and your brother are back in front of the Commodore 64, arguing about whose turn it is. Not much has changed. You don't like what he did with the blood capsules, and you tell him so.","He actually apologises. You don't believe him when he says he'll never do it again, but you're willing to give him another chance. After all, there's a new game waiting to load."],"choices":[{"label":"Turn the page to your teenage years","to":"s096","sub":"The story isn't over.","effect":"b+2"},{"label":"Revisit the old market for a fresh start","to":"s096","sub":"Some things never change.","effect":"m+1"}],"caption":"A friendship that survives a fair bit of nonsense.","item":"BROTHERS","photo":"c64"},"s094":{"year":"1986","chapter":"07 · THE YEARS FLY BY","theme":"bedroom","title":"The great sulk","body":["You refuse to speak to your brother. At teatime he asks whether you want the potatoes. You glare at him. Dad tells you to sort it out before the whole family gets indigestion.","By Sunday you're beginning to miss your usual gaming sessions. You don't want to admit it, of course."],"choices":[{"label":"Make peace and return to gaming","to":"s096","sub":"You have proved your point.","effect":"b+1"},{"label":"Give your C64 away in protest","to":"e18","sub":"An irreversible statement.","effect":"b-2"}],"caption":"The silence is broken by the sound of a cassette rewinding.","item":"SULKING","photo":""},"s095":{"year":"1986","chapter":"07 · THE YEARS FLY BY","theme":"kitchen","title":"Mum has the final say","body":["Mum tells you both that the prank went too far. Your brother looks ashamed, which makes you feel a little better.","Then she says you'll have to sort out the rules for using the C64 without her getting involved every five minutes. Your brother points out that there were rules. You both start arguing about them. Mum walks away."],"choices":[{"label":"Agree to a new truce","to":"s096","sub":"There's no point wasting another weekend.","effect":"b+2"},{"label":"Keep provoking each other","to":"e21","sub":"The family pulls the plug.","effect":"b-2"}],"caption":"The adult has abandoned the negotiations.","item":"FINAL WARNING","photo":""},"s096":{"year":"1987","chapter":"07 · THE YEARS FLY BY","theme":"bedroom","title":"1987. The C64 is still your world.","body":["You're older. You have more homework, less time and a growing stack of cassettes beside the telly. Some of the covers are battered. A few games no longer load. Every one of them has a memory attached.","Your brother is still your rival, your occasional ally and the person most likely to mention the Friday the 13th incident at an embarrassing moment. You are beginning to suspect these stories might last a lifetime."],"choices":[{"label":"Start documenting your favourite games","to":"s097","sub":"You could become the household historian.","effect":"r+1"},{"label":"Concentrate on school for a while","to":"s098","sub":"The exam timetable is not negotiable.","effect":"r+2"},{"label":"Visit a friend with a Spectrum","to":"s099","sub":"A reminder of the path not taken.","effect":"n-1"}],"caption":"From one cassette to a collection of memories.","item":"1987","photo":"c64"},"s097":{"year":"1987","chapter":"07 · THE YEARS FLY BY","theme":"news","title":"A scrapbook of game memories","body":["You start keeping notes on what you've played, what it cost and whether it was any good. Some reviews consist of a score and the word “brilliant”. Others stretch to several pages of barely restrained anger.","Your brother says you could do this for an audience one day. You tell him not to be ridiculous. It's 1987. An audience would have to come to your house."],"choices":[{"label":"Keep writing and reviewing","to":"s100","sub":"A future hobby is taking shape.","effect":"r+2"},{"label":"Arrange one more Commando competition","to":"s101","sub":"Old scores need settling.","effect":"b+1"}],"caption":"Every game has a story. Some have a grievance.","item":"GAME JOURNAL","photo":""},"s098":{"year":"1987","chapter":"07 · THE YEARS FLY BY","theme":"school","title":"Exams versus the C64","body":["You discover that revision doesn't get itself done while you play games. This comes as a genuine disappointment.","A girl from school offers to compare notes. Your brother offers to help by hiding the joystick until you've finished. Both gestures are helpful. One is less annoying than the other."],"choices":[{"label":"Do the revision, then play","to":"s102","sub":"A balanced approach.","effect":"r+2"},{"label":"Bin the revision and play all night","to":"s103
