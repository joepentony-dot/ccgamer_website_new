","sub":"An ambitious academic strategy.","effect":"r-3"}],"caption":"One last difficult school-year choice.","item":"EXAM WEEK","photo":""},"s099":{"year":"1987","chapter":"07 · THE YEARS FLY BY","theme":"spectrum","title":"One last visit to the dark side","body":["Your friend is still defending his ZX Spectrum. He demonstrates a game and insists the colourful mess on the screen looks better “once you've got used to it”.","You remember the market stalls, the tempting price and the narrow escape. Your Commodore 64 is waiting at home. You think of its keyboard, its sound and your favourite games."],"choices":[{"label":"Invite him over to hear the C64 instead","to":"s104","sub":"A mercy mission.","effect":"r+1"},{"label":"Let him persuade you to swap computers","to":"e22","sub":"A dramatic late-career collapse.","effect":"b-2"},{"label":"Tell him you'll stick with the C64","to":"s097","sub":"No second thoughts.","effect":"n+1"}],"caption":"Some arguments never end.","item":"WRONG TURN","photo":"spectrum"},"s100":{"year":"1988","chapter":"08 · THE LAST CHAPTER","theme":"news","title":"A voice for the games you love","body":["You keep a record of the games that mattered: the brilliant ones, the dreadful ones, and the odd little discoveries that deserved a much bigger audience.","Somewhere in the future there might be a way to share these stories with other people, rather than forcing your brother to listen to your latest review while he's trying to eat his dinner."],"choices":[{"label":"Share the stories one day","to":"s105","sub":"There's a larger adventure ahead.","effect":"r+2"},{"label":"Organise your games into an archive","to":"s105","sub":"Memories are worth keeping.","effect":"b+1"}],"caption":"The beginnings of the Cheeky Commodore Gamer spirit.","item":"THE COLLECTOR","photo":"c64"},"s101":{"year":"1988","chapter":"08 · THE LAST CHAPTER","theme":"commando","title":"Commando: the rematch years later","body":["You dig out Commando again. Your brother claims his reactions haven't changed. The first thirty seconds suggest otherwise.","Before long you're both laughing at the same ridiculous mistakes you made years earlier. There's a satisfying moment when one of you finally beats the old score, though nobody can remember whose score it was."],"choices":[{"label":"Record the result and call it a classic","to":"s105","sub":"Some rivalries deserve preserving.","effect":"b+2,r+1"},{"label":"Accuse him of interfering with the joystick","to":"s105","sub":"He knows you too well.","effect":"b-1"}],"caption":"Certain games refuse to grow old.","item":"REMATCH","photo":"joystick"},"s102":{"year":"1988","chapter":"08 · THE LAST CHAPTER","theme":"school","title":"A pass, and a free afternoon","body":["You finish your exams and can finally turn the C64 on without a textbook sitting beside the keyboard as a decoy. The first title screen feels better than it has for months.","Your brother has left a note on top of the Datasette: “Don't forget my high score.” You put the note in a drawer where it belongs."],"choices":[{"label":"Celebrate with the family","to":"s105","sub":"Games are better when life is going well.","effect":"b+2,r+1"},{"label":"Invite your school friends round","to":"s105","sub":"The gaming room is open.","effect":"r+2"}],"caption":"Responsibility does have occasional rewards.","item":"PASSED","photo":""},"s103":{"year":"1988","chapter":"08 · THE LAST CHAPTER","theme":"school","title":"A poor exam result and a long lecture","body":["You play until the early hours and go into the examination with the distinct feeling you've forgotten everything not written on a cassette label.","The result is a disaster. Your parents are disappointed. Your brother says “I told you so” with such enthusiasm that it nearly becomes a speech."],"choices":[{"label":"Accept responsibility and turn things around","to":"s105","sub":"Not every mistake needs to be the ending.","effect":"r-2"},{"label":"Blame the C64 and abandon it","to":"e23","sub":"A bitter conclusion.","effect":"b-2,r-2"}],"caption":"Real life can be harder than the last level.","item":"RESULTS DAY","photo":""},"s104":{"year":"1988","chapter":"08 · THE LAST CHAPTER","theme":"c64","title":"Your friend hears the SID chip","body":["Your Spectrum-owning mate comes round. The C64 boots. You put on a favourite game and let the music do the talking. He says, “That's actually quite good.” Your brother nearly applauds.","After an hour he asks if he can come round again. A friendship has survived the platform war, even if his taste in computers remains questionable."],"choices":[{"label":"Welcome him into the C64 fold","to":"s105","sub":"An eight-bit conversion.","effect":"r+2"},{"label":"Suggest swapping your C64 for his Spectrum","to":"e24","sub":"Please don't do that.","effect":"b-3"}],"caption":"A diplomatic victory for the beige machine.","item":"SID DIPLOMACY","photo":"c64"},"s105":{"year":"1989","chapter":"08 · THE LAST CHAPTER","theme":"final","title":"One last choice","body":["The years have rolled by. You have a pile of games, stories from school, a few embarrassing romantic memories, and a brother who knows exactly which childhood incident will still make you squirm.","You can remember the excitement of seeing a Commodore 64 for the first time. The market bargains. The Sunday afternoons. The arguments over Commando. And the tears over a ridiculous blood capsule that felt anything but ridiculous at the time.","The machine was never just a computer. It became a way of remembering everything that happened around it. So what do you do with all those memories?"],"choices":[{"label":"Keep the stories alive for other gamers","to":"e25","sub":"The best possible tribute to the C64.","effect":"r+2,b+1"},{"label":"Share the collection with your brother","to":"e26","sub":"The family rivalry becomes legend.","effect":"b+2"},{"label":"Pack it all away and never look back","to":"e27","sub":"A bittersweet ending.","effect":"r-1"},{"label":"Give the C64 away for a Spectrum","to":"e22","sub":"You cannot be serious.","effect":"b-3"}],"caption":"The real adventure may only just be beginning.","item":"THE FINAL DECISION","photo":"c64"},"e01":{"year":"1983","chapter":"THE FINAL PAGE","theme":"spectrum","title":"THE RUBBER-KEYED REGRET","body":["You keep the ZX Spectrum. Every time you visit your friend with a Commodore 64, you convince yourself that yours is just as good. The sound from his telly says otherwise.","Your brother never lets you forget it. For years he refers to the family machine as “that thing”. The C64 adventure ends before it starts."],"choices":[],"grade":"bad","caption":"BAD ENDING 01 · You chose the Spectrum."},"e02":{"year":"1983","chapter":"THE FINAL PAGE","theme":"school","title":"THE PLAYGROUND EXPERT","body":["You loudly insist the Spectrum is superior after one disastrous demonstration. The next day somebody asks you to type a programme in front of the class. You fail to finish the first line.","Your reputation evaporates. Worse, the boy with the C64 offers to help."],"choices":[],"grade":"bad","caption":"BAD ENDING 02 · The school debate is lost."},"e03":{"year":"1983","chapter":"THE FINAL PAGE","theme":"kitchen","title":"THE TANTRUM OF 1983","body":["You demand a C64, Datasette, disk drive and fourteen games immediately. Mum says no. Dad says absolutely not. Your brother refuses to be seen with you in public for a week.","The computer fund is suspended pending a dramatic improvement in attitude."],"choices":[],"grade":"bad","caption":"BAD ENDING 03 · Negotiations collapse."},"e04":{"year":"1983","chapter":"THE FINAL PAGE","theme":"money","title":"THE DREAM THAT RAN OUT OF MONEY","body":["You decide earning the money is too much effort. Life goes on. Your brother eventually gets his way into computer gaming while you spend your spare cash on sweets and a football sticker collection.","Years later you still remember the Commodore 64 in the shop window and wonder what would have happened."],"choices":[],"grade":"bad","caption":"BAD ENDING 04 · You gave up too early."},"e05":{"year":"1983","chapter":"THE FINAL PAGE","theme":"spectrum","title":"THE SPECTRUM YEARS","body":["You refuse to return the Spectrum, partly because you've already told everybody it was a brilliant purchase. You perfect the art of explaining why rubber keys are actually an advantage.","Your brother says nothing when the C64 advert comes on the television. That makes it worse."],"choices":[],"grade":"bad","caption":"BAD ENDING 05 · Pride wins; the C64 loses."},"e06":{"year":"1983","chapter":"THE FINAL PAGE","theme":"market","title":"THE DEAD COMPUTER","body":["The market C64 turns out to be faulty. The trader has vanished by the next Saturday. You own a box of beige plastic that makes no picture and a cable that appears to belong to a kettle.","Your brother reminds you that he did say to test it. He does not stop reminding you."],"choices":[],"grade":"bad","caption":"BAD ENDING 06 · The bargain was a disaster."},"e07":{"year":"1983","chapter":"THE FINAL PAGE","theme":"tape","title":"THE CASSETTE CASUALTY","body":["You throw the cassette in frustration. It hits the wall and splits. Your parents refuse to buy a replacement. Your brother is furious because the game was partly his.","You spend the following Saturday staring at the C64's READY prompt, reconsidering your life decisions."],"choices":[],"grade":"bad","caption":"BAD ENDING 07 · The tape loses. So do you."},"e08":{"year":"1984","chapter":"THE FINAL PAGE","theme":"school","title":"THE CONFISCATED C64","body":["Mum catches you lying about homework for the third time. The C64 is locked away until your schoolwork improves.","Your brother gets to use it before you do. You can hear the title music from upstairs. There are few crueller sounds in childhood."],"choices":[],"grade":"bad","caption":"BAD ENDING 08 · Grounded."},"e09":{"year":"1984","chapter":"THE FINAL PAGE","theme":"living","title":"THE WORST PHYSICS EXPERIMENT","body":["Your brother tries to pass a platform game off as science homework. Mum isn't fooled. Both of you lose computer privileges for a fortnight.","He says it was your idea. You say it was his. Mum says neither of you is helping."],"choices":[],"grade":"bad","caption":"BAD ENDING 09 · Nobody believes the alibi."},"e10":{"year":"1985","chapter":"THE FINAL PAGE","theme":"romance","title":"THE ROMANTIC GAME OVER","body":["She was interested until you explained your high-score system in extraordinary detail and then accused her of cheating at a video game.","She decides she'd rather spend Saturday with someone who occasionally asks questions that aren't about computers. Your brother laughs for three days."],"choices":[],"grade":"bad","caption":"BAD ENDING 10 · Relationship status: GAME OVER."},"e11":{"year":"1985","chapter":"THE FINAL PAGE","theme":"tape","title":"THE TERRIBLE TASTE AWARD","body":["You decide the awful game you bought is an overlooked masterpiece. You defend it at school, in the shops and at the dinner table. Nobody agrees.","Years later, even you struggle to remember what the game was actually called."],"choices":[],"grade":"bad","caption":"BAD ENDING 11 · An expensive hill to die on."},"e12":{"year":"1985","chapter":"THE FINAL PAGE","theme":"market","title":"THE GREAT CASSETTE BETRAYAL","body":["You trade away your brother's favourite game without asking. He finds out before tea. The row makes the television argument of 1984 look like a friendly chat.","He never trusts you near his cassettes again."],"choices":[],"grade":"bad","caption":"BAD ENDING 12 · Your brother will remember this."},"e13":{"year":"1985","chapter":"THE FINAL PAGE","theme":"money","title":"THE LOAN THAT WASN’T","body":["You accuse your brother of profiteering and storm out of the shop. He pockets his money and buys the game for himself.","You sit in the next room listening to Commando while he enjoys it without you. You have achieved the exact opposite of your objective."],"choices":[],"grade":"bad","caption":"BAD ENDING 13 · Negotiation failed."},"e14":{"year":"1985","chapter":"THE FINAL PAGE","theme":"joystick","title":"THE BROKEN JOYSTICK TREATY","body":["You blame your brother for the damaged joystick. He knows it wasn't his fault. You know it wasn't his fault. The joystick does not recover from the argument.","Commando is replaced by a long, unpleasant silence and a shortage of spare hardware."],"choices":[],"grade":"bad","caption":"BAD ENDING 14 · A costly tantrum."},"e15":{"year":"1985","chapter":"THE FINAL PAGE","theme":"kitchen","title":"THE TEATIME BLACKOUT","body":["You both ignore the call for tea because Commando is going so well. Mum walks in and switches the television off.","Your brother blames you for the ruined run. You blame him for not pausing. Neither of you remembers that Commando has no convenient pause button when you're this far gone."],"choices":[],"grade":"bad","caption":"BAD ENDING 15 · Dinner wins."},"e16":{"year":"1985","chapter":"THE FINAL PAGE","theme":"tape","title":"THE ETERNAL LOADING SCREEN","body":["You fill your shelves with untested bargain tapes. Some are blank, some are broken, and the rest take longer to load than your patience will allow.","Your brother gives up and starts visiting friends who buy games with actual labels."],"choices":[],"grade":"bad","caption":"BAD ENDING 16 · LOAD ERROR forever."},"e17":{"year":"1986","chapter":"THE FINAL PAGE","theme":"horror","title":"THE HORROR GAME RETIREMENT","body":["After the fake-blood prank you announce that computer games are finished for you. Your brother tries to apologise but you refuse even to look at the C64.","Years later, you remember the tears more than the games. It's a grim ending to something that had given you so much joy."],"choices":[],"grade":"bad","caption":"BAD ENDING 17 · You let the prank win."},"e18":{"year":"1986","chapter":"THE FINAL PAGE","theme":"bedroom","title":"THE COMPUTER YOU GAVE AWAY","body":["In the heat of the argument you give your precious C64 away. Your brother is speechless. A week later you want it back more than anything in the world.","The new owner is very happy with it. You are not."],"choices":[],"grade":"bad","caption":"BAD ENDING 18 · The worst trade of all."},"e19":{"year":"1986","chapter":"THE FINAL PAGE","theme":"blood","title":"THE PRANK WAR","body":["Your revenge prank goes too far and Mum bans both of you from using the computer until further notice. The capsules are thrown away.","Your brother mutters that the original joke was better. You admit, privately, that he has a point."],"choices":[],"grade":"bad","caption":"BAD ENDING 19 · Both players lose."},"e21":{"year":"1986","chapter":"THE FINAL PAGE","theme":"kitchen","title":"THE FAMILY SWITCHES OFF","body":["You continue arguing until your parents decide that nobody will use the C64 for the rest of the month. Your brother stares at you like you've committed treason.","You are both sentenced to board games. Neither of you ever forgives the other."],"choices":[],"grade":"bad","caption":"BAD ENDING 20 · The power is cut."},"e22":{"year":"1988","chapter":"THE FINAL PAGE","theme":"spectrum","title":"THE UNTHINKABLE TRADE","body":["Against all reason, you swap your Commodore 64 for a ZX Spectrum. Your brother asks if you're feeling all right. The rubber keyboard is exactly as you remember.","The first evening ends in regret. You have somehow managed to lose an argument you won several years earlier."],"choices":[],"grade":"bad","caption":"BAD ENDING 21 · A betrayal of the beige machine."},"e23":{"year":"1988","chapter":"THE FINAL PAGE","theme":"school","title":"THE EXAM NIGHT DISASTER","body":["You blame the C64 for your exam result and refuse to play again. The machine did not choose to stay on all night. You did.","The lesson is a difficult one, and your wonderful collection gathers dust while you try to forget it."],"choices":[],"grade":"bad","caption":"BAD ENDING 22 · Responsibility avoided."},"e24":{"year":"1988","chapter":"THE FINAL PAGE","theme":"spectrum","title":"THE SECOND SPECTRUM MISTAKE","body":["You have a perfectly good Commodore 64, a collection of games and years of memories. Then you suggest trading it for your friend's Spectrum.","He agrees suspiciously quickly. Your brother can be heard laughing from the next room."],"choices":[],"grade":"bad","caption":"BAD ENDING 23 · You knew better."},"e25":{"year":"TODAY","chapter":"THE FINAL PAGE","theme":"celebrate","title":"THE CHEEKY COMMODORE GAMER","body":["Years later, you begin sharing the stories: the C64, the games, the market bargains, the brothers battling through Commando and the infamous fake-blood capsules. People who grew up with the same machines start telling their own stories too.","What began as a boy wanting a computer in 1983 becomes something bigger: the Cheeky Commodore Gamer channel, keeping those memories alive for everyone who was there — and for people who wish they had been.","Your brother still has one story he tells at every opportunity. Yes, that one."],"choices":[],"grade":"gold","caption":"LEGENDARY ENDING · The memories live on."},"e26":{"year":"TODAY","chapter":"THE FINAL PAGE","theme":"celebrate","title":"BROTHERS TO THE END","body":["You and your brother sit down for one final Commando session. You argue over the joystick, the scoreboard and who cheated in 1985. Nothing has changed.","Then one of you remembers the fake blood. The other groans. Within minutes you're both laughing. The machine was the centre of it all, but the real story was the time you spent together."],"choices":[],"grade":"gold","caption":"GOLD ENDING · Brothers, games, memories."},"e27":{"year":"TODAY","chapter":"THE FINAL PAGE","theme":"bedroom","title":"THE BOX IN THE LOFT","body":["You pack the Commodore 64 away. The cassette cases go into a box; the joystick cable is carefully coiled around the handle. The room grows quiet.","Many years later, you find the box again. The sight of that beige keyboard takes you straight back to the living room, your brother, the market and the game that made you cry. Maybe this isn't really an ending after all."],"choices":[],"grade":"bittersweet","caption":"BITTERSWEET ENDING · The memories are waiting."}}</script>
