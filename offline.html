<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020b1d">
  <meta name="robots" content="noindex,follow">
  <title>CCG Offline | Cheeky Commodore Gamer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/resources/images/ccg-app-icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #020711;
      color: #ecfbff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 10%, rgba(39, 135, 255, 0.18), transparent 36%),
        radial-gradient(circle at 82% 82%, rgba(206, 62, 255, 0.14), transparent 34%),
        #020711;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 54px);
      border: 2px solid #4ed6ff;
      background: rgba(4, 14, 34, 0.96);
      box-shadow: 0 0 34px rgba(78, 214, 255, 0.18);
      text-align: center;
    }

    img {
      width: 112px;
      height: 112px;
      margin-bottom: 18px;
    }

    p:first-of-type {
      margin: 0 0 8px;
      color: #78eaff;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 8vw, 4rem);
      line-height: 1;
    }

    .message {
      margin: 0 auto 28px;
      max-width: 52ch;
      color: #c8d9e8;
      line-height: 1.65;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a,
    button {
      min-height: 46px;
      padding: 12px 18px;
      border: 1px solid #4ed6ff;
      border-radius: 0;
      background: #082243;
      color: #fff;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    a:hover,
    a:focus-visible,
    button:hover,
    button:focus-visible {
      outline: 3px solid #d267ff;
      outline-offset: 3px;
      background: #103969;
    }

    .status {
      min-height: 1.4em;
      margin: 22px 0 0;
      color: #9fb4c7;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <img src="/resources/images/ccg-app-icon.svg" alt="Cheeky Commodore Gamer">
    <p>Offline mode</p>
    <h1>No connection</h1>
    <p class="message">The live archive cannot be reached at the moment. Previously cached public pages may still open, or retry once your connection returns.</p>
    <nav aria-label="Offline options">
      <a href="/home.html">Home</a>
      <a href="/games/">Browse Games</a>
      <a href="/games/discover/">Find Me a Game</a>
      <button type="button" id="offlineRetry">Retry</button>
    </nav>
    <p class="status" id="offlineStatus" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      "use strict";
      const status = document.getElementById("offlineStatus");
      const retry = document.getElementById("offlineRetry");

      function updateStatus() {
        status.textContent = navigator.onLine
          ? "A connection is available. Retry to return to the live site."
          : "Still offline.";
      }

      retry.addEventListener("click", function () {
        if (navigator.onLine) {
          window.location.href = "/home.html";
          return;
        }
        updateStatus();
      });

      window.addEventListener("online", updateStatus);
      window.addEventListener("offline", updateStatus);
      updateStatus();
    })();
  </script>
</body>
</html>
