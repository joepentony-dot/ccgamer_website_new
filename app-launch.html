<!doctype html>
<html lang="en-GB" data-ccg-page="app-launch">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020711">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCG">
  <meta name="robots" content="noindex,follow">
  <title>Cheeky Commodore Gamer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/resources/images/ccg-app-icon-v2.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/resources/images/ccg-app-icon-v2.svg">
  <link rel="stylesheet" href="/resources/css/ccg-app-launch.css">
  <script src="/js/ccg-app-launch.js" defer></script>
</head>
<body>
  <main class="ccg-app-launch" data-ccg-app-launch>
    <div class="ccg-app-launch__stars" aria-hidden="true"></div>

    <section class="ccg-app-launch__card" aria-label="Cheeky Commodore Gamer is loading">
      <p class="ccg-app-launch__eyebrow">CCG // COMMODORE ARCHIVE</p>

      <div class="ccg-app-launch__mark-wrap" aria-hidden="true">
        <img
          class="ccg-app-launch__mark"
          src="/resources/images/ccg-app-icon-v2.svg"
          width="172"
          height="172"
          alt=""
          decoding="sync">
      </div>

      <h1 class="ccg-app-launch__title">
        <span class="ccg-app-launch__title-main">Cheeky</span>
        <span class="ccg-app-launch__title-sub">Commodore Gamer</span>
      </h1>

      <p class="ccg-app-launch__slogan">Stay a while, stay forever!</p>

      <div class="ccg-app-launch__platforms" aria-label="Commodore 64 and Amiga">
        <span>C64</span>
        <i class="ccg-app-launch__platform-divider" aria-hidden="true"></i>
        <span>Amiga</span>
      </div>

      <div class="ccg-app-launch__boot" aria-hidden="true">
        <div class="ccg-app-launch__boot-label">
          <span>Loading archive</span>
          <span>Ready</span>
        </div>
        <div class="ccg-app-launch__boot-track">
          <span class="ccg-app-launch__boot-bar"></span>
        </div>
      </div>

      <a class="ccg-app-launch__enter" href="/home.html?source=pwa" data-ccg-app-launch-enter>Tap to enter now</a>
    </section>
  </main>
</body>
</html>
