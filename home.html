<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cheeky Commodore Gamer | Home Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Core Styles -->
    <link rel="stylesheet" href="resources/css/ccg-master.css">
    <link rel="stylesheet" href="resources/css/ccg-mode.css">
    <link rel="stylesheet" href="resources/css/home.css">
    <link rel="stylesheet" href="resources/css/ccg-effects.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           CCG — HOME PAGE NO-CRT VERSION (NO HUM)
           ========================================================== */

        .crt-overlay,
        .crt-scanlines,
        .ccg-crt,
        .ccg-crt-overlay,
        .ccg-rgb,
        .ccg-scanlines,
        .ccg-crt-flicker {
            display: none !important;
            animation: none !important;
        }

        .ccg-rgb::before,
        .ccg-rgb::after {
            display: none !important;
        }

        .ccg-flicker,
        .ccg-pulse,
        .ccg-shimmer,
        .ccg-shake {
            animation: none !important;
        }

        body {
            background: #000718;
            color: #ffffff;
            overflow-x: hidden;
        }

        .ccg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: #020e2b;
            border-bottom: 3px solid var(--ccg-accent);
        }

        .ccg-logo {
            height: 70px;
        }

        .ccg-title {
            font-family: "VT323", monospace;
            color: var(--ccg-accent);
            font-size: 42px;
            margin-left: 12px;
        }

        #mode-toggle {
            padding: 10px 18px;
            font-family: "VT323", monospace;
            font-size: 20px;
            border: 2px solid var(--ccg-accent);
            background: transparent;
            color: var(--ccg-accent);
            cursor: pointer;
        }

        .ccg-panel {
            max-width: 1200px;
            margin: 30px auto;
            background: rgba(0, 0, 0, 0.55);
            padding: 20px 28px;
            border: 2px solid var(--ccg-accent);
        }

        .ccg-panel-title {
            font-family: "Press Start 2P", sans-serif;
            font-size: 20px;
            color: var(--ccg-accent);
            margin-bottom: 22px;
            text-align: center;
        }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .genre-card {
            background: #0a1028;
            border: 2px solid var(--ccg-accent);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .genre-card:hover {
            background: #0f1a3d;
            transform: scale(1.04);
        }

        .genre-card img {
            width: 100%;
            max-width: 120px;
        }

        .genre-label {
            margin-top: 8px;
            font-family: "VT323";
            font-size: 22px;
            color: var(--ccg-accent);
        }

        footer {
            text-align: center;
            color: #777;
            padding: 20px;
            margin-top: 30px;
            font-size: 14px;
        }

    </style>
</head>

<body class="ccg-body ccg-mode-c64">

            <img src="resources/CCGAMER LOGO.png" class="ccg-logo">

        <button id="mode-toggle">SYSTEM MODE</button>
    </header>

    <main>
        <section class="ccg-panel">
            <div class="ccg-panel-title">GAME GENRES</div>

            <div class="genre-grid">
                
                <a class="genre-card" href="games/genres/arcade-games.html">

                </a>

                </a>

                    <div class="genre-label">ADVENTURE</div>
                </a>

                <a class="genre-card" href="games/genres/bpjs-indexed-games.html">
                    <img src="resources/images/genres/bpjs.png">
                    <div class="genre-label">BPJS INDEXED</div>
                </a>

                <a class="genre-card" href="games/genres/cartridge-games.html">
                    <img src="resources/images/genres/cartridge.png">

                <a class="genre-card" href="games/genres/fighting-games.html">

                <a class="genre-card" href="games/genres/horror-games.html">

                <a class="genre-card" href="games/genres/platform-games.html">
                    <img src="resources/images/genres/platform.png">

                </a>

                <a class="genre-card" href="games/genres/puzzle-games.html">
                    <img src="resources/images/genres/puzzle.png">

                </a>

                <a class="genre-card" href="games/genres/racing-games.html">
                    <img src="resources/images/genres/racing.png">

                <!-- 🔥 FIXED RPG LINK -->
                <a class="genre-card" href="games/genres/rpg-games.html">

                <a class="genre-card" href="games/genres/shooting-games.html">
                    <img src="resources/images/genres/shooting.png">

                <a class="genre-card" href="games/genres/sports-games.html">

                </a>

                <a class="genre-card" href="games/genres/strategy-games.html">
                    <img src="resources/images/genres/strategy.png">
                    <div class="genre-label">STRATEGY</div>
                </a>

                <a class="genre-card" href="games/genres/top-picks.html">
                    <img src="resources/images/genres/top-picks.png">
                    <div class="genre-label">TOP PICKS</div>
                </a>

            </div>
        </section>
    </main>

    <footer>
        © 2025 Cheeky Commodore Gamer — All Rights Reserved
    </footer>

    <script src="js/ccg-mode-engine.js" defer></script>

</body>
</html>
