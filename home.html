<!DOCTYPE html>
<html lang="en" data-ccg-page="home">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cheeky Commodore Gamer | Home</title>
    <meta name="description"
          content="Cheeky Commodore Gamer — epic Commodore 64 and Amiga coverage: reviews, longplays, trivia, curated collections and more. Stay a while, stay forever!">
    <link rel="canonical" href="home.html" />
    <link rel="icon" href="favicon.ico" />

    <!-- REQUIRED FONT RESTORE -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="resources/css/ccg-master.css" />
    <link rel="stylesheet" href="resources/css/ccg-mode.css" />
    <link rel="stylesheet" href="resources/css/ccg-effects.css" />
    <link rel="stylesheet" href="resources/css/ccg-hero.css" />
    <link rel="stylesheet" href="resources/css/ccg-cards.css" />
    <link rel="stylesheet" href="resources/css/ccg-socials.css" />
    <link rel="stylesheet" href="resources/css/ccg-anim.css" />
    <link rel="stylesheet" href="resources/css/ccg-overlays.css" />

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="resources/css/home.css" />
</head>

<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">

    <!-- GLOBAL BACKGROUND OVERLAYS -->
    <div class="ccg-bg">
        <div class="ccg-bg-starfield"></div>
        <div class="ccg-bg-grid"></div>
        <div class="ccg-bg-crt-overlay"></div>
    </div>

    <div class="ccg-page ccg-page--home">

        <!-- HEADER (UNCHANGED) -->
        <header class="ccg-header">
            <div class="ccg-header-inner">
                <!-- brand + nav unchanged -->
            </div>
            <div class="ccg-header-neon-strip"></div>
        </header>

        <!-- MAIN -->
        <main class="ccg-main ccg-main--home">

            <!-- HERO (UNCHANGED) -->
            <section class="home-hero">
                <div class="ccg-hero ccg-hero--home">
                    <div class="ccg-hero-inner home-hero__inner">
                        <!-- hero content unchanged -->
                    </div>
                </div>
            </section>

            <!-- TAGLINE -->
            <section class="home-tagline">
                <p class="home-tagline__kicker">Another visitor...</p>
                <p class="home-tagline__main">Stay a while, stay forever!</p>
            </section>

            <!-- FEATURED SPLIT (NEW STRUCTURE) -->
            <div class="home-featured-split">

                <!-- LEFT: FEATURED HIGHLIGHTS -->
                <section class="home-section home-section--highlights home-featured-highlights">
                    <header class="home-section__header">
                        <h2 class="home-section__title">Featured Highlights</h2>
                        <div class="home-section__divider"></div>
                    </header>

                    <article class="ccg-card home-feature-card" data-ccg-featured-game>
                        <div class="ccg-card__media ccg-card__media--16x9">
                            <img src="resources/images/thumbnails/all/1942.jpg"
                                 alt="Featured game artwork"
                                 data-fg-thumb>
                        </div>
                        <div class="ccg-card__body">
                            <h3 class="ccg-card__title home-feature-title" data-fg-title>Featured Game</h3>
                            <p class="ccg-card__text home-feature-meta" data-fg-desc></p>
                            <a href="#" class="ccg-btn ccg-btn--primary" data-fg-btn>
                                View Game
                            </a>
                        </div>
                    </article>
                </section>

                <!-- RIGHT: FEATURED VIDEO -->
                <section class="home-section home-featured-video">
                    <article class="ccg-card home-feature-card home-feature-card--video">
                        <header class="home-feature-video__header">
                            <h3 class="ccg-card__title" data-ccg-featured-video-title>
                                Featured CCG Video
                            </h3>
                        </header>

                        <div class="ccg-card__media ccg-card__media--16x9 home-feature-video__frame">
                            <img src="resources/images/thumbnails/all/1942.jpg"
                                 alt="Featured CCG video thumbnail"
                                 data-ccg-featured-video-thumb>
                        </div>

                        <div class="ccg-card__body">
                            <p class="ccg-card__text" data-ccg-featured-video-desc></p>
                            <a href="https://www.youtube.com/@CheekyCommodoreGamer"
                               target="_blank"
                               class="ccg-btn ccg-btn--primary"
                               data-ccg-featured-video-btn>
                                Watch on YouTube
                            </a>
                        </div>
                    </article>
                </section>

            </div>

            <!-- GENRES (UNCHANGED) -->
            <section class="home-section home-section--genres">
                <!-- unchanged -->
            </section>

        </main>

        <footer class="ccg-footer">
            <p class="ccg-footer__text">
                © <span data-ccg-year></span> Cheeky Commodore Gamer.
            </p>
        </footer>

    </div>

    <!-- JS -->
    <script src="js/ccg-global.js" defer></script>
    <script src="js/ccg-mode-engine.js" defer></script>
    <script src="js/home-dynamic.js" defer></script>

</body>
</html>
