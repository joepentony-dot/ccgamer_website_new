    <link rel="canonical" href="home.html" />
    <link rel="icon" href="favicon.ico" />

    <!-- REQUIRED FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<body class="ccg-body" data-ccg-mode="c64" data-mode="c64">

<!-- GLOBAL BACKGROUND -->
<div class="ccg-bg">
    <div class="ccg-bg-starfield"></div>
    <div class="ccg-bg-grid"></div>
    <div class="ccg-bg-crt-overlay"></div>

<div class="ccg-page ccg-page--home">

    <!-- HEADER -->
    <header class="ccg-header">
        <div class="ccg-header-inner">

            <!-- BRAND -->
            <a href="home.html" class="ccg-brand">
                <img src="resources/images/ccgamer-logo.png"

                     loading="lazy"
                     decoding="async"
                     width="56"
                     height="56"
                     alt="Cheeky Commodore Gamer logo">

                <div class="ccg-brand__text">
                    <div class="ccg-brand__kicker">Stay a while, stay forever!</div>
                    <div class="ccg-brand__title">
                        <span class="ccg-brand__neon-cheeky">CHEEKY</span>
                        <span class="ccg-brand__neon-sub">COMMODORE GAMER</span>

                </div>
            </a>

            <!-- NAVIGATION -->
            <nav class="ccg-nav" aria-label="Primary navigation">
                <ul class="ccg-nav__list">

                    <li>
                        <a href="home.html"
                           class="ccg-nav__link ccg-nav__link--active">Home</a>
                    </li>

                    <li>
                        <a href="games/index.html"
                           class="ccg-nav__link">Browse Games</a>
                    </li>

                    <li>
                        <a href="games/genres/index.html"

                    <li>

                                   class="ccg-nav__dropdown-link">
                                    Trivia &amp; Leaderboard
                                </a>
                            </li>
                            <li>
                                <a href="emulation.html"
                                   class="ccg-nav__dropdown-link">
                                    Emulation
                                </a>
                            </li>
                            <li>
                                <a href="about.html"
                                   class="ccg-nav__dropdown-link">
                                    About
                                </a>
                            </li>
                            <li>
                                <a href="contact.html"
                                   class="ccg-nav__dropdown-link">
                                    Contact
                                </a>
                            </li>
                        </ul>
                    </li>

                </ul>
            </nav>

            <!-- HEADER ACTIONS -->
            <div class="ccg-header-actions">

                <!-- MODE TOGGLE -->
                <button class="ccg-mode-toggle"
                        type="button"
                        aria-label="Toggle between C64 and Amiga modes"
                        data-ccg-mode-toggle>
                    <span class="ccg-mode-toggle__pill">
                        <span class="ccg-mode-toggle__label ccg-mode-toggle__label--c64">C64</span>
                        <span class="ccg-mode-toggle__label ccg-mode-toggle__label--amiga">Amiga</span>
                        <span class="ccg-mode-toggle__thumb"></span>
                    </span>
                </button>

                <!-- SOCIAL ICONS (RESTORED + VISIBLE) -->
                <div class="ccg-header-socials">
                    <a href="https://www.youtube.com/@CheekyCommodoreGamer" aria-label="YouTube">

                    </a>
                    <a href="https://patreon.com/CheekyCommodoreGamer" aria-label="Patreon">
                        <span class="ccg-socials__icon ccg-socials__icon--patreon"></span>

                    <a href="https://www.paypal.com/donate/?hosted_button_id=LGG86ZV9P4YKL" aria-label="PayPal">

                    <a href="https://twitter.com/CheekyC64Gamer" aria-label="X / Twitter">
