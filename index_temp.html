<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheeky Commodore Gamer – Intro</title>

    <link rel="stylesheet" href="/ccgamer_website_new/resources/css/ccg-master.css">
</head>

<body class="crt intro-body c64-mode">

    <!-- CLICK TO START OVERLAY -->
    <div id="intro-tap-overlay" class="intro-overlay">
        <p>CLICK TO START INTRO WITH SOUND</p>
        <button id="intro-overlay-btn">Begin</button>
        <button id="skip-intro" class="skip-top">Skip Intro</button>
    </div>

    <!-- MAIN INTRO CONTAINER -->
    <div id="introContainer" class="intro-container hidden">
        <button id="skip-intro" class="skip-top">Skip Intro</button>

        <div class="c64-border">
            <div class="c64-screen">
                <div id="loadingBars" class="loading-bars"></div>

                <!-- the animated title text -->
                <div id="intro-title-text" class="intro-text"></div>
            </div>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="sidAudio" src="resources/audio/c64_speech_stayawhile.mp3"></audio>

    <!-- JS -->
    <script src="js/index-intro.js"></script>

</body>
</html>
