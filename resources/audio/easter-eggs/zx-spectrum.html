<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>CCG Local ZX Spectrum Easter Egg</title>
    <link rel="stylesheet" href="../../css/easter-eggs-zx-spectrum.css">
</head>
<body>
    <main class="zx" data-zx-spectrum>
        <section class="zx__emulator" aria-label="ZX Spectrum loading sequence">
            <header class="zx__toolbar">
                <div>
                    <strong>ZX SPECTRUM 48K</strong>
                    <span>TAPE LOADER</span>
                </div>
                <button type="button" data-zx-action="sound" aria-pressed="true">SOUND: ON</button>
            </header>

            <div class="zx__screen" tabindex="0" aria-live="polite" aria-atomic="true">
                <div class="zx__stage" data-zx-loader-one>
                    <img src="zx_1.gif" alt="ZX Spectrum tape loading screen">
                </div>

                <div class="zx__stage" data-zx-loader-two hidden>
                    <img src="zx_2.gif" alt="ZX Spectrum game screen">
                </div>

                <div class="zx__team" data-zx-team hidden>
                    <p>WE'RE TEAM COMMODORE HERE.</p>
                </div>

                <div class="zx__reveal" data-zx-reveal hidden>
                    <img src="zx-clive.jpg" alt="Sir Clive Sinclair">
                    <div class="zx__reveal-copy">
                        <strong>NO...</strong>
                        <span>I DON'T THINK SO.</span>
                    </div>
                </div>

                <div class="zx__final" data-zx-final hidden>
                    <strong>COMMODORE MODE RESTORED</strong>
                    <span>RETURNING TO CHEEKY COMMODORE GAMER...</span>
                </div>
            </div>

            <footer class="zx__footer">
                <span data-zx-footer>LOADING FROM TAPE...</span>
                <button type="button" data-zx-action="restart">RESTART</button>
            </footer>
        </section>
    </main>

    <audio data-zx-voice preload="auto" playsinline src="no_i_dont_think_sp.mp3"></audio>
    <script src="../../../js/easter-eggs/zx-spectrum.js"></script>
</body>
</html>
