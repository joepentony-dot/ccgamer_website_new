<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CCG Invaders</title>
    <link rel="stylesheet" href="../../css/easter-eggs-invaders.css">
</head>
<body>
    <main class="ccg-invaders" aria-label="CCG Invaders game">
        <header class="ccg-invaders__header">
            <div><span>SCORE</span><strong data-score>000000</strong></div>
            <h1>CCG INVADERS</h1>
            <div><span>LIVES</span><strong data-lives>3</strong></div>
        </header>

        <section class="ccg-invaders__stage">
            <canvas width="720" height="760" aria-label="Space Invaders play area" data-canvas></canvas>
            <div class="ccg-invaders__message" data-message>
                <strong>DEFEND THE COMMODORE ARCHIVE</strong>
                <span>ARROW KEYS OR A / D TO MOVE · SPACE TO FIRE</span>
                <button type="button" data-start>START GAME</button>
            </div>
        </section>

        <div class="ccg-invaders__toolbar" aria-label="Game controls">
            <button type="button" data-pause>PAUSE</button>
            <button type="button" data-restart>RESTART</button>
            <button type="button" data-sound aria-pressed="true">SOUND ON</button>
        </div>

        <div class="ccg-invaders__touch" aria-label="Touch controls">
            <button type="button" data-control="left" aria-label="Move left">◀</button>
            <button type="button" class="ccg-invaders__fire" data-control="fire" aria-label="Fire">FIRE</button>
            <button type="button" data-control="right" aria-label="Move right">▶</button>
        </div>
    </main>
    <script type="module" src="../../../js/easter-eggs/invaders-game.js"></script>
</body>
</html>
