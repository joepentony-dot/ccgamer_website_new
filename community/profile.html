<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | CCG Community</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
  <link rel="stylesheet" href="../resources/css/community-account.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>My Private Profile</h1>
      <p class="auth-subtitle">Manage notifications, newsletter choices, and account security.</p>

      <div id="profileMessage" class="auth-message" aria-live="polite"></div>

      <img id="profileAvatar" class="profile-avatar" src="/favicon.ico" alt="Profile avatar" />

      <div class="profile-list">
        <div class="profile-row"><span>Display name</span><strong id="displayName">—</strong></div>
        <div class="profile-row"><span>Email (private)</span><strong id="emailValue">—</strong></div>
        <div class="profile-row"><span>Joined</span><strong id="joinDate">—</strong></div>
      </div>

      <form id="prefsForm" class="pref-grid">
        <label><input type="checkbox" id="newsletterOptIn" /> Monthly newsletter</label>
        <label><input type="checkbox" id="notifyNewGames" /> New game notifications</label>
        <label><input type="checkbox" id="notifyC64" /> C64 notifications</label>
        <label><input type="checkbox" id="notifyAmiga" /> Amiga notifications</label>
        <button type="submit" class="auth-btn">Save preferences</button>
      </form>

      <div class="profile-actions">
        <a class="auth-btn" href="/auth/forgot.html">Reset password</a>
        <button type="button" class="auth-btn" id="logoutBtn">Logout</button>
      </div>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>
  <script type="module" src="../resources/js/auth/profile-page.js"></script>
</body>
</html>
