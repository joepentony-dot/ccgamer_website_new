<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow">
<script src="/js/analytics.js"></script>
  <title>Community Admin | CCG</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
  <link rel="stylesheet" href="../resources/css/community-account.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Community Admin</h1>
      <p class="auth-subtitle">High-level community totals.</p>

      <div id="adminMessage" class="auth-message" aria-live="polite"></div>

      <div class="profile-list" id="adminStats" hidden>
        <div class="profile-row"><span>Total users</span><strong id="statUsers">—</strong></div>
        <div class="profile-row"><span>Total comments</span><strong id="statComments">—</strong></div>
        <div class="profile-row"><span>Total ratings</span><strong id="statRatings">—</strong></div>
        <div class="profile-row"><span>Total activity</span><strong id="statActivity">—</strong></div>
      </div>

      <div class="profile-actions">
        <a class="auth-btn" href="/community/profile.html">My profile</a>
        <a class="auth-btn" href="/">Home</a>
      </div>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>
  <script src="../js/ccg-auth-ui.js" defer></script>
  <script type="module" src="../resources/js/community/admin-page.js"></script>
</body>
</html>
