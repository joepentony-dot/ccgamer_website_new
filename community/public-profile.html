<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow">
<script src="/js/analytics.js"></script>
  <title>Community Profile | CCG</title>
  <link rel="stylesheet" href="../resources/css/auth.css" />
  <link rel="stylesheet" href="../resources/css/community-account.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <h1>Community Profile</h1>
      <p class="auth-subtitle">Public profile (read-only).</p>

      <div id="publicMessage" class="auth-message" aria-live="polite"></div>

      <img id="publicAvatar" class="profile-avatar" src="/favicon.ico" alt="Profile avatar" />

      <div class="profile-list">
        <div class="profile-row"><span>Display name</span><strong id="publicDisplayName">—</strong></div>
        <div class="profile-row"><span>Joined</span><strong id="publicJoinDate">—</strong></div>
      </div>

      <div class="profile-actions">
        <a class="auth-btn" href="/community/profile.html">My private profile</a>
        <a class="auth-btn" href="/">Home</a>
      </div>
    </section>
  </main>

  <script src="../js/ccg-supabase-config.js" defer></script>
  <script src="../js/ccg-supabase-client.js" defer></script>
  <script src="../js/ccg-auth-ui.js" defer></script>
  <script type="module" src="../resources/js/community/public-profile-page.js"></script>
</body>
</html>
