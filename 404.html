<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <script src="/js/analytics.js" defer></script>
    <title>Page not found</title>
    <link rel="canonical" href="https://www.cheekycommodoregamer.co.uk/404.html">
    <style>
        body {
            opacity: 0;
        }

        body.ccg-404-ready {
            opacity: 1;
            transition: opacity 120ms ease;
        }
    </style>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p id="ccg404Message">We could not find that page.</p>
        <p>
            <a href="/home.html">Go to home</a>
            · <a href="/games/">Browse games</a>
            · <a href="/games/publishers/">Browse publishers</a>
        </p>
    </main>
    <script>
        (function redirectPrettyGame() {
            const RESERVED_GAME_SECTIONS = new Set([
                "collections",
                "developers",
                "discover",
                "downloads",
                "genres",
                "platforms",
                "publishers",
                "search",
                "years"
            ]);

            let pathname = window.location.pathname || "";
            const repoMarker = "/ccgamer_website_new/";
            let basePath = "/";

            if (pathname.includes(repoMarker)) {
                basePath = repoMarker;
                pathname = pathname.slice(pathname.indexOf(repoMarker) + repoMarker.length);
            }

            const segments = pathname
                .replace(/^\/+|\/+$/g, "")
                .split("/")
                .filter(Boolean);

            const showNotFound = function (message) {
                const messageNode = document.getElementById("ccg404Message");
                if (messageNode && message) messageNode.textContent = message;
                document.body.classList.add("ccg-404-ready");
            };

            if (segments[0] !== "games") {
                showNotFound("We could not find that page.");
                return;
            }

            if (segments.length !== 2) {
                showNotFound("That game archive page is unavailable. Use the links below to return to a populated archive.");
                return;
            }

            let slug = String(segments[1] || "")
                .replace(/index\.html$/i, "")
                .replace(/\.html$/i, "")
                .replace(/\/+$/g, "")
                .toLowerCase();

            if (
                !slug
                || RESERVED_GAME_SECTIONS.has(slug)
                || !/^[a-z0-9][a-z0-9-]*$/.test(slug)
            ) {
                showNotFound("That game archive page is unavailable. Use the links below to return to a populated archive.");
                return;
            }

            const target = `${window.location.origin}${basePath}games/game.html?slug=${encodeURIComponent(slug)}`;
            window.location.replace(target);
        })();
    </script>
    <script src="/js/ccg-schema.js"></script>
</body>
</html>
